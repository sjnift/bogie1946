<div class="app">
  <header class="top" id="top">
    <div class="nav">
      <div class="left" id="nav-left"></div>
      <h1 id="nav-title">Profile</h1>
      <div class="right" id="nav-right"></div>
    </div>
  </header>
  <main class="screen" id="screen"></main>
</div>

<div class="tabbar">
  <nav aria-label="Sections">
    <button type="button" data-view="profile" aria-current="page"><span class="ti">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle class="fill" cx="12" cy="8" r="4"/><path class="fill" d="M4 20.5c1.4-4 4.5-6.2 8-6.2s6.6 2.2 8 6.2z"/></svg></span>
      Profile</button>
    <button type="button" data-view="diary"><span class="ti">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect class="fill" x="3.5" y="5" width="17" height="15.5" rx="3"/><path class="cut" d="M3.5 10h17"/><path d="M8 3v4M16 3v4"/></svg></span>
      Diary</button>
    <button type="button" data-view="stats"><span class="ti">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect class="fill" x="4" y="11" width="4" height="9" rx="1.2"/><rect class="fill" x="10" y="4" width="4" height="16" rx="1.2"/><rect class="fill" x="16" y="8" width="4" height="12" rx="1.2"/></svg></span>
      Stats</button>
    <button type="button" data-view="insights"><span class="ti">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="fill" d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path class="fill" d="M18.5 15l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></svg></span>
      Insights</button>
    <button type="button" data-view="compare"><span class="ti">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="12" r="6"/><circle class="fill" cx="15" cy="12" r="6" fill-opacity=".35"/></svg></span>
      Compare</button>
  </nav>
</div>

<input id="friend-input" type="file" accept=".zip,.csv,application/zip,text/csv" multiple hidden>
<input id="file-input" type="file" accept=".zip,.csv,.json,application/zip,text/csv,application/json" multiple hidden>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
<div id="tip" role="tooltip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
