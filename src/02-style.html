<style>
/* ---------- lookup panel ---------- */
.lookup {
  margin-block: 20px 6px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); padding: 16px 18px; display: grid; gap: 12px;
}
.lookup-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.lookup-head h2 { font-size: 16px; font-weight: 700; }
.lookup .sub-h { font-size: 14px; font-weight: 700; margin-top: 6px; }
.lookup p { margin: 0; color: var(--ink-2); max-width: 75ch; }
.meter { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.meter > span { display: block; height: 100%; width: 0; background: var(--gold); border-radius: 999px; transition: width .3s; }
.lookup-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.lookup-row input[type="password"], .lookup-row input[type="text"] {
  flex: 1 1 260px; min-width: 0; padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); font-family: var(--mono); font-size: 13px;
}
.status { font-size: 13.5px; color: var(--ink-2); }
.status.err { color: var(--danger); }
.tmdb-link { font-size: 12px; font-weight: 500; color: var(--muted); text-decoration: none; white-space: nowrap; margin-left: 4px; }
.tmdb-link:hover { color: var(--gold-ink); }
.linkish { all: unset; cursor: pointer; color: var(--gold-ink); text-decoration: underline; text-underline-offset: 2px; }
.linkish:focus-visible { outline: 2px solid var(--gold-ink); outline-offset: 2px; }
.src-tag {
  display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px;
  color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
}
.src-tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }

/* ---------- credit sections ---------- */
main { padding-block: 8px 64px; }
.credit {
  display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 10px 36px;
  padding-block: 34px; border-top: 1px solid var(--line);
}
.credit:first-of-type { border-top: 0; }
.role { display: grid; gap: 6px; align-content: start; }
.role h2 {
  font-family: var(--display); font-weight: 800; text-transform: uppercase;
  font-size: 30px; line-height: .95; letter-spacing: .03em;
}
.role .hint { font-size: 13px; color: var(--muted); }
.credit-body { min-width: 0; display: grid; gap: 18px; align-content: start; }
@media (max-width: 760px) {
  .credit { grid-template-columns: minmax(0, 1fr); padding-block: 26px; }
}
.empty {
  border: 1px dashed var(--line); border-radius: var(--radius); padding: 18px; color: var(--muted);
}

.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab {
  cursor: pointer; border: 0; background: transparent; color: var(--muted); padding: 4px 2px; margin-right: 14px;
  font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.tab:disabled { opacity: .4; cursor: default; }

/* ---------- insights ---------- */
.glance { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.gcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.gcard .k { font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.gcard .big { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; color: var(--gold-ink); text-transform: uppercase; overflow-wrap: anywhere; }
.gcard p { margin: 0; color: var(--ink-2); }
.mults { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px 30px; }
@media (max-width: 900px) { .mults { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .mults { grid-template-columns: minmax(0, 1fr); } }
.mult { min-width: 0; }
.mult h3, .ins-grid h3, .crowd h3 { font-size: 12.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
.crowd { display: grid; gap: 10px; }
.crowd h3 { margin-top: 10px; }
.tbl-wrap { overflow-x: auto; }
.tbl-wrap table.data { min-width: 640px; }
.trend-lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-width: 75ch; }
.trend-lines li { display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; }
.mk { font-size: 11px; color: var(--muted); flex: none; }
.heat td.cell { text-align: center; min-width: 52px; }
.div-bar { position: relative; display: inline-block; width: 110px; height: 10px; vertical-align: middle; }
.div-bar .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; border-left: 1px solid var(--muted); }
.div-bar .fill { position: absolute; top: 0; bottom: 0; }
.div-bar .fill.pos { left: 50%; background: var(--gold); border-radius: 0 3px 3px 0; }
.div-bar .fill.neg { right: 50%; background: var(--lilac); border-radius: 3px 0 0 3px; }
.ins-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 36px; }
@media (max-width: 900px) { .ins-grid { grid-template-columns: minmax(0, 1fr); } }
.ins-grid > div { min-width: 0; }
.ins-grid .rank-row { grid-template-columns: 22px minmax(0, 1.7fr) minmax(0, 1fr) 70px; }
.lead { margin: 0; font-size: 16px; color: var(--ink); max-width: 72ch; }
.poster .cap .diff { color: var(--ink); }
.habits { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px 16px; }
.habit { border-top: 2px solid var(--gold); padding-top: 8px; display: grid; gap: 2px; align-content: start; }
.habit .k { font-size: 12.5px; color: var(--muted); }
.habit .v { font-weight: 700; font-size: 24px; color: var(--ink); line-height: 1.15; }
.habit .t { color: var(--ink-2); font-size: 14px; }

/* ---------- compare ---------- */
.who-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.who { display: inline-flex; align-items: center; gap: 2px; }
.who-x { font-size: 13px; color: var(--muted); padding: 2px 6px; text-decoration: none; }
.match { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.match .score { font-family: var(--display); font-weight: 800; font-size: 84px; line-height: .85; color: var(--gold-ink); }
.match .out { font-family: var(--mono); color: var(--muted); align-self: flex-end; margin-left: -12px; margin-bottom: 6px; }
.match b { font-size: 18px; color: var(--ink); }
.match p { margin: 2px 0 0; color: var(--ink-2); max-width: 52ch; }
.venn { display: flex; gap: 2px; height: 22px; border-radius: 6px; overflow: hidden; }
.venn span { min-width: 3px; }
.venn .va { background: var(--gold); } .venn .vboth { background: var(--muted); } .venn .vb { background: var(--lilac); }
.phist { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; height: 140px; align-items: end; border-bottom: 1px solid var(--line); }
.pgroup { display: flex; gap: 2px; align-items: flex-end; justify-content: center; height: 100%; }
.pgroup span { width: 45%; max-width: 16px; border-radius: 3px 3px 0 0; min-height: 0; }
.pgroup .pa { background: var(--gold); } .pgroup .pb { background: var(--lilac); }
.gpair { display: grid; grid-template-columns: 140px minmax(0, 1fr) 90px; gap: 12px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
.gpair .gname { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gpair .gbars { display: grid; gap: 2px; }
.gpair .gbars span { display: block; height: 8px; border-radius: 0 3px 3px 0; min-width: 2px; }
.gpair .ga { background: var(--gold); } .gpair .gb { background: var(--lilac); }
.gpair .gv { text-align: right; font-size: 13px; color: var(--ink-2); }
@media (max-width: 520px) { .gpair { grid-template-columns: 96px minmax(0, 1fr) 76px; } }
.plain-list { list-style: none; margin: 0; padding: 0; }
.plain-list li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.plain-list li span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chiplets { display: flex; flex-wrap: wrap; gap: 8px; }
.chiplet { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; background: var(--surface); }
.poster .cap > span { display: block; }

.facts { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.fact { display: grid; gap: 0; min-width: 0; }
.fact .k { font-size: 12.5px; color: var(--muted); }
.fact .v { font-weight: 600; font-size: 15px; }

/* ---------- column chart (weeks / months / decades) ---------- */
.chart { position: relative; margin-right: 30px; }
.chart .cols { position: relative; z-index: 1; }
.chart + .axis { margin-right: 30px; }
.cols {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: end;
  gap: 2px; height: 170px; border-bottom: 1px solid var(--line); padding-top: 8px;
}
.col { height: 100%; display: flex; flex-direction: column-reverse; align-items: center; cursor: default; min-width: 0; }
.col .seg { width: 100%; max-width: 24px; min-height: 0; }
.col .seg + .seg { margin-bottom: 2px; }
.col .seg.a { background: var(--gold); border-radius: 0 0 0 0; }
.col .seg.b { background: var(--lilac); }
.col .seg:last-child { border-radius: 4px 4px 0 0; }
.col:hover .seg, .col:focus-visible .seg { filter: brightness(1.2); }
.axis { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; margin-top: 6px; }
.axis span { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: center; white-space: nowrap; overflow: visible; }
@media (max-width: 620px) { .axis span.minor { visibility: hidden; } }
.gridline { position: absolute; left: 0; right: -30px; border-top: 1px solid var(--line); pointer-events: none; }
.gridline span { position: absolute; right: 0; top: -8px; font-family: var(--mono); font-size: 11px; line-height: 16px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* weekday bars */
.weekdays { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; max-width: 440px; }
.wd { display: grid; gap: 6px; justify-items: center; }
.wd .bar-v { width: 100%; max-width: 24px; height: 64px; display: flex; align-items: flex-end; }
.wd .bar-v span { display: block; width: 100%; background: var(--gold); border-radius: 4px 4px 0 0; }
.wd .lbl { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.wd .cnt { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* calendar heatmap */
.cal-wrap { overflow-x: auto; padding-bottom: 4px; }
.cal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); grid-auto-columns: 11px; gap: 3px; width: max-content; }
.cal i { display: block; border-radius: 2px; background: var(--surface-2); }
.cal i.l1 { background: var(--heat-1); } .cal i.l2 { background: var(--heat-2); } .cal i.l3 { background: var(--heat-3); }
.cal i.pad { background: transparent; }
.cal-months { display: grid; grid-auto-flow: column; grid-auto-columns: 11px; gap: 3px; width: max-content; margin-bottom: 4px; }
.cal-months span { font-family: var(--mono); font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: visible; width: 11px; }
.heat-key { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.heat-key i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; background: var(--surface-2); }

/* rating histogram */
.spread { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 2px; align-items: end; height: 150px; border-bottom: 1px solid var(--line); }
.spread .col .seg { max-width: 34px; }
.stars-axis { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 2px; margin-top: 6px; }
.stars-axis span { text-align: center; font-size: 11px; color: var(--muted); white-space: nowrap; letter-spacing: -.04em; }

/* ---------- people ---------- */
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 18px 14px; }
.person {
  all: unset; cursor: pointer; display: grid; gap: 8px; align-content: start; min-width: 0; border-radius: 8px;
}
.person:focus-visible { outline: 2px solid var(--gold-ink); outline-offset: 4px; }
.face {
  aspect-ratio: 1; max-width: 100%; border-radius: 8px; overflow: hidden; position: relative;
  background: var(--surface-2); display: grid; place-items: center;
}
.face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; display: block; }
.face .initials { font-family: var(--display); font-weight: 800; font-size: 40px; color: var(--muted); letter-spacing: .04em; }
.face .rank {
  position: absolute; left: 6px; top: 6px; font-family: var(--mono); font-size: 11px; font-weight: 500;
  background: color-mix(in srgb, var(--bg) 80%, transparent); color: var(--ink); padding: 1px 6px; border-radius: 999px;
}
.person:hover .face { box-shadow: 0 0 0 2px var(--gold); }
@media (max-width: 520px) {
  .people { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 10px; }
  .face .initials { font-size: 28px; }
}
.person .nm { font-weight: 600; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
.person .ct { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -6px; }

.rank-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.rank-list li { border-top: 1px solid var(--line); }
.rank-list li:first-child { border-top: 0; }
.rank-row {
  all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid;
  grid-template-columns: 30px minmax(0, 1.2fr) minmax(0, 2fr) 64px; align-items: center; gap: 12px; padding: 7px 4px;
}
.rank-row:hover { background: var(--surface); }
.rank-row:focus-visible { outline: 2px solid var(--gold-ink); outline-offset: -2px; }
.rank-row .r { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.rank-row .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-row .track { height: 10px; display: flex; align-items: center; }
.rank-row .track span { display: block; height: 10px; background: var(--gold); border-radius: 0 4px 4px 0; min-width: 2px; }
.rank-row .v { text-align: right; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 520px) { .rank-row { grid-template-columns: 26px minmax(0, 1fr) 70px 52px; gap: 8px; } }

.cat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
.cat-grid h3 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
.cat-grid .rank-row { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) 54px; }
@media (max-width: 900px) { .cat-grid { grid-template-columns: minmax(0, 1fr); } }

/* ---------- films ---------- */
.posters { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px; }
.poster { display: grid; gap: 6px; min-width: 0; align-content: start; }
.poster .art {
  aspect-ratio: 2 / 3; max-width: 100%; border-radius: 6px; overflow: hidden; background: var(--surface-2);
  display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; position: relative;
  border: 1px solid var(--line);
}
.poster .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.poster .art .t { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 17px; line-height: .95; overflow-wrap: break-word; }
.poster .art .y { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 4px; }
.poster .cap { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; overflow-wrap: anywhere; }
.stars { color: var(--gold-ink); letter-spacing: .02em; white-space: nowrap; }

.milestones { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 18px 14px; }
.milestone .k { font-family: var(--mono); font-size: 12px; color: var(--gold-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.milestone .cap { display: grid; gap: 1px; }
.milestone .d { color: var(--muted); }

.decades { display: grid; gap: 14px; }
.decade { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 14px; align-items: start; }
.decade .lbl { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; }
.decade .lbl small { display: block; font-family: var(--sans); font-weight: 500; font-size: 12px; color: var(--muted); margin-top: 4px; }
.decade .row { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.decade .chiplet { flex: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; background: var(--surface); }

table.data { border-collapse: collapse; font-size: 13px; width: 100%; }
table.data th, table.data td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
table.data td.n, table.data th.n { text-align: right; font-variant-numeric: tabular-nums; }
details.tbl summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details.tbl .scroll { max-height: 320px; overflow: auto; margin-top: 8px; }

/* ---------- dialog, tooltip, drop ---------- */
dialog {
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink);
  padding: 0; width: min(560px, calc(100vw - 32px)); max-height: min(80vh, 720px); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(10, 6, 12, .6); }
.dlg-head { display: flex; gap: 14px; align-items: center; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.dlg-head .face { width: 56px; flex: none; }
.dlg-head h3 { font-size: 20px; }
.dlg-head .close { margin-left: auto; }
.dlg-body { padding: 8px 20px 20px; overflow: auto; max-height: calc(min(80vh, 720px) - 100px); }
.film-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.film-row .ft { font-weight: 500; overflow-wrap: anywhere; }
.film-row .fy { color: var(--muted); font-weight: 400; }
.film-row .fd { font-size: 12.5px; color: var(--muted); }
.film-row .fr { text-align: right; }

#tip {
  position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg);
  font-size: 12.5px; padding: 6px 9px; border-radius: 6px; max-width: 240px; line-height: 1.35; box-shadow: var(--shadow);
}
.drop-veil {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; pointer-events: none;
  background: color-mix(in srgb, var(--bg) 82%, transparent); border: 3px dashed var(--gold);
  font-family: var(--display); font-weight: 800; font-size: 40px; text-transform: uppercase; letter-spacing: .04em;
}
footer { border-top: 1px solid var(--line); padding-block: 22px 40px; color: var(--muted); font-size: 13px; }
footer p { margin: 0 0 6px; max-width: 80ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
