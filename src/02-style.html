<style>
/* ---------- lookup panel ---------- */
.lookup {
  margin-block: 20px 6px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); padding: 16px 18px; display: grid; gap: 12px;
}
.lookup-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.lookup-head h2 { font-size: 16px; font-weight: 700; }
.lookup .sub-h { font-size: 14px; font-weight: 700; margin-top: 6px; }
.lookup p { margin: 0; color: var(--ink-2); max-width: 75ch; }
.meter { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.meter > span { display: block; height: 100%; width: 0; background: var(--gold); border-radius: 999px; transition: width .3s; }
.lookup-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.lookup-row input[type="password"], .lookup-row input[type="text"] {
  flex: 1 1 260px; min-width: 0; padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); font-family: var(--mono); font-size: 13px;
}
.status { font-size: 13.5px; color: var(--ink-2); }
.status.err { color: var(--danger); }
.tmdb-link { font-size: 12px; font-weight: 500; color: var(--muted); text-decoration: none; white-space: nowrap; margin-left: 4px; }
.tmdb-link:hover { color: var(--gold-ink); }
.linkish { all: unset; cursor: pointer; color: var(--gold-ink); text-decoration: underline; text-underline-offset: 2px; }
.linkish:focus-visible { outline: 2px solid var(--gold-ink); outline-offset: 2px; }
.src-tag {
  display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px;
  color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
}
.src-tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }

/* ---------- the diary on this site: asking for its password (top), putting it there (foot of the page) ---------- */
.site-box, .site-open > .site-in {
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
  padding: 16px 18px; display: grid; gap: 10px; max-width: 640px; color: var(--ink-2);
}
.site-box { margin: 16px 0 18px; }
.site-box .site-in + .site-in { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px; }
.site-box:empty, .site-open:empty { display: none; }
.site-open > .site-in { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 8%, var(--surface)); }
.site-in { display: grid; gap: 10px; }
/* the owner's way in, folded away for everyone else */
.site-open > .site-in.owner-open:not([open]) { border: 0; background: none; padding: 4px 0 0; }
.owner-open > summary { cursor: pointer; color: var(--muted); font-size: 14px; width: fit-content; }
.owner-open > summary:hover { color: var(--gold-ink); }
.owner-open[open] > summary { color: var(--ink); font-weight: 600; }
.site-open > .site-in.owner-open[open] { border-color: var(--line); background: var(--surface); }
.site-in .sub-h { margin: 0; font-size: 15px; font-weight: 700; color: var(--ink); text-transform: none; letter-spacing: 0; }
.site-in p { margin: 0; }
.site-in label.status { margin-bottom: -6px; }
.site-in input.key {
  width: 100%; box-sizing: border-box; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 13px;
}
.site-in > .btn, .site-help .btn { justify-self: start; }
.site-row { display: flex; flex-wrap: wrap; gap: 8px; }
.site-help { display: grid; gap: 8px; }
.site-help summary { cursor: pointer; color: var(--gold-ink); font-size: 13.5px; }
.site-help[open] { gap: 10px; }
.site-form { display: grid; gap: 10px; margin-top: 8px; }
.site-form label.status { margin-bottom: -6px; }
.site-help .steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13.5px; }
.site-help a, .site-in .status a { color: var(--gold-ink); }

/* ---------- credit sections ---------- */
main { padding-block: 8px 64px; }
.credit {
  display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 10px 36px;
  padding-block: 34px; border-top: 1px solid var(--line);
}
.credit:first-of-type, .ch-mark + .credit { border-top: 0; }
.ch-mark + .credit { padding-top: 22px; }
.role { display: grid; gap: 6px; align-content: start; }
.role h2 {
  font-family: var(--display); font-weight: 800; text-transform: uppercase;
  font-size: 30px; line-height: .95; letter-spacing: .03em;
}
.role .hint { font-size: 13px; color: var(--muted); }
.credit-body { min-width: 0; display: grid; gap: 18px; align-content: start; }
@media (max-width: 760px) {
  .credit { grid-template-columns: minmax(0, 1fr); padding-block: 26px; }
}
.empty {
  border: 1px dashed var(--line); border-radius: var(--radius); padding: 18px; color: var(--muted);
}

.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab-rows { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; }
.tab {
  cursor: pointer; border: 0; background: transparent; color: var(--muted); padding: 4px 2px; margin-right: 14px;
  font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.tab:disabled { opacity: .4; cursor: default; }

/* ---------- insights ---------- */
.glance { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.gcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.gcard .k { font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.gcard .big { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; color: var(--gold-ink); text-transform: uppercase; overflow-wrap: anywhere; }
.gcard p, .gcard .gp { margin: 0; color: var(--ink-2); display: block; }
.mults { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px 30px; }
@media (max-width: 900px) { .mults { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .mults { grid-template-columns: minmax(0, 1fr); } }
.mult { min-width: 0; }
.mult h3, .ins-grid h3, .crowd h3 { font-size: 12.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
.crowd { display: grid; gap: 10px; }
.crowd h3 { margin-top: 10px; }
.tbl-wrap { overflow-x: auto; }
.tbl-wrap table.data { min-width: 640px; }
.trend-lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-width: 75ch; }
.trend-lines li { display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; }
.mk { font-size: 11px; color: var(--muted); flex: none; }
.heat td.cell { text-align: center; min-width: 52px; }
.div-bar { position: relative; display: inline-block; width: 110px; height: 10px; vertical-align: middle; }
.div-bar .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; border-left: 1px solid var(--muted); }
.div-bar .fill { position: absolute; top: 0; bottom: 0; }
.div-bar .fill.pos { left: 50%; background: var(--gold); border-radius: 0 3px 3px 0; }
.div-bar .fill.neg { right: 50%; background: var(--lilac); border-radius: 3px 0 0 3px; }
.ins-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 36px; }
@media (max-width: 900px) { .ins-grid { grid-template-columns: minmax(0, 1fr); } }
.ins-grid > div { min-width: 0; }
.ins-grid .rank-row { grid-template-columns: 22px minmax(0, 1.7fr) minmax(0, 1fr) 70px; }
.lead { margin: 0; font-size: 16px; color: var(--ink); max-width: 72ch; }
.poster .cap .diff { color: var(--ink); }
.habits { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px 16px; }
.habit { border-top: 2px solid var(--gold); padding-top: 8px; display: grid; gap: 2px; align-content: start; }
.habit .k { font-size: 12.5px; color: var(--muted); }
.habit .v { font-weight: 700; font-size: 24px; color: var(--ink); line-height: 1.15; }
.habit .t { color: var(--ink-2); font-size: 14px; }
/* the study: findings, chapters on a strip of time, trends with small charts, runs of films */
.findings { display: grid; gap: 12px; max-width: 86ch; }
.finding { display: grid; grid-template-columns: minmax(150px, 210px) minmax(0, 1fr); gap: 4px 20px; align-items: baseline; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.finding:last-child { border-bottom: 0; padding-bottom: 0; }
.finding .fk { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-ink); }
.finding .ft { font-size: 15.5px; color: var(--ink); }
@media (max-width: 620px) { .finding { grid-template-columns: minmax(0, 1fr); } }
.ch-strip { position: relative; height: 26px; margin: 4px 0 30px; border-radius: 6px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.ch-strip .seg { all: unset; position: absolute; top: 3px; bottom: 3px; border-radius: 4px; cursor: pointer; background: var(--gold); min-width: 4px; }
.ch-strip .seg:hover { filter: brightness(1.2); }
.ch-strip .yr { position: absolute; top: 0; bottom: -18px; border-left: 1px solid var(--line); pointer-events: none; }
.ch-strip .yr i { position: absolute; bottom: 0; left: 4px; font: 500 11px/1 var(--mono); font-style: normal; color: var(--muted); }
.chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.chapter { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px 18px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.chapter .ch-title { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: .95; text-transform: uppercase; letter-spacing: .01em; }
.chapter .ch-title .dlink { text-decoration: none; }
.chapter p { margin: 0; color: var(--ink-2); }
.posters.strip { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 4px; }
.posters.strip .poster .art { padding: 6px; }
.posters.strip .poster .art .t { font-size: 12px; }
.drifts { display: grid; gap: 18px; }
.drift { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 10px 30px; align-items: center; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.drift:last-child { border-bottom: 0; }
.drift h3 { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; text-transform: uppercase; color: var(--gold-ink); margin-bottom: 6px; }
.drift h3 .dlink { text-decoration: none; }
.drift p { margin: 0; color: var(--ink); }
.drift .cols { height: 64px; }
.chart.bare .cols { border-bottom-color: var(--line); }
@media (max-width: 760px) { .drift { grid-template-columns: minmax(0, 1fr); } }
.threads { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px 24px; }
.thread { display: grid; gap: 8px; align-content: start; min-width: 0; }
.thread p { margin: 0; color: var(--ink); }

/* ---------- reviews ---------- */
.review-tools input { width: min(100%, 420px); padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.review { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 18px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.review .rv-art .art { padding: 7px; }
.review .rv-art .art .t { font-size: 12px; }
.rv-title { font-size: 17px; font-weight: 700; margin: 0; }
.rv-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 13px; margin: 2px 0 8px; }
.rv-text { color: var(--ink); line-height: 1.6; max-width: 72ch; overflow-wrap: anywhere; margin: 0; }
.rv-text p { margin: 0 0 .8em; } .rv-text p:last-child { margin-bottom: 0; }
.rv-text blockquote { margin: .3em 0 .8em; padding-left: 12px; border-left: 2px solid var(--line); color: var(--ink-2); }
.rv-text ul, .rv-text ol { margin: .3em 0 .8em; padding-left: 1.3em; }
.rv-text a { color: var(--gold-ink); }
.rv-text.clamp.short { max-height: 4.8em; }
.review.short { grid-template-columns: 56px minmax(0, 1fr); gap: 16px; padding: 14px 0; }
.review.short .rv-art .art { padding: 5px; }
.review.short .rv-art .art .t { font-size: 10px; }
.review.short .rv-meta { margin-bottom: 4px; }
.rv-text.clamp { max-height: 9.6em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.rv-more { margin-top: 6px; font-size: 13.5px; }
.rv-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.rv-tags .chiplet { font-size: 12px; padding: 3px 8px; }
.wordcloud { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; max-width: 80ch; }
.wordcloud .w { color: var(--ink); font-weight: 600; line-height: 1.3; }
.pair-rev { padding: 14px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.sub-h { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 14px 0 6px; }
@media (max-width: 520px) { .review { grid-template-columns: 64px minmax(0, 1fr); gap: 12px; } }

/* ---------- compare ---------- */
.who-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.who { display: inline-flex; align-items: center; gap: 2px; }
.who-x { font-size: 13px; color: var(--muted); padding: 2px 6px; text-decoration: none; }
.match { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.match .score { font-family: var(--display); font-weight: 800; font-size: 84px; line-height: .85; color: var(--gold-ink); }
.match .out { font-family: var(--mono); color: var(--muted); align-self: flex-end; margin-left: -12px; margin-bottom: 6px; }
.match b { font-size: 18px; color: var(--ink); }
.match p { margin: 2px 0 0; color: var(--ink-2); max-width: 52ch; }
.venn { display: flex; gap: 2px; height: 22px; border-radius: 6px; overflow: hidden; }
.venn span { min-width: 3px; }
.venn .va { background: var(--gold); } .venn .vboth { background: var(--muted); } .venn .vb { background: var(--lilac); }
.phist { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; height: 140px; align-items: end; border-bottom: 1px solid var(--line); }
.pgroup { display: flex; gap: 2px; align-items: flex-end; justify-content: center; height: 100%; }
.pgroup span { width: 45%; max-width: 16px; border-radius: 3px 3px 0 0; min-height: 0; }
.pgroup .pa { background: var(--gold); } .pgroup .pb { background: var(--lilac); }
.gpair { display: grid; grid-template-columns: 140px minmax(0, 1fr) 90px; gap: 12px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
.gpair .gname { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gpair .gbars { display: grid; gap: 2px; }
.gpair .gbars span { display: block; height: 8px; border-radius: 0 3px 3px 0; min-width: 2px; }
.gpair .ga { background: var(--gold); } .gpair .gb { background: var(--lilac); }
.gpair .gv { text-align: right; font-size: 13px; color: var(--ink-2); }
@media (max-width: 520px) { .gpair { grid-template-columns: 96px minmax(0, 1fr) 76px; } }
.plain-list { list-style: none; margin: 0; padding: 0; }
.plain-list li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.plain-list li span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chiplets { display: flex; flex-wrap: wrap; gap: 8px; }
.chiplet { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; background: var(--surface); }
.poster .cap > span { display: block; }

.facts { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.fact { display: grid; gap: 0; min-width: 0; }
.fact .k { font-size: 12.5px; color: var(--muted); }
.fact .v { font-weight: 600; font-size: 15px; }

/* ---------- column chart (weeks / months / decades) ---------- */
.chart { position: relative; margin-right: 30px; }
.chart .cols { position: relative; z-index: 1; }
.chart + .axis { margin-right: 30px; }
.cols {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: end;
  gap: 2px; height: 170px; border-bottom: 1px solid var(--line); padding-top: 8px;
}
.col { height: 100%; display: flex; flex-direction: column-reverse; align-items: center; cursor: default; min-width: 0; }
.col .seg { width: 100%; max-width: 24px; min-height: 0; }
.col .seg + .seg { margin-bottom: 2px; }
.col .seg.a { background: var(--gold); border-radius: 0 0 0 0; }
.col .seg.b { background: var(--lilac); }
.col .seg:last-child { border-radius: 4px 4px 0 0; }
.col:hover .seg, .col:focus-visible .seg { filter: brightness(1.2); }
.axis { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; margin-top: 6px; }
.axis span { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: center; white-space: nowrap; overflow: visible; }
@media (max-width: 620px) { .axis span.minor { visibility: hidden; } }
.gridline { position: absolute; left: 0; right: -30px; border-top: 1px solid var(--line); pointer-events: none; }
.gridline span { position: absolute; right: 0; top: -8px; font-family: var(--mono); font-size: 11px; line-height: 16px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* weekday bars */
.weekdays { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; max-width: 440px; }
.wd { display: grid; gap: 6px; justify-items: center; }
.wd .bar-v { width: 100%; max-width: 24px; height: 64px; display: flex; align-items: flex-end; }
.wd .bar-v span { display: block; width: 100%; background: var(--gold); border-radius: 4px 4px 0 0; }
.wd .lbl { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.wd .cnt { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* calendar heatmap */
.cal-wrap { overflow-x: auto; padding-bottom: 4px; }
.cal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); grid-auto-columns: 11px; gap: 3px; width: max-content; }
.cal i { display: block; border-radius: 2px; background: var(--surface-2); }
.cal i.l1 { background: var(--heat-1); } .cal i.l2 { background: var(--heat-2); } .cal i.l3 { background: var(--heat-3); }
.cal i.pad { background: transparent; }
.cal-months { display: grid; grid-auto-flow: column; grid-auto-columns: 11px; gap: 3px; width: max-content; margin-bottom: 4px; }
.cal-months span { font-family: var(--mono); font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: visible; width: 11px; }
.heat-key { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.heat-key i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; background: var(--surface-2); }

/* rating histogram */
.spread { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 2px; align-items: end; height: 150px; border-bottom: 1px solid var(--line); }
.spread .col .seg { max-width: 34px; }
.stars-axis { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 2px; margin-top: 6px; }
.stars-axis span { text-align: center; font-size: 11px; color: var(--muted); white-space: nowrap; letter-spacing: -.04em; }

/* ---------- people ---------- */
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 18px 14px; }
.person {
  all: unset; cursor: pointer; display: grid; gap: 8px; align-content: start; min-width: 0; border-radius: 8px;
}
.person:focus-visible { outline: 2px solid var(--gold-ink); outline-offset: 4px; }
.face {
  aspect-ratio: 1; max-width: 100%; border-radius: 8px; overflow: hidden; position: relative;
  background: var(--surface-2); display: grid; place-items: center;
}
.face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; display: block; }
.face .initials { font-family: var(--display); font-weight: 800; font-size: 40px; color: var(--muted); letter-spacing: .04em; }
.face .rank {
  position: absolute; left: 6px; top: 6px; font-family: var(--mono); font-size: 11px; font-weight: 500;
  background: color-mix(in srgb, var(--bg) 80%, transparent); color: var(--ink); padding: 1px 6px; border-radius: 999px;
}
.person:hover .face { box-shadow: 0 0 0 2px var(--gold); }
@media (max-width: 520px) {
  .people { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 10px; }
  .face .initials { font-size: 28px; }
}
.person .nm { font-weight: 600; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
.person .ct { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -6px; }

.rank-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.rank-list li { border-top: 1px solid var(--line); }
.rank-list li:first-child { border-top: 0; }
.rank-row {
  all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid;
  grid-template-columns: 30px minmax(0, 1.2fr) minmax(0, 2fr) 64px; align-items: center; gap: 12px; padding: 7px 4px;
}
.rank-row:hover { background: var(--surface); }
.rank-row:focus-visible { outline: 2px solid var(--gold-ink); outline-offset: -2px; }
.rank-row .r { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.rank-row .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-row .track { height: 10px; display: flex; align-items: center; }
.rank-row .track span { display: block; height: 10px; background: var(--gold); border-radius: 0 4px 4px 0; min-width: 2px; }
.rank-row .v { text-align: right; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 520px) { .rank-row { grid-template-columns: 26px minmax(0, 1fr) 70px 52px; gap: 8px; } }

.cat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
.cat-grid h3 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
.cat-grid .rank-row { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) 54px; }
@media (max-width: 900px) { .cat-grid { grid-template-columns: minmax(0, 1fr); } }

/* ---------- films ---------- */
.posters { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px; }
.poster { display: grid; gap: 6px; min-width: 0; align-content: start; }
.poster .art {
  aspect-ratio: 2 / 3; max-width: 100%; border-radius: 6px; overflow: hidden; background: var(--surface-2);
  display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; position: relative;
  border: 1px solid var(--line);
}
.poster .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.poster .art .t { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 17px; line-height: .95; overflow-wrap: break-word; }
.poster .art .t.long { font-size: 13.5px; } .poster .art .t.xlong { font-size: 11px; } /* long words shrink rather than break */
.poster .art .y { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 4px; }
.poster .cap { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; overflow-wrap: anywhere; }
.stars { color: var(--gold-ink); letter-spacing: .02em; white-space: nowrap; }

.milestones { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 18px 14px; }
.milestone .k { font-family: var(--mono); font-size: 12px; color: var(--gold-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.milestone .cap { display: grid; gap: 1px; }
.milestone .d { color: var(--muted); }

.decades { display: grid; gap: 14px; }
.decade { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 14px; align-items: start; }
.decade .lbl { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; }
.decade .lbl small { display: block; font-family: var(--sans); font-weight: 500; font-size: 12px; color: var(--muted); margin-top: 4px; }
.decade .row { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.decade .chiplet { flex: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; background: var(--surface); }

table.data { border-collapse: collapse; font-size: 13px; width: 100%; }
table.data th, table.data td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
table.data td.n, table.data th.n { text-align: right; font-variant-numeric: tabular-nums; }
details.tbl summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details.tbl .scroll { max-height: 320px; overflow: auto; margin-top: 8px; }

/* ---------- dialog, tooltip, drop ---------- */
dialog {
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink);
  padding: 0; width: min(560px, calc(100vw - 32px)); max-height: min(80vh, 720px); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(10, 6, 12, .6); }
.dlg-head { display: flex; gap: 14px; align-items: center; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.dlg-head .face { width: 56px; flex: none; }
.dlg-head h3 { font-size: 20px; }
.dlg-head .close { margin-left: auto; }
#dlg[open] { display: flex; flex-direction: column; }
.dlg-head, .dlg-foot { flex: none; }
.dlg-body { padding: 8px 20px 20px; overflow: auto; flex: 1 1 auto; min-height: 0; }
.film-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.film-row .ft { font-weight: 500; overflow-wrap: anywhere; }
.film-row .fy { color: var(--muted); font-weight: 400; }
.film-row .fd { font-size: 12.5px; color: var(--muted); }
.film-row .fr { text-align: right; }

/* ---------- links into the data ---------- */
/* A number that opens its data carries a fine gold underline (none in tables); in a sentence the link is simply gold,
   and names, titles and tags read as what they are. */
.dlink { all: unset; cursor: pointer; text-decoration: underline 1px; text-underline-offset: 4px;
  text-decoration-color: color-mix(in srgb, var(--gold) 40%, transparent); transition: color .15s, text-decoration-color .15s; }
.dlink:hover { color: var(--gold-ink); text-decoration-color: var(--gold-ink); }
.sub .dlink, .lead .dlink, .status .dlink, .hint .dlink, .tile .foot .dlink, .lookup p .dlink, .legend .dlink, .decade .lbl .dlink, .trend-lines .dlink {
  color: var(--gold-ink); text-decoration-color: transparent; }
.sub .dlink:hover, .lead .dlink:hover, .status .dlink:hover, .hint .dlink:hover, .tile .foot .dlink:hover, .lookup p .dlink:hover, .legend .dlink:hover,
  .decade .lbl .dlink:hover, .trend-lines .dlink:hover { text-decoration-color: currentColor; }
.rv-title .dlink, .crowd h3 .dlink, .match .score .dlink, .plain-list .dlink { text-decoration: none; }
.fact .v .dlink, table.data .dlink { text-decoration: none; }
.fact .v .dlink::after { content: "›"; margin-left: 6px; color: var(--gold-ink); font-weight: 400; }
.fact .v .dlink:hover { color: var(--ink); }
.fact .v .dlink:hover::after { margin-left: 9px; }
.dlink:focus-visible, .dline:focus-visible { outline: 2px solid var(--gold-ink); outline-offset: 2px; border-radius: 2px; }
.dline { all: unset; cursor: pointer; display: block; }
.trend-lines li:has(.dline) { align-items: flex-start; }
.trend-lines li:has(.dline) .mk { line-height: 1.5; padding-top: .1em; }
.dline:hover { color: var(--gold-ink); }
.dline .go { color: var(--gold-ink); }
button.col, button.wd, button.poster, button.gcard, button.habit, button.chiplet, .venn button, .gpair, .pgroup {
  appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
button.col, button.wd, button.poster { background: none; border: 0; padding: 0; margin: 0; width: 100%; }
button.col:focus-visible, button.wd:focus-visible, button.poster:focus-visible { outline: 2px solid var(--gold-ink); outline-offset: 2px; }
button.wd:hover .bar-v span { filter: brightness(1.2); }
button.poster:hover .art { box-shadow: 0 0 0 2px var(--gold); }
button.gcard:hover, button.habit:hover { border-color: var(--gold); }
button.gcard .go, button.habit .go { color: var(--gold-ink); }
button.habit { background: none; border-width: 2px 0 0; border-style: solid; border-color: var(--gold); padding: 8px 0 0; margin: 0; border-radius: 0; }
button.chiplet:hover { border-color: var(--gold); }
.wordcloud button.w { all: unset; cursor: pointer; color: var(--ink); font-weight: 600; line-height: 1.3; }
.wordcloud button.w:hover { color: var(--gold-ink); text-decoration: underline; }
.wordcloud button.w:focus-visible { outline: 2px solid var(--gold-ink); }
.cal i[data-list] { cursor: pointer; }
button.pgroup, button.gpair { background: none; border: 0; margin: 0; width: 100%; }
button.pgroup { padding: 0; }
button.pgroup:disabled { cursor: default; }
button.gpair { border-bottom: 1px solid var(--line); padding: 5px 0; }
button.pgroup:hover span, button.gpair:hover .gbars span { filter: brightness(1.2); }
button.gpair:hover .gname { color: var(--gold-ink); }
.venn [data-list] { cursor: pointer; }
.venn [data-list]:hover { filter: brightness(1.2); }
a.chiplet { color: inherit; text-decoration: none; }
a.chiplet:hover { border-color: var(--gold); }
.match .score .dlink:hover { color: var(--ink); }
.cal i[data-list]:hover { outline: 1px solid var(--ink); }
td .dlink { font-variant-numeric: tabular-nums; }
/* in a table that compares its rows: the highest of each column in gold, the lowest in purple */
table.data td.hi { color: var(--gold-ink); font-weight: 700; }
table.data td.lo { color: color-mix(in srgb, var(--lilac) 80%, white); font-weight: 700; }

/* ---------- the pop-up and the full page ---------- */
dialog.wide { width: min(720px, calc(100vw - 32px)); }
.dlg-foot { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 20px 14px; border-top: 1px solid var(--line); }
.drill-bar { display: flex; gap: 12px; align-items: center; margin: 22px 0 6px; }
.drill-page { max-width: 760px; margin-bottom: 40px; }
.drill-row { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 7px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
button.drill-row:hover { background: var(--surface-2); }
button.drill-row:focus-visible { outline: 2px solid var(--gold-ink); outline-offset: -2px; }
.drill-row.entry { grid-template-columns: 34px 36px minmax(0, 1fr) auto; }
.drill-row.name, .drill-row.plain { grid-template-columns: minmax(0, 1fr) auto; cursor: default; }
button.drill-row.name { cursor: pointer; }
.dr-main { display: grid; min-width: 0; }
.dr-t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-y { color: var(--muted); font-weight: 400; }
.dr-s { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.dr-r { text-align: right; white-space: nowrap; font-size: 13px; }
.dr-r .ic { color: var(--muted); margin-left: 5px; }
.heart, .dr-r .ic.heart { color: var(--heart); }
.dr-d { display: grid; justify-items: center; line-height: 1.05; }
.dr-d b { font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.dr-d small { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.drill-month { display: flex; justify-content: space-between; margin: 16px 0 2px; font-family: var(--mono); font-size: 11.5px; color: var(--gold-ink); text-transform: uppercase; letter-spacing: .08em; }
.drill-month:first-child { margin-top: 6px; }
.drill-group + .drill-group { margin-top: 18px; }
.drill-group h4 { display: flex; justify-content: space-between; margin: 10px 0 2px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.dr-gsub { margin: 0 0 4px; font-size: 12.5px; color: var(--muted); }
.thumb { position: relative; display: grid; place-items: center; width: 36px; aspect-ratio: 2 / 3; border-radius: 4px; overflow: hidden;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); font-family: var(--display); font-weight: 800; font-size: 12px; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb.big { width: 110px; flex: none; font-size: 16px; line-height: .95; text-transform: uppercase; padding: 8px; text-align: center; color: var(--ink); }
.drill-rev { border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.drill-rev .drill-row { border-bottom: 0; }
.drill-rev .rv-text { margin: 2px 4px 4px 52px; }
.drill-rev .linkish { margin-left: 52px; font-size: 13px; }
.rv-text mark { background: color-mix(in srgb, var(--gold) 35%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }
.fcard { display: grid; gap: 14px; padding-top: 10px; }
.fc-badge { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--gold-ink); }
.fc-top { display: flex; gap: 16px; align-items: flex-start; }
.fc-facts { display: grid; gap: 4px; min-width: 0; }
.fc-facts p { margin: 0; color: var(--ink-2); font-size: 14px; }
.fc-facts .fc-t { color: var(--ink); font-size: 20px; font-weight: 700; line-height: 1.2; }
.fc-facts .fc-t span { color: var(--muted); font-weight: 400; }
.fc-crowd { font-size: 13px !important; }
.fc-crowd small { color: var(--muted); }
.fc-sec h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.fc-line { margin: 0 0 6px; }
.fc-entries { display: grid; border-top: 1px solid var(--line); }
.fc-entry { display: flex; justify-content: space-between; gap: 12px; padding: 5px 2px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.fc-entry small { color: var(--muted); }
.fc-entry.on { background: color-mix(in srgb, var(--gold) 16%, transparent); }
.fc-review { margin-top: 10px; }
.fc-review .dr-s { margin: 0 0 2px; }
.fc-dir .dlink { text-decoration: none; color: var(--ink); font-weight: 600; }
.fc-dir .dlink:hover { color: var(--gold-ink); }
.fc-tags, .fc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fc-tags { margin-top: 6px !important; }
.fc-tags .dlink, .fc-chips .dlink { text-decoration: none; padding: 3px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2);
  font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
.fc-tags .dlink:hover, .fc-chips .dlink:hover { color: var(--ink); border-color: var(--gold); }
.fc-links { display: flex; gap: 16px; margin: 0; font-size: 13.5px; }
.fc-links a { color: var(--gold-ink); text-decoration: none; }
.fc-links a:hover { text-decoration: underline; text-underline-offset: 4px; }

/* ---------- search, filmographies, fixing a match, watch next, backups ---------- */
.search-box { position: sticky; top: -8px; background: var(--surface); padding: 6px 0 10px; z-index: 1; }
.search-box input { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.search-box input:focus { outline: 2px solid var(--gold-ink); outline-offset: 0; }
.search-hint { margin: 6px 0; }
.filmo { margin: 8px 0 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.filmo .dr-s { margin: 0; }
.filmo-head { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.filmo-bar { height: 6px; border-radius: 3px; background: var(--line); margin: 8px 0 4px; overflow: hidden; }
.filmo-bar i { display: block; height: 100%; background: var(--gold); border-radius: 3px; }
.filmo-left summary { cursor: pointer; font-size: 13px; color: var(--gold-ink); margin-top: 6px; }
.filmo-left .drill-row { border-bottom-color: color-mix(in srgb, var(--line) 70%, transparent); }
.fc-fix { font-size: 13px; }
.fc-fix label { display: block; color: var(--muted); margin-bottom: 6px; }
.fix-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fix-row input { flex: 1 1 260px; min-width: 0; font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.fix-note { margin: 6px 0 0; }
.posters.wn .cap .pred { color: var(--gold-ink); font-weight: 600; }
.posters.wn .cap .why { font-size: 12px; line-height: 1.3; }
.backup-keys { margin-left: 10px; }
dialog.tall { width: min(520px, calc(100vw - 32px)); max-height: 94vh; }
.share-img { display: block; width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); margin-top: 6px; }
.share-row { display: flex; gap: 8px; margin: 12px 0 6px; flex-wrap: wrap; }
.btn.green { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }

#tip {
  position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg);
  font-size: 12.5px; padding: 6px 9px; border-radius: 6px; max-width: 300px; line-height: 1.4; box-shadow: var(--shadow); white-space: pre-line;
}
#tip b { display: block; font-size: 13.5px; margin-bottom: 2px; }
/* the world map: the more films, the deeper the gold */
.wmap { --w0: var(--surface-2); --w1: color-mix(in srgb, var(--gold) 34%, var(--surface-2)); --w2: color-mix(in srgb, var(--gold) 55%, var(--surface-2));
  --w3: color-mix(in srgb, var(--gold) 78%, var(--surface-2)); --w4: var(--gold); --w5: var(--gold-ink); display: grid; gap: 12px; }
.wsvg { display: block; width: 100%; height: auto; }
.wsvg .wc { fill: var(--w0); stroke: var(--bg); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; transition: fill .15s; }
.wsvg .wc[data-list] { cursor: pointer; }
.wsvg .wc:hover { stroke: var(--ink); stroke-width: 1.5; }
.wsvg .l1 { fill: var(--w1); } .wsvg .l2 { fill: var(--w2); } .wsvg .l3 { fill: var(--w3); } .wsvg .l4 { fill: var(--w4); } .wsvg .l5 { fill: var(--w5); }
.wkey { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.wk { all: unset; display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
button.wk { cursor: pointer; } button.wk:hover { color: var(--ink); } button.wk:focus-visible { outline: 2px solid var(--gold-ink); outline-offset: 2px; border-radius: 3px; }
.wk i { width: 16px; height: 10px; border-radius: 2px; background: var(--w0); }
.wk i.l1 { background: var(--w1); } .wk i.l2 { background: var(--w2); } .wk i.l3 { background: var(--w3); } .wk i.l4 { background: var(--w4); } .wk i.l5 { background: var(--w5); }
.wk-unit { color: var(--muted); }
.wgone { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.drop-veil {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; pointer-events: none;
  background: color-mix(in srgb, var(--bg) 82%, transparent); border: 3px dashed var(--gold);
  font-family: var(--display); font-weight: 800; font-size: 40px; text-transform: uppercase; letter-spacing: .04em;
}
footer { border-top: 1px solid var(--line); padding-block: 22px 40px; color: var(--muted); font-size: 13px; }
footer p { margin: 0 0 6px; max-width: 80ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* the best-rated decade */
.best-decade { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 18px 20px;
  border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(120deg, color-mix(in srgb, var(--gold) 12%, var(--surface)), var(--surface) 60%); }
.bd-head { display: grid; gap: 6px; }
.bd-title { font-family: var(--display); font-weight: 800; font-size: 52px; line-height: .9; text-transform: uppercase; letter-spacing: .01em; }
.bd-title .dlink { text-decoration: none; }
.bd-title .accent { color: var(--gold-ink); }
.bd-head p { margin: 0; }
.best-decade .posters { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 10px; }
.bd-next { margin: 0; font-size: 13.5px; color: var(--ink-2); }
/* the second and third best, side by side, their posters a little smaller */
.bd-runners { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.bd-runner { display: grid; gap: 12px; align-content: start; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius);
  background: linear-gradient(120deg, color-mix(in srgb, var(--gold) 6%, var(--surface)), var(--surface) 60%); }
.bd-rhead { display: grid; gap: 4px; }
.bd-rhead p { margin: 0; font-size: 13px; }
.bd-rtitle { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: .95; text-transform: uppercase; letter-spacing: .01em; }
.bd-rtitle .dlink { text-decoration: none; }
.bd-rtitle .accent { color: var(--gold-ink); }
.bd-runner .posters { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.bd-runner .poster .art { padding: 6px; }
.bd-runner .poster .art .t { font-size: 12px; }
.bd-runner .poster .art .y { font-size: 10.5px; }
.bd-runner .poster .cap { font-size: 11px; }
.bd-runners + .bd-next { margin-top: 12px; }
@media (max-width: 1100px) { .bd-runners { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 1100px) { .best-decade .posters { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 760px) { .best-decade .posters { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
/* month by month: a square for every month of every year */
.mgrid { border-collapse: separate; border-spacing: 3px; width: 100%; font-variant-numeric: tabular-nums; }
.mgrid th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; padding: 2px; }
.mgrid tbody th, .mgrid tfoot th { text-align: left; color: var(--ink-2); padding-right: 8px; white-space: nowrap; }
.mgrid td { text-align: center; padding: 0; height: 32px; min-width: 34px; }
.mgrid td.n { text-align: right; padding-left: 8px; font-size: 13px; }
.mg-c { all: unset; box-sizing: border-box; cursor: pointer; display: grid; place-items: center; width: 100%; height: 32px; border-radius: 6px; font-size: 12.5px; font-weight: 600;
  background: color-mix(in srgb, var(--gold) calc(var(--a) * 100%), var(--surface-2)); color: var(--ink); }
