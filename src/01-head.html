<title>Credits Roll</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: a screening programme. A sprocket-edged title band, then one column of
   credit-style sections: the role label ("Starring", "Directed by") sits in a narrow
   left column on wide screens, the names and charts to its right. */
:root {
  --bg: #141017;
  --surface: #1D1722;
  --surface-2: #272030;
  --line: #352C3D;
  --ink: #F3EEF4;
  --ink-2: #C2B8C6;
  --muted: #8E8394;
  --gold: #BE8722;
  --gold-ink: #E6B65A;
  --lilac: #8A7AE6;
  --heat-1: #7E5D21;
  --heat-2: #A97B27;
  --heat-3: #DCA63C;
  --danger: #EE8A92;
  --on-gold: #1A1206;
  --shadow: 0 18px 40px rgba(0, 0, 0, .45);
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --sans: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F6F2F4; --surface: #FFFFFF; --surface-2: #F0EAEF; --line: #E2D9E0;
    --ink: #1E1722; --ink-2: #4E4553; --muted: #776D7C;
    --gold: #B07A12; --gold-ink: #8A5E0B; --lilac: #6D5FD3;
    --heat-1: #D4AA55; --heat-2: #B07A12; --heat-3: #7A520A;
    --danger: #B4232F; --on-gold: #FFFFFF; --shadow: 0 18px 40px rgba(60, 30, 60, .14);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F6F2F4; --surface: #FFFFFF; --surface-2: #F0EAEF; --line: #E2D9E0;
  --ink: #1E1722; --ink-2: #4E4553; --muted: #776D7C;
  --gold: #B07A12; --gold-ink: #8A5E0B; --lilac: #6D5FD3;
  --heat-1: #D4AA55; --heat-2: #B07A12; --heat-3: #7A520A;
  --danger: #B4232F; --on-gold: #FFFFFF; --shadow: 0 18px 40px rgba(60, 30, 60, .14);
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--gold-ink); }
:focus-visible { outline: 2px solid var(--gold-ink); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.wrap {
  max-width: 1160px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- title band ---------- */
.band { background: var(--surface); border-bottom: 1px solid var(--line); position: relative; }
.sprockets {
  height: 18px;
  background: repeating-linear-gradient(90deg, transparent 0 10px, var(--bg) 10px 24px, transparent 24px 34px);
  -webkit-mask: linear-gradient(transparent 5px, #000 5px, #000 13px, transparent 13px);
          mask: linear-gradient(transparent 5px, #000 5px, #000 13px, transparent 13px);
  opacity: .9;
}
.band-inner { padding-block: 22px 26px; display: grid; gap: 22px; }
.topline { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.wordmark {
  font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .14em;
  text-transform: uppercase; display: flex; align-items: center; gap: 10px;
}
.wordmark .reel {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  background: radial-gradient(circle, var(--surface) 0 2px, transparent 2.5px),
    conic-gradient(var(--gold) 0 40deg, transparent 40deg 60deg, var(--gold) 60deg 100deg, transparent 100deg 120deg,
    var(--gold) 120deg 160deg, transparent 160deg 180deg, var(--gold) 180deg 220deg, transparent 220deg 240deg,
    var(--gold) 240deg 280deg, transparent 280deg 300deg, var(--gold) 300deg 340deg, transparent 340deg 360deg);
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; line-height: 1.2;
  transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 5px 11px; font-size: 13px; }

.hero { display: grid; gap: 10px; }
.eyebrow {
  font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.hero h1 {
  font-family: var(--display); font-weight: 800; text-transform: uppercase;
  font-size: clamp(54px, 11vw, 120px); line-height: .86; letter-spacing: .01em;
}
.hero h1 .accent { color: var(--gold-ink); }
.hero .sub { color: var(--ink-2); font-size: 16px; max-width: 62ch; }

.notice {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  border: 1px dashed var(--gold); border-radius: var(--radius); padding: 12px 16px;
  color: var(--ink-2); background: color-mix(in srgb, var(--gold) 8%, transparent);
}
.notice strong { color: var(--ink); }
.notice p { margin: 0; flex: 1 1 320px; min-width: 0; }

.scopes-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.scopes-row .eyebrow { flex: none; }
.scopes { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; min-width: 0; }
.chip {
  flex: none; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  padding: 5px 12px; border-radius: 999px; font-family: var(--mono); font-size: 13px;
}
.chip:hover { color: var(--ink); border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ---------- overview tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-block: 28px 8px; }
.tile { background: var(--surface); padding: 16px 18px; display: grid; gap: 2px; align-content: start; min-width: 0; }
a.tile { color: inherit; text-decoration: none; }
a.tile:hover { background: var(--surface-2); }
a.tile .label::after { content: " ↓"; }
.tile .label { font-size: 13px; color: var(--muted); }
.tile .value { font-weight: 700; font-size: clamp(26px, 3.2vw, 34px); line-height: 1.1; letter-spacing: -.01em; }
.tile .value small { font-size: .5em; font-weight: 500; color: var(--muted); margin-left: 3px; }
.tile .foot { font-size: 12.5px; color: var(--muted); font-family: var(--mono); }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 520px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
