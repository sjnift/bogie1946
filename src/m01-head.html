<title>Credits Roll Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a phone app in the style of the Letterboxd app. A sticky nav bar with year tabs,
   one scrolling screen per bottom tab, list rows with chevrons, and pushed detail screens.
   Dark only, like the app. On wide screens the app sits in a centred 480px column. */
:root {
  --bg: #14181C;
  --bar: #1B2128;
  --card: #202830;
  --card-2: #2C3440;
  --line: #2C3440;
  --ink: #FFFFFF;
  --ink-1: #DDE6EE;
  --ink-2: #99AABB;
  --muted: #6E8193;
  --green: #00E054;
  --green-mark: #00A83E;
  --blue: #40BCF4;
  --blue-mark: #2E95D3;
  --orange: #FF8000;
  --slate-mark: #62788D;
  --heat-1: #0E5C2C;
  --heat-2: #13873F;
  --heat-3: #2FC266;
  --danger: #FF7A7A;
  --frame: rgba(221, 238, 255, .2);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Roboto, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --navbar: 48px;
  --scopebar: 40px;
  --tabbar: 56px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { color: var(--ink-2); font-family: var(--sans); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
a { color: var(--blue); text-decoration: none; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 24px); }
@media (min-width: 520px) { .app { border-inline: 1px solid var(--line); } }
.screen {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- nav bar + year tabs ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); border-bottom: 1px solid var(--line); }
.nav {
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; height: var(--navbar);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.nav h1 { color: var(--ink); font-size: 17px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
.nav .left { justify-self: start; } .nav .right { justify-self: end; }
.nav-btn { background: none; border: 0; color: var(--green); font-size: 15px; font-weight: 500; padding: 8px 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
.nav-btn svg { width: 22px; height: 22px; }
.scopes {
  display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; height: var(--scopebar); align-items: stretch;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.scopes::-webkit-scrollbar { display: none; }
.scope {
  all: unset; flex: none; cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); border-bottom: 2px solid transparent; display: flex; align-items: center;
}
.scope[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--green); }
.scope:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.top.detail .scopes { display: none; }

/* ---------- common pieces ---------- */
.sh {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 26px 0 10px; padding-bottom: 7px;
  border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2);
}
.sh .more { all: unset; cursor: pointer; color: var(--ink-2); font-size: 12px; letter-spacing: .08em; }
.sh .more:hover { color: var(--ink); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: 0;
  border-radius: 6px; padding: 11px 16px; font-weight: 600; font-size: 15px; background: var(--card-2); color: var(--ink);
}
.btn.green { background: var(--green-mark); color: #fff; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.card { background: var(--card); border-radius: 8px; padding: 14px; display: grid; gap: 10px; }
.card p { margin: 0; }
.card .title { color: var(--ink); font-weight: 600; font-size: 15px; }
.status { font-size: 13.5px; color: var(--ink-2); }
.status.err { color: var(--danger); }
.tmdb-link { font-size: 11px; font-weight: 500; color: var(--blue); white-space: nowrap; margin-left: 4px; }
.linkish { all: unset; cursor: pointer; color: var(--blue); }
.linkish:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.stars { color: var(--green); letter-spacing: .02em; white-space: nowrap; }
.heart { color: var(--orange); }
.rewatch { color: var(--green); }
.chev { width: 16px; height: 16px; color: var(--muted); flex: none; }
.empty { color: var(--muted); padding: 16px 0; font-size: 14px; }
.meter { height: 4px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--green-mark); width: 0; transition: width .3s; }

/* ---------- profile ---------- */
.profile { display: grid; justify-items: center; gap: 6px; padding-top: 22px; text-align: center; }
.avatar {
  border-radius: 50%; background: var(--card-2); display: grid; place-items: center; overflow: hidden; position: relative;
  color: var(--ink-1); font-weight: 700; flex: none; box-shadow: inset 0 0 0 1px var(--frame);
}
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
.avatar.xl { width: 84px; height: 84px; font-size: 28px; }
.avatar.lg { width: 64px; height: 64px; font-size: 21px; }
.avatar.md { width: 44px; height: 44px; font-size: 15px; }
.profile .name { color: var(--ink); font-size: 20px; font-weight: 700; margin-top: 6px; }
.profile .handle { font-size: 13.5px; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--bg); background: var(--ink-2); border-radius: 3px; padding: 2px 6px; }
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 18px; border-block: 1px solid var(--line); }
.strip div { display: grid; justify-items: center; padding: 12px 2px; gap: 1px; min-width: 0; }
.strip div + div { border-left: 1px solid var(--line); }
.strip b { color: var(--ink); font-size: 19px; font-weight: 700; }
.strip span { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
.notice { margin-top: 16px; }

/* ---------- menu rows ---------- */
.menu { list-style: none; margin: 0; padding: 0; }
.row {
  all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: flex; align-items: center; gap: 12px;
  padding: 13px 0; border-bottom: 1px solid var(--line); color: var(--ink-1); font-size: 16px;
}
.row:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.row .count { margin-left: auto; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.row.danger { color: var(--danger); }

/* ---------- people ---------- */
.scroller { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; padding-bottom: 2px; }
.scroller::-webkit-scrollbar { display: none; }
.pcard { all: unset; cursor: pointer; flex: none; width: 74px; display: grid; justify-items: center; gap: 5px; text-align: center; }
.pcard .nm { color: var(--ink-1); font-size: 12px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pcard .ct { font-size: 11.5px; color: var(--ink-2); margin-top: -3px; }
.segctl { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--card); border-radius: 8px; padding: 2px; gap: 2px; margin-top: 14px; }
.segctl button { all: unset; text-align: center; padding: 7px 0; border-radius: 6px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.segctl button[aria-pressed="true"] { background: var(--card-2); color: var(--ink); }
.segctl button:focus-visible { outline: 2px solid var(--blue); }
.toggles { display: flex; gap: 18px; margin-top: 14px; }
.toggle { all: unset; cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-bottom: 3px; border-bottom: 2px solid transparent; }
.toggle[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--green); }
.prow {
  all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 24px 44px minmax(0, 1fr) auto 16px;
  align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line);
}
.prow:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.prow .rk { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.prow .nm { color: var(--ink); font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .sub { font-size: 12.5px; color: var(--ink-2); }
.prow .val { color: var(--ink-1); font-size: 14px; font-variant-numeric: tabular-nums; }
.prow.cat { grid-template-columns: minmax(0, 1fr) 90px 44px 16px; }
.mini { height: 6px; background: var(--card-2); border-radius: 3px; overflow: hidden; }
.mini span { display: block; height: 100%; background: var(--slate-mark); border-radius: 3px; }

/* ---------- posters ---------- */
.pgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 8px; }
.pitem { all: unset; cursor: default; display: grid; gap: 4px; min-width: 0; }
.poster {
  position: relative; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 4px; overflow: hidden;
  background: linear-gradient(165deg, #2F3946, #1C232B);
}
.poster::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--frame); pointer-events: none; }
.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.poster .ph { position: absolute; inset: 0; padding: 7px 6px; display: flex; flex-direction: column; justify-content: flex-end; color: var(--ink-1); font-size: 11px; font-weight: 600; line-height: 1.15; overflow-wrap: break-word; }
.poster .ph small { color: var(--ink-2); font-weight: 400; font-size: 10px; margin-top: 2px; }
.pmeta { display: flex; gap: 4px; align-items: center; font-size: 11px; min-height: 14px; }
.mlabel { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mdate { font-size: 11px; color: var(--muted); margin-top: -2px; }

/* ---------- diary ---------- */
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.fact { background: var(--card); border-radius: 8px; padding: 10px 12px; display: grid; gap: 1px; min-width: 0; }
.fact .k { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.fact .v { color: var(--ink); font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.month-h {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--navbar) + var(--scopebar) + 1px); z-index: 5;
  background: var(--bg); padding: 10px 0 6px; border-bottom: 1px solid var(--line);
  font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2);
}
.drow { display: grid; grid-template-columns: 30px 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.drow .day { font-size: 22px; font-weight: 300; color: var(--ink-2); text-align: center; font-variant-numeric: tabular-nums; }
.drow .poster { width: 34px; }
.drow .poster .ph { display: none; }
.drow .t { color: var(--ink); font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drow .t span { color: var(--ink-2); font-weight: 400; }
.drow .m { font-size: 12px; display: flex; gap: 6px; align-items: center; }
.drow .icons { display: flex; gap: 6px; font-size: 14px; }

/* ---------- charts ---------- */
.chart { position: relative; margin-right: 26px; margin-top: 8px; }
.cols { position: relative; z-index: 1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: end; gap: 1px; border-bottom: 1px solid var(--line); padding-top: 8px; }
.col { height: 100%; display: flex; flex-direction: column-reverse; align-items: center; min-width: 0; }
.col .seg { width: 100%; max-width: 24px; }
.col .seg + .seg { margin-bottom: 2px; }
.col .seg.a { background: var(--green-mark); }
.col .seg.b { background: var(--blue-mark); }
.col .seg:last-child { border-radius: 3px 3px 0 0; }
.col:hover .seg { filter: brightness(1.25); }
.chart.slate .col .seg.a { background: var(--slate-mark); }
.chart + .axis { margin-right: 26px; }
.axis { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 1px; margin-top: 5px; }
.axis span { font-size: 10.5px; color: var(--muted); text-align: center; white-space: nowrap; }
.axis.dense span.minor { visibility: hidden; }
.gridline { position: absolute; left: 0; right: -26px; border-top: 1px solid var(--line); pointer-events: none; }
.gridline span { position: absolute; right: 0; top: -8px; font-size: 10.5px; line-height: 16px; color: var(--muted); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
.weekdays { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.wd { display: grid; gap: 4px; justify-items: center; }
.wd .bar-v { width: 100%; max-width: 24px; height: 60px; display: flex; align-items: flex-end; }
.wd .bar-v span { display: block; width: 100%; background: var(--green-mark); border-radius: 3px 3px 0 0; }
.wd .lbl { font-size: 11px; color: var(--muted); }
.wd .cnt { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cal-wrap { overflow-x: auto; padding-bottom: 4px; }
.cal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 10px); grid-auto-columns: 10px; gap: 3px; width: max-content; }
.cal i { display: block; border-radius: 2px; background: var(--card-2); }
.cal i.l1 { background: var(--heat-1); } .cal i.l2 { background: var(--heat-2); } .cal i.l3 { background: var(--heat-3); }
.cal i.pad { background: transparent; }
.cal-months { display: grid; grid-auto-flow: column; grid-auto-columns: 10px; gap: 3px; width: max-content; margin-bottom: 4px; }
.cal-months span { font-size: 10px; color: var(--muted); white-space: nowrap; width: 10px; }
.heat-key { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.heat-key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; background: var(--card-2); }
.hist-ends { display: flex; justify-content: space-between; font-size: 11px; margin-top: 4px; }

/* ---------- detail screens ---------- */
.dhead { display: grid; justify-items: center; gap: 4px; padding-top: 22px; text-align: center; }
.dhead .name { color: var(--ink); font-size: 21px; font-weight: 700; margin-top: 8px; }
.dhead .sub { font-size: 13.5px; }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--bar); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabbar nav { max-width: 448px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: var(--tabbar); }
.tabbar button { all: unset; cursor: pointer; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--muted); font-size: 10.5px; font-weight: 500; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button:focus-visible { outline: 2px solid var(--blue); outline-offset: -4px; border-radius: 8px; }

/* ---------- insights ---------- */
.icards { display: grid; gap: 8px; }
.yearpick { overflow-x: auto; scrollbar-width: none; flex-wrap: nowrap; margin-top: 14px; padding-bottom: 2px; }
.yearpick::-webkit-scrollbar { display: none; }
.yearpick .toggle { flex: none; }
.icard { background: var(--card); border-radius: 8px; padding: 12px 14px; display: grid; gap: 3px; }
.icard .k { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.icard .big { color: var(--ink); font-size: 22px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.icard p { margin: 0; font-size: 14px; }
.mults { display: grid; gap: 14px; }
.mult .mt { margin: 0 0 2px; font-size: 12px; color: var(--ink-2); }
.tscroll { overflow-x: auto; margin-top: 14px; margin-inline: -16px; padding-inline: 16px; }
.mtable { border-collapse: collapse; font-size: 13px; width: max-content; min-width: 100%; }
.mtable th, .mtable td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.mtable th { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.mtable td { color: var(--ink-1); }
.mtable .n { text-align: right; font-variant-numeric: tabular-nums; }
.mtable.heat td.n { text-align: center; min-width: 40px; }
.dim { color: var(--muted); }
.tline { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; color: var(--ink-1); font-size: 14.5px; }
.tline .mk { font-size: 10px; flex: none; color: var(--ink-2); }
.ghead { display: grid; grid-template-columns: minmax(0, 1fr) 84px 84px 16px; gap: 10px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin-top: 10px; }
.grow { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) 84px 84px 16px; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.grow .nm { display: block; color: var(--ink); font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow .sub { font-size: 12px; }
.gcol { display: grid; gap: 2px; justify-items: center; }
.gcol .v { font-size: 11.5px; color: var(--ink-1); font-variant-numeric: tabular-nums; }
.dbar { position: relative; display: block; width: 100%; height: 8px; }
.dbar .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; border-left: 1px solid var(--muted); }
.dbar .fill { position: absolute; top: 0; bottom: 0; }
.dbar .fill.pos { left: 50%; background: var(--green-mark); border-radius: 0 3px 3px 0; }
.dbar .fill.neg { right: 50%; background: var(--blue-mark); border-radius: 3px 0 0 3px; }
.lead { margin: 4px 0 0; color: var(--ink-1); font-size: 15px; }
.fact .t { font-size: 12.5px; color: var(--ink-2); }
.dv { color: var(--ink); font-weight: 600; }
/* ---------- reviews ---------- */
.mrev { padding: 14px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.mrev-head { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; }
.mrev-head .poster .ph { display: none; }
.mrev .t { color: var(--ink); font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrev .t span { color: var(--ink-2); font-weight: 400; }
.mrev .m { display: flex; gap: 6px; align-items: center; font-size: 12.5px; }
.rv-text { color: var(--ink-1); font-size: 14.5px; line-height: 1.55; overflow-wrap: anywhere; }
.rv-text p { margin: 0 0 .7em; } .rv-text p:last-child { margin-bottom: 0; }
.rv-text blockquote { margin: .3em 0 .7em; padding-left: 10px; border-left: 2px solid var(--card-2); color: var(--ink-2); }
.rv-text ul, .rv-text ol { margin: .3em 0 .7em; padding-left: 1.2em; }
.rv-text a { color: var(--blue); }
.rv-text.clamp { max-height: 7.8em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
.mrev .linkish { justify-self: start; font-size: 13px; }
.wordcloud { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.wordcloud .w { color: var(--ink); font-weight: 600; line-height: 1.3; }
.wchips { display: flex; flex-wrap: wrap; gap: 6px; }
.wchips span { background: var(--card); border-radius: 4px; padding: 4px 9px; font-size: 13px; color: var(--ink-1); }

/* ---------- compare ---------- */
.venn { display: flex; gap: 2px; height: 18px; border-radius: 5px; overflow: hidden; }
