  out.follow = factors.map((f) => ({ ...f, pct: Math.max(0, Math.round(f.r2 * 100)) })).sort((a, b) => b.r2 - a.r2);
  const dir = out.follow.find((f) => f.id === "d");
  const fl = out.follow.filter((f) => f.pct >= FOLLOW_MIN && !(f.id === "w" && dir && Math.abs(f.pct - dir.pct) <= 5));
  if (fl.length) {
    const low = out.follow.find((f) => f.id === "g");
    out.followText = `What tells most about how you'll rate a film is ${fl[0].short}: it accounts for ${fl[0].pct}% of the ups and downs in your ratings` +
      (fl[1] ? `, then ${fl[1].short} (${fl[1].pct}%)${fl[2] ? ` and ${fl[2].short} (${fl[2].pct}%)` : ""}` : "") + "." +
      (low && fl.indexOf(low) > 2 ? ` Its genres account for only ${low.pct}%.` : "");
  }

  // What you like more, or less, than a film's reputation says you should: your rating against the one the crowd's
  // score would predict for you, averaged over the films that share something.
  const base = line ? withCrowd : rated;
  const resid = new Map(base.map((x) => [x, x.rating - (line ? line.a + line.b * x.crowd : mu)]));
  const spread = sdOf([...resid.values()]);
  out.beyond.vsCrowd = !!line;
  const groups = [];
  for (const [fid, fc] of Object.entries(FACETS)) {
    if (fid === "c") continue;
    const m = new Map();
    for (const x of base) for (const v of fc.vals(x)) { if (!m.has(v)) m.set(v, []); m.get(v).push(x); }
    for (const [v, xs] of m) groups.push({ name: fid === "d" ? `Films by ${v}` : fid === "g" ? capFirst(genreNoun(v)) : fid === "dec" ? `Films from the ${v}s` : fid === "l" ? `Films in ${v}` : `Films from ${placeName(v)}`, xs, min: fid === "d" ? 4 : 6, person: fid === "d" });
  }
  const bands = [
    ["Films under 90 minutes", (x) => x.rt && x.rt < 90], ["Films of 2½ hours or more", (x) => x.rt >= 150],
    ["Films seen within a year of release", (x) => x.age != null && x.age <= 1], ["Films 50 or more years old when you saw them", (x) => x.age >= 50],
    [`The most popular films (top fifth by ${B.popSrc} ratings)`, (x) => x.popQ >= 0.8], [`Little-known films (bottom fifth by ${B.popSrc} ratings)`, (x) => x.popQ != null && x.popQ <= 0.2],
    ["Popular new releases", (x) => x.popQ >= 0.8 && x.age != null && x.age <= 2], ["Films by directors new to you", (x) => x.newDir],
  ];
  for (const [name, test] of bands) groups.push({ name, xs: base.filter(test), min: 6 });
  const found = groups.filter((g) => g.xs.length >= g.min && g.xs.length <= base.length * 0.7).map((g) => {
    const rs = g.xs.map((x) => resid.get(x)), mean = avg(rs), z = spread ? mean / (spread / Math.sqrt(rs.length)) : 0;
    return { ...g, mean, sh: rs.reduce((s, r) => s + r, 0) / (rs.length + 5), z };
  }).filter((g) => Math.abs(g.sh) >= 0.2 && Math.abs(g.z) >= 2.5);
  const beyondItem = (g) => {
    const xs = [...g.xs].sort((a, b) => resid.get(b) - resid.get(a)), up = g.mean > 0;
    const text = line ? `${g.name}: you rate them ${Math.abs(g.mean).toFixed(1)}★ ${up ? "higher" : "lower"} than their reputation would predict for you (${plural(xs.length, "film")}).`
      : `${g.name}: you rate them ${Math.abs(g.mean).toFixed(1)}★ ${up ? "above" : "below"} your average (${plural(xs.length, "film")}).`;
    return { name: g.name, big: g.name, text, up, mean: g.mean, to: D.films(g.name, `${plural(xs.length, "film")} · ${signed(g.mean)}★ against ${line ? "what their reputation predicts" : "your average"}`, xsFilms(xs),
      { sort: "given", note: (f) => { const x = B.byFilm.get(f); return line ? `You ${stars(x.rating)} · ${C.short} ${fmtC(x.crowd)} · ${signed(resid.get(x))}★` : `You ${stars(x.rating)}`; } }) };
  };
  // one line per thing: a director who is the whole of a country's films isn't said twice
  const pickBeyond = (list) => {
    const out2 = [];
    for (const g of list) {
      if (g.person && out2.some((o) => o.person)) continue;
      if (out2.some((o) => g.xs.filter((x) => o.xs.includes(x)).length >= 0.7 * g.xs.length)) continue;
      out2.push(g); if (out2.length === 4) break;
    }
    return out2.map(beyondItem);
  };
  out.beyond.up = pickBeyond(found.filter((g) => g.mean > 0).sort((a, b) => b.z - a.z));
  out.beyond.down = pickBeyond(found.filter((g) => g.mean < 0).sort((a, b) => a.z - b.z));

  // Tougher or choosier: your ratings at the time against the crowd's view of the same films, period by period.
  const P = periods.filter((p) => p.F.filter((x) => x.rAt).length >= 6);
  if (P.length >= 4) {
    const pt = (p, f) => { const xs = p.F.filter((x) => x.rAt && f(x) != null); return { x: p.i, w: xs.length, y: xs.length ? avg(xs.map(f)) : null }; };
    const you = fitLine(P.map((p) => pt(p, (x) => x.rAt))), cr = fitLine(P.map((p) => pt(p, (x) => x.crowd != null ? x.crowd : null)));
    const gap = fitLine(P.map((p) => pt(p, (x) => x.crowd != null ? x.rAt - x.crowd : null)));
    const sdFit = fitLine(P.map((p) => { const rs = p.F.filter((x) => x.rAt).map((x) => x.rAt); return { x: p.i, w: rs.length, y: rs.length >= 6 ? sdOf(rs) : null }; }));
    const third = Math.max(1, Math.floor(P.length / 3)), early = P.slice(0, third), late = P.slice(-third);
    const y0 = periodYears(early), y1 = periodYears(late);
    const rows = (ps) => ps.flatMap((p) => p.F.filter((x) => x.rAt));
    const yrs = periodYears;
    const mean = (ps, f) => { const v = rows(ps).map(f).filter((x) => x != null); return v.length ? avg(v) : null; };
    const yA = mean(early, (x) => x.rAt), yB = mean(late, (x) => x.rAt), cA = mean(early, (x) => x.crowd), cB = mean(late, (x) => x.crowd);
    const listOf = (ps) => { const xs = rows(ps).sort((a, b) => b.rAt - a.rAt); return D.films(yrs(ps), `${plural(xs.length, "film")} · ${avg(xs.map((x) => x.rAt)).toFixed(2)} as rated then`, xsFilms(xs),
      { sort: "given", ratingOf: (f) => B.byFilm.get(f).rAt, note: (f) => { const x = B.byFilm.get(f); return x.crowd != null ? `${C.short} ${fmtC(x.crowd)}` : "No crowd score"; } }); };
    const to = D.groups("Your ratings then and now", `${y1} against ${y0}`, [listOf(late), listOf(early)]);
    // (a slightly lower bar than elsewhere: a period's ratings swing with what was watched, which blurs a slow change)
    const sig = (f, a, b, min) => f && a != null && b != null && Math.abs(f.t) >= 2.5 && Math.abs(b - a) >= min && Math.sign(f.b) === Math.sign(b - a);
    const yMoved = sig(you, yA, yB, 0.15), cMoved = sig(cr, cA, cB, 0.1);
    const r = (v) => `${v.toFixed(1)}★`;
    const gA = mean(early, (x) => x.crowd != null ? x.rAt - x.crowd : null), gB = mean(late, (x) => x.crowd != null ? x.rAt - x.crowd : null);
    const gMoved = gA != null && gB != null && sig(gap, gA, gB, 0.12);
    const apart = (g, who = "") => Math.abs(g) < 0.05 ? `level with ${who || "them"}` : `${Math.abs(g).toFixed(1)}★ ${g > 0 ? "above" : "below"}${who ? ` ${who}` : ""}`;
    if (yMoved) {

      const films = cMoved && Math.sign(cB - cA) === Math.sign(yB - yA) && !gMoved;
      out.judge.push({ big: films ? (down ? "Less acclaimed picks" : "Choosier") : (down ? "Tougher" : "Kinder"), to,
        text: films ? `Your average rating went from about ${r(yA)} in ${y0} to ${r(yB)} in ${y1}, and the standing of what you choose moved the same way (${C.label}: ${fmtC(cA)} to ${fmtC(cB)}). It's the films that changed, not how hard you judge.`
          : `Your average rating went from about ${r(yA)} in ${y0} to ${r(yB)} in ${y1}${gA != null ? `, more than the films explain: you rated them ${apart(gA, C.label)} in ${y0}, and ${apart(gB)} in ${y1}. You've grown ${down ? "tougher" : "kinder"}` : `: you've grown ${down ? "tougher" : "kinder"}`}.` });
    } else if (gMoved) {
      const tougher = gB < gA;
      out.judge.push({ big: tougher ? "Tougher" : "Kinder", to,
        text: `Next to ${C.label}, you've grown ${tougher ? "tougher" : "kinder"}: you rated films ${apart(gA, "them")} on average in ${y0}, and ${apart(gB)} in ${y1}.` });
    } else if (you && Math.abs(you.t) < 2 && Math.abs(yB - yA) < 0.1) {
      out.judge.push({ big: "Steady", to, text: `Your ratings have held steady since ${y0}, at about ${r(avg(rows(P).map((x) => x.rAt)))} on average${cr && !cMoved ? ", and so has the standing of the films you choose" : ""}.` });
    } else if (yA != null && yB != null) {
      out.judge.push({ big: "No clear change", to, text: `Your ratings haven't clearly moved: about ${r(yA)} on average in ${y0}, and ${r(yB)} in ${y1}, a difference that's within the usual ups and downs.` });
    }
    if (sdFit && Math.abs(sdFit.t) >= STUDY_Z && Math.abs(sdFit.to - sdFit.from) >= 0.15)
      out.judge.push({ big: sdFit.to > sdFit.from ? "Wider range" : "Narrower range", to,
        text: sdFit.to > sdFit.from ? "You use more of the scale than you used to: your ratings spread wider now, with more very high and very low marks." : "Your ratings have narrowed: you give fewer very high and very low marks than you used to." });
  }

  // Directors who never let you down, and the ones who divide you
  const byDir = new Map();
  for (const x of rated) for (const d of x.d) { if (!byDir.has(d)) byDir.set(d, []); byDir.get(d).push(x); }
  const dirs = [...byDir].filter(([, xs]) => xs.length >= 4).map(([name, xs]) => { const rs = xs.map((x) => x.rating); return { name, xs, mean: avg(rs), min: Math.min(...rs), max: Math.max(...rs), sd: sdOf(rs) }; });
  const dTo = (d) => D.films(d.name, filmsSub(xsFilms(d.xs)), xsFilms(d.xs), { person: { key: personKey(d.name), name: d.name, films: xsFilms(d.xs) } });
  out.steady = dirs.filter((d) => d.min >= 3.5 && d.mean >= mu + 0.3).sort((a, b) => b.min - a.min || b.mean - a.mean || b.xs.length - a.xs.length).slice(0, 3)
    .map((d) => ({ name: d.name, text: `${d.name} has never let you down: ${plural(d.xs.length, "film")}, none below ${stars(d.min)}.`, to: dTo(d) }));
  out.divide = dirs.filter((d) => d.max - d.min >= 2.5).sort((a, b) => b.sd - a.sd).slice(0, 3)
    .map((d) => ({ name: d.name, text: `${d.name} divides you: ${plural(d.xs.length, "film")}, from ${stars(d.min)} to ${stars(d.max)}.`, to: dTo(d) }));
  return out;
}

/* ----- threads: how one film led to another ----- */
// `within`: only runs and chains that began in that year.
function threadStudy(B, within, most = 6) {
  const xs = B.xs, days = xs.map((x) => dayIndex(x.date)), began = (x) => !within || x.date.startsWith(within);
  const watched = (x) => `Watched ${fmtDate(x.date)}`;
  // gateways: the film that started a run of four or more by one person within 120 days
  const people = new Map();
  const add = (name, role, x) => { const k = `${role}|${personKey(name)}`; if (!people.has(k)) people.set(k, { name, role, xs: [] }); people.get(k).xs.push(x); };
  for (const x of xs) { for (const n of x.d) add(n, "d", x); for (const n of x.c.slice(0, 3)) add(n, "c", x); }
  const runs = [];
  for (const p of people.values()) {
    if (p.xs.length < 4) continue;
    const ds = p.xs.map((x) => dayIndex(x.date));
    let best = null;
    for (let i = 0, j = 0; i < ds.length; i++) { while (j + 1 < ds.length && ds[j + 1] - ds[i] <= 120) j++; if (began(p.xs[i]) && (!best || j - i > best.j - best.i)) best = { i, j }; }
    if (!best || best.j - best.i + 1 < 4) continue;
    runs.push({ ...p, run: p.xs.slice(best.i, best.j + 1), before: best.i, days: ds[best.j] - ds[best.i] });
  }
  runs.sort((a, b) => b.run.length - a.run.length || (a.role === "d" ? -1 : 1) - (b.role === "d" ? -1 : 1) || a.days - b.days);
  const gateways = [];
  for (const r of runs) {
    if (gateways.some((g) => r.run.filter((x) => g.run.includes(x)).length >= 0.6 * r.run.length)) continue;
    const opener = r.run[0], more = r.run.length - 1, weeks = Math.max(1, Math.round(r.days / 7));
    const when = weeks <= 2 ? `${plural(r.days + 1, "day")}` : weeks < 9 ? `${weeks} weeks` : `${Math.round(r.days / 30)} months`;
    const text = r.before === 0 ? `${opener.f.name} (${fmtDate(opener.date)}) opened the door to ${r.name}: ${more} more of their films followed within ${when}.`
      : `In ${monthName(opener.date)} you went back to ${r.name} (you'd seen ${r.before === 1 ? "one of their films" : `${r.before} of their films`} before) and watched ${r.run.length} in ${when}, starting with ${opener.f.name}.`;
    gateways.push({ name: r.name, text, run: r.run, films: xsFilms(r.run), date: opener.date,
      to: D.films(r.name, `${r.run.length} films in ${when}${r.before ? ` · ${plural(r.before, "film")} seen before` : ""}`, xsFilms(r.run), { sort: "given", note: (f) => watched(B.byFilm.get(f)), person: { key: personKey(r.name), name: r.name, films: xsFilms(r.run) } }) });

  const len = xs.map(() => 1), prev = xs.map(() => -1), via = xs.map(() => "");
  for (let i = 0; i < xs.length; i++) {
    for (let j = i - 1; j >= 0 && days[i] - days[j] <= 10; j--) {
      if (len[j] + 1 <= len[i]) continue;
      for (const [k, name] of ppl[i]) if (ppl[j].has(k)) { len[i] = len[j] + 1; prev[i] = j; via[i] = name; break; }
    }
  }
  const used = new Set(), chains = [];
  for (const end of xs.map((_, i) => i).sort((a, b) => len[b] - len[a])) {
    if (len[end] < 5 || chains.length === Math.ceil(most / 2)) break;
    const path = [];
    for (let i = end; i >= 0; i = prev[i]) path.unshift(i);
    if (path.some((i) => used.has(i)) || !began(xs[path[0]])) continue;
    const vias = [...new Set(path.slice(1).map((i) => via[i]))];
    if (vias.length < 2) continue;
    path.forEach((i) => used.add(i));
    const a = xs[path[0]], z = xs[path[path.length - 1]];
    const viaOf = new Map(path.map((i, n) => [xs[i].f, n ? `via ${via[i]}` : "Where it started"]));
    chains.push({ films: path.map((i) => xs[i].f), date: a.date,
      text: `${dateSpan(a.date, z.date)}: one film led to the next ${path.length - 1} times in a row, through ${joinAnd(vias.slice(0, 3))}${vias.length > 3 ? " and others" : ""}, from ${a.f.name} to ${z.f.name}.`,
      to: D.films("One film to the next", `${dateSpan(a.date, z.date)} · ${plural(path.length, "film")}`, path.map((i) => xs[i].f), { sort: "given", note: (f) => `${viaOf.get(f)} · ${fmtDate(B.byFilm.get(f).date)}` }) });
  }
  return { gateways, chains };
}

/* ----- habits, and what they say ----- */
function habitStudy(B) {
  const out = [], E = B.E, xs = B.xs, fmtC = (v) => crowdScore(B.crowdKey in CROWDS ? B.crowdKey : "tmdb", v);
  if (E.length < 20) return out;
  const isWe = (d) => weekdayOf(d) >= 5;
  const ents = (title, es, o) => D.entries(title, entriesSub(es), es, o);
  const fl = (title, list, o) => D.films(title, filmsSub(xsFilms(list)), xsFilms(list), o);

  // weekends against weekdays: what changes in what you pick
  {
    const we = xs.filter((x) => isWe(x.date)), wd = xs.filter((x) => !isWe(x.date));
    const tests = [
      { big: "Longer at weekends", val: (x) => x.rt, min: 8, say: (a, b) => `At weekends you go for longer films: ${Math.round(a)} minutes on average, against ${Math.round(b)} on weekdays.`, sort: "runtime", note: (x) => `${x.rt} min` },
      { big: "Older at weekends", val: (x) => x.age, min: 5, say: (a, b) => `At weekends you reach further back: the films are ${ageWord(a)} on average when you see them, against ${ageWord(b)} on weekdays.`, sort: "old", note: (x) => ageWord(x.age) },
      { big: "Kinder at weekends", val: (x) => x.rAt, min: 0.15, say: (a, b) => `You rate weekend films ${Math.abs(a - b).toFixed(1)}★ ${a > b ? "higher" : "lower"} than weekday ones (${a.toFixed(2)} against ${b.toFixed(2)}).`, note: (x) => `You ${stars(x.rAt)}` },
    ];
    for (const t of tests) {
      const a = we.filter((x) => t.val(x) != null), b = wd.filter((x) => t.val(x) != null);
      const va = a.map(t.val), vb = b.map(t.val), z = zMeans(va, vb), d = avg(va) - avg(vb);
      if (Math.abs(z) < STUDY_Z || Math.abs(d) < t.min) continue;
      const big = d < 0 ? t.big.replace("Longer", "Shorter").replace("Older", "Newer").replace("Kinder", "Tougher") : t.big;
      out.push({ big, z: Math.abs(z), text: t.say(avg(va), avg(vb)), to: D.groups(big, "Weekends against weekdays",
        [fl("Weekends", a, { sort: t.sort || "rating", note: (f) => t.note(B.byFilm.get(f)) }), fl("Weekdays", b, { sort: t.sort || "rating", note: (f) => t.note(B.byFilm.get(f)) })]) });
    }
  }
  // seasons: a genre that belongs to one month, year after year
  {
    const withM = xs.filter((x) => x.m), years = (list) => [...new Set(list.map((x) => x.date.slice(0, 4)))].sort();
    const all = new Map(); for (const x of withM) for (const g of x.g) bump(all, g);
    const cands = [];
    for (let mo = 0; mo < 12; mo++) {
      const inM = withM.filter((x) => +x.date.slice(5, 7) - 1 === mo), restN = withM.length - inM.length;
      if (inM.length < 10 || restN < 10) continue;
      const gs = new Map(); for (const x of inM) for (const g of x.g) bump(gs, g);
      for (const [g, k] of gs) {
        const p0 = (all.get(g) - k) / restN, share = k / inM.length, z = zShare(k, inM.length, Math.max(p0, 0.5 / restN));
        if (k < 6 || z < STUDY_Z + 0.5 || share < 1.8 * p0 || share - p0 < 0.1) continue;
        const hits = inM.filter((x) => x.g.includes(g)), ys = years(inM), hy = ys.filter((y) => { const l = inM.filter((x) => x.date.startsWith(y)); return l.length && l.filter((x) => x.g.includes(g)).length / l.length > p0 * 1.5; });
        if (hy.length < 2 || hy.length < ys.length / 2) continue;
        cands.push({ mo, g, z, share, p0, hits, hy, ys });
      }
    }
    for (const c of cands.sort((a, b) => b.z - a.z).filter((c, i, a) => a.findIndex((o) => o.mo === c.mo) === i).slice(0, 2)) {
      const M = MONTHS_LONG[c.mo];
      out.push({ big: `${M} is for ${genreNoun(c.g)}`, z: c.z, season: { g: c.g, mo: c.mo }, text: `${M} is ${c.g.toLowerCase()} month: ${pc(c.share)}% of the films you see for the first time in ${M} are ${genreNoun(c.g)}, against ${pc(c.p0)}% the rest of the year (${c.hy.length === c.ys.length ? `every year since ${c.ys[0]}` : joinAnd(c.hy)}).`,
        to: D.groups(`${capFirst(genreNoun(c.g))} in ${M}`, joinAnd(c.hy), c.hy.slice().reverse().map((y) => { const l = c.hits.filter((x) => x.date.startsWith(y)); return l.length && fl(`${M} ${y}`, l); })) });
    }
  }
  // the month you rewatch most
  {
    const rw = E.filter((e) => e.rewatch);
    if (rw.length >= 10) {
      let best = null;
      for (let mo = 0; mo < 12; mo++) {
        const inM = E.filter((e) => +e.date.slice(5, 7) - 1 === mo), k = inM.filter((e) => e.rewatch).length, n = inM.length;
        const z = zProps(k, n, rw.length - k, E.length - n);
        if (n >= 15 && z >= STUDY_Z && k / n - (rw.length - k) / (E.length - n) >= 0.06 && (!best || z > best.z)) best = { mo, k, n, z, inM };
      }
      if (best) { const M = MONTHS_LONG[best.mo], rest = (rw.length - best.k) / (E.length - best.n);
        out.push({ big: `${M} is for rewatching`, z: best.z, text: `${M} is when you go back to old favourites: ${pc(best.k / best.n)}% of ${M}'s diary is rewatches, against ${pc(rest)}% the rest of the year.`,
          to: ents(`Rewatches in ${M}`, best.inM.filter((e) => e.rewatch)) }); }

  {
    const dates = [...new Set(E.map((e) => e.date))];
    const backs = [];
    for (let i = 1; i < dates.length; i++) { const gap = dayIndex(dates[i]) - dayIndex(dates[i - 1]); if (gap >= 15) backs.push({ date: dates[i], gap: gap - 1 }); }
    const firstBack = new Set(backs.map((b) => b.date));
    const after = E.filter((e) => firstBack.has(e.date)), others = E.filter((e) => !firstBack.has(e.date));
    const k1 = after.filter((e) => e.rewatch).length, k2 = others.filter((e) => e.rewatch).length;
    const z = zProps(k1, after.length, k2, others.length);
    if (backs.length >= 4 && z >= 2.5 && k1 / after.length - k2 / others.length >= 0.1) {
      const gapOf = new Map(backs.map((b) => [b.date, b.gap]));
      out.push({ big: "Comfort after a break", z, text: `After a break of two weeks or more (${plural(backs.length, "time")}), you come back with a rewatch ${pc(k1 / after.length)}% of the time, against ${pc(k2 / others.length)}% otherwise.`,
        to: ents("Back after a break", after, { order: "asc", note: (e) => `After ${plural(gapOf.get(e.date), "day")} off` }) });
    }
  }
  // busy months against quiet ones: what changes when you watch a lot
  {
    const months = new Map();
    for (const x of xs) { const k = x.date.slice(0, 7); if (!months.has(k)) months.set(k, []); months.get(k).push(x); }
    const ms = [...months.values()].filter((l) => l.length >= 3).sort((a, b) => b.length - a.length);
    if (ms.length >= 16) {
      const q = Math.floor(ms.length / 4), busy = ms.slice(0, q).flat(), quiet = ms.slice(-q).flat();
      const tests = [
        { val: (x) => x.rt, min: 8, word: (d) => d < 0 ? "shorter" : "longer", say: (a, b) => `${Math.round(a)} minutes on average in your busiest months, ${Math.round(b)} in your quietest`, sort: "runtime", note: (x) => `${x.rt} min` },
        { val: (x) => x.age, min: 5, word: (d) => d < 0 ? "newer" : "older", say: (a, b) => `${ageWord(a)} on average when you saw them in your busiest months, ${ageWord(b)} in your quietest`, sort: "old", note: (x) => ageWord(x.age) },
        { val: (x) => x.crowd, min: 0.15, word: (d) => d < 0 ? "less acclaimed" : "better regarded", say: (a, b) => `${B.crowd.label} give them ${fmtC(a)} on average in your busiest months, ${fmtC(b)} in your quietest`, note: (x) => `${B.crowd.short} ${fmtC(x.crowd)}` },
      ];
      let best = null;
      for (const t of tests) {
        const va = busy.filter((x) => t.val(x) != null).map(t.val), vb = quiet.filter((x) => t.val(x) != null).map(t.val), z = zMeans(va, vb), d = avg(va) - avg(vb);
        if (Math.abs(z) >= STUDY_Z && Math.abs(d) >= t.min && (!best || Math.abs(z) > best.z)) best = { t, z: Math.abs(z), d, a: avg(va), b: avg(vb) };
      }
      if (best) out.push({ big: `Busy means ${best.t.word(best.d)}`, z: best.z, text: `The more you watch, the ${best.t.word(best.d)} the films: ${best.t.say(best.a, best.b)}.`,
        to: D.groups(`Busy months, ${best.t.word(best.d)} films`, `Your busiest ${plural(q, "month")} against your quietest`,
          [fl("Busiest months", busy, { sort: best.t.sort || "rating", note: (f) => best.t.note(B.byFilm.get(f)) }), fl("Quietest months", quiet, { sort: best.t.sort || "rating", note: (f) => best.t.note(B.byFilm.get(f)) })]) });
    }
  }
  // marathon days: do you rate differently when you watch three or more in a day?
  {
    const perDay = new Map(); for (const e of E) bump(perDay, e.date);
    const rated = xs.filter((x) => x.rAt), many = rated.filter((x) => perDay.get(x.date) >= 3), one = rated.filter((x) => perDay.get(x.date) === 1);
    const z = zMeans(many.map((x) => x.rAt), one.map((x) => x.rAt)), d = avg(many.map((x) => x.rAt)) - avg(one.map((x) => x.rAt));
    if (many.length >= 10 && Math.abs(z) >= 2.5 && Math.abs(d) >= 0.2)
      out.push({ big: d < 0 ? "Marathons rate lower" : "Marathons rate higher", z: Math.abs(z), text: `On days you watch three or more, you rate the films ${Math.abs(d).toFixed(1)}★ ${d < 0 ? "lower" : "higher"} than on days you watch just one (${avg(many.map((x) => x.rAt)).toFixed(2)} against ${avg(one.map((x) => x.rAt)).toFixed(2)}).`,
        to: D.groups("Marathon days against single-film days", "Ratings given at the time", [fl("Days with three or more", many, { ratingOf: (f) => B.byFilm.get(f).rAt }), fl("Days with one", one, { ratingOf: (f) => B.byFilm.get(f).rAt })]) });
  }
  // logging and rating: how the way you keep the diary has changed
  {
    const third = Math.floor(E.length / 3);
    if (third >= 30) {
      const early = E.slice(0, third), late = E.slice(-third), yrs = (es) => { const a = es[0].date.slice(0, 4), b = es[es.length - 1].date.slice(0, 4); return a === b ? a : `${a}–${b.slice(2)}`; };
      const share = (es, f) => { const l = es.filter((e) => f(e) != null); return { k: l.filter(f).length, n: l.length, l }; };
      const same = (e) => e.logged ? e.logged === e.date : null, rated = (e) => !!e.rating;
      for (const [f, big, say] of [[same, "Logging", (a, b) => `You log ${b > a ? "faster" : "later"} than you used to: ${pc(b)}% of films on the day you watched them in ${yrs(late)}, against ${pc(a)}% in ${yrs(early)}.`],
        [rated, "Rating", (a, b) => `You rate ${b > a ? "more" : "fewer"} of the films you log: ${pc(b)}% in ${yrs(late)}, against ${pc(a)}% in ${yrs(early)}.`]]) {
        const A = share(early, f), Z = share(late, f), z = zProps(Z.k, Z.n, A.k, A.n);
        if (A.n >= 30 && Z.n >= 30 && Math.abs(z) >= STUDY_Z && Math.abs(Z.k / Z.n - A.k / A.n) >= 0.1)
          out.push({ big, z: Math.abs(z), text: say(A.k / A.n, Z.k / Z.n), to: D.groups(big, `${yrs(late)} against ${yrs(early)}`, [ents(yrs(late), Z.l), ents(yrs(early), A.l)]) });
      }
    }
  }
  // rewatches: do your ratings hold up on a second look?
  {
    const pairs = [];
    for (const f of new Set(E.filter((e) => e.rewatch && e.rating).map((e) => e.film))) {
      const es = f.entries.filter((e) => e.rating).sort((a, b) => a.date.localeCompare(b.date) || a.order - b.order);
      for (let i = 1; i < es.length; i++) if (es[i].rewatch) pairs.push({ e: es[i], was: es[i - 1].rating, now: es[i].rating });
    }
    if (pairs.length >= 8) {
      const up = pairs.filter((p) => p.now > p.was), down = pairs.filter((p) => p.now < p.was), same = pairs.length - up.length - down.length;
      const to = D.groups("Ratings on a second look", plural(pairs.length, "rewatch", "rewatches"), [
        up.length && D.entries("Rated higher", entriesSub(up.map((p) => p.e)), up.map((p) => p.e), { note: (e) => { const p = pairs.find((q) => q.e === e); return `${stars(p.was)} before, ${stars(p.now)} now`; } }),
        down.length && D.entries("Rated lower", entriesSub(down.map((p) => p.e)), down.map((p) => p.e), { note: (e) => { const p = pairs.find((q) => q.e === e); return `${stars(p.was)} before, ${stars(p.now)} now`; } })]);
      out.push({ big: "Second looks", z: 2, to: up.length + down.length ? to : D.entries("Rewatches you rated", entriesSub(pairs.map((p) => p.e)), pairs.map((p) => p.e)), text: same === pairs.length ? `When you rewatch a film you'd rated, you give it the same rating every time (${plural(pairs.length, "rewatch", "rewatches")}).` : `When you rewatch a film you'd rated, your rating holds ${pc(same / pairs.length)}% of the time` +
        (up.length + down.length ? `; when it moves, it goes ${up.length >= down.length ? `up ${up.length} times for every ${Math.max(1, down.length)} down` : `down ${down.length} times for every ${Math.max(1, up.length)} up`}.` : ".") });
    }
  }
  return out.sort((a, b) => b.z - a.z);
}

/* ----- against the crowd (shown with the stats, for all time or a year) ----- */
// Films you rated against a crowd's score: how far apart, how closely you follow them, where you part ways most.
function crowdOf(crowdKey, films, ratingOf = (f) => f.rating) {
  const key = crowdKey in CROWDS ? crowdKey : "tmdb", C = CROWDS[key], rated = films.filter((f) => ratingOf(f));
  const pairs = rated.map((f) => { const s = C.score(metaOf(f), f); return s ? { f, you: ratingOf(f), crowd: s / 2, diff: ratingOf(f) - s / 2 } : null; }).filter(Boolean);
  const out = { key, label: C.label, short: C.short, n: pairs.length, available: {}, to: crowdDrill(rated, key, `You against ${C.label}`, ratingOf), higher: [], lower: [], gems: [] };
  for (const k of Object.keys(CROWDS)) out.available[k] = rated.filter((f) => CROWDS[k].score(metaOf(f), f)).length;
  if (pairs.length >= 3) {
    out.r = pairs.length >= 5 ? pearson(pairs.map((p) => p.you), pairs.map((p) => p.crowd)) : null;
    out.meanDiff = avg(pairs.map((p) => p.diff));
    // every film above or below the crowd at all, not just the ones far enough apart for the rows
    const apart = (side) => { const ps = pairs.filter((p) => side * p.diff > 0).sort((a, b) => side * (b.diff - a.diff) || b.you - a.you);
      return { n: ps.length, to: ps.length ? D.films(`${side > 0 ? "Above" : "Below"} ${C.label}`, `${plural(ps.length, "film")} you rated ${side > 0 ? "higher" : "lower"} than their average`,
        ps.map((p) => p.f), { sort: "given", note: (f) => { const p = ps.find((x) => x.f === f); return `${C.short} ${crowdScore(key, p.crowd)} · ${signed(p.diff)}★`; } }) : null }; };
    out.above = apart(1); out.below = apart(-1);
    out.higherAll = pairs.filter((p) => p.diff >= crowdAbove()).sort((a, b) => b.diff - a.diff || b.you - a.you);
    out.lowerAll = pairs.filter((p) => p.diff <= -CROWD_BELOW).sort((a, b) => a.diff - b.diff || a.you - b.you);
    out.higher = out.higherAll.slice(0, 12); out.lower = out.lowerAll.slice(0, 12);
  }
  const popularity = (f) => { const x = LBX[f.key], m = metaOf(f); return x && x.n ? { n: x.n, src: "Letterboxd" } : m && m.iv ? { n: m.iv, src: "IMDb" } : m && m.vc ? { n: m.vc, src: "TMDB" } : null; };
  out.gemsAll = rated.filter((f) => ratingOf(f) >= 4.5).map((f) => ({ f, pop: popularity(f) }))
    .filter((x) => x.pop && x.pop.n < { Letterboxd: 5000, IMDb: 25000, TMDB: 1000 }[x.pop.src]).sort((a, b) => ratingOf(b.f) - ratingOf(a.f) || a.pop.n - b.pop.n);
  out.gems = out.gemsAll.slice(0, 12);
  return out;
}

// Against the crowd, both layouts: how many films are above and below the crowd at all, and how far apart the rows' are.
function apartLine(C) {
  if (!C.above) return "";
  const n = (x, word) => x.n ? dlink(x.to, `${fmtN(x.n)} ${word}`) : `none ${word}`;
  return `<p class="status">You rated ${n(C.above, "above")} their average and ${n(C.below, "below")}${C.n - C.above.n - C.below.n ? `, ${fmtN(C.n - C.above.n - C.below.n)} the same` : ""}. The rows show the films ${crowdAbove() === CROWD_BELOW ? `${starPart(CROWD_BELOW)} or more apart` : `you rated ${starPart(crowdAbove())} or more above it, and ${starPart(CROWD_BELOW)} or more below`}.</p>`;
}
/* ----- pieces both layouts draw ----- */
// A drift's periods as columns. Shares start from zero; typical values (age, length…) from a little under the
// lowest, so a change shows, and then the chart has no gridline to misread.
function driftCols(d) {
  const vs = d.series.filter((c) => c.v != null).map((c) => c.v), lo = Math.min(...vs), hi = Math.max(...vs);
  const floor = d.kind === "share" || !vs.length ? 0 : Math.max(0, lo - (hi - lo) * 0.35 - 1e-6);
  return { grid: !floor, unit: d.kind === "share" ? "%" : "", cols: d.series.map((c) => ({ a: c.v == null ? 0 : Math.max(0.0001, c.v - floor), b: 0, label: c.label, minor: c.minor, tip: c.tip, to: c.to })) };
}
// Where each chapter falls between the diary's first and last day, as shares of the whole.
// The pace of each month against your usual, as columns, for both layouts.
// `few`: only the months furthest from your usual pace carry their number (a phone has no room for twelve).
function paceChart(M, H, few) {
  const far = new Set([...M.profile].sort((a, b) => Math.abs(b.a - 100) - Math.abs(a.a - 100)).slice(0, few || 12));
  return colChart(M.profile, "Your pace each month, against your usual", "", H,
    { values: (c) => far.has(c) ? `${c.a >= 100 ? "+" : "−"}${Math.abs(c.a - 100)}%` : "", base: Math.max(0, Math.min(...M.profile.map((c) => c.a)) - 15) });
}
function chapterStrip(chs, from, to) {
  const a = dayIndex(from), span = Math.max(1, dayIndex(to) - a + 1);
  const years = [];
  for (let y = +from.slice(0, 4) + 1; y <= +to.slice(0, 4); y++) years.push({ y, at: (dayIndex(`${y}-01-01`) - a) / span });
  return { years, items: chs.map((c) => ({ c, left: Math.max(0, (dayIndex(c.from) - a) / span), width: Math.max(0.006, (dayIndex(c.until) - dayIndex(c.from) + 1) / span) })) };
}

/* ----- through the year: how your watching runs month by month, and how that has changed over the years ----- */
// Asked Oct 2026. Every month of the diary counts by the days it was in it (the first and last only in part), so a
// partial month isn't taken for a quiet one. A month is said to be busier or quieter only when it's three standard
// errors from your usual pace (allowing for how unevenly films come, binges and all) and was so in most of your years.
function monthStudy(B, habits) {
  const E = B.E, out = { profile: null, pace: [], shifts: [], leans: [], ratings: [], enough: false };
  if (E.length < 60) return out;
  const first = E[0].date, last = E[E.length - 1].date, d0 = dayIndex(first), d1 = dayIndex(last);
  const ents = (title, es, extra) => D.entries(title, entriesSub(es, extra), es, { order: "asc" });
  const fl = (title, xs, o) => D.films(title, filmsSub(xsFilms(xs)), xsFilms(xs), o);
  // each month of each year: the days it was in the diary and the entries made in it
  const cells = [], byKey = new Map();
  for (let y = +first.slice(0, 4), mo = +first.slice(5, 7) - 1; y * 12 + mo <= +last.slice(0, 4) * 12 + +last.slice(5, 7) - 1; mo === 11 ? (y++, mo = 0) : mo++) {
    const a = dayIndex(`${y}-${String(mo + 1).padStart(2, "0")}-01`), len = new Date(Date.UTC(y, mo + 1, 0)).getUTCDate();
    const days = Math.min(d1, a + len - 1) - Math.max(d0, a) + 1, c = { y: String(y), i: mo, days, full: days === len, E: [] };
    cells.push(c); byKey.set(`${y}-${mo}`, c);
  }
  for (const e of E) byKey.get(`${+e.date.slice(0, 4)}-${+e.date.slice(5, 7) - 1}`).E.push(e);
  const N = E.length, Dall = cells.reduce((t, c) => t + c.days, 0), r = N / Dall;
  const cal = MONTHS_LONG.map((name, i) => { const cs = cells.filter((c) => c.i === i), n = cs.reduce((t, c) => t + c.E.length, 0), days = cs.reduce((t, c) => t + c.days, 0);
    return { i, name, cs, n, days, rate: days ? n / days : 0, E: cs.flatMap((c) => c.E) }; });
  // how unevenly films come from month to month, beyond what each calendar month explains
  let chi = 0, k = 0;
  for (const c of cells) { const m = cal[c.i]; if (c.days >= 7 && m.rate > 0) { const ex = m.rate * c.days; chi += sq(c.E.length - ex) / ex; k++; } }
  const phi = Math.max(1, k > 13 ? chi / (k - 12) : 1);
  const years = [...new Set(cells.map((c) => c.y))], yRate = new Map(years.map((y) => { const cs = cells.filter((c) => c.y === y); return [y, cs.reduce((t, c) => t + c.E.length, 0) / Math.max(1, cs.reduce((t, c) => t + c.days, 0))]; }));
  for (const m of cal) {
    const ex = r * m.days;
    m.index = m.days ? m.rate / r : null;
    m.z = ex ? (m.n - ex) / Math.sqrt(ex * phi) : 0;
    const full = m.cs.filter((c) => c.full && yRate.get(c.y) > 0);
    m.yrs = full.length; m.above = full.filter((c) => c.E.length / c.days > yRate.get(c.y)).length;
  }
  out.enough = cal.filter((m) => m.days >= 28).length >= 12;
  if (!out.enough) return out;
  const pct = (x) => `${Math.round(Math.abs(x - 1) * 100)}%`;
  out.profile = cal.map((m) => ({ a: Math.round(m.index * 100), b: 0, label: MONTHS[m.i][0], tip: `${m.name}: ${m.index >= 1 ? "+" : "−"}${pct(m.index)} against your usual pace`, to: m.E.length ? ents(`${m.name}, every year`, m.E, plural(m.cs.length, "year")) : null }));
  // busier and quieter months, year after year
  const steadyMonths = (m) => m.yrs >= 3 && (m.z > 0 ? m.above : m.yrs - m.above) >= Math.ceil(m.yrs * 2 / 3);
  const hi = cal.filter((m) => m.z >= STUDY_Z && m.index >= 1.15 && steadyMonths(m)).sort((a, b) => b.z - a.z);
  const lo = cal.filter((m) => m.z <= -STUDY_Z && m.index <= 0.85 && steadyMonths(m)).sort((a, b) => a.z - b.z);
  for (const m of hi.slice(0, 2)) out.pace.push({ big: `${m.name}`, up: true, to: ents(`${m.name}, every year`, m.E, plural(m.cs.length, "year")),
    text: `${m.name} is ${m === hi[0] ? "your strongest month" : "another strong month"}: you watch ${pct(m.index)} more than your usual pace then, and it ran above your pace in ${m.above} of ${m.yrs} years.` });
  for (const m of lo.slice(0, 2)) out.pace.push({ big: `${m.name}`, up: false, to: ents(`${m.name}, every year`, m.E, plural(m.cs.length, "year")),
    text: `${m.name} is ${m === lo[0] ? "your quietest month" : "another quiet month"}: you watch ${pct(m.index)} less than your usual pace then, and it ran below your pace in ${m.yrs - m.above} of ${m.yrs} years.` });
  if (!out.pace.length) out.pace.push({ big: "No fixed season", to: ents("Your diary", E), text: "No month is reliably busier or quieter than the rest: your busy months move around from one year to the next." });
  // the year's shape over the years: a quarter, or a month, taking a growing or shrinking share of each full year
  const fullYears = years.filter((y) => cells.filter((c) => c.y === y && c.full).length === 12);
  if (fullYears.length >= 4) {
    const Q = [["January – March", [0, 1, 2]], ["April – June", [3, 4, 5]], ["July – September", [6, 7, 8]], ["October – December", [9, 10, 11]], ...MONTHS_LONG.map((n, i) => [n, [i]])];
    const tot = new Map(fullYears.map((y) => [y, cells.filter((c) => c.y === y).reduce((t, c) => t + c.E.length, 0)]));
    for (const [name, ms] of Q) {
      if (out.shifts.some((x) => x.ms.some((i) => ms.includes(i)))) continue;
      const pts = fullYears.map((y, x) => { const n = cells.filter((c) => c.y === y && ms.includes(c.i)).reduce((t, c) => t + c.E.length, 0); return { x, y: tot.get(y) ? n / tot.get(y) : null, w: 1, n, yr: y }; });
      const fit = fitLine(pts);
      if (!fit || Math.abs(fit.t) < STUDY_Z) continue;
      const a = pts[0], z = pts[pts.length - 1];
      if (Math.abs(z.y - a.y) < (ms.length > 1 ? 0.08 : 0.04) || Math.sign(fit.b) !== Math.sign(z.y - a.y)) continue;
      const up = z.y > a.y, es = (yr) => cells.filter((c) => c.y === yr && ms.includes(c.i)).flatMap((c) => c.E);
      out.shifts.push({ ms, big: `${up ? "More" : "Less"} in ${name}`, up, to: D.groups(name, `${z.yr} against ${a.yr}`, [ents(`${name} ${z.yr}`, es(z.yr)), ents(`${name} ${a.yr}`, es(a.yr))]),
        text: `${name} takes a ${up ? "growing" : "shrinking"} share of your year: ${pc(a.y)}% of ${a.yr}'s diary, ${pc(z.y)}% of ${z.yr}'s.` });
      if (out.shifts.length === 3) break;
    }
  }
  // what a month leans toward, year after year (not one binge, and not a seasonal habit said already)
  for (const m of cal) {
    const F = B.xs.filter((x) => +x.date.slice(5, 7) - 1 === m.i);
    for (const st of standouts(F, B)) {
      const ys = new Map(); for (const x of st.xs) bump(ys, x.date.slice(0, 4));
      if (ys.size < 2 || Math.max(...ys.values()) > 0.7 * st.xs.length) continue;
      if (habits.some((h) => h.season && st.fid === "g" && h.season.g === st.v && h.season.mo === m.i)) continue;
      const kind = kindOf(st.fid, st.v);
      out.leans.push({ i: m.i, z: st.z, big: `${m.name}: ${kind}`, posters: xsFilms(bestFirst(st.xs).slice(0, 6)), to: fl(`${capFirst(kind)} in ${m.name}`, st.xs),
        text: FACETS[st.fid].person ? `In ${m.name} you come back to ${kind}: ${st.k} of the ${st.n} films you've seen for the first time in ${m.name}, over ${plural(ys.size, "year")}, ${st.p0 < 0.005 ? "and hardly any the rest of the year" : `against ${pc(st.p0)}% the rest of the year`}.`
          : `In ${m.name} you lean to ${kind}: ${pc(st.share)}% of what you see for the first time in ${m.name}, against ${vsShare(st.p0)} the rest of the year, over ${plural(ys.size, "year")}.` });
      break;
    }
  }
  out.leans = out.leans.sort((a, b) => b.z - a.z).slice(0, 4).sort((a, b) => a.i - b.i);
  // a month you rate differently, and whether it's you or the films you pick then
  for (const m of cal) {
    const a = B.xs.filter((x) => x.rAt && +x.date.slice(5, 7) - 1 === m.i), b = B.xs.filter((x) => x.rAt && +x.date.slice(5, 7) - 1 !== m.i);
    if (a.length < 15) continue;
    const va = a.map((x) => x.rAt), vb = b.map((x) => x.rAt), z = zMeans(va, vb), dlt = avg(va) - avg(vb);
    if (Math.abs(z) < STUDY_Z || Math.abs(dlt) < 0.2) continue;
    const ca = a.filter((x) => x.crowd != null), cb = b.filter((x) => x.crowd != null);
    const films = ca.length >= 10 && cb.length >= 20 && Math.abs(avg(ca.map((x) => x.crowd)) - avg(cb.map((x) => x.crowd))) >= Math.abs(dlt) / 2 && Math.sign(avg(ca.map((x) => x.crowd)) - avg(cb.map((x) => x.crowd))) === Math.sign(dlt);

/* ----- one year, against the rest of the diary ----- */

      const mdO = [...perDay].filter(([d, n]) => !d.startsWith(Y) && n >= 3), daysO = perDay.size - daysY;

    }

    if (EY.length >= 30) {

<script>
/* ---------- filters: the Stats pages narrowed to a genre, a decade, a country or a language ----------
   Everything on the computer's main page, and on the phone's Profile, Diary and Stats, is worked out from the diary
   seen through the filters: its films that pass, their diary entries, reviews and watchlist. Insights and Compare
   always use the whole diary. Filters last until the page is closed. */
const FILTERS = [["g", "Genre"], ["d", "Decade"], ["k", "Country"], ["l", "Language"]];
// Each group takes any number of picks (asked Oct 2026). A film can have several genres and countries, so with two or
// more picked there, a switch says whether it needs any of them or all of them; a film has one decade and one
// language, so those always match any.
const FILTER = { g: [], d: [], k: [], l: [] };
const FILTER_ALL = { g: false, k: false };
const FILTER_BOTH = new Set(["g", "k"]);
const filterOn = () => FILTERS.some(([k]) => FILTER[k].length);
const groupAll = (k) => FILTER_BOTH.has(k) && FILTER_ALL[k] && FILTER[k].length > 1;
function clearFilters() { for (const [k] of FILTERS) FILTER[k] = []; FILTER_ALL.g = FILTER_ALL.k = false; }
// What a film offers each filter (genres and countries need cast & crew details; decades come with the export)
function facetValues(f, key, metaOf) {
  if (key === "d") return f.year ? [`${Math.floor(f.year / 10) * 10}s`] : [];
  const m = metaOf(f);
  if (!m) return [];
  return key === "g" ? m.g || [] : key === "k" ? m.k || [] : m.l ? [m.l] : [];
}
function groupPasses(vals, k) {
  const picks = FILTER[k];
  return !picks.length || (groupAll(k) ? picks.every((v) => vals.includes(v)) : picks.some((v) => vals.includes(v)));
}
const filmPasses = (f, metaOf, except) => FILTERS.every(([k]) => k === except || groupPasses(facetValues(f, k, metaOf), k));
// The same library object while the filters, the diary and its details stay the same, so worked-out stats are kept.
let FILTERED = null;
function filteredLib(lib, metaOf) {
  if (!lib || !filterOn()) return lib;
  const sig = `${FILTERS.map(([k]) => FILTER[k].join("\u0001") + (groupAll(k) ? "&" : "|")).join("/")}|${DATA_REV}|${Object.keys(META).length}`;
  if (FILTERED && FILTERED.base === lib && FILTERED.sig === sig && FILTERED.meta === META) return FILTERED.lib;
  const keep = (f) => filmPasses(f, metaOf);
  const films = lib.films.filter(keep), set = new Set(films);
  const watchlistFilms = lib.watchlistFilms.filter(keep);
  const out = { ...lib, films, entries: lib.entries.filter((e) => set.has(e.film)), reviews: lib.reviews.filter((r) => set.has(r.film)),
    watchlistFilms, watchlist: watchlistFilms.length, filtered: true };
  FILTERED = { base: lib, sig, meta: META, lib: out };
  return out;
}
// The choices for one filter, with how many films each has given the other filters (and, matching all of a group's
// picks, given those picks too), most first (decades in order).
function filterOptions(lib, metaOf, key) {
  const counts = new Map(), every = FILTER_BOTH.has(key) && FILTER_ALL[key];
  for (const f of lib.films) {
    if (!filmPasses(f, metaOf, key)) continue;
    const vals = new Set(facetValues(f, key, metaOf));
    if (every && !FILTER[key].every((p) => vals.has(p))) continue;
    for (const v of vals) counts.set(v, (counts.get(v) || 0) + 1);
  }
  return [...counts].sort((a, b) => key === "d" ? a[0].localeCompare(b[0]) : b[1] - a[1] || a[0].localeCompare(b[0]));
}
// "Horror or Thriller films from the 1970s, made in France and Italy, in French"
const joinWords = (xs, word) => xs.length < 2 ? xs.join("") : `${xs.slice(0, -1).join(", ")} ${word} ${xs[xs.length - 1]}`;
function filterText() {
  if (!filterOn()) return "";
  const w = (k) => joinWords(FILTER[k], groupAll(k) ? "and" : "or");
  return `${FILTER.g.length ? `${w("g")} films` : "Films"}${FILTER.d.length ? ` from the ${w("d")}` : ""}${FILTER.k.length ? `, made in ${w("k")}` : ""}${FILTER.l.length ? `, in ${w("l")}` : ""}`;
}
// The whole diary (the filters narrow it, never the other way round).
const wholeLib = () => state.mode === "mine" && MY_LIB ? MY_LIB : EXAMPLE_LIB;
// The panel of choices, in the pop-up (computer) or the sheet (phone), opened by the Filter button. Plain buttons, not
// menus: Safari froze or went blank when a menu was replaced in the page while it was being used (owner, Oct 2026).
D.filters = () => ({ kind: "filters", title: "Filter your stats", sub: "" }); // no explanation: the choices speak for themselves (owner, Oct 2026)
const FILTER_SHOWN = 14; // choices shown at first in each group; the rest behind "More"
const filterMore = new Set();
function filtersInner() {
  const lib = wholeLib();
  if (!lib) return "";
  const n = filterOn() ? filteredLib(lib, metaOf).films.length : lib.films.length;
  const groups = FILTERS.map(([k, label]) => {
    const opts = filterOptions(lib, metaOf, k);
    if (!opts.length) return k === "d" ? "" : `<section class="fp-group"><h4>${label}</h4><p class="fp-none">${label === "Decade" ? "" : "Comes with cast &amp; crew details."}</p></section>`;
    const picks = FILTER[k];
    const cur = picks.filter((v) => !opts.some(([o]) => o === v)).map((v) => [v, 0]);
    const all = [...cur, ...opts], many = all.length > FILTER_SHOWN && !filterMore.has(k);
    const shown = many ? all.filter(([v], i) => i < FILTER_SHOWN || picks.includes(v)) : all;
    const mode = FILTER_BOTH.has(k) && picks.length > 1 ? `<div class="fp-mode" role="group" aria-label="A film needs">${[["any", "Any of these"], ["all", "All of these"]].map(([m, l]) =>
      `<button type="button" data-fmode="${k}" data-fval="${m}" aria-pressed="${(m === "all") === FILTER_ALL[k]}">${l}</button>`).join("")}</div>` : "";
    return `<section class="fp-group"><h4>${label}${picks.length ? ` <button class="fp-x" type="button" data-fclear="${k}">Clear</button>` : ""}</h4>${mode}
      <div class="fp-chips">${shown.map(([v, c]) => `<button class="fp-chip" type="button" data-fpick="${k}" data-fval="${esc(v)}" aria-pressed="${picks.includes(v)}">${esc(v)}<span>${fmtN(c)}</span></button>`).join("")}
      ${many ? `<button class="fp-more" type="button" data-fmore="${k}">${fmtN(all.length - shown.length)} more</button>` : ""}</div></section>`;
  }).join("");
  return `${groups}<div class="fp-foot">${filterOn() ? `<button class="btn small" type="button" data-filter-clear>Clear</button>` : ""}
    <button class="btn small primary green" type="button" data-close data-sclose>${filterOn() ? `Show ${plural(n, "film")}` : "Done"}</button></div>`;
}
const filtersBodyHtml = () => `<div class="fpanel">${filtersInner()}</div>`;
// The line that says a filter is on, with a way off. `n` is how many films pass.
const filterStripHtml = (n) => filterOn() ? `<div class="fstrip" role="status"><span>${esc(filterText())} <b>· ${plural(n, "film")}</b></span>
  <button class="fstrip-edit" type="button" ${dl(D.filters())}>Change</button><button class="fstrip-x" type="button" data-filter-clear>Clear</button></div>` : "";
// After a choice: the panel shows it at once, the page underneath follows a moment later.
let filterRedraw = 0;
function refreshFilters() {
  for (const el of document.querySelectorAll(".fpanel")) el.innerHTML = filtersInner();
  cancelAnimationFrame(filterRedraw);
  filterRedraw = requestAnimationFrame(() => { try { render(); } catch (e) { clearFilters(); render(); } });
}
document.addEventListener("click", (e) => {
  const pick = e.target.closest("[data-fpick]");
  if (pick) {
    const k = pick.dataset.fpick, v = pick.dataset.fval;
    FILTER[k] = FILTER[k].includes(v) ? FILTER[k].filter((x) => x !== v) : [...FILTER[k], v];
    if (FILTER[k].length < 2 && k in FILTER_ALL) FILTER_ALL[k] = false; // the switch shows again from "any" with two picks
    refreshFilters(); return;
  }
  const mode = e.target.closest("[data-fmode]");
  if (mode) { FILTER_ALL[mode.dataset.fmode] = mode.dataset.fval === "all"; refreshFilters(); return; }
  const group = e.target.closest("[data-fclear]");
  if (group) { const k = group.dataset.fclear; FILTER[k] = []; if (k in FILTER_ALL) FILTER_ALL[k] = false; refreshFilters(); return; }
  const more = e.target.closest("[data-fmore]");
  if (more) { filterMore.add(more.dataset.fmore); for (const el of document.querySelectorAll(".fpanel")) el.innerHTML = filtersInner(); return; }
  if (e.target.closest("[data-filter-clear]")) { clearFilters(); refreshFilters(); }
});
// With a filter on, sections it leaves empty are left out rather than shown as "nothing here".
function dropEmpties(html, isEmpty) {
  const t = document.createElement("template");
  t.innerHTML = html;
  isEmpty(t.content);
  return t.innerHTML;
}
</script>
<script>
/* ---------- a year (or all time) as a story: cards one after another, a tap (or →) to go on, ← or a tap on the
   left to go back. It opens in the pop-up (computer) or the sheet (phone) like any list, so Back and Close work.
   Always the whole diary, whatever filters the page has on. */
D.story = (Y) => ({ kind: "story", year: Y, title: Y === "all" ? "All time in film" : `${Y} in film`, sub: "Tap or press → to go on" });
let STORY_STUDY = null;
// The study's headline findings for the story, worked out once per diary (it can take a moment on a big one).
function storyFindings(lib, Y) {
  const crowd = state.crowd || defaultCrowd(lib, metaOf), sig = `${DATA_REV}|${crowd}|${Object.keys(META).length}`;
  if (!STORY_STUDY || STORY_STUDY.lib !== lib || STORY_STUDY.sig !== sig) STORY_STUDY = { lib, sig, all: null, years: new Map() };
  if (!STORY_STUDY.all) STORY_STUDY.all = computeStudy(lib, metaOf, crowd);
  if (Y === "all") return STORY_STUDY.all.overview || [];
  if (!STORY_STUDY.years.has(Y)) STORY_STUDY.years.set(Y, computeYearStudy(lib, metaOf, crowd, Y, STORY_STUDY.all));
  return STORY_STUDY.years.get(Y).overview || [];
}
function storyBodyHtml(d) {
  const lib = shareLib(), Y = d.year, all = Y === "all", when = all ? "All time" : Y;
  const { S, best, top } = shareData(lib, Y);
  const who = state.mode === "example" ? "Example diary" : lib.profile.username ? `@${lib.profile.username}` : "Your diary";
  const art = (f) => { const m = metaOf(f); return `<span class="st-art"><span class="st-ph">${esc(f.name)}</span>${showImages && m && m.poster ? `<img src="${IMG}${esc(m.poster)}" alt="" loading="lazy">` : ""}</span>`; };
  const cards = [];
  cards.push(`<p class="st-k">${esc(who)}</p><h3 class="st-big">${esc(when)}<span>in film</span></h3>
    <div class="st-nums"><div><b>${fmtN(S.films.length)}</b><span>films</span></div><div><b>${S.timed ? fmtN(Math.round(S.minutes / 60)) : "—"}</b><span>hours</span></div><div><b>${fmtN(S.entries.length)}</b><span>diary entries</span></div></div>`);
  if (best.length) cards.push(`<p class="st-k">Your highest rated</p><div class="st-posters">${best.slice(0, 4).map((x) => `<figure>${art(x.f)}<figcaption><span class="st-t">${esc(x.f.name)}</span><span class="stars">${stars(x.r)}</span></figcaption></figure>`).join("")}</div>`);
  const person = (label, p) => p && p.count > 1 ? `<p class="st-k">${label}</p><h3 class="st-name">${esc(p.name)}</h3><p class="st-p">${plural(p.count, "film")}${p.avg ? `, ${p.avg.toFixed(1)}★ on average` : ""}</p>
    <div class="st-posters three">${p.films.slice(0, 3).map((f) => `<figure>${art(f)}</figure>`).join("")}</div>` : "";
  const dir = person(all ? "The director you watch most" : "Director of the year", S.directors.most[0]);
  if (dir) cards.push(dir);
  const face = person(all ? "The face you see most" : "The face of the year", S.cast.most[0]);
  if (face) cards.push(face);
  const withMeta = S.films.filter((f) => metaOf(f)).length;
  if (withMeta && S.genres.most.length) {
    const gs = S.genres.most.slice(0, 5), mx = gs[0].count;
    cards.push(`<p class="st-k">What you watched</p><h3 class="st-name">${esc(top ? top[0] : gs[0].name)}</h3><p class="st-p">${top ? `${top[1]}% of your films` : ""}</p>
      <div class="st-bars-list">${gs.map((g) => `<div class="st-row"><span>${esc(g.name)}</span><i><b style="width:${(g.count / mx * 100).toFixed(1)}%"></b></i><span class="num">${pctOf(g.count, withMeta)}%</span></div>`).join("")}</div>`);
  }
  const bm = S.busiestMonth, fav = S.weekday.indexOf(Math.max(...S.weekday));
  if (S.entries.length) cards.push(`<p class="st-k">When you watched</p>
    <div class="st-facts">${bm ? `<div><span>Busiest month</span><b>${MONTHS_LONG[+bm.key.slice(5, 7) - 1]}${all ? ` ${bm.key.slice(0, 4)}` : ""}</b><small>${plural(bm.count, "film")}</small></div>` : ""}
      <div><span>Favourite day</span><b>${WEEKDAYS_LONG[fav]}</b><small>${plural(S.weekday[fav], "film")}</small></div>
      ${S.streak.days > 1 ? `<div><span>Longest streak</span><b>${S.streak.days} days</b><small>in a row</small></div>` : ""}
      ${S.rewatches ? `<div><span>Rewatches</span><b>${fmtN(S.rewatches)}</b><small>films seen again</small></div>` : ""}</div>`);
  cards.push(`<p class="st-k">What stood out</p><div class="st-find" data-storyfind="${esc(Y)}"><p class="st-p">Working it out…</p></div>`);
  cards.push(`<p class="st-k">That's ${esc(all ? "your diary" : Y)}</p><h3 class="st-name">Share it</h3><p class="st-p">As a picture for a feed post or a story.</p>
    <button class="btn primary green st-go" type="button" ${dl(D.share(Y))}>Make the picture</button>`);
  return `<div class="story" tabindex="-1"><div class="st-bars" aria-hidden="true">${cards.map((_, i) => `<i${i ? "" : ' class="done"'}></i>`).join("")}</div>
    ${cards.map((c, i) => `<section class="st-card${i ? "" : " on"}" aria-label="${i + 1} of ${cards.length}">${c}</section>`).join("")}
    <div class="st-nav"><button class="btn small" type="button" data-story-step="-1">Back</button><span class="st-pos" aria-live="polite">1 of ${cards.length}</span><button class="btn small" type="button" data-story-step="1">Next</button></div></div>`;
}
// Fills in the findings card once the story is on screen (the study can take a moment).
function fillStory(root) {
  for (const el of (root || document).querySelectorAll("[data-storyfind]:not([data-busy])")) {
    el.dataset.busy = "1";
    setTimeout(() => {
      if (!el.isConnected) return;
      let list = [];
      try { list = storyFindings(shareLib(), el.dataset.storyfind).slice(0, 2); } catch {}
      el.innerHTML = list.length ? list.map((f) => `<div class="st-f"><span class="st-fk">${esc(f.k || "")}</span><b>${esc(f.big || "")}</b><p>${esc(f.text || "")}</p></div>`).join("")
        : `<p class="st-p">Nothing stood out clearly enough to say. Insights says more as your diary grows.</p>`;
    }, 60);
  }
}
function storyStep(st, by) {
  const cards = [...st.querySelectorAll(".st-card")];
  let i = cards.findIndex((c) => c.classList.contains("on"));
  i = Math.max(0, Math.min(cards.length - 1, i + by));
  cards.forEach((c, j) => c.classList.toggle("on", j === i));
  st.querySelectorAll(".st-bars i").forEach((b, j) => b.classList.toggle("done", j <= i));
  const pos = st.querySelector(".st-pos");
  if (pos) pos.textContent = `${i + 1} of ${cards.length}`;
}
document.addEventListener("click", (e) => {
  const st = e.target.closest && e.target.closest(".story");
  if (!st) return;
  const b = e.target.closest("[data-story-step]");
  if (b) { storyStep(st, +b.dataset.storyStep); return; }
  if (e.target.closest("button, a, [data-list]")) return;
  const r = st.getBoundingClientRect();
  storyStep(st, e.clientX - r.left < r.width * 0.3 ? -1 : 1);
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const st = [...document.querySelectorAll(".story")].filter((x) => x.offsetParent).pop();
  if (!st || (e.target.matches && e.target.matches("input, textarea, select"))) return;
  e.preventDefault();
  storyStep(st, e.key === "ArrowRight" ? 1 : -1);
});
</script>

<script>
/* ---------- the world map: where your films were made, the more films the deeper the colour (asked Oct 2026). Each
   country shows its numbers on hover and opens its films; both layouts draw it (desktop under Genre & origin, phone in
   Stats › Breakdown). Shapes and names are in WORLD (06n-world.js). ---------- */
const normCountry = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/&/g, " and ").replace(/^the\s+|,\s*the$/g, "").replace(/[^a-z0-9]+/g, " ").trim();
let WORLD_INDEX = null;
function worldIndex() {
  if (WORLD_INDEX) return WORLD_INDEX;
  const code = new Map(), gone = new Map();
  for (const [c, names] of Object.entries(WORLD.names)) for (const n of names) code.set(n, c);
  for (const [name, g] of Object.entries(WORLD.gone)) for (const n of g.names) gone.set(n, name);
  return (WORLD_INDEX = { code, gone });
}
// The period's countries on the map: one place per code, its films each counted once (two spellings of a country are
// one place), the countries that no longer exist, and any name the map doesn't know.
function worldData(countries) {
  const { code, gone } = worldIndex();
  const at = new Map(), old = new Map(), off = [];
  for (const c of countries.most) {
    const n = normCountry(c.name), g = gone.get(n), k = code.get(n);
    const into = g ? old : k ? at : null, key = g || k;
    if (!into) { off.push(c); continue; }
    if (!into.has(key)) into.set(key, { code: k || null, name: g || c.name, names: [], films: new Set() });
    const x = into.get(key);
    x.names.push(c.name);
    for (const f of c.films) x.films.add(f);
  }
  const done = (x) => { const films = [...x.films], r = films.filter((f) => f.rating); return { ...x, films, count: films.length, ratings: r.map((f) => f.rating), avg: r.length ? avg(r.map((f) => f.rating)) : 0 }; };
  const places = [...at.values()].map(done).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  return { places, by: new Map(places.map((p) => [p.code, p])), gone: [...old.values()].map(done).sort((a, b) => b.count - a.count), off };
}
// Five steps of shading, spaced so a long tail of countries with a film or two still shows apart from the few with hundreds.
function worldSteps(max) {
  const nice = [2, 3, 5, 10, 20, 30, 50, 100, 200, 300, 500, 1000, 2000, 3000, 5000, 10000];
  const cuts = [1];
  for (let k = 1; k < 5; k++) {
    const want = Math.pow(max, k / 5), n = nice.filter((x) => x > cuts[cuts.length - 1] && x <= max).sort((a, b) => Math.abs(Math.log(a / want)) - Math.abs(Math.log(b / want)))[0];
    if (n) cuts.push(n);
  }
  const lo = [...new Set(cuts)].sort((a, b) => a - b);
  return lo.map((a, i) => ({ lo: a, hi: i + 1 < lo.length ? lo[i + 1] - 1 : Infinity, cls: `l${i + 1 + (5 - lo.length)}` }));
}
const stepLabel = (st) => st.hi === Infinity ? `${fmtN(st.lo)}+` : st.hi === st.lo ? fmtN(st.lo) : `${fmtN(st.lo)}–${fmtN(st.hi)}`;
// The map, its key, and the countries that are no longer on it. o.scope is the year (or "all"), o.total the period's films.
function worldMapHtml(countries, o) {
  const W = worldData(countries), Y = o.scope === "all" ? "" : o.scope;
  if (!W.places.length && !W.gone.length && !W.off.length) return "";
  const steps = worldSteps(W.places.length ? W.places[0].count : 1);
  const stepOf = (n) => steps.find((st) => n >= st.lo && n <= st.hi);
  const filmsTo = (p) => D.films(p.name, filmsSub(p.films), p.films, { scope: o.scope });
  // what came from a country that no longer exists, said on each country that came out of it
  const formerly = new Map();
  for (const g of W.gone) for (const c of WORLD.gone[g.name].codes) formerly.set(c, [...(formerly.get(c) || []), g]);
  const tipOf = (p, c) => {
    const lines = [];
    if (p) {
      const share = o.total ? p.count / o.total * 100 : 0;
      lines.push(`${plural(p.count, "film")}${Y ? ` in ${Y}` : ""} · ${share < 1 ? "under 1" : Math.round(share)}% of ${filterOn() ? "these" : "your"} films`);
      if (p.ratings.length) lines.push(`Your average ${p.avg.toFixed(2)}★ from ${plural(p.ratings.length, "rated film")}`);
      const lead = (key, one) => { const n = new Map(); for (const f of p.films) { const m = metaOf(f); for (const v of new Set(one ? (m && m[key] ? [m[key]] : []) : (m && m[key]) || [])) n.set(v, (n.get(v) || 0) + 1); }
        return [...n].sort((a, b) => b[1] - a[1])[0]; };
      const g = lead("g"), l = lead("l", true);
      if (g || l) lines.push(`Mostly ${[g && g[0].toLowerCase(), l && `in ${l[0]}`].filter(Boolean).join(", ")}`);
      const best = p.films.filter((f) => f.rating).sort((a, b) => b.rating - a.rating || (b.year || 0) - (a.year || 0))[0];
      if (best) lines.push(`Highest rated: ${best.name}${best.year ? ` (${best.year})` : ""} ${stars(best.rating)}`);
    } else lines.push(`No films${Y ? ` in ${Y}` : ""}`);
    for (const g of formerly.get(c) || []) lines.push(`Also ${plural(g.count, "film")} from ${g.name === "Soviet Union" ? "the " : ""}${g.name}`);
    return lines.join("\n");
  };
  const attrs = (c) => {
    const p = W.by.get(c), name = p ? p.name : WORLD.label[c] || c;
    return `${p ? `class="wc ${stepOf(p.count).cls}" ${dl(filmsTo(p))}` : `class="wc"`} data-tip-h="${esc(name)}" data-tip="${esc(tipOf(p, c))}" aria-label="${esc(name)}: ${p ? plural(p.count, "film") : "no films"}"`;
  };
  // countries with films go last, the most last, so their outline shows over their neighbours'
  const order = (c) => (W.by.get(c) || { count: 0 }).count;
  const shapes = WORLD.shapes.slice().sort((a, b) => order(a[0]) - order(b[0])).map(([c, d]) => `<path d="${d}" ${attrs(c)}/>`).join("");
  const dots = WORLD.dots.filter(([c]) => W.by.has(c)).map(([c, x, y]) => `<circle cx="${x}" cy="${y}" r="9" ${attrs(c)}/>`).join("");
  const key = `<div class="wkey" aria-label="Key"><span class="wk"><i class="wc"></i>None</span>${steps.map((st) => {
    const ps = W.places.filter((p) => p.count >= st.lo && p.count <= st.hi);
    const label = `<i class="wc ${st.cls}"></i>${stepLabel(st)}`;
    return ps.length ? `<button class="wk" type="button" ${dl(D.names(`Countries with ${stepLabel(st)} ${st.lo === 1 && st.hi === 1 ? "film" : "films"}`, `${plural(ps.length, "country", "countries")}${Y ? ` · ${Y}` : ""}`,
      ps.map((p) => ({ name: p.name, films: p.films, value: fmtN(p.count), note: filmsSub(p.films), to: filmsTo(p) }))))}>${label}</button>` : `<span class="wk">${label}</span>`;
  }).join("")}<span class="wk-unit">films</span></div>`;
  const elsewhere = [...W.gone, ...W.off.map((c) => ({ name: c.name, films: c.films, count: c.count }))];
  const gone = elsewhere.length ? `<p class="wgone">Not on today's map: ${elsewhere.map((p) => `${dlink(D.films(p.name, filmsSub(p.films), p.films, { scope: o.scope }), esc(p.name))} <span class="muted">${fmtN(p.count)}</span>`).join(", ")}.</p>` : "";
  // on the computer the countries' column is gone from Genre & origin, so the map says who leads, in two lines
  const toOf = (c) => D.films(c.name, filmsSub(c.films), c.films, { scope: o.scope });
  const lead = (label, list, value) => list.length ? `<p class="wtops"><span class="k">${label}</span> ${list.slice(0, 6).map((c) => `${dlink(toOf(c), esc(c.name))} <span class="muted">${value(c)}</span>`).join(" · ")}</p>` : "";
  const tops = o.tops ? lead("Most watched", countries.most, (c) => fmtN(c.count))
    + lead("Highest rated", countries.best, (c) => c.avg.toFixed(2))
    + (countries.most.length > 6 ? `<p class="wtops">${dlink(D.names("Countries", `${plural(countries.most.length, "country", "countries")}, most watched first`, countries.most.map((c) => ({ name: c.name, films: c.films, value: fmtN(c.count),
      note: `${plural(c.count, "film")}${c.avg ? ` · ${c.avg.toFixed(2)} average` : ""}`, to: toOf(c) }))), `All ${fmtN(countries.most.length)} countries ›`)}</p>` : "") : "";
  const v = WORLD_VIEW, zoomed = v.w < WORLD.w - 0.5;
  const zoom = `<div class="wzoom" role="group" aria-label="Zoom the map"><button type="button" data-wz="in" aria-label="Zoom in">+</button><button type="button" data-wz="out" aria-label="Zoom out"${zoomed ? "" : " disabled"}>−</button><button type="button" data-wz="reset" aria-label="Whole world"${zoomed ? "" : " disabled"}>⟲</button></div>`;
  return `<div class="wmap"><div class="wbox"><svg class="wsvg${zoomed ? " zoomed" : ""}" viewBox="${[v.x, v.y, v.w, v.h].map((n) => +n.toFixed(1)).join(" ")}" role="group" aria-label="World map of where your films were made">${shapes}${dots}</svg>${zoom}</div>${key}${tops}${gone}</div>`;
}

/* ----- zooming the map (asked Oct 2026): + and − (and ⟲ for the whole world), pinching on a phone or trackpad, ctrl or ⌘
   with the mouse wheel; once zoomed in, drag to move around. A drag never opens a country; a plain click or tap does.
   The view is kept while the page redraws, so the map doesn't jump back out. ----- */
let WORLD_VIEW = { x: 0, y: 0, w: WORLD.w, h: WORLD.h };
const WORLD_MAX = 8; // eight times closer, enough for Belgium or Lebanon
function worldSet(svg, v) {
  const w = Math.min(WORLD.w, Math.max(WORLD.w / WORLD_MAX, v.w)), h = w * WORLD.h / WORLD.w;
  const x = Math.min(WORLD.w - w, Math.max(0, v.x)), y = Math.min(WORLD.h - h, Math.max(0, v.y));
  WORLD_VIEW = { x, y, w, h };

  for (const s of document.querySelectorAll(".wsvg")) {
    s.setAttribute("viewBox", [x, y, w, h].map((n) => +n.toFixed(1)).join(" "));
    s.classList.toggle("zoomed", zoomed);

// zoom by `k` (above 1 is closer) keeping the point under (cx, cy) on screen where it is
function worldZoom(svg, k, cx, cy) {

  const fx = r.width ? (cx - r.left) / r.width : 0.5, fy = r.height ? (cy - r.top) / r.height : 0.5;
  const w = Math.min(WORLD.w, Math.max(WORLD.w / WORLD_MAX, v.w / k)), h = w * WORLD.h / WORLD.w;
  worldSet(svg, { x: v.x + fx * v.w - fx * w, y: v.y + fy * v.h - fy * h, w, h });
}
document.addEventListener("click", (e) => {
  const b = e.target.closest && e.target.closest("[data-wz]");
  if (!b) return;
  const svg = b.closest(".wbox").querySelector(".wsvg"), r = svg.getBoundingClientRect();
  if (b.dataset.wz === "reset") worldSet(svg, { x: 0, y: 0, w: WORLD.w, h: WORLD.h });

document.addEventListener("wheel", (e) => {

}, true);

/* ---------- speed: results worked out once per change of data, and screens patched rather than redrawn ---------- */
let MEMO = new Map(), memoTag = [];
// The stats, insights and comparisons for this diary, worked out once until something in the data changes.
function memo(key, fn) {

  if (tag.some((x, i) => x !== memoTag[i])) { MEMO = new Map(); memoTag = tag; }

// place, and nothing flashes. Children with data-k keep their element when they move.

function patchKids(a, b) {
  const keyed = new Map();

  let x = a.firstChild, y = b.firstChild;

    const next = y.nextSibling, k = y.nodeType === 1 ? y.getAttribute("data-k") : null;
    if (k != null) {
      const m = keyed.get(k);
      if (m && m.nodeName === y.nodeName) { keyed.delete(k); if (m === x) x = x.nextSibling; else a.insertBefore(m, x); patchNode(m, y); }
      else a.insertBefore(y, x);
    } else if (x && x.nodeType === y.nodeType && x.nodeName === y.nodeName && !(x.nodeType === 1 && x.hasAttribute("data-k"))) { patchNode(x, y); x = x.nextSibling; }

function patchNode(x, y) {
  if (x.nodeType !== 1) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; return; }
  if (x.nodeName === "IMG" && x.getAttribute("src") === y.getAttribute("src")) return;

  for (const { name, value } of y.attributes) if (x.getAttribute(name) !== value) x.setAttribute(name, value);

  // another field (the screen shifted): then what was typed belongs to that other field, not this one
  if (x.nodeName === "INPUT") { const v = y.getAttribute("value") || ""; if (wasName !== y.getAttribute("name") || (x !== document.activeElement && x.value !== v && was !== v)) x.value = v; return; }

let warmQueued = false;
function warmUp() {

  const ratings = s.rated ? sh("Ratings", `<span class="count">${plural(s.rated, "film")} · ★ ${s.avgRating.toFixed(2)}</span>`) + `<div class="card">` +
