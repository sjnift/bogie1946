  if (!all.length) return { html: `<div class="empty">${esc(d.empty || "Nothing here.")}</div>`, hidden: 0 };
  const html = d.kind === "entries" ? entryRowsHtml(shown, all, d)
    : shown.map((x) => d.kind === "films" ? filmRowHtml(x, d) : d.kind === "reviews" ? reviewRowHtml(x, d) : d.kind === "names" ? nameRowHtml(x, d) : plainRowHtml(x)).join("");
  return { html, hidden: all.length - shown.length };
}

/* ----- one film: everything you (and anyone you're comparing with) logged for it ----- */
function crowdBits(f, m) {
  const x = LBX[f.key], out = [];
  if (x && x.r) out.push(`Letterboxd <b>${x.r.toFixed(1)}★</b>${x.n ? ` <small>${fmtN(x.n)} ratings</small>` : ""}`);
  if (m && m.ir) out.push(`IMDb <b>${m.ir.toFixed(1)}</b>${m.iv ? ` <small>${fmtN(m.iv)} votes</small>` : ""}`);
  if (m && m.va && (m.vc || 0) >= 25) out.push(`TMDB <b>${m.va.toFixed(1)}</b>`);
  if (m && m.mc) out.push(`Metacritic <b>${m.mc}</b>`);
  if (m && m.rt) out.push(`Rotten Tomatoes <b>${m.rt}%</b>`);
  return out;
}
function recordHtml(p, d, solo) {
  const g = p.film;
  const head = `<h4>${solo ? esc(d.who ? `In ${d.who}'s diary` : state.mode === "example" ? "In the example diary" : "In your diary") : esc(p.name)}</h4>`;
  if (!g) return `<section class="fc-sec">${head}<p class="dr-s">${esc(p.missing || "Not logged.")}</p></section>`;
  const line = [g.rating ? `<span class="stars">${stars(g.rating)}</span>` : "Not rated", g.liked ? '<span class="heart">♥</span> Liked' : "",
    g.entries.length ? plural(g.entries.length, "diary entry", "diary entries") : "Logged without a date"].filter(Boolean).join(" · ");
  const rows = [...g.entries].reverse().map((e) => `<div class="fc-entry${d.entry === e ? " on" : ""}"><span>${fmtDate(e.date)}${e.logged && e.logged !== e.date ? ` <small>logged ${fmtDate(e.logged)}</small>` : ""}</span>
    <span><span class="stars">${stars(e.rating)}</span>${e.rewatch ? ' <span title="Rewatch">↻</span>' : ""}${e.review ? ' <span title="Reviewed">≡</span>' : ""}</span></div>`).join("");
  const reviews = p.lib.reviews.filter((r) => r.film === g && r.html).map((r) => `<div class="fc-review"><p class="dr-s">Review${r.date ? `, ${fmtDate(r.date)}` : ""}</p><div class="rv-text">${r.html}</div></div>`).join("");
  return `<section class="fc-sec">${head}<p class="fc-line">${line}</p>${rows ? `<div class="fc-entries">${rows}</div>` : ""}${reviews}</section>`;
}
function filmCardHtml(d) {
  const f = d.film, m = metaOf(f), lib = d.lib || state.lib;
  const who = d.people || [{ lib, film: lib.films.includes(f) ? f : lib.films.find((x) => x.key === f.key) }];
  const facts = [], tags = [];
  if (m) {
    if (m.d.length) facts.push(`<p class="fc-dir">Directed by ${m.d.map((n) => dlink(personDrill(lib, n, "d"), esc(n))).join(", ")}</p>`);
    if (m.r) facts.push(`<p>${m.r} min</p>`);
    tags.push(...m.g.map((g) => dlink(catDrill(lib, g, "g"), esc(g))), ...m.k.map((k) => dlink(catDrill(lib, k, "k"), esc(k))), ...(m.l ? [dlink(catDrill(lib, m.l, "l"), esc(m.l))] : []));
  }
  const crowd = crowdBits(f, m);
  const cast = m && m.c.length ? `<section class="fc-sec"><h4>Cast</h4><div class="fc-chips">${m.c.slice(0, 12).map((n) => dlink(personDrill(lib, n, "c"), esc(n))).join("")}</div></section>` : "";
  const tm = META[f.key];
  const links = [`<a href="${esc(lbUrl(f))}" target="_blank" rel="noopener">Letterboxd ↗</a>`,
    tm && tm.src === "tmdb" && tm.id && !IN_VIEWER ? `<a href="https://www.themoviedb.org/movie/${tm.id}" target="_blank" rel="noopener">TMDB ↗</a>` : "",
    m && m.im ? `<a href="https://www.imdb.com/title/${m.im}/" target="_blank" rel="noopener">IMDb ↗</a>` : ""].filter(Boolean).join("");
  return `<div class="fcard">${d.badge ? `<p class="fc-badge">${esc(d.badge)}</p>` : ""}<div class="fc-top">${thumb(f, true)}<div class="fc-facts">
      ${facts.join("")}${m ? "" : `<p class="dr-s">No cast &amp; crew details yet.</p>`}
      ${crowd.length ? `<p class="fc-crowd">${crowd.join('<span class="sep"> · </span>')}</p>` : ""}${tags.length ? `<p class="fc-tags">${tags.join("")}</p>` : ""}</div></div>
    ${who.map((p) => recordHtml(p, d, !d.people)).join("")}${cast}<p class="fc-links">${links}</p></div>`;
}
</script>
<script>
/* ---------- app state ---------- */
const state = {
  mode: "example", lib: null, scope: "all", view: "profile", stack: [],
  role: "c", crew: "w", sort: "most", catSort: "most", peopleLimit: 50, diaryLimit: 60, crowd: null, insYear: "all", reviewQuery: "", reviewLimit: 30, cmp: null, cmpError: "", unfriend: null,
};
let MY_LIB = null, EXAMPLE_LIB = null, STATS = null;
const IMG = "https://image.tmdb.org/t/p/w185";
const showImages = !IN_VIEWER; // pages inside Claude can't load outside images
const VIEW_KEY = "cr-mview-v1";
const TITLES = { profile: "Profile", people: "People", diary: "Diary", films: "Films", data: "Import" };
const CHEV = `<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>`;
const BACK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>`;

function metaOf(f) {
  if (state.mode === "example") return EXAMPLE_META[f.key] || null;
  const m = META[f.key];
  if (m && !m.miss) return m;
  return EXAMPLE_META[f.key] || null;
}
let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}
function saveView() { store.set(VIEW_KEY, { scope: state.scope, mode: state.mode, view: state.view }); }

function render() {
  if (state.mode === "mine" && !MY_LIB) state.mode = "example";
  state.lib = state.mode === "mine" ? MY_LIB : EXAMPLE_LIB;
  const years = [...new Set(state.lib.entries.map((e) => e.date.slice(0, 4)))].sort().reverse();
  if (state.scope !== "all" && !years.includes(state.scope)) state.scope = "all";
  STATS = computeStats(state.lib, metaOf, state.scope);
  LISTS = new Map();
  const d = state.stack[state.stack.length - 1];
  renderTop(years, d);
  $("#screen").innerHTML = d ? detailScreen(d, STATS) : SCREENS[state.view](STATS);
  for (const b of document.querySelectorAll(".tabbar [data-view]")) {
    if (b.dataset.view === state.view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  }
  const cal = $(".cal-wrap");
  if (cal) cal.scrollLeft = cal.scrollWidth;
}
function renderTop(years, d) {
  $("#top").classList.toggle("detail", !!d);
  $("#nav-left").innerHTML = d ? `<button class="nav-btn" type="button" data-act="back">${BACK}<span class="sr-only">Back</span></button>` : "";
  const who = state.mode === "example" ? "Example diary" : state.lib.profile.username || "Your diary";
  $("#nav-title").textContent = d ? d.title : state.view === "profile" ? who : TITLES[state.view];
  $("#nav-right").innerHTML = !d ? `<button class="nav-btn" type="button" data-act="insights">Insights</button>` : "";
  $("#scopes").innerHTML = ["all", ...years].map((y) =>
    `<button class="scope" type="button" data-scope="${y}" aria-pressed="${y === state.scope}">${y === "all" ? "All time" : y}</button>`).join("");
}
function push(entry) {
  entry.ret = window.scrollY;
  state.stack.push(entry);
  render();
  window.scrollTo(0, 0);
}
function pop() {
  const d = state.stack.pop();
  render();
  window.scrollTo(0, d ? d.ret : 0);
}

/* ---------- pieces ---------- */
const sh = (label, right = "") => `<div class="sh"><span>${label}</span>${right}</div>`;
function avatar(p, size) {
  const ph = showImages && p.key && PHOTOS[p.key];
  return `<span class="avatar ${size}" aria-hidden="true">${esc(initials(p.name || "?"))}${ph ? `<img src="${IMG}${esc(ph)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;
}
function poster(f) {
  const m = metaOf(f);
  const img = showImages && m && m.poster ? `<img src="${IMG}${esc(m.poster)}" alt="" loading="lazy" onerror="this.remove()">` : "";
  return `<span class="poster"><span class="ph">${esc(f.name)}<small>${f.year || ""}</small></span>${img}</span>`;
}
function posterGrid(films) {
  return `<div class="pgrid">${films.map((f) => `<button class="pitem" type="button" ${dl(D.film(f))} title="${esc(f.name)}${f.year ? ` (${f.year})` : ""}">${poster(f)}
    <span class="pmeta"><span class="stars">${stars(f.rating)}</span>${f.liked ? '<span class="heart" aria-label="liked">♥</span>' : ""}</span></button>`).join("")}</div>`;
}
const filmsTitle = (p) => `${plural(p.count, "film")}${p.avg ? ` · ★ ${p.avg.toFixed(2)} average` : ""}`;
function personRow(p, rank, sortBest) {
  return `<button class="prow" type="button" data-list="${reg(p.name, filmsTitle(p), p.films, p)}">
    <span class="rk">${rank}</span>${avatar(p, "md")}
    <span style="min-width:0"><span class="nm" style="display:block">${esc(p.name)}</span><span class="sub">${filmsTitle(p)}</span></span>
    <span class="val">${sortBest ? p.avg.toFixed(2) : fmtN(p.count)}</span>${CHEV}</button>`;
}
function catRow(c, max, sortBest) {
  const w = sortBest ? c.avg / 5 : c.count / max;
  return `<button class="prow cat" type="button" data-list="${reg(c.name, filmsTitle(c), c.films)}">
    <span class="nm">${esc(c.name)}</span><span class="mini" aria-hidden="true"><span style="width:${(w * 100).toFixed(1)}%"></span></span>
    <span class="val" style="text-align:right">${sortBest ? c.avg.toFixed(2) : fmtN(c.count)}</span>${CHEV}</button>`;
}
const needMeta = () => `<div class="card" style="margin-top:14px"><p class="title">No cast or crew yet</p>
  <p>Letterboxd's export lists your films, dates and ratings, but not who's in them. Fill them in from the Import tab.</p>
  <button class="btn green" type="button" data-view="data">Fill in cast &amp; crew</button></div>`;

/* ---------- Profile ---------- */
function profileScreen(s) {
  const ex = state.mode === "example", lib = state.lib;
  const name = ex ? "Example diary" : lib.profile.name || lib.profile.username || "Your diary";
  const handle = ex ? `<span class="pill">Example</span>` : lib.profile.joined ? `Member since ${MONTHS_LONG[+lib.profile.joined.slice(5, 7) - 1]} ${lib.profile.joined.slice(0, 4)}` : "";
  const notice = ex ? `<div class="card notice"><p class="title">This is an example diary, not yours.</p>
      <p>Export your data from Letterboxd (Settings → Data → Export your data), then import the ZIP here. Your files stay in this browser.</p>
      <button class="btn green block" type="button" data-act="import">Import your export</button></div>` : "";
  const total = lib.films.length, have = lib.films.filter((f) => metaOf(f)).length;
  const fill = !ex && have < total ? `<button class="row" type="button" data-view="data" style="border-top:1px solid var(--line); margin-top:16px">
      <span>${job.running ? `Looking up cast &amp; crew · ${fmtN(job.done)} of ${fmtN(job.total)}` : `Cast &amp; crew for ${fmtN(have)} of ${plural(total, "film")}`}</span>
      <span class="count" style="color:var(--green)">${job.running ? "" : "Fill in"}</span>${CHEV}</button>` : "";
  const hours = Math.round(s.minutes / 60);
  const cell = (to, v, label) => to ? `<button type="button" ${dl(to)}><b class="num">${v}</b><span>${label}</span></button>` : `<div><b class="num">${v}</b><span>${label}</span></div>`;
  const strip = `<div class="strip">${cell(s.films.length && DR.films(s), fmtN(s.films.length), "Films")}${cell(s.timed && DR.runtime(s), s.timed ? fmtN(hours) : "—", "Hours")}
    ${cell(s.entries.length && DR.diary(s), fmtN(s.entries.length), "Entries")}${cell(s.rated && DR.rated(s), s.avgRating ? s.avgRating.toFixed(2) : "—", "Average")}</div>`;
  const top = s.films.filter((f) => f.rating).sort((a, b) => b.rating - a.rating || b.entries.length - a.entries.length || (b.year || 0) - (a.year || 0));
  const topRated = top.length ? sh("Top rated", `<button class="more" type="button" data-act="all-rated">See all</button>`) + posterGrid(top.slice(0, 4)) : "";
  const ratings = s.rated ? sh("Ratings", `<span class="num">${fmtN(s.rated)}</span>`) +
    colChart(s.spread.map((x) => ({ a: x.count, b: 0, tip: `${stars(x.r)} · ${plural(x.count, "film")}`, to: x.count && DR.rating(s.films, x.r) })), "How many films you gave each rating", "", 72)
      .replace('class="chart"', 'class="chart slate"').replace(/<div class="axis"[^]*?<\/div>/, "") +
    `<div class="hist-ends" style="margin-right:26px"><span class="stars">★</span><span class="stars">★★★★★</span></div>` : "";
  const strip2 = (label, data, role) => {
    const list = data.most.slice(0, 10);
    if (!list.length) return "";
    return sh(label, `<button class="more" type="button" data-act="people" data-role="${role}">See all</button>`) +
      `<div class="scroller">${list.map((p) => `<button class="pcard" type="button" data-list="${reg(p.name, filmsTitle(p), p.films, p)}">
        ${avatar(p, "lg")}<span class="nm">${esc(p.name)}</span><span class="ct">${plural(p.count, "film")}</span></button>`).join("")}</div>`;
  };
  const people = s.withMeta ? strip2("Most watched actors", s.cast, "c") + strip2("Most watched directors", s.directors, "d") : "";
  const rows = [
    ["Actors", s.cast.total, `data-act="people" data-role="c"`],
    ["Directors", s.directors.total, `data-act="people" data-role="d"`],
    ["Diary", s.entries.length, `data-view="diary"`],
    ["Reviews", lib.reviewTextMissing ? s.reviews : reviewsIn(lib, s.scope === "all" ? null : s.scope).length, `data-act="reviews"`],
    ["Genres", s.genres.most.length, `data-act="cat" data-field="genres"`],
    ["Countries", s.countries.most.length, `data-act="cat" data-field="countries"`],
    ["Languages", s.languages.most.length, `data-act="cat" data-field="languages"`],
    ["Rewatches", s.rewatches, s.rewatches ? dl(DR.rewatches(s)) : `data-view="diary"`],
    ["Liked", s.likes, `data-act="liked"`],
  ].map(([k, n, attrs]) => `<li><button class="row" type="button" ${attrs}><span>${k}</span><span class="count">${fmtN(n)}</span>${CHEV}</button></li>`).join("");
  return `<div class="profile">${avatar({ name: ex ? "Example" : lib.profile.username || "You" }, "xl")}
      <div class="name">${esc(name)}</div><div class="handle">${handle}</div></div>
    ${state.importNote ? `<div class="card notice"><p>${esc(state.importNote)}</p>${MY_LIB && MY_LIB.reviews.length ? `<button class="btn block" type="button" data-act="reviews">See your reviews</button>` : ""}</div>` : ""}${notice}${strip}
    <button class="row" type="button" data-act="insights"><span>Insights</span><span class="count">Trends, tastes, the crowd</span>${CHEV}</button>
    <button class="row" type="button" data-act="compare"><span>Compare</span><span class="count">You and friends</span>${CHEV}</button>
    ${fill}${topRated}${ratings}${people}
    ${sh(state.scope === "all" ? "All time" : state.scope)}<ul class="menu">${rows}</ul>`;
}

/* ---------- People ---------- */
function peopleScreen(s) {
  const role = state.role;
  const data = role === "c" ? s.cast : role === "d" ? s.directors : { w: s.writers, p: s.dop, m: s.music }[state.crew];
  const best = state.sort === "best";
  const list = best ? data.best : data.most;
  const segs = [["c", "Actors"], ["d", "Directors"], ["crew", "Crew"]].map(([v, l]) =>
    `<button type="button" data-role="${v}" aria-pressed="${v === role}">${l}</button>`).join("");
  const crew = role === "crew" ? `<div class="toggles">${[["w", "Writers"], ["p", "Camera"], ["m", "Music"]].map(([v, l]) =>
    `<button class="toggle" type="button" data-crew="${v}" aria-pressed="${v === state.crew}">${l}</button>`).join("")}</div>` : "";
  const sorts = `<div class="toggles">${[["most", "Most watched"], ["best", "Highest rated"]].map(([v, l]) =>
    `<button class="toggle" type="button" data-sort="${v}" aria-pressed="${v === state.sort}">${l}</button>`).join("")}</div>`;
  const head = `<div class="segctl" role="group" aria-label="Role">${segs}</div>${crew}${sorts}`;
  if (!s.withMeta) return head + needMeta();
  const note = role === "c" ? `Top ${CAST_DEPTH} billed cast of each film.` : "";
  const bestNote = best ? `${note ? " " : ""}Highest rated needs ${s.minRated} or more rated films.` : "";
  const rows = list.slice(0, state.peopleLimit).map((p, i) => personRow(p, i + 1, best)).join("");
  const more = list.length > state.peopleLimit ? `<button class="row" type="button" data-act="more-people"><span>Show more</span><span class="count">${fmtN(list.length - state.peopleLimit)} more</span>${CHEV}</button>` : "";
  return head + sh(`${fmtN(list.length)} ${role === "c" ? "actors" : role === "d" ? "directors" : "people"}`) +
    (note + bestNote ? `<p class="status" style="margin:-2px 0 4px">${esc(note + bestNote)}</p>` : "") +
    (rows || `<div class="empty">Nobody to show for this period.</div>`) + more;
}
</script>
<script>
/* ---------- Diary ---------- */
// a fact that opens what it counts, or the film it names
const fact = (k, v, f, to) => { const inner = `<span class="k">${k}</span><span class="v">${esc(v)}${to || f ? '<span class="go" aria-hidden="true"> ›</span>' : ""}</span>`;
  return to || f ? `<button class="fact" type="button" ${dl(to || D.film(f))}>${inner}</button>` : `<div class="fact">${inner}</div>`; };
function diaryScreen(s) {
  if (!s.entries.length) return `<div class="empty" style="padding-top:28px">No diary dates in ${s.scope === "all" ? "your export" : s.scope}. Films logged without a date still count on the other tabs.</div>`;
  const cols = timeline(s);
  const unit = s.scope !== "all" ? "week" : cols[0].key.length === 7 ? "month" : "year";
  const bm = s.busiestMonth, fav = s.weekday.indexOf(Math.max(...s.weekday));
  const facts = `<div class="facts">${[
    fact("Busiest month", bm ? `${MONTHS[+bm.key.slice(5, 7) - 1]} ${bm.key.slice(0, 4)} · ${plural(bm.count, "film")}` : "—", null, bm && DR.month(s.entries, bm.key)),
    fact("Longest streak", s.streak.days > 1 ? `${s.streak.days} days` : "1 day", null, DR.streak(s)),
    fact("Most in a day", s.busiestDay ? `${plural(s.busiestDay.count, "film")} · ${fmtDate(s.busiestDay.key).replace(/ \d{4}$/, s.scope === "all" ? "$&" : "")}` : "—", null, s.busiestDay && DR.day(s.entries, s.busiestDay.key)),
    fact("Favourite day", WEEKDAYS_LONG[fav], null, DR.weekday(s.entries, fav)),
  ].join("")}</div>`;
  const legend = s.rewatches ? `<div class="legend"><span><i style="background:var(--green-mark)"></i>First watch</span><span><i style="background:var(--blue-mark)"></i>Rewatch</span></div>` : "";
  let chart = colChart(cols, `Diary entries by ${unit}`, legend, 110);
  if (cols.length > 24) chart = chart.replace('class="axis"', 'class="axis dense"');
  const wmax = Math.max(1, ...s.weekday);
  const weekdays = `<div class="weekdays" role="group" aria-label="Diary entries by day of the week">${s.weekday.map((n, i) =>
    `<button class="wd" type="button" ${dl(DR.weekday(s.entries, i))} aria-label="${WEEKDAYS_LONG[i]}: ${plural(n, "film")}"><span class="cnt">${n}</span><span class="bar-v"><span style="height:${(n / wmax * 100).toFixed(1)}%"></span></span><span class="lbl">${WEEKDAYS[i].slice(0, 1)}</span></button>`).join("")}</div>`;
  const list = [...s.entries].reverse().slice(0, state.diaryLimit);
  let rows = "", month = "";
  for (const e of list) {
    const m = e.date.slice(0, 7);
    if (m !== month) { month = m; rows += `<div class="month-h">${MONTHS_LONG[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}</div>`; }
    rows += `<button class="drow" type="button" ${dl(D.film(e.film, { entry: e }))}><span class="day">${+e.date.slice(8, 10)}</span>${poster(e.film)}
      <span style="min-width:0"><span class="t" style="display:block">${esc(e.film.name)} <span>${e.film.year || ""}</span></span>
      <span class="m"><span class="stars">${stars(e.rating)}</span></span></span>
      <span class="icons">${e.rewatch ? '<span class="rewatch" title="Rewatch">↻</span>' : ""}${e.film.liked ? '<span class="heart" title="Liked">♥</span>' : ""}${e.review ? '<span title="Reviewed">≡</span>' : ""}</span></button>`;
  }
  const more = s.entries.length > state.diaryLimit ? `<button class="row" type="button" data-act="more-diary"><span>Show older entries</span><span class="count">${fmtN(s.entries.length - state.diaryLimit)} more</span>${CHEV}</button>` : "";
  return facts + sh(`Films by ${unit}`, `<span class="num">${fmtN(s.entries.length)}</span>`) + chart +
    sh("By day of the week") + weekdays +
    sh(s.scope === "all" ? "Last 12 months" : `Every day of ${s.scope}`) + heatmap(s).replace("Fewer", "Less") +
    sh("Diary", `<span class="num">${plural(s.entries.length, "entry", "entries")}</span>`) + `<div>${rows}</div>` + more;
}

/* ---------- Films ---------- */
function filmsScreen(s) {
  const views = (f) => s.scope === "all" ? f.entries.length : f.entries.filter((e) => e.date.startsWith(s.scope)).length;
  const rated = s.films.filter((f) => f.rating).sort((a, b) => b.rating - a.rating || views(b) - views(a) || (b.year || 0) - (a.year || 0));
  let html = rated.length ? sh("Highest rated", `<button class="more" type="button" data-act="all-rated">See all</button>`) + posterGrid(rated.slice(0, 8)) : "";
  const best = state.catSort === "best";
  if (s.withMeta) {
    html += `<div class="toggles" style="margin-top:22px">${[["most", "Most watched"], ["best", "Highest rated"]].map(([v, l]) =>
      `<button class="toggle" type="button" data-catsort="${v}" aria-pressed="${v === state.catSort}">${l}</button>`).join("")}</div>`;
    for (const [label, data, field] of [["Genres", s.genres, "genres"], ["Countries", s.countries, "countries"], ["Languages", s.languages, "languages"]]) {
      const list = (best ? data.best : data.most);
      html += sh(label, list.length > 6 ? `<button class="more" type="button" data-act="cat" data-field="${field}">See all</button>` : "") +
        (list.length ? list.slice(0, 6).map((c) => catRow(c, list[0].count, best)).join("") : `<div class="empty">${best ? "Needs 3 or more rated films each." : "Nothing yet."}</div>`);
    }
  } else html += needMeta();

  if (s.decades.length) {
    const all = s.decades, cols = [];
    for (let d = all[0].decade; d <= all[all.length - 1].decade; d += 10) {
      const x = all.find((y) => y.decade === d);
      cols.push({ a: x ? x.count : 0, b: 0, label: `’${String(d).slice(2)}`, tip: `${d}s: ${plural(x ? x.count : 0, "film")}${x && x.avg ? ` · ${x.avg.toFixed(2)} average` : ""}`, to: x && DR.decade(x) });
    }
    const ranked = all.filter((x) => x.ratings.length >= 3).sort((a, b) => b.avg - a.avg).slice(0, 5)
      .map((x) => ({ name: `${x.decade}s`, films: x.films, count: x.count, avg: x.avg }));
    html += sh("Decades") + colChart(cols, "Films by decade of release", "", 90) +
      (ranked.length ? `<p class="status" style="margin:14px 0 0">Highest-rated decades</p>` + ranked.map((c) => catRow(c, 1, true)).join("") : "");
  }

  const re = s.films.filter((f) => views(f) > 1).sort((a, b) => views(b) - views(a) || (b.rating || 0) - (a.rating || 0)).slice(0, 8);
  if (re.length) html += sh("Most rewatched") + re.map((f) => `<button class="drow" type="button" ${dl(D.film(f))} style="grid-template-columns:34px minmax(0,1fr) auto">${poster(f)}
    <span style="min-width:0"><span class="t" style="display:block">${esc(f.name)} <span>${f.year || ""}</span></span><span class="m"><span class="stars">${stars(f.rating)}</span></span></span>
    <span class="val num">${views(f)}×</span></button>`).join("");

  const E = s.entries;
  if (E.length) {
    const marks = s.scope === "all" ? [50, 100, 250, 500, 750, 1000, 1500, 2000, 2500, 3000, 4000, 5000, 7500, 10000] : [25, 50, 100, 150, 200, 250, 300, 365, 400, 500];
    const items = [["First film", E[0], 1], ...marks.filter((n) => n < E.length).slice(-5).map((n) => [`${ordinal(n)} film`, E[n - 1], n])];
    if (E.length > 1) items.push(["Latest", E[E.length - 1], E.length]);
    html += sh("Milestones") + `<div class="pgrid">${items.map(([k, e, n]) => `<button class="pitem" type="button" ${dl(D.film(e.film, { entry: e, badge: `${k}: diary entry ${fmtN(n)} of ${fmtN(E.length)}${s.scope === "all" ? "" : ` in ${s.scope}`}, ${fmtDate(e.date)}` }))} title="${esc(e.film.name)}${e.film.year ? ` (${e.film.year})` : ""}">
      <span class="mlabel">${k}</span>${poster(e.film)}
      <span class="pmeta"><span class="stars">${stars(e.rating)}</span>${e.rewatch ? '<span class="rewatch" aria-label="rewatch">↻</span>' : ""}</span>
      <span class="mdate">${fmtDate(e.date)}</span></button>`).join("")}</div>`;
  }

  const timed = s.films.filter((f) => metaOf(f) && metaOf(f).r);
  const longest = timed.reduce((a, f) => !a || metaOf(f).r > metaOf(a).r ? f : a, null);
  const shortest = timed.reduce((a, f) => !a || metaOf(f).r < metaOf(a).r ? f : a, null);
  const dated = s.films.filter((f) => f.year);
  const oldest = dated.reduce((a, f) => !a || f.year < a.year ? f : a, null);
  const newest = dated.reduce((a, f) => !a || f.year > a.year ? f : a, null);
  const rec = [
    longest && fact("Longest", `${longest.name} · ${metaOf(longest).r} min`, longest), shortest && fact("Shortest", `${shortest.name} · ${metaOf(shortest).r} min`, shortest),
    oldest && fact("Oldest", `${oldest.name} · ${oldest.year}`, oldest), newest && fact("Newest", `${newest.name} · ${newest.year}`, newest),
  ].filter(Boolean).join("");
  if (rec) html += sh("Records") + `<div class="facts" style="margin-top:0">${rec}</div>`;
  return html || `<div class="empty">No films in this period.</div>`;
}

/* ---------- Import ---------- */
function lookupInner() {
  if (state.mode === "example" || !MY_LIB) {
    return `<p class="title">Cast &amp; crew</p><p>Letterboxd's export lists your films, dates and ratings, but not who's in them.
      After you import yours, you can fill them in${IN_VIEWER ? " with Claude" : " from TMDB with your API key"}. The example has them filled in already.</p>`;
  }
  const lib = MY_LIB, total = lib.films.length;
  const have = lib.films.filter((f) => metaOf(f)).length;
  const fromTmdb = lib.films.filter((f) => META[f.key] && META[f.key].src === "tmdb" && !META[f.key].miss).length;
  const pct = total ? Math.round(have / total * 100) : 0;
  const src = fromTmdb ? (fromTmdb === have ? "From TMDB" : "From TMDB and Claude") : have ? "From Claude's film knowledge" : "Not looked up yet";
  const head = `<p class="title">Cast &amp; crew</p><div class="meter" role="progressbar" aria-label="Films with cast and crew" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span id="lookup-meter" style="width:${pct}%"></span></div>
    <p class="status">${fmtN(have)} of ${plural(total, "film")} · ${src}</p>`;
  const note = job.note ? `<p class="status${job.err ? " err" : ""}" role="status">${esc(job.note)}</p>` : "";
  const saveNote = job.saveFailed ? `<p class="status err">This browser wouldn't save the results, so they'll be gone when you close the page.</p>` : "";
  if (job.running) return head + `<p class="status" id="lookup-progress" role="status">${progressText()}</p><button class="btn block" type="button" data-act="stop">Stop</button>`;
  let body;
  if (!IN_VIEWER) {
    const todo = needsLookup(lib, "tmdb").length;
    const askKey = !tmdbKey() || editKey || job.badKey;
    body = todo && !askKey ? `<button class="btn green block" type="button" data-act="tmdb">Look up ${plural(todo, "film")} on TMDB</button>
      <p class="status">Using your saved TMDB key. <button class="linkish" type="button" data-act="change-key">Change key</button></p>` :
      todo ? `<label class="sr-only" for="tmdb-key">TMDB API key or read access token</label>
      <input class="key" id="tmdb-key" type="password" autocomplete="off" spellcheck="false" placeholder="TMDB API key or read access token" value="${esc(tmdbKey())}">
      <button class="btn green block" type="button" data-act="tmdb">Look up ${plural(todo, "film")} on TMDB</button>
      <p class="status">Get a free key at <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org/settings/api</a>. It's saved in this browser and sent only to TMDB.</p>` : have < total ? `<p>TMDB had no match for ${plural(total - have, "film")}.</p>` : `<p>Every film has details from TMDB.</p>`;
  } else if (sampleState === "ready") {
    const todo = needsLookup(lib, "claude").length;
    const misses = lib.films.filter((f) => META[f.key] && META[f.key].miss && META[f.key].src === "claude").length;
    body = `<p>Pages inside Claude can't reach TMDB, so Claude fills in each film from what it knows. Obscure films can come back wrong or empty.</p>` +
      (todo ? `<button class="btn green block" type="button" data-act="claude">Look up ${plural(todo, "film")} with Claude</button>
        <p class="status">About ${plural(Math.ceil(todo / CLAUDE_BATCH), "request")} on your Claude plan.</p>` :
      misses ? `<button class="btn block" type="button" data-act="claude-retry">Try the ${plural(misses, "film")} Claude didn't recognise</button>` : "");
  } else if (sampleState === "pending") {
    body = `<p class="status">Connecting to Claude…</p>`;
  } else {
    body = `<p>Lookups aren't available in this view. Open the downloadable copy of this page in a browser and use a TMDB key.</p>`;
  }
  return head + body + note + saveNote + imdbBlock(MY_LIB, true) + letterboxdBlock(MY_LIB, true);
}
function progressText() {
  return job.kind === "claude" && job.done === 0 ? `Asking Claude about ${plural(job.total, "film")}… the first batch takes up to a minute.`
    : `Looked up ${fmtN(job.done)} of ${plural(job.total, "film")} ${job.kind === "tmdb" ? "on TMDB" : "with Claude"}…`;
}
function renderLookup() { const el = $("#lookup"); if (el) el.innerHTML = lookupInner(); }
function renderLookupProgress() {
  const p = $("#lookup-progress");
  if (p) p.textContent = progressText();
  const ip = $("#imdb-progress");
  if (ip) ip.textContent = imdbProgressText();
  const lp = $("#lb-progress");
  if (lp) lp.textContent = lbProgressText();
  const m = $("#lookup-meter");
  if (m && MY_LIB) m.style.width = `${Math.round(MY_LIB.films.filter((f) => metaOf(f)).length / Math.max(1, MY_LIB.films.length) * 100)}%`;
}
function dataScreen() {
  const lib = MY_LIB;
  const status = lib ? `${plural(lib.films.length, "film")}, ${plural(lib.entries.length, "diary entry", "diary entries")} and ${plural(lib.reviews.length, "review")} imported${lib.profile.username ? ` for @${esc(lib.profile.username)}` : ""}.${lib.reviewTextMissing ? " The review text is missing, so import the export again." : ""}` : "Nothing imported yet.";
  const rows = [];
  if (state.mode === "mine") rows.push(`<li><button class="row" type="button" data-act="example"><span>View the example diary</span>${CHEV}</button></li>`);
  else if (lib) rows.push(`<li><button class="row" type="button" data-act="mine"><span>Back to my diary</span>${CHEV}</button></li>`);
  rows.push(`<li><button class="row danger" type="button" data-act="forget"><span>${state.forgetArmed ? "Tap again to delete" : "Delete saved data from this browser"}</span></button></li>`);
  return `<div class="card" style="margin-top:18px"><p class="title">Your Letterboxd export</p><p>${status}</p>
      <ol style="margin:0; padding-left:18px; display:grid; gap:4px">
        <li>On <a href="https://letterboxd.com/settings/data/" target="_blank" rel="noopener">letterboxd.com</a>, open Settings → Data.</li>
        <li>Choose Export your data and download the ZIP.</li>
        <li>Import the ZIP here. It stays in this browser.</li></ol>
      <button class="btn green block" type="button" data-act="import">${lib ? "Import a newer export" : "Import export"}</button>
      ${state.importError ? `<p class="status err" role="alert">${esc(state.importError)}</p>` : ""}</div>
    <div class="card" id="lookup" style="margin-top:12px">${lookupInner()}</div>
    ${sh("This browser")}<ul class="menu">${rows.join("")}</ul>
    ${state.forgetArmed ? `<p class="status">Removes your imported export and looked-up details, plus any keys you typed in.</p>` : ""}
    <div class="foot"><p>Credits Roll reads the CSV files in a Letterboxd data export. It is not made by or affiliated with Letterboxd.</p>
      <p>With your own TMDB key, film details come from The Movie Database. This product uses the TMDB API but is not endorsed or certified by TMDB.
      Inside the Claude app, details come from Claude's knowledge of each film instead, so check anything surprising.</p>
      <p>On a computer? <a href="desktop.html">Open the desktop version</a>. It uses the same import.</p>
      <p>Updated 22 Oct 2026, 17:29 UTC</p></div>`;
}

/* ---------- pushed detail screens ---------- */
function detailScreen(d, s) {
  if (d.type === "insights") return insightsScreen();
  if (d.type === "compare") return compareScreen();
  if (d.type === "reviews") return reviewsScreen();
  if (d.type === "drill") return drillScreen(d.d);
  if (d.type === "cat") {
    const data = s[d.field], best = state.catSort === "best";
    const list = best ? data.best : data.most;
    return `<div class="toggles" style="margin-top:16px">${[["most", "Most watched"], ["best", "Highest rated"]].map(([v, l]) =>
      `<button class="toggle" type="button" data-catsort="${v}" aria-pressed="${v === state.catSort}">${l}</button>`).join("")}</div>` +
      sh(`${fmtN(list.length)} ${d.title.toLowerCase()}`) + (list.map((c) => catRow(c, list[0].count, best)).join("") || `<div class="empty">Nothing to show for this period.</div>`);
  }
  const films = [...d.films].sort((a, b) => (b.rating || 0) - (a.rating || 0) || (b.year || 0) - (a.year || 0));
  return `<div class="dhead">${d.person && d.person.key ? avatar(d.person, "xl") : ""}<div class="name">${esc(d.title)}</div><div class="sub">${esc(d.sub)}</div></div>` +
    sh("Films", `<span class="num">${fmtN(films.length)}</span>`) + posterGrid(films);
}

const SCREENS = { profile: profileScreen, people: peopleScreen, diary: diaryScreen, films: filmsScreen, data: dataScreen };
</script>
<script>
/* ---------- phone: the Insights screen, pushed from the nav bar or Profile ---------- */
function insightsScreen() {
  const lib = state.lib;
  if (!lib.entries.length) return `<div class="empty" style="padding-top:28px">Insights come from your diary dates, and this diary has none yet.</div>`;
  const ys = diaryYears(lib);
  if (state.insYear !== "all" && !ys.includes(state.insYear)) state.insYear = "all";
  const picker = `<div class="toggles yearpick">${["all", ...[...ys].reverse()].map((y) =>
    `<button class="toggle" type="button" data-insyear="${y}" aria-pressed="${y === state.insYear}">${y === "all" ? "All years" : y}</button>`).join("")}</div>`;
  if (state.insYear !== "all") return picker + mYearInsights(state.insYear);
  return picker + mAllInsights();
}
function mAllInsights() {
  const lib = state.lib;
  const I = computeInsights(lib, metaOf, state.crowd || defaultCrowd(lib, metaOf));
  const first = lib.entries[0].date, last = lib.entries[lib.entries.length - 1].date;
  const intro = `<p class="status" style="margin:16px 0 0">Patterns across ${dlink(D.entries("Your diary", entriesSub(lib.entries), lib.entries), plural(I.years.length, "year"))} of diary, ${fmtDate(first)} to ${fmtDate(last)}.</p>`;
  return intro + mGlance(I.glance, "At a glance") + mYears(I) + mTastes(I) + mGenres(I) + mPeople(I) + mCrowd(I) + mReviewInsights(lib, null) + mHabits(I.habits, "Habits");
}
const twoYears = (what) => `<div class="empty">${what} need diary entries from at least two years, with five or more films in each.</div>`;
const go = '<span class="go" aria-hidden="true"> ›</span>';
// a sentence that opens the data it describes
const mLines = (lines, mark) => lines.map((l) => `<div class="tline"><span class="mk ${l.dir || ""}" aria-hidden="true">${mark(l)}</span><span>${dline(l.to, esc(l.text))}</span></div>`).join("");
// a poster that opens its film
const mPosters = (items, cap) => `<div class="pgrid">${items.map((x) => `<button class="pitem" type="button" ${dl(D.film(x.f))}>${poster(x.f)}${cap(x)}</button>`).join("")}</div>`;

function mGlance(glance, title) {
  if (!glance.length) return "";
  return sh(title) + `<div class="icards">${glance.map((g) => { const inner = `<span class="k">${esc(g.k)}</span><span class="big">${esc(g.big)}</span><span class="p">${esc(g.text)}${g.to ? go : ""}</span>`;
    return g.to ? `<button class="icard" type="button" ${dl(g.to)}>${inner}</button>` : `<div class="icard">${inner}</div>`; }).join("")}</div>`;
}

function mYears(I) {
  if (I.years.length < 2) return sh("Year by year") + twoYears("Year-by-year trends");
  const mult = (title, what, value, tip, extra) => `<div class="mult"><p class="mt">${title}</p>${colChart(I.years.map((p) => ({ a: Math.max(0, value(p) || 0), b: extra ? extra(p) : 0, label: `’${p.year.slice(2)}`, tip: tip(p), to: p.entries ? yearDrill(p, what) : null })), title + " by year", "", 64)}</div>`;
  const anyPace = I.years.some((p) => p.pace && p.pace > p.films);
  const legend = anyPace ? `<div class="legend" style="margin-top:2px"><span><i style="background:var(--green-mark)"></i>Watched</span><span><i style="background:var(--blue-mark)"></i>Rest of this year at your pace</span></div>` : "";
  const rows = [...I.years].reverse().map((p) => { const cell = (what, v) => v == null ? "—" : dlink(yearDrill(p, what), v);
    return `<tr><td>${cell("entries", p.year)}</td><td class="n">${cell("films", fmtN(p.films))}${p.pace ? ` <span class="dim">→${fmtN(p.pace)}</span>` : ""}</td><td class="n">${cell("hours", fmtN(Math.round(p.hours)))}</td>
    <td class="n">${cell("rating", p.avgRating ? p.avgRating.toFixed(2) : null)}</td><td class="n">${cell("nonEnglish", p.nonEnglish != null ? p.nonEnglish + "%" : null)}</td>
    <td>${p.topGenre ? dlink(D.films(`${p.topGenre[0]} in ${p.year}`, filmsSub(p.F.filter(hasGenre(p.topGenre[0]))), p.F.filter(hasGenre(p.topGenre[0])), { scope: p.year }), esc(p.topGenre[0])) : "—"}</td>
    <td>${p.topDirector && p.topDirector[1] > 1 ? dlink(personDrill(state.lib, p.topDirector[0], "d", p.F), esc(p.topDirector[0])) : "—"}</td></tr>`; }).join("");
  return sh("Year by year") + legend + `<div class="mults">
    ${mult("Films", "films", (p) => p.films, (p) => `${p.year}: ${plural(p.films, "film")}${p.pace ? `, on pace for about ${fmtN(p.pace)}` : ""}`, (p) => p.pace && p.pace > p.films ? p.pace - p.films : 0)}
    ${mult("Hours", "hours", (p) => Math.round(p.hours), (p) => `${p.year}: ${fmtN(Math.round(p.hours))} hours`)}
    ${mult("Average rating", "rating", (p) => p.avgRating, (p) => `${p.year}: ${p.avgRating ? starsNum(p.avgRating) : "no ratings"}`)}
    ${mult("Film age when watched", "age", (p) => p.age, (p) => `${p.year}: ${p.age != null ? Math.round(p.age) + " years old on average" : "—"}`)}
    ${mult("Not in English (%)", "nonEnglish", (p) => p.nonEnglish, (p) => `${p.year}: ${p.nonEnglish != null ? p.nonEnglish + "%" : "not enough details"}`)}
    ${mult("Rewatches (%)", "rewatches", (p) => pctOf(p.rewatches, p.entries), (p) => `${p.year}: ${pctOf(p.rewatches, p.entries)}% of entries`)}</div>
    <div class="tscroll"><table class="mtable"><thead><tr><th>Year</th><th class="n">Films</th><th class="n">Hours</th><th class="n">Avg</th><th class="n">Not Eng.</th><th>Top genre</th><th>Top director</th></tr></thead><tbody>${rows}</tbody></table></div><p class="status">Tap any number to see what's behind it.</p>`;
}

function mTastes(I) {
  if (!I.tastes.table) return sh("Changing tastes") + twoYears("Changes in taste");
  const lines = I.tastes.lines.length ? mLines(I.tastes.lines, (l) => l.dir === "up" ? "▲" : "▼")
    : `<p style="margin:0">Your taste has held steady between your earliest and latest years.</p>`;
  const t = I.tastes.table;
  const heat = `<div class="tscroll"><table class="mtable heat"><thead><tr><th>Genre</th>${t.years.map((y) => `<th class="n">’${y.year.slice(2)}</th>`).join("")}</tr></thead>
    <tbody>${t.genres.map((g, gi) => `<tr><td>${dlink(catDrill(state.lib, g, "g"), esc(g))}</td>${t.years.map((y) => { const v = y.shares[gi], fs = y.p.F.filter(hasGenre(g));
      return `<td class="n" style="background:color-mix(in srgb, var(--green-mark) ${v == null ? 0 : Math.min(65, v * 1.5)}%, transparent)">${v == null ? "—" : dlink(fs.length && D.films(`${g} in ${y.year}`, filmsSub(fs, `${v}% of the year's films`), fs, { scope: y.year }), v)}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="status">Percent of each year's films in the genre. Tap one to see those films.</p>`;
  return sh("Changing tastes") + lines + heat;
}

function mGenres(I) {
  if (!I.genres.length) return sh("Genres") + needMeta();
  const max = Math.max(0.5, ...I.genres.map((g) => Math.abs(g.vsCrowd || 0)), ...I.genres.map((g) => Math.abs(g.vsMe)));
  const bar = (d) => d == null ? `<span class="dim">—</span>` : `<span class="dbar" aria-hidden="true"><span class="mid"></span><span class="fill ${d >= 0 ? "pos" : "neg"}" style="width:${Math.min(50, Math.abs(d) / max * 50).toFixed(1)}%"></span></span>`;
  const lines = mLines(I.genreLines, () => "●");
  const rows = I.genres.map((g) => `<button class="grow" type="button" data-list="${reg(g.name, `${plural(g.count, "film")} · ${g.mine.toFixed(2)} average`, g.films)}">
    <span style="min-width:0"><span class="nm">${esc(g.name)}</span><span class="sub">${plural(g.count, "film")} · ★ ${g.mine.toFixed(2)}</span></span>
    <span class="gcol">${bar(g.vsMe)}<span class="v">${signed(g.vsMe)}</span></span><span class="gcol">${bar(g.vsCrowd)}<span class="v">${g.vsCrowd == null ? "" : signed(g.vsCrowd)}</span></span>${CHEV}</button>`).join("");
  return sh("Genres") + lines + `<div class="ghead"><span></span><span>vs your avg</span><span>vs ${esc(I.crowd.short)}</span><span></span></div>${rows}
    <div class="legend" style="margin-top:8px"><span><i style="background:var(--green-mark)"></i>Higher</span><span><i style="background:var(--blue-mark)"></i>Lower</span><span>in stars</span></div>`;
}

function mPeople(I) {
  const P = I.people;
  const row = (p, i, value, sub, to) => `<button class="prow" type="button" data-list="${to ? drill(to) : reg(p.name, sub(p), p.films, p)}">
    <span class="rk">${i + 1}</span>${avatar(p, "md")}<span style="min-width:0"><span class="nm" style="display:block">${esc(p.name)}</span><span class="sub">${esc(sub(p))}</span></span>
    <span class="val">${value}</span>${CHEV}</button>`;
  const obs = [...P.obsDirectors.map((p) => ({ ...p, role: "Director" })), ...P.obsActors.map((p) => ({ ...p, role: "Actor" }))].sort((a, b) => b.inLatest - a.inLatest).slice(0, 6);
  const comp = [...P.compDirectors.map((p) => ({ ...p, role: "Director" })), ...P.compActors.map((p) => ({ ...p, role: "Actor" }))].sort((a, b) => b.years.size - a.years.size || b.count - a.count).slice(0, 6);
  if (!obs.length && !comp.length && !P.binges.length) return sh("People") + `<div class="empty">People trends need cast &amp; crew details and a few years of diary.</div>`;
  let html = "";
  if (obs.length) html += sh(`New in ${I.latest}`) + obs.map((p, i) => row(p, i, `${p.inLatest}`, (q) => `${q.role} · ${plural(q.inLatest, "film")} in ${I.latest}, none before`)).join("");
  if (comp.length) html += sh("Long-time companions") + comp.map((p, i) => row(p, i, `${p.years.size}y`, (q) => `${q.role} · ${plural(q.years.size, "year")} of your diary`)).join("");
  if (P.binges.length) html += sh("Director binges") + P.binges.map((p, i) => row(p, i, `${p.binge.n}`, (q) => `${q.binge.n} films, ${fmtDate(q.binge.from)} – ${fmtDate(q.binge.to)}`,
    D.entries(`${p.name} binge`, `${p.binge.n} films, ${fmtDate(p.binge.from)} – ${fmtDate(p.binge.to)}`, p.binge.entries, { order: "asc", person: p }))).join("");
  if (P.discoveries.length >= 2) html += sh("Directors discovered each year") +
    colChart(P.discoveries.map((d) => ({ a: d.count, b: 0, label: `’${d.year.slice(2)}`, tip: `${d.year}: ${plural(d.count, "new director")}`,
      to: d.count && D.names(`Directors new in ${d.year}`, plural(d.count, "director"), d.people, { faces: true }) })), "New directors by year", "", 64);
  return html;
}

function mCrowd(I) {
  const C = I.crowd;
  const toggles = `<div class="toggles">${Object.entries(CROWDS).map(([k, c]) => (C.available[k] || 0) >= 5 || k === C.key
    ? `<button class="toggle" type="button" data-crowdsel="${k}" aria-pressed="${k === C.key}">${c.short}</button>` : "").join("")}</div>`;
  if (C.n < 5) {
    const why = IN_VIEWER ? `Crowd scores come from TMDB and OMDb, which pages inside Claude can't reach. Open <a href="https://sjnift.github.io/credits-roll/" target="_blank" rel="noopener">the web version</a>.`
      : C.key === "tmdb" ? "Crowd scores come with TMDB details. Look your films up in the Import tab."
      : C.key === "letterboxd" ? "Letterboxd averages need an Apify token, added in the Import tab." : "IMDb and critics' scores need a free OMDb key, added in the Import tab.";
    return sh("Against the crowd") + toggles + `<div class="empty">${why}</div>`;
  }
  const cap = (p) => `<span class="pmeta"><span class="stars">${stars(p.you)}</span></span><span class="mdate">${C.short} ${crowdScore(C.key, p.crowd)} · <b class="dv">${signed(p.diff)}★</b></span>`;
  let html = sh("Against the crowd") + toggles + `<p class="lead">You give ${Math.abs(C.meanDiff).toFixed(2)}★ ${C.meanDiff >= 0 ? "more" : "less"} than ${esc(C.label)} on average${followText(C.r)}, across ${dlink(C.to, plural(C.n, "film"))}.</p>`;
  html += sh(`Liked more than ${esc(C.short)}`) + (C.higher.length ? mPosters(C.higher, cap) : `<div class="empty">No film you rated ¾★ or more above them.</div>`);
  html += sh(`Liked less than ${esc(C.short)}`) + (C.lower.length ? mPosters(C.lower, cap) : `<div class="empty">No film you rated ¾★ or more below them.</div>`);
  if (C.gems.length) html += sh("Hidden gems") + `<p class="status" style="margin:-2px 0 10px">Rated 4½★ or more by you, and by few others.</p>` +
    mPosters(C.gems, (g) => `<span class="pmeta"><span class="stars">${stars(g.f.rating)}</span></span><span class="mdate">${fmtN(g.pop.n)} ${g.pop.src} votes</span>`);
  return html;
}

function mHabits(habits, title) {
  if (!habits.length) return "";
  return sh(title) + `<div class="facts" style="margin-top:0">${habits.map((h) => { const inner = `<span class="k">${esc(h.k)}</span><span class="v">${esc(h.v)}</span><span class="t">${esc(h.text)}${h.to ? go : ""}</span>`;
    return h.to ? `<button class="fact" type="button" ${dl(h.to)}>${inner}</button>` : `<div class="fact">${inner}</div>`; }).join("")}</div>`;
}

/* ----- one year ----- */
function mYearInsights(Y) {
  const lib = state.lib;
  const R = computeYearInsights(lib, metaOf, Y, state.crowd || defaultCrowd(lib, metaOf));
  const prevY = String(+Y - 1), first = R.firstYear === Y;
  let h = `<p class="status" style="margin:14px 0 0">${dlink(DR.films(R.S), plural(R.S.films.length, "film"))} and ${dlink(DR.diary(R.S), plural(R.S.entries.length, "diary entry", "diary entries"))} in ${esc(Y)}.</p>`;
  h += mGlance(R.glance, `${esc(Y)} at a glance`);
  h += sh(`Against ${prevY}`) + (R.changes.length ? `<div class="tscroll" style="margin-top:0"><table class="mtable"><thead><tr><th></th><th class="n">${esc(Y)}</th><th class="n">${prevY}</th><th class="n"></th></tr></thead>
    <tbody>${R.changes.map((c) => `<tr><td>${dlink(c.to, c.label)}</td><td class="n">${dlink(c.to.groups[0], c.now)}</td><td class="n">${dlink(c.to.groups[1], c.before)}</td><td class="n dim">${Math.abs(c.d) < 1e-9 ? "=" : c.d > 0 ? "▲" : "▼"}</td></tr>`).join("")}</tbody></table></div><p class="status">Tap any number to see what's behind it.</p>` +
    mLines(R.genreLines, (l) => l.dir === "up" ? "▲" : "▼")
    : `<div class="empty">No diary entries in ${prevY} to compare with.</div>`);
  const months = MONTHS.map((m, i) => {
    const key = `${Y}-${String(i + 1).padStart(2, "0")}`, es = R.S.entries.filter((e) => e.date.startsWith(key)), b = es.filter((e) => e.rewatch).length;
    return { a: es.length - b, b, label: m[0], tip: `${MONTHS_LONG[i]}: ${plural(es.length, "film")}`, to: es.length && DR.month(R.S.entries, key) };
  });
  h += sh("Month by month") + colChart(months, `Films each month of ${Y}`, "", 80);
  const cap = (x) => `<span class="pmeta"><span class="stars">${stars(x.r)}</span>${x.f.liked ? '<span class="heart">♥</span>' : ""}</span>`;
  if (R.best.length) h += sh(`Best of ${esc(Y)}`) + mPosters(R.best, cap);
  if (R.worst.length) h += sh("Lowest rated") + mPosters(R.worst, cap);
  const prow = (items, sub) => items.map((p, i) => `<button class="prow" type="button" data-list="${reg(p.name, filmsTitle(p), p.films, p)}"><span class="rk">${i + 1}</span>${avatar(p, "md")}
    <span style="min-width:0"><span class="nm" style="display:block">${esc(p.name)}</span><span class="sub">${sub}</span></span><span class="val">${p.count}</span>${CHEV}</button>`).join("");
  if (R.topDirectors.length) h += sh(`Directors of ${esc(Y)}`) + prow(R.topDirectors.slice(0, 5), `films in ${esc(Y)}`);
  if (R.topActors.length) h += sh(`Actors of ${esc(Y)}`) + prow(R.topActors.slice(0, 5), `films in ${esc(Y)}`);
  if (!first && R.discDirectors.length) h += sh(`New directors in ${esc(Y)}`) + prow(R.discDirectors.slice(0, 5), "first time in your diary");
  const newOnes = (label, list, field) => list.length ? `${label}: ${list.map((v) => { const fs = R.S.films.filter((f) => { const m = metaOf(f); return m && (field === "l" ? m.l === v : m[field].includes(v)); });
    return dlink(D.films(`${v} in ${Y}`, filmsSub(fs), fs, { scope: Y }), esc(v)); }).join(", ")}.` : "";
  if (!first && (R.newCountries.length || R.newLangs.length)) h += `<p class="lead">${newOnes("New countries", R.newCountries, "k")} ${newOnes("New languages", R.newLangs, "l")}</p>`;
  const C = R.crowd;
  if (C.n >= 3) {
    const ccap = (p) => `<span class="pmeta"><span class="stars">${stars(p.you)}</span></span><span class="mdate">${C.short} ${crowdScore(C.key, p.crowd)} · <b class="dv">${signed(p.diff)}★</b></span>`;
    const cg = (items) => items.length ? mPosters(items, ccap) : `<div class="empty">None.</div>`;
    const crowdTo = crowdDrill(R.rated.map((x) => x.f), C.key, `${Y} against ${C.label}`, R.ratingAt);
    h += sh(`You vs ${esc(C.short)} in ${esc(Y)}`) + `<p class="lead">You gave ${Math.abs(C.meanDiff).toFixed(2)}★ ${C.meanDiff >= 0 ? "more" : "less"} than ${esc(C.label)} on average, across ${dlink(crowdTo, plural(C.n, "film"))}.</p>` +
      `<p class="status" style="margin:10px 0 6px">You liked more</p>` + cg(C.higher) + `<p class="status" style="margin:14px 0 6px">You liked less</p>` + cg(C.lower);
  }
  h += mReviewInsights(lib, Y);
  h += mHabits(R.habits, `Habits in ${esc(Y)}`);
  return h;
}
</script>
<script>
/* ---------- phone: the Compare screen, pushed from Profile ---------- */
function compareScreen() {
  const profiles = comparePeople().map((p) => tasteProfile(p, metaOf));
  const friends = profiles.slice(1);
  if (state.cmp === "all" ? friends.length < 2 : !friends.some((f) => f.id === state.cmp)) state.cmp = friends.length ? friends[0].id : null;
  const ex = state.mode === "example";
  const sel = friends.find((f) => f.id === state.cmp);
  const toggles = friends.length ? `<div class="toggles" style="flex-wrap:wrap">${friends.map((f) =>
    `<button class="toggle" type="button" data-cmp="${f.id}" aria-pressed="${state.cmp === f.id}">${esc(f.name)}</button>`).join("")}
    ${friends.length >= 2 ? `<button class="toggle" type="button" data-cmp="all" aria-pressed="${state.cmp === "all"}">Everyone</button>` : ""}</div>` : "";
  const note = ex ? (MY_LIB ? "These are made-up example friends. Switch back to your diary in the Import tab to compare with real ones." : "These are made-up example friends. Import your own export first, then add friends' exports here.")
    : friends.length ? "Friends' exports stay in this browser." : "Ask a friend for their Letterboxd export (Settings → Data → Export your data), then add the ZIP here. Add as many friends as you like. Their exports stay in this browser.";
  const remove = sel && !sel.example ? `<button class="linkish" type="button" data-unfriend="${sel.id}">${state.unfriend === sel.id ? `Tap again to remove ${esc(sel.name)}` : `Remove ${esc(sel.name)}`}</button>` : "";
  const head = `${toggles}<p class="status" style="margin:12px 0 0">${note} ${remove}</p>
    ${ex ? "" : `<button class="btn block" type="button" data-act="add-friend" style="margin-top:12px"${MY_LIB ? "" : " disabled"}>Add a friend's export</button>`}
    ${state.cmpError ? `<p class="status err" role="alert">${esc(state.cmpError)}</p>` : ""}
    ${friendsSaveFailed ? `<p class="status err">This browser wouldn't save your friends' exports.</p>` : ""}`;
  if (state.cmp === "all") return head + mGroup(profiles);
  if (sel) return head + mPair(comparePair(profiles[0], sel, metaOf));
  return head;
}

const mFilms = (items, empty, cap, card) => items.length ? `<div class="pgrid">${items.map((x) => `<button class="pitem" type="button" ${dl(card(x.f))}>${poster(x.f)}${cap(x)}</button>`).join("")}</div>` : `<div class="empty">${empty}</div>`;
const twoStars = (B) => (x) => `<span class="mdate">You <span class="stars">${stars(x.a)}</span></span><span class="mdate">${esc(B.name)} <span class="stars">${stars(x.b)}</span></span>`;

function mPair(C) {
  const { A, B, match, to } = C;
  let h = sh(`You and ${esc(B.name)}`);
  h += match.score != null ? `<button class="icard" type="button" ${dl(to.rated)}><span class="k">Taste match</span><span class="big">${match.score}/100 · ${matchWords(match.score)}</span>
      <span class="p">From how close your ratings are on the ${plural(match.n, "film")} you've both rated.${go}</span></button>`
    : `<div class="empty">A taste match needs five or more films you've both rated. You have ${dlink(match.n && to.rated, match.n)}.</div>`;
  h += mLines(C.lines, () => "●");
  const o = C.overlap, tot = o.onlyA + o.both + o.onlyB || 1;
  const seg = (cls, n, d) => n ? `<span class="${cls}" role="button" tabindex="0" ${dl(d)} style="flex:${n / tot}"></span>` : "";
  h += sh("Overlap") + `<div class="venn" aria-label="${o.onlyA} only you, ${o.both} both, ${o.onlyB} only ${esc(B.name)}">
      ${seg("va", o.onlyA, to.onlyA)}${seg("vboth", o.both, to.shared)}${seg("vb", o.onlyB, to.onlyB)}</div>
    <div class="legend" style="margin-top:8px;flex-wrap:wrap"><span><i style="background:var(--green-mark)"></i>Only you ${dlink(o.onlyA && to.onlyA, fmtN(o.onlyA))}</span><span><i style="background:var(--muted)"></i>Both ${dlink(o.both && to.shared, fmtN(o.both))}</span><span><i style="background:var(--blue-mark)"></i>Only ${esc(B.name)} ${dlink(o.onlyB && to.onlyB, fmtN(o.onlyB))}</span></div>`;
  h += sh("You both loved") + mFilms(C.bothLoved, "No film you both rated 4½★ or more.", twoStars(B), to.card);
  h += sh("You rated higher") + mFilms(C.aHigher, `Nothing you rated 1½★ or more above ${esc(B.name)}.`, twoStars(B), to.card);
  h += sh(`${esc(B.name)} rated higher`) + mFilms(C.bHigher, `Nothing ${esc(B.name)} rated 1½★ or more above you.`, twoStars(B), to.card);
  h += `<p class="status" style="margin:12px 0 0">${dlink(to.apart, "Every film you've both rated, furthest apart first")}</p>`;
  h += mBothReviewed(A, B, to.card);
  if (A.rated.length && B.rated.length) {
    const mx = Math.max(1, ...A.spread, ...B.spread);
    h += sh("Rating style") + `<div class="legend" style="flex-wrap:wrap"><span><i style="background:var(--green-mark)"></i>You · ${A.avg.toFixed(2)} avg</span><span><i style="background:var(--blue-mark)"></i>${esc(B.name)} · ${B.avg.toFixed(2)} avg</span></div>
      <div class="phist" role="group" aria-label="Share of each person's ratings at each half-star">${A.spread.map((a, i) => `<button class="pgroup" type="button" ${a || B.spread[i] ? dl(to.stars((i + 1) / 2)) : "disabled"} aria-label="${stars((i + 1) / 2)}: you ${Math.round(a)}%, ${esc(B.name)} ${Math.round(B.spread[i])}%">
        <span class="pa" style="height:${(a / mx * 100).toFixed(1)}%"></span><span class="pb" style="height:${(B.spread[i] / mx * 100).toFixed(1)}%"></span></button>`).join("")}</div>
      <div class="hist-ends"><span class="stars">½</span><span class="stars">★★★★★</span></div>`;
  }
  if (C.topGenres.length) {
    const gmax = Math.max(1, ...C.topGenres.map((g) => Math.max(g.a, g.b)));
    h += sh("Genres") + C.topGenres.map((g) => `<button class="gpair" type="button" ${dl(to.genre(g.g))}><span class="gname">${esc(g.g)}</span><span class="gbars"><span class="ga" style="width:${(g.a / gmax * 100).toFixed(1)}%"></span><span class="gb" style="width:${(g.b / gmax * 100).toFixed(1)}%"></span></span>
      <span class="gv">${Math.round(g.a)}·${Math.round(g.b)}%</span></button>`).join("");
  }
  const rows = (items, val, toOf) => items.map((x) => `<button class="kv" type="button" ${dl(toOf(x))}><span>${esc(x.name || x[0])}</span><span>${val(x)}</span></button>`).join("");
  if (C.directors.shared.length) h += sh("Directors you both watch") + rows(C.directors.shared, (x) => `you ${x.a} · ${esc(B.name)} ${x.b}`, (x) => to.person(x.name, "d"));
  if (C.actors.shared.length) h += sh("Actors you both watch") + rows(C.actors.shared, (x) => `you ${x.a} · ${esc(B.name)} ${x.b}`, (x) => to.person(x.name, "c"));
  const recCap = (who) => (x) => `<span class="pmeta"><span class="stars">${stars(x.f.rating)}</span></span><span class="mdate">${who}${x.onWatchlist ? " · on your watchlist" : ""}</span>`;
  h += sh(`For you, from ${esc(B.name)}`) + mFilms(C.forA, `Nothing ${esc(B.name)} rated 4★ or more that you haven't seen.`, recCap(esc(B.name)), to.card);
  h += sh(`For ${esc(B.name)}, from you`) + mFilms(C.forB, `Nothing you rated 4★ or more that ${esc(B.name)} hasn't seen.`, recCap("You"), to.card);
  h += sh("Watch together") + (C.together.length ? C.together.map((w) => `<a class="kv" href="${esc(lbUrl(w))}" target="_blank" rel="noopener"><span>${esc(w.name)}</span><span>${w.year || ""} ↗</span></a>`).join("") : `<div class="empty">No film is on both of your watchlists.</div>`);
  h += sh("Habits") + `<div class="tscroll" style="margin-top:0"><table class="mtable"><thead><tr><th></th><th class="n">You</th><th class="n">${esc(B.name)}</th></tr></thead><tbody>${habitRows(C).map(([k, a, b]) =>
    `<tr><td>${k}</td><td class="n">${a}</td><td class="n">${b}</td></tr>`).join("")}</tbody></table></div><p class="status">Tap any number to see what's behind it.</p>`;
  return h;
}

function mGroup(profiles) {
  const G = compareGroup(profiles);
  const pairs = [];
  profiles.forEach((P, i) => profiles.forEach((Q, j) => { if (j > i && G.matrix[i][j] && G.matrix[i][j].score != null) pairs.push({ a: P.name, b: Q.name, s: G.matrix[i][j].score, to: G.pairTo(i, j) }); }));
  pairs.sort((x, y) => y.s - x.s);
  let h = sh("Taste matrix");
  if (pairs.length) h += mLines([{ text: `Closest: ${pairs[0].a} and ${pairs[0].b}, ${pairs[0].s}/100.`, to: pairs[0].to },
    pairs.length > 1 && { text: `Furthest apart: ${pairs[pairs.length - 1].a} and ${pairs[pairs.length - 1].b}, ${pairs[pairs.length - 1].s}/100.`, to: pairs[pairs.length - 1].to }].filter(Boolean), () => "●");
  h += `<div class="tscroll"><table class="mtable heat"><thead><tr><th></th>${profiles.map((p) => `<th class="n">${esc(p.name)}</th>`).join("")}</tr></thead><tbody>
    ${profiles.map((P, i) => `<tr><td>${esc(P.name)}</td>${profiles.map((_, j) => { const m = G.matrix[i][j];
      return m && m.score != null ? `<td class="n" style="background:color-mix(in srgb, var(--green-mark) ${Math.round(m.score * 0.65)}%, transparent)">${dlink(G.pairTo(i, j), m.score)}</td>` : `<td class="n dim">${m ? "—" : ""}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="status">${dlink(G.everyone && G.everyoneTo, plural(G.everyone, "film"))} everyone has seen.</p>`;
  const all = (x) => x.by.map((b) => `<span class="mdate">${esc(b.name)} <span class="stars">${stars(b.r)}</span></span>`).join("");
  h += sh("Everyone loved") + mFilms(G.loved, "No film yet that three or more of you all rated 4★ or more.", all, G.card);
  h += sh("Most divisive") + mFilms(G.divisive, "Nothing has split the group yet.", all, G.card);
  const pickName = (p) => p.f ? dlink(G.card(p.f), `<b>${esc(p.name)}</b>`) : `<a href="${esc(lbUrl(p))}" target="_blank" rel="noopener"><b>${esc(p.name)}</b></a>`;
  h += sh("Movie night") + (G.picks.length ? G.picks.map((p) => `<div class="tline"><span class="mk">●</span><span>${pickName(p)} <span class="dim">${p.year || ""}</span>. ${esc(p.why)}.</span></div>`).join("") : `<div class="empty">No pick yet.</div>`);
  return h;
}
</script>
<script>
/* ---------- phone: reviews, review insights and side-by-side reviews ---------- */
const mReimport = () => `<div class="card notice"><p class="title">Your reviews aren't in yet.</p>
  <p>The copy of your export saved here was made before review text was kept. Import your Letterboxd export again to bring your reviews in, formatting and all.</p>
  <button class="btn green block" type="button" data-act="import">Import export</button></div>`;

function mReviewItem(r) {
  const long = r.words > 60;
  return `<div class="mrev"><button class="mrev-head" type="button" ${dl(D.film(r.film))}>${poster(r.film)}<span style="min-width:0"><span class="t" style="display:block">${esc(r.film.name)} <span>${r.film.year || ""}</span></span>
    <span class="m"><span class="stars">${stars(r.rating)}</span>${r.film.liked ? '<span class="heart">♥</span>' : ""}${r.rewatch ? '<span class="rewatch">↻</span>' : ""}<span class="dim">${r.date ? fmtDate(r.date) : ""}</span></span></span></button>
    <div class="rv-text${long ? " clamp" : ""}">${r.html}</div>${long ? `<button class="linkish" type="button" data-expand>More</button>` : ""}</div>`;
}
function mReviewList(year) {
  const q = (state.reviewQuery || "").trim().toLowerCase();
  const all = reviewsIn(state.lib, year);
  const list = q ? all.filter((r) => r.text.toLowerCase().includes(q) || r.film.name.toLowerCase().includes(q)) : all;
  const shown = list.slice(0, state.reviewLimit);
  return `<p class="status" style="margin:10px 0 0">${q ? `${plural(list.length, "review")} match` : plural(all.length, "review")}</p>` +
    (shown.length ? shown.map(mReviewItem).join("") : `<div class="empty">No review matches that search.</div>`) +
    (list.length > shown.length ? `<button class="row" type="button" data-more-reviews><span>Show more</span><span class="count">${fmtN(list.length - shown.length)} more</span>${CHEV}</button>` : "");
}
function reviewsScreen() {
  const lib = state.lib, year = state.scope === "all" ? null : state.scope;
  if (lib.reviewTextMissing) return mReimport();
  if (!reviewsIn(lib, year).length) return `<div class="empty" style="padding-top:28px">No written reviews ${year ? `in ${year}` : "yet"}.</div>`;
  return `<label class="sr-only" for="review-search">Search your reviews</label>
    <input class="key" id="review-search" type="search" autocomplete="off" placeholder="Search reviews" value="${esc(state.reviewQuery || "")}" style="margin-top:14px;font-family:var(--sans)">
    ${year ? `<p class="status" style="margin:8px 0 0">Showing ${year}. Pick another year on Profile.</p>` : ""}
    <div id="review-list">${mReviewList(year)}</div>`;
}
function refreshReviewList() {
  const el = $("#review-list");
  if (el) el.innerHTML = mReviewList(state.scope === "all" ? null : state.scope);
}

function mReviewInsights(lib, Y) {
  if (lib.reviewTextMissing) return sh(Y ? `Reviews in ${esc(Y)}` : "Your reviews") + mReimport();
  const RI = computeReviewInsights(lib, Y);
  if (!RI) return "";
  let h = sh(Y ? `Reviews in ${esc(Y)}` : "Your reviews") + mLines(RI.lines, () => "●");
  if (RI.top.length) {
    const maxN = RI.top[0][1];
    h += `<p class="status" style="margin:12px 0 6px">Words you use most</p><div class="wordcloud">${RI.top.map(([w, n]) => `<button class="w" type="button" ${dl(RI.wordTo(w))} style="font-size:${(12 + 11 * n / maxN).toFixed(1)}px">${esc(w)}</button>`).join("")}</div>`;
  }
  const chips = (ws, to) => ws.length ? `<div class="wchips">${ws.map((w) => `<button type="button" ${dl(to(w))}>${esc(w)}</button>`).join("")}</div>` : `<p class="status">Not enough reviews yet.</p>`;
  if (RI.love.length || RI.cold.length) h += `<p class="status" style="margin:14px 0 6px">When you love a film</p>${chips(RI.love, RI.loveTo)}<p class="status" style="margin:12px 0 6px">When you don't</p>${chips(RI.cold, RI.coldTo)}`;
  if (RI.perYear.length >= 2) h += `<p class="status" style="margin:14px 0 6px">Reviews each year</p>` + colChart(RI.perYear.map((p) => ({ a: p.count, b: 0, label: `’${p.year.slice(2)}`, tip: `${p.year}: ${plural(p.count, "review")}`, to: p.to })), "Reviews written each year", "", 64);
  h += `<p class="status" style="margin:14px 0 0">Your longest review${Y ? ` of ${esc(Y)}` : ""}</p>` + mReviewItem(RI.longest);
  return h;
}

function mBothReviewed(A, B, card) {
  const both = bothReviewed(A, B).slice(0, 6);
  if (!both.length) return "";
  return sh("In your words") + both.map((x) => `<div class="mrev"><div class="t" style="color:var(--ink);font-weight:600">${dlink(card(x.f), esc(x.f.name))} <span class="dim">${x.f.year || ""}</span></div>
    <p class="m" style="margin:6px 0 2px">You <span class="stars">${stars(x.mine.rating)}</span></p><p class="rv-text" style="margin:0">${esc(excerpt(x.mine.text, 180))}</p>
    <p class="m" style="margin:8px 0 2px">${esc(B.name)} <span class="stars">${stars(x.theirs.rating)}</span></p><p class="rv-text" style="margin:0">${esc(excerpt(x.theirs.text, 180))}</p></div>`).join("");
}
</script>
<script>
/* ---------- phone: a tap opens the data behind it in a sheet; a long list can go on a screen of its own ---------- */
let SSTACK = [];
function paintSheet() {
  const sheet = $("#sheet"), d = SSTACK[SSTACK.length - 1];
  PANEL = new Map();
  const { html, hidden } = inPanel(() => drillBody(d, PANEL_CAP));
  const n = drillSize(d);
  const head = `<div class="sheet-grip" aria-hidden="true"></div><div class="sheet-head">
    ${SSTACK.length > 1 ? `<button class="nav-btn" type="button" data-sback>${BACK}<span class="sr-only">Back</span></button>` : "<span></span>"}
    <div class="sheet-title">${d.person && d.person.key ? avatar(d.person, "sm") : ""}<div style="min-width:0"><h2 id="sheet-title">${esc(d.title)}</h2>${d.sub ? `<p>${esc(d.sub)}</p>` : ""}</div></div>
    <button class="nav-btn done" type="button" data-sclose>Done</button></div>`;
  const foot = hidden ? `<div class="sheet-foot"><button class="btn green block" type="button" data-drillpage>See all ${fmtN(n)}</button></div>` : "";
  sheet.innerHTML = head + `<div class="sheet-body">${html}</div>` + foot;
  if (!sheet.open) { if (typeof sheet.showModal === "function") sheet.showModal(); else sheet.setAttribute("open", ""); }
  const body = sheet.querySelector(".sheet-body");
  if (body) body.scrollTop = 0;
}
// From a screen a drill opens the sheet; from inside the sheet it stacks, with Back.
function openSheet(d, inside) {
  if (!d) return;
  SSTACK = inside ? [...SSTACK, d] : [d];
  paintSheet();
}
// "See all" turns the sheet into a screen of its own, pushed like any other.
function sheetToPage() {
  const d = SSTACK[SSTACK.length - 1];
  $("#sheet").close();
  state.drillLimit = 200;
  push({ type: "drill", title: d.title, d });
}
function drillScreen(d) {
  const { html, hidden } = drillBody(d, state.drillLimit);
  return `<div class="dhead">${d.person && d.person.key ? avatar(d.person, "xl") : ""}<div class="name">${esc(d.title)}</div>${d.sub ? `<div class="sub">${esc(d.sub)}</div>` : ""}</div>
    <div class="drill-page">${html}</div>
    ${hidden ? `<button class="row" type="button" data-drillmore><span>Show more</span><span class="count">${fmtN(hidden)} more</span>${CHEV}</button>` : ""}`;
}
</script>
<script>
/* ---------- importing ---------- */
async function importFiles(files) {
  state.importError = "";
  try {
    const rows = await readExport(files);
    const saved = store.set(KEYS.rows, rows);
    MY_LIB = buildLibrary(rows);
    Object.assign(state, { mode: "mine", scope: "all", view: "profile", stack: [], peopleLimit: 50, diaryLimit: 60 });
    job.note = saved ? "" : "This browser wouldn't save your export, so you'll need to import it again next time.";
    job.err = !saved;
    state.importNote = importSummary(rows, MY_LIB);
    setTimeout(() => autoLookup(allFilmsLib()));
  } catch (e) {
    state.importError = (e && e.message) || "Couldn't read that file. Import the ZIP from Letterboxd → Settings → Data.";
    Object.assign(state, { view: "data", stack: [] });
  }
  saveView();
  render();
  window.scrollTo(0, 0);
}

/* ---------- taps ---------- */
let forgetTimer = null;
function act(t) {
  const a = t.dataset.act;
  if (a === "import") $("#file-input").click();
  else if (a === "insights") push({ type: "insights", title: "Insights" });
  else if (a === "compare") push({ type: "compare", title: "Compare" });
  else if (a === "reviews") { state.reviewLimit = 30; push({ type: "reviews", title: "Reviews" }); }
  else if (a === "add-friend") $("#friend-input").click();
  else if (a === "back") pop();
  else if (a === "people") { Object.assign(state, { view: "people", role: t.dataset.role || "c", stack: [], peopleLimit: 50 }); saveView(); render(); window.scrollTo(0, 0); }
  else if (a === "cat") push({ type: "cat", field: t.dataset.field, title: t.dataset.field[0].toUpperCase() + t.dataset.field.slice(1) });
  else if (a === "all-rated" || a === "liked") openSheet(a === "liked" ? DR.liked(STATS) : D.films("Highest rated", filmsSub(STATS.films.filter((f) => f.rating)), STATS.films.filter((f) => f.rating), { scope: STATS.scope }));
  else if (a === "more-people") { state.peopleLimit += 100; render(); }
  else if (a === "more-diary") { state.diaryLimit += 120; render(); }
  else if (a === "example" || a === "mine") { Object.assign(state, { mode: a === "example" ? "example" : "mine", scope: "all", view: "profile", stack: [] }); saveView(); render(); window.scrollTo(0, 0); }
  else if (a === "forget") {
    if (!state.forgetArmed) {
      state.forgetArmed = true; render();
      forgetTimer = setTimeout(() => { state.forgetArmed = false; if (state.view === "data") render(); }, 6000);
      return;
    }
    clearTimeout(forgetTimer); state.forgetArmed = false;
    if (job.running && job.ctl) job.ctl.abort();
    Object.values(KEYS).forEach((k) => store.del(k)); store.del(VIEW_KEY);
    META = {}; PHOTOS = {}; LBX = {}; FRIENDS = []; MY_LIB = null;
    Object.assign(state, { mode: "example", scope: "all", stack: [] });
    job.note = "Deleted your saved data from this browser."; job.err = false;
    render();
  }
  else if (a === "tmdb") startTmdb(MY_LIB);
  else if (a === "change-key") { editKey = true; renderLookup(); $("#tmdb-key")?.focus(); }
  else if (a === "omdb") startOmdb(MY_LIB);
  else if (a === "change-omdb") { editOmdb = true; renderLookup(); $("#omdb-key")?.focus(); }
  else if (a === "claude") runClaude(MY_LIB);
  else if (a === "claude-retry") retryClaudeMisses(MY_LIB);
  else if (a === "stop") job.ctl && job.ctl.abort();
}

function bind() {
  const friendInput = $("#friend-input");
  friendInput.addEventListener("change", async () => {
    const files = [...friendInput.files]; friendInput.value = "";
    if (!files.length) return;
    try {
      state.cmp = await addFriend(files);
      Object.assign(state, { cmpError: "", mode: "mine" });
      autoLookup(allFilmsLib());
    } catch (e) { state.cmpError = (e && e.message) || "Couldn't read that export."; }
    render();
  });
  const fileInput = $("#file-input");
  fileInput.addEventListener("change", () => { const files = [...fileInput.files]; fileInput.value = ""; if (files.length) importFiles(files); });
  document.addEventListener("input", (e) => {
    if (e.target.id !== "review-search") return;
    state.reviewQuery = e.target.value; state.reviewLimit = 30; refreshReviewList();
  });
  document.addEventListener("click", (e) => {
    const x = e.target.closest("[data-expand],[data-more-reviews]");
    if (x && x.hasAttribute("data-expand")) { const open = x.previousElementSibling.classList.toggle("clamp") === false; x.textContent = open ? "Less" : "More"; return; }
    if (x) { state.reviewLimit += 30; refreshReviewList(); }
  });
  // the sheet: Back, Done, a tap outside it, and "See all"
  const sheet = $("#sheet");
  sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.close(); });
  sheet.addEventListener("close", () => { SSTACK = []; PANEL = new Map(); });
  document.addEventListener("click", (e) => {
    const x = e.target.closest("[data-sback],[data-sclose],[data-drillpage],[data-drillmore]");
    if (!x) return;
    if (x.hasAttribute("data-sback")) { SSTACK.pop(); paintSheet(); }
    else if (x.hasAttribute("data-sclose")) sheet.close();
    else if (x.hasAttribute("data-drillpage")) sheetToPage();
    else { state.drillLimit += 200; render(); }
  });
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-insyear],[data-cmp],[data-unfriend],[data-lb],[data-crowdsel],[data-act],[data-view],[data-scope],[data-list],[data-role],[data-crew],[data-sort],[data-catsort]");
    if (!t) return;
    if (t.dataset.insyear) { state.insYear = t.dataset.insyear; render(); return; }
    if (t.dataset.cmp) { Object.assign(state, { cmp: t.dataset.cmp, unfriend: null }); render(); return; }
    if (t.dataset.unfriend) {
      if (state.unfriend === t.dataset.unfriend) { removeFriend(t.dataset.unfriend); state.unfriend = null; } else state.unfriend = t.dataset.unfriend;
      render(); return;
    }
    if (t.dataset.lb) { lbAction(t.dataset.lb, MY_LIB); return; }
    if (t.dataset.crowdsel) { state.crowd = t.dataset.crowdsel; render(); return; }
    if (t.dataset.act) return act(t);
    if (t.dataset.view) {
      const same = state.view === t.dataset.view && !state.stack.length;
      Object.assign(state, { view: t.dataset.view, stack: [], forgetArmed: false, importNote: "" });
      saveView(); render();
      if (!same) window.scrollTo(0, 0);
    }
    else if (t.dataset.scope) { Object.assign(state, { scope: t.dataset.scope, peopleLimit: 50, diaryLimit: 60 }); saveView(); render(); }
    else if (t.dataset.list) openSheet(drillGet(t.dataset.list), sheet.open && sheet.contains(t));
    else if (t.dataset.role) { Object.assign(state, { role: t.dataset.role, peopleLimit: 50 }); render(); }
    else if (t.dataset.crew) { state.crew = t.dataset.crew; render(); }
    else if (t.dataset.sort) { state.sort = t.dataset.sort; render(); }
    else if (t.dataset.catsort) { state.catSort = t.dataset.catsort; render(); }
  });

  // tooltips for chart marks; a tap shows one on a phone
  const tip = $("#tip");
  const place = (x, y) => {
    const r = tip.getBoundingClientRect();
    let left = x + 12, top = y - r.height - 14;
    if (left + r.width > innerWidth - 8) left = x - r.width - 12;
    if (top < 8) top = y + 20;
    tip.style.left = Math.max(8, left) + "px"; tip.style.top = top + "px";
  };
  document.addEventListener("pointerover", (e) => {
    const t = e.target.closest && e.target.closest("[data-tip]");
    if (!t) { tip.hidden = true; return; }
    tip.textContent = t.dataset.tip; tip.hidden = false; place(e.clientX, e.clientY);
  });
  document.addEventListener("pointermove", (e) => { if (!tip.hidden) place(e.clientX, e.clientY); });
  window.addEventListener("scroll", () => { tip.hidden = true; }, { passive: true });

  // a dropped export works too, for anyone using this on a computer
  const hasFiles = (e) => [...((e.dataTransfer && e.dataTransfer.types) || [])].includes("Files");
  window.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener("drop", (e) => { if (!hasFiles(e)) return; e.preventDefault(); const files = [...e.dataTransfer.files]; if (files.length) importFiles(files); });
}

function init() {
  const ex = buildExample();
  EXAMPLE_FRIENDS = buildExampleFriends().map((f) => ({ ...f, lib: buildLibrary(f.rows) }));
  loadFriends();
  EXAMPLE_META = Object.fromEntries(Object.entries(ex.meta).map(([k, m]) => [k, cleanMeta(m)]));
  EXAMPLE_LIB = buildLibrary(ex.rows);
  const saved = store.get(KEYS.rows, null);
  if (saved) { try { MY_LIB = buildLibrary(saved); } catch { MY_LIB = null; } }
  const view = store.get(VIEW_KEY, {});
  state.mode = MY_LIB && view.mode !== "example" ? "mine" : "example";
  if (view.scope) state.scope = view.scope;
  if (SCREENS[view.view]) state.view = view.view;
  bind();
  render();
  // A saved key picks up films not yet looked up, or matched before matching improved.
  if (MY_LIB) { autoLookup(allFilmsLib()); pollLetterboxd(MY_LIB); }
}
init();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});</script>
