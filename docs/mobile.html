<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Credits Roll Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a phone app in the style of the Letterboxd app. A sticky nav bar with year tabs,
   one scrolling screen per bottom tab, list rows with chevrons, and pushed detail screens.
   Dark only, like the app. On wide screens the app sits in a centred 480px column. */
:root {
  --bg: #14181C;
  --bar: #1B2128;
  --card: #202830;
  --card-2: #2C3440;
  --line: #2C3440;
  --ink: #FFFFFF;
  --ink-1: #DDE6EE;
  --ink-2: #99AABB;
  --muted: #6E8193;
  --green: #00E054;
  --green-mark: #00A83E;
  --blue: #40BCF4;
  --blue-mark: #2E95D3;
  --orange: #FF8000;
  --slate-mark: #62788D;
  --heat-1: #0E5C2C;
  --heat-2: #13873F;
  --heat-3: #2FC266;
  --danger: #FF7A7A;
  --frame: rgba(221, 238, 255, .2);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Roboto, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --navbar: 48px;
  --scopebar: 40px;
  --tabbar: 56px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { color: var(--ink-2); font-family: var(--sans); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
a { color: var(--blue); text-decoration: none; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 24px); }
@media (min-width: 520px) { .app { border-inline: 1px solid var(--line); } }
.screen {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- nav bar + year tabs ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); border-bottom: 1px solid var(--line); }
.nav {
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; height: var(--navbar);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.nav h1 { color: var(--ink); font-size: 17px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
.nav .left { justify-self: start; } .nav .right { justify-self: end; }
.nav-btn { background: none; border: 0; color: var(--green); font-size: 15px; font-weight: 500; padding: 8px 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
.nav-btn svg { width: 22px; height: 22px; }
.scopes {
  display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; height: var(--scopebar); align-items: stretch;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.scopes::-webkit-scrollbar { display: none; }
.scope {
  all: unset; flex: none; cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); border-bottom: 2px solid transparent; display: flex; align-items: center;
}
.scope[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--green); }
.scope:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.top.detail .scopes { display: none; }

/* ---------- common pieces ---------- */
.sh {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 26px 0 10px; padding-bottom: 7px;
  border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2);
}
.sh .more { all: unset; cursor: pointer; color: var(--ink-2); font-size: 12px; letter-spacing: .08em; }
.sh .more:hover { color: var(--ink); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: 0;
  border-radius: 6px; padding: 11px 16px; font-weight: 600; font-size: 15px; background: var(--card-2); color: var(--ink);
}
.btn.green { background: var(--green-mark); color: #fff; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.card { background: var(--card); border-radius: 8px; padding: 14px; display: grid; gap: 10px; }
.card p { margin: 0; }
.card .title { color: var(--ink); font-weight: 600; font-size: 15px; }
.status { font-size: 13.5px; color: var(--ink-2); }
.status.err { color: var(--danger); }
.linkish { all: unset; cursor: pointer; color: var(--blue); }
.linkish:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.stars { color: var(--green); letter-spacing: .02em; white-space: nowrap; }
.heart { color: var(--orange); }
.rewatch { color: var(--green); }
.chev { width: 16px; height: 16px; color: var(--muted); flex: none; }
.empty { color: var(--muted); padding: 16px 0; font-size: 14px; }
.meter { height: 4px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--green-mark); width: 0; transition: width .3s; }

/* ---------- profile ---------- */
.profile { display: grid; justify-items: center; gap: 6px; padding-top: 22px; text-align: center; }
.avatar {
  border-radius: 50%; background: var(--card-2); display: grid; place-items: center; overflow: hidden; position: relative;
  color: var(--ink-1); font-weight: 700; flex: none; box-shadow: inset 0 0 0 1px var(--frame);
}
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
.avatar.xl { width: 84px; height: 84px; font-size: 28px; }
.avatar.lg { width: 64px; height: 64px; font-size: 21px; }
.avatar.md { width: 44px; height: 44px; font-size: 15px; }
.profile .name { color: var(--ink); font-size: 20px; font-weight: 700; margin-top: 6px; }
.profile .handle { font-size: 13.5px; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--bg); background: var(--ink-2); border-radius: 3px; padding: 2px 6px; }
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 18px; border-block: 1px solid var(--line); }
.strip div { display: grid; justify-items: center; padding: 12px 2px; gap: 1px; min-width: 0; }
.strip div + div { border-left: 1px solid var(--line); }
.strip b { color: var(--ink); font-size: 19px; font-weight: 700; }
.strip span { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
.notice { margin-top: 16px; }

/* ---------- menu rows ---------- */
.menu { list-style: none; margin: 0; padding: 0; }
.row {
  all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: flex; align-items: center; gap: 12px;
  padding: 13px 0; border-bottom: 1px solid var(--line); color: var(--ink-1); font-size: 16px;
}
.row:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.row .count { margin-left: auto; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.row.danger { color: var(--danger); }

/* ---------- people ---------- */
.scroller { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; padding-bottom: 2px; }
.scroller::-webkit-scrollbar { display: none; }
.pcard { all: unset; cursor: pointer; flex: none; width: 74px; display: grid; justify-items: center; gap: 5px; text-align: center; }
.pcard .nm { color: var(--ink-1); font-size: 12px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pcard .ct { font-size: 11.5px; color: var(--ink-2); margin-top: -3px; }
.segctl { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--card); border-radius: 8px; padding: 2px; gap: 2px; margin-top: 14px; }
.segctl button { all: unset; text-align: center; padding: 7px 0; border-radius: 6px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.segctl button[aria-pressed="true"] { background: var(--card-2); color: var(--ink); }
.segctl button:focus-visible { outline: 2px solid var(--blue); }
.toggles { display: flex; gap: 18px; margin-top: 14px; }
.toggle { all: unset; cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-bottom: 3px; border-bottom: 2px solid transparent; }
.toggle[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--green); }
.prow {
  all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 24px 44px minmax(0, 1fr) auto 16px;
  align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line);
}
.prow:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.prow .rk { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.prow .nm { color: var(--ink); font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .sub { font-size: 12.5px; color: var(--ink-2); }
.prow .val { color: var(--ink-1); font-size: 14px; font-variant-numeric: tabular-nums; }
.prow.cat { grid-template-columns: minmax(0, 1fr) 90px 44px 16px; }
.mini { height: 6px; background: var(--card-2); border-radius: 3px; overflow: hidden; }
.mini span { display: block; height: 100%; background: var(--slate-mark); border-radius: 3px; }

/* ---------- posters ---------- */
.pgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 8px; }
.pitem { all: unset; cursor: default; display: grid; gap: 4px; min-width: 0; }
.poster {
  position: relative; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 4px; overflow: hidden;
  background: linear-gradient(165deg, #2F3946, #1C232B);
}
.poster::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--frame); pointer-events: none; }
.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.poster .ph { position: absolute; inset: 0; padding: 7px 6px; display: flex; flex-direction: column; justify-content: flex-end; color: var(--ink-1); font-size: 11px; font-weight: 600; line-height: 1.15; overflow-wrap: break-word; }
.poster .ph small { color: var(--ink-2); font-weight: 400; font-size: 10px; margin-top: 2px; }
.pmeta { display: flex; gap: 4px; align-items: center; font-size: 11px; min-height: 14px; }
.mlabel { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mdate { font-size: 11px; color: var(--muted); margin-top: -2px; }

/* ---------- diary ---------- */
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.fact { background: var(--card); border-radius: 8px; padding: 10px 12px; display: grid; gap: 1px; min-width: 0; }
.fact .k { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.fact .v { color: var(--ink); font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.month-h {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--navbar) + var(--scopebar) + 1px); z-index: 5;
  background: var(--bg); padding: 10px 0 6px; border-bottom: 1px solid var(--line);
  font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2);
}
.drow { display: grid; grid-template-columns: 30px 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.drow .day { font-size: 22px; font-weight: 300; color: var(--ink-2); text-align: center; font-variant-numeric: tabular-nums; }
.drow .poster { width: 34px; }
.drow .poster .ph { display: none; }
.drow .t { color: var(--ink); font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drow .t span { color: var(--ink-2); font-weight: 400; }
.drow .m { font-size: 12px; display: flex; gap: 6px; align-items: center; }
.drow .icons { display: flex; gap: 6px; font-size: 14px; }

/* ---------- charts ---------- */
.chart { position: relative; margin-right: 26px; margin-top: 8px; }
.cols { position: relative; z-index: 1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: end; gap: 1px; border-bottom: 1px solid var(--line); padding-top: 8px; }
.col { height: 100%; display: flex; flex-direction: column-reverse; align-items: center; min-width: 0; }
.col .seg { width: 100%; max-width: 24px; }
.col .seg + .seg { margin-bottom: 2px; }
.col .seg.a { background: var(--green-mark); }
.col .seg.b { background: var(--blue-mark); }
.col .seg:last-child { border-radius: 3px 3px 0 0; }
.col:hover .seg { filter: brightness(1.25); }
.chart.slate .col .seg.a { background: var(--slate-mark); }
.chart + .axis { margin-right: 26px; }
.axis { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 1px; margin-top: 5px; }
.axis span { font-size: 10.5px; color: var(--muted); text-align: center; white-space: nowrap; }
.axis.dense span.minor { visibility: hidden; }
.gridline { position: absolute; left: 0; right: -26px; border-top: 1px solid var(--line); pointer-events: none; }
.gridline span { position: absolute; right: 0; top: -8px; font-size: 10.5px; line-height: 16px; color: var(--muted); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
.weekdays { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.wd { display: grid; gap: 4px; justify-items: center; }
.wd .bar-v { width: 100%; max-width: 24px; height: 60px; display: flex; align-items: flex-end; }
.wd .bar-v span { display: block; width: 100%; background: var(--green-mark); border-radius: 3px 3px 0 0; }
.wd .lbl { font-size: 11px; color: var(--muted); }
.wd .cnt { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cal-wrap { overflow-x: auto; padding-bottom: 4px; }
.cal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 10px); grid-auto-columns: 10px; gap: 3px; width: max-content; }
.cal i { display: block; border-radius: 2px; background: var(--card-2); }
.cal i.l1 { background: var(--heat-1); } .cal i.l2 { background: var(--heat-2); } .cal i.l3 { background: var(--heat-3); }
.cal i.pad { background: transparent; }
.cal-months { display: grid; grid-auto-flow: column; grid-auto-columns: 10px; gap: 3px; width: max-content; margin-bottom: 4px; }
.cal-months span { font-size: 10px; color: var(--muted); white-space: nowrap; width: 10px; }
.heat-key { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.heat-key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; background: var(--card-2); }
.hist-ends { display: flex; justify-content: space-between; font-size: 11px; margin-top: 4px; }

/* ---------- detail screens ---------- */
.dhead { display: grid; justify-items: center; gap: 4px; padding-top: 22px; text-align: center; }
.dhead .name { color: var(--ink); font-size: 21px; font-weight: 700; margin-top: 8px; }
.dhead .sub { font-size: 13.5px; }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--bar); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabbar nav { max-width: 448px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: var(--tabbar); }
.tabbar button { all: unset; cursor: pointer; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--muted); font-size: 10.5px; font-weight: 500; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button:focus-visible { outline: 2px solid var(--blue); outline-offset: -4px; border-radius: 8px; }

#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink-1); color: var(--bg); font-size: 12.5px; padding: 6px 9px; border-radius: 6px; max-width: 240px; line-height: 1.35; }
.foot { font-size: 12.5px; color: var(--muted); margin-top: 26px; display: grid; gap: 6px; }
.foot p { margin: 0; }
input.key { width: 100%; padding: 11px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); font-family: var(--mono); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top">
    <div class="nav">
      <div class="left" id="nav-left"></div>
      <h1 id="nav-title">Profile</h1>
      <div class="right" id="nav-right"></div>
    </div>
    <div class="scopes" id="scopes" role="group" aria-label="Time period"></div>
  </header>
  <main class="screen" id="screen"></main>
</div>

<div class="tabbar">
  <nav aria-label="Sections">
    <button type="button" data-view="profile" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      Profile</button>
    <button type="button" data-view="people">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 19.5c1-3.5 3.6-5.5 6.5-5.5s5.5 2 6.5 5.5"/><path d="M15.5 4.8a3.5 3.5 0 0 1 0 6.4M17.5 14c2 .8 3.4 2.6 4 5.5"/></svg>
      People</button>
    <button type="button" data-view="diary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      Diary</button>
    <button type="button" data-view="films">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18M16 3v18M4 7.5h4M4 12h4M4 16.5h4M16 7.5h4M16 12h4M16 16.5h4"/></svg>
      Films</button>
    <button type="button" data-view="data">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 16.5v3A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5v-3"/></svg>
      Import</button>
  </nav>
</div>

<input id="file-input" type="file" accept=".zip,.csv,application/zip,text/csv" multiple hidden>
<div id="tip" role="tooltip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* Example diary shown before anyone imports an export. The films are real; the dates,
   ratings and likes are invented for the example. Columns:
   title, year, rating, liked, directors, cast, genres, countries, language, runtime, writers, cinematography, music */
const EXAMPLE_FILMS = [
  ["Parasite", 2019, 5, 1, "Bong Joon-ho", "Song Kang-ho|Lee Sun-kyun|Cho Yeo-jeong|Choi Woo-shik|Park So-dam|Lee Jung-eun", "Comedy|Thriller|Drama", "South Korea", "Korean", 133, "Bong Joon-ho|Han Jin-won", "Hong Kyung-pyo", "Jung Jae-il"],
  ["Memories of Murder", 2003, 4.5, 1, "Bong Joon-ho", "Song Kang-ho|Kim Sang-kyung|Kim Roe-ha|Song Jae-ho|Byun Hee-bong", "Crime|Drama|Thriller", "South Korea", "Korean", 132, "Bong Joon-ho|Shim Sung-bo", "Kim Hyung-koo", "Taro Iwashiro"],

/* Turns the table above into the same shape an imported export produces:
   a library of films plus diary entries, and a metadata map keyed by film. */
function buildExample() {
  let seed = 20261021;
  const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const start = Date.UTC(2025, 0, 3), end = Date.UTC(2026, 9, 18), day = 864e5;
  const span = (end - start) / day;
  const iso = (t) => new Date(t).toISOString().slice(0, 10);
  // weight later dates a little so 2026 reads busier than 2025
  const pick = () => start + Math.floor(Math.pow(rand(), 0.8) * span) * day;
  const rows = { profile: [{ Username: "example" }], watched: [], ratings: [], diary: [], likes: [], reviews: [] };
  const meta = {};
  const split = (s) => s ? s.split("|") : [];
  EXAMPLE_FILMS.forEach((f, i) => {
    const [name, year, rating, liked, d, c, g, k, l, r, w, p, m] = f;
    const base = { Name: name, Year: String(year), "Letterboxd URI": "" };
    rows.watched.push({ ...base, Date: iso(start) });
    rows.ratings.push({ ...base, Rating: String(rating) });
    if (liked) rows.likes.push(base);
    meta[filmKey(name, year)] = { src: "example", d: split(d), c: split(c), g: split(g), k: split(k), l, r, w: split(w), p: split(p), m: split(m) };
    if (i % 9 === 4) return; // logged as watched without a diary date
    const first = pick();
    rows.diary.push({ ...base, "Watched Date": iso(first), Rating: String(rating), Rewatch: "", Tags: "" });
    if (rating >= 4.5 && rand() < 0.55) {
      const again = first + Math.floor(rand() * (end - first) / day) * day;
      if (again > first) rows.diary.push({ ...base, "Watched Date": iso(again), Rating: String(rating), Rewatch: "Yes", Tags: "" });
    }
    if (rand() < 0.3) rows.reviews.push({ ...base, "Watched Date": iso(first) });
  });
  return { rows, meta };
}

async function readExport(fileList) {

  let found = 0;

    if (/(^|\/)(deleted|orphaned)\//i.test(path)) return;

    if (/\.zip$/i.test(file.name) || file.type.includes("zip")) {

/* ---------- the library: one record per film, one per diary entry ---------- */
function buildLibrary(input) {
  const rows = { diary: [], watched: [], ratings: [], reviews: [], likes: [], watchlist: [], profile: [], ...input };
  const films = new Map();

    profile: { username: p.Username || "", joined: (p["Date Joined"] || "").slice(0, 10), name: [p["Given Name"], p["Family Name"]].filter(Boolean).join(" ") },
    watchlist: rows.watchlist.length,

}

/* ---------- metadata: one shape whether it came from TMDB, Claude or the example ---------- */
const COUNTRY_ALIASES = {

<script>

          sampleState = "off"; stop = "Claude lookups aren't allowed for this page, so cast and crew stay blank. You can still use the page with a TMDB key in your own browser."; return;
        }
        if (code === "rate_limited") { stop = "Claude is limiting requests right now. Progress is saved; look up the rest in a few minutes."; return; }
        if (code === "session_expired") { stop = "Your Claude session expired. Sign in again, then look up the rest."; return; }
        job.failed += batch.length;
      }
      job.done += batch.length;
      saveMeta(); scheduleRender(); renderLookupProgress();
    }
  };
  await Promise.all([worker(), worker()]);
  job.running = false;
  if (stop) { job.note = stop; job.err = true; }
  else if (signal.aborted) job.note = `Stopped after ${plural(job.done, "film")}. Progress is saved.`;
  else job.note = job.failed ? `Done. ${plural(job.failed, "film")} came back without details. Try those again, or use TMDB.` : "Done. Every film has cast and crew.";
  scheduleRender();
}
function retryClaudeMisses(lib) {
  for (const f of lib.films) { const m = META[f.key]; if (m && m.miss && m.src === "claude") delete META[f.key]; }
  return runClaude(lib);
}

<script>
/* ---------- helpers and charts shared by the desktop and phone pages ---------- */
let LISTS = new Map(), listSeq = 0;
function reg(title, sub, films, person) { const id = "l" + (++listSeq); LISTS.set(id, { title, sub, films, person }); return id; }
const initials = (name) => name.replace(/[^\p{L}\s-]/gu, "").split(/[\s-]+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const ordinal = (n) => { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const isoOfDay = (d) => new Date(d * 864e5).toISOString().slice(0, 10);
function niceTick(max) {
  const raw = max * 0.8, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  return Math.max(1, (n >= 5 ? 5 : n >= 2 ? 2 : 1) * p);
}
const personSub = (p) => `${plural(p.count, "film")}${p.avg ? ` · ${p.avg.toFixed(2)} average from ${plural(p.ratings.length, "rating")}` : ""}`;

/* ---------- column chart: weeks, months, years, ratings, decades ---------- */
function colChart(cols, aria, legend, H = 162) {
  const max = Math.max(1, ...cols.map((c) => c.a + (c.b || 0)));
  const tick = niceTick(max);
  const bars = cols.map((c) => {
    const segs = [];
    if (c.a) segs.push(`<div class="seg a" style="height:${(c.a / max * 100).toFixed(2)}%"></div>`);
    if (c.b) segs.push(`<div class="seg b" style="height:${(c.b / max * 100).toFixed(2)}%"></div>`);
    return `<div class="col" data-tip="${esc(c.tip)}">${segs.join("")}</div>`;
  }).join("");
  const axis = cols.map((c) => `<span${c.minor ? ' class="minor"' : ""}>${c.label || ""}</span>`).join("");
  return `${legend || ""}<div class="chart"><div class="gridline" style="bottom:${(tick / max * H).toFixed(1)}px"><span>${fmtN(tick)}</span></div>
    <div class="cols" style="height:${H + 8}px" role="img" aria-label="${esc(aria)}">${bars}</div></div><div class="axis" aria-hidden="true">${axis}</div>`;
}
function timeline(s) {
  const E = s.entries, cols = [];
  const add = (key, label, tipLabel, minor) => cols.push({ key, a: 0, b: 0, label, tipLabel, minor });
  let keyOf;
  if (s.scope !== "all") {
    const y = +s.scope, jan1 = dayIndex(`${y}-01-01`), off = weekdayOf(`${y}-01-01`);
    const weeks = Math.floor((dayIndex(`${y}-12-31`) - jan1 + off) / 7) + 1;
    let prevMonth = -1;
    for (let w = 0; w < weeks; w++) {
      const startIso = isoOfDay(Math.max(jan1, jan1 + w * 7 - off));
      const m = +startIso.slice(5, 7) - 1;
      add(w, m !== prevMonth ? MONTHS[m] : "", `Week of ${fmtDate(isoOfDay(jan1 + w * 7 - off))}`, m % 3 !== 0);
      prevMonth = m;
    }
    keyOf = (e) => Math.floor((dayIndex(e.date) - jan1 + off) / 7);
  } else {
    const first = E[0].date, last = E[E.length - 1].date;
    const months = (+last.slice(0, 4) - +first.slice(0, 4)) * 12 + (+last.slice(5, 7) - +first.slice(5, 7)) + 1;
    if (months <= 60) {
      let y = +first.slice(0, 4), m = +first.slice(5, 7) - 1;
      for (let i = 0; i < months; i++) {
        const label = m === 0 ? String(y) : months <= 24 && m % 3 === 0 ? MONTHS[m] : "";
        add(`${y}-${String(m + 1).padStart(2, "0")}`, label, `${MONTHS_LONG[m]} ${y}`, m !== 0);
        if (++m === 12) { m = 0; y++; }
      }
      keyOf = (e) => e.date.slice(0, 7);
    } else {
      const y0 = +first.slice(0, 4), y1 = +last.slice(0, 4);
      for (let y = y0; y <= y1; y++) add(String(y), (y1 - y0 > 16 && y % 2) ? "" : `’${String(y).slice(2)}`, String(y), y % 5 !== 0);
      keyOf = (e) => e.date.slice(0, 4);
    }
  }
  const idx = new Map(cols.map((c, i) => [c.key, i]));
  for (const e of E) { const c = cols[idx.get(keyOf(e))]; if (c) e.rewatch ? c.b++ : c.a++; }
  for (const c of cols) c.tip = `${c.tipLabel}: ${plural(c.a + c.b, "film")}${c.b ? ` (${plural(c.b, "rewatch", "rewatches")})` : ""}`;
  return cols;
}
function heatmap(s) {
  let start, end;
  if (s.scope !== "all") { start = dayIndex(`${s.scope}-01-01`); end = dayIndex(`${s.scope}-12-31`); }
  else { end = dayIndex(s.entries[s.entries.length - 1].date); start = end - 364; }
  const pad = weekdayOf(isoOfDay(start));
  const cells = [], months = [];
  for (let i = 0; i < pad; i++) cells.push('<i class="pad"></i>');
  for (let d = start; d <= end; d++) {
    const iso = isoOfDay(d), n = s.byDay.get(iso) || 0;
    cells.push(`<i class="${n ? "l" + Math.min(3, n) : ""}" data-tip="${fmtDate(iso)}: ${plural(n, "film")}"></i>`);
  }
  const weeks = Math.ceil((pad + end - start + 1) / 7);
  for (let w = 0; w < weeks; w++) {
    let label = "";
    for (let k = 0; k < 7; k++) { const d = start - pad + w * 7 + k; if (d >= start && d <= end && isoOfDay(d).endsWith("-01")) label = MONTHS[+isoOfDay(d).slice(5, 7) - 1]; }
    months.push(`<span>${label}</span>`);
  }
  return `<div class="cal-wrap"><div class="cal-months" aria-hidden="true">${months.join("")}</div>
    <div class="cal" role="img" aria-label="Calendar of diary entries, ${fmtDate(isoOfDay(start))} to ${fmtDate(isoOfDay(end))}">${cells.join("")}</div></div>
    <div class="heat-key" aria-hidden="true">Fewer <i></i><i style="background:var(--heat-1)"></i><i style="background:var(--heat-2)"></i><i style="background:var(--heat-3)"></i> More</div>`;
}

</script>
<script>

const showImages = !IN_VIEWER; // pages inside Claude can't load outside images

const CHEV = `<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>`;

}
let renderQueued = false;
function scheduleRender() {

}
function saveView() { store.set(VIEW_KEY, { scope: state.scope, mode: state.mode, view: state.view }); }

    sh("By day of the week") + weekdays +
    sh(s.scope === "all" ? "Last 12 months" : `Every day of ${s.scope}`) + heatmap(s).replace("Fewer", "Less") +
    sh("Diary", `<span class="num">${plural(s.entries.length, "entry", "entries")}</span>`) + `<div>${rows}</div>` + more;
}

/* ---------- Films ---------- */
function filmsScreen(s) {
  const views = (f) => s.scope === "all" ? f.entries.length : f.entries.filter((e) => e.date.startsWith(s.scope)).length;
  const rated = s.films.filter((f) => f.rating).sort((a, b) => b.rating - a.rating || views(b) - views(a) || (b.year || 0) - (a.year || 0));
  let html = rated.length ? sh("Highest rated", `<button class="more" type="button" data-act="all-rated">See all</button>`) + posterGrid(rated.slice(0, 8)) : "";
  const best = state.catSort === "best";
  if (s.withMeta) {
    html += `<div class="toggles" style="margin-top:22px">${[["most", "Most watched"], ["best", "Highest rated"]].map(([v, l]) =>
      `<button class="toggle" type="button" data-catsort="${v}" aria-pressed="${v === state.catSort}">${l}</button>`).join("")}</div>`;
    for (const [label, data, field] of [["Genres", s.genres, "genres"], ["Countries", s.countries, "countries"], ["Languages", s.languages, "languages"]]) {
      const list = (best ? data.best : data.most);
      html += sh(label, list.length > 6 ? `<button class="more" type="button" data-act="cat" data-field="${field}">See all</button>` : "") +
        (list.length ? list.slice(0, 6).map((c) => catRow(c, list[0].count, best)).join("") : `<div class="empty">${best ? "Needs 3 or more rated films each." : "Nothing yet."}</div>`);
    }
  } else html += needMeta();

  if (s.decades.length) {
    const all = s.decades, cols = [];
    for (let d = all[0].decade; d <= all[all.length - 1].decade; d += 10) {
      const x = all.find((y) => y.decade === d);
      cols.push({ a: x ? x.count : 0, b: 0, label: `’${String(d).slice(2)}`, tip: `${d}s: ${plural(x ? x.count : 0, "film")}${x && x.avg ? ` · ${x.avg.toFixed(2)} average` : ""}` });
    }
    const ranked = all.filter((x) => x.ratings.length >= 3).sort((a, b) => b.avg - a.avg).slice(0, 5)
      .map((x) => ({ name: `${x.decade}s`, films: x.films, count: x.count, avg: x.avg }));
    html += sh("Decades") + colChart(cols, "Films by decade of release", "", 90) +
      (ranked.length ? `<p class="status" style="margin:14px 0 0">Highest-rated decades</p>` + ranked.map((c) => catRow(c, 1, true)).join("") : "");
  }

  const re = s.films.filter((f) => views(f) > 1).sort((a, b) => views(b) - views(a) || (b.rating || 0) - (a.rating || 0)).slice(0, 8);
  if (re.length) html += sh("Most rewatched") + re.map((f) => `<div class="drow" style="grid-template-columns:34px minmax(0,1fr) auto">${poster(f)}
    <span style="min-width:0"><span class="t" style="display:block">${esc(f.name)} <span>${f.year || ""}</span></span><span class="m"><span class="stars">${stars(f.rating)}</span></span></span>
    <span class="val num">${views(f)}×</span></div>`).join("");

  const E = s.entries;
  if (E.length) {
    const marks = s.scope === "all" ? [50, 100, 250, 500, 750, 1000, 1500, 2000, 2500, 3000, 4000, 5000, 7500, 10000] : [25, 50, 100, 150, 200, 250, 300, 365, 400, 500];
    const items = [["First film", E[0]], ...marks.filter((n) => n < E.length).slice(-5).map((n) => [`${ordinal(n)} film`, E[n - 1]])];
    if (E.length > 1) items.push(["Latest", E[E.length - 1]]);
    html += sh("Milestones") + `<div class="pgrid">${items.map(([k, e]) => `<div class="pitem" title="${esc(e.film.name)}${e.film.year ? ` (${e.film.year})` : ""}">
      <span class="mlabel">${k}</span>${poster(e.film)}
      <span class="pmeta"><span class="stars">${stars(e.rating)}</span>${e.rewatch ? '<span class="rewatch" aria-label="rewatch">↻</span>' : ""}</span>
      <span class="mdate">${fmtDate(e.date)}</span></div>`).join("")}</div>`;
  }

  const timed = s.films.filter((f) => metaOf(f) && metaOf(f).r);
  const longest = timed.reduce((a, f) => !a || metaOf(f).r > metaOf(a).r ? f : a, null);
  const shortest = timed.reduce((a, f) => !a || metaOf(f).r < metaOf(a).r ? f : a, null);
  const dated = s.films.filter((f) => f.year);
  const oldest = dated.reduce((a, f) => !a || f.year < a.year ? f : a, null);
  const newest = dated.reduce((a, f) => !a || f.year > a.year ? f : a, null);
  const rec = [
    longest && fact("Longest", `${longest.name} · ${metaOf(longest).r} min`), shortest && fact("Shortest", `${shortest.name} · ${metaOf(shortest).r} min`),
    oldest && fact("Oldest", `${oldest.name} · ${oldest.year}`), newest && fact("Newest", `${newest.name} · ${newest.year}`),
  ].filter(Boolean).join("");
  if (rec) html += sh("Records") + `<div class="facts" style="margin-top:0">${rec}</div>`;
  return html || `<div class="empty">No films in this period.</div>`;
}

/* ---------- Import ---------- */
function lookupInner() {
  if (state.mode === "example" || !MY_LIB) {
    return `<p class="title">Cast &amp; crew</p><p>Letterboxd's export lists your films, dates and ratings, but not who's in them.
      After you import yours, you can fill them in${IN_VIEWER ? " with Claude" : " from TMDB with your API key"}. The example has them filled in already.</p>`;
  }
  const lib = MY_LIB, total = lib.films.length;
  const have = lib.films.filter((f) => metaOf(f)).length;
  const fromTmdb = lib.films.filter((f) => META[f.key] && META[f.key].src === "tmdb" && !META[f.key].miss).length;
  const pct = total ? Math.round(have / total * 100) : 0;
  const src = fromTmdb ? (fromTmdb === have ? "From TMDB" : "From TMDB and Claude") : have ? "From Claude's film knowledge" : "Not looked up yet";
  const head = `<p class="title">Cast &amp; crew</p><div class="meter" role="progressbar" aria-label="Films with cast and crew" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span id="lookup-meter" style="width:${pct}%"></span></div>
    <p class="status">${fmtN(have)} of ${plural(total, "film")} · ${src}</p>`;
  const note = job.note ? `<p class="status${job.err ? " err" : ""}" role="status">${esc(job.note)}</p>` : "";
  const saveNote = job.saveFailed ? `<p class="status err">This browser wouldn't save the results, so they'll be gone when you close the page.</p>` : "";
  if (job.running) return head + `<p class="status" id="lookup-progress" role="status">${progressText()}</p><button class="btn block" type="button" data-act="stop">Stop</button>`;
  let body;
  if (!IN_VIEWER) {
    const todo = needsLookup(lib, "tmdb").length;
    const askKey = !tmdbKey() || editKey || job.badKey;
    body = todo && !askKey ? `<button class="btn green block" type="button" data-act="tmdb">Look up ${plural(todo, "film")} on TMDB</button>
      <p class="status">Using your saved TMDB key. <button class="linkish" type="button" data-act="change-key">Change key</button></p>` :
      todo ? `<label class="sr-only" for="tmdb-key">TMDB API key or read access token</label>
      <input class="key" id="tmdb-key" type="password" autocomplete="off" spellcheck="false" placeholder="TMDB API key or read access token" value="${esc(tmdbKey())}">
      <button class="btn green block" type="button" data-act="tmdb">Look up ${plural(todo, "film")} on TMDB</button>
      <p class="status">Get a free key at <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org/settings/api</a>. It's saved in this browser and sent only to TMDB.</p>` : have < total ? `<p>TMDB had no match for ${plural(total - have, "film")}.</p>` : `<p>Every film has details from TMDB.</p>`;
  } else if (sampleState === "ready") {
    const todo = needsLookup(lib, "claude").length;
    const misses = lib.films.filter((f) => META[f.key] && META[f.key].miss && META[f.key].src === "claude").length;
    body = `<p>Pages inside Claude can't reach TMDB, so Claude fills in each film from what it knows. Obscure films can come back wrong or empty.</p>` +
      (todo ? `<button class="btn green block" type="button" data-act="claude">Look up ${plural(todo, "film")} with Claude</button>
        <p class="status">About ${plural(Math.ceil(todo / CLAUDE_BATCH), "request")} on your Claude plan.</p>` :
      misses ? `<button class="btn block" type="button" data-act="claude-retry">Try the ${plural(misses, "film")} Claude didn't recognise</button>` : "");
  } else if (sampleState === "pending") {
    body = `<p class="status">Connecting to Claude…</p>`;
  } else {
    body = `<p>Lookups aren't available in this view. Open the downloadable copy of this page in a browser and use a TMDB key.</p>`;
  }
  return head + body + note + saveNote;
}
function progressText() {
  return job.kind === "claude" && job.done === 0 ? `Asking Claude about ${plural(job.total, "film")}… the first batch takes up to a minute.`
    : `Looked up ${fmtN(job.done)} of ${plural(job.total, "film")} ${job.kind === "tmdb" ? "on TMDB" : "with Claude"}…`;
}
function renderLookup() { const el = $("#lookup"); if (el) el.innerHTML = lookupInner(); }
function renderLookupProgress() {
  const p = $("#lookup-progress");
  if (p) p.textContent = progressText();
  const m = $("#lookup-meter");
  if (m && MY_LIB) m.style.width = `${Math.round(MY_LIB.films.filter((f) => metaOf(f)).length / Math.max(1, MY_LIB.films.length) * 100)}%`;
}
function dataScreen() {
  const lib = MY_LIB;
  const status = lib ? `${plural(lib.films.length, "film")} and ${plural(lib.entries.length, "diary entry", "diary entries")} imported${lib.profile.username ? ` for @${esc(lib.profile.username)}` : ""}.` : "Nothing imported yet.";
  const rows = [];
  if (state.mode === "mine") rows.push(`<li><button class="row" type="button" data-act="example"><span>View the example diary</span>${CHEV}</button></li>`);
  else if (lib) rows.push(`<li><button class="row" type="button" data-act="mine"><span>Back to my diary</span>${CHEV}</button></li>`);
  rows.push(`<li><button class="row danger" type="button" data-act="forget"><span>${state.forgetArmed ? "Tap again to delete" : "Delete saved data from this browser"}</span></button></li>`);
  return `<div class="card" style="margin-top:18px"><p class="title">Your Letterboxd export</p><p>${status}</p>
      <ol style="margin:0; padding-left:18px; display:grid; gap:4px">
        <li>On <a href="https://letterboxd.com/settings/data/" target="_blank" rel="noopener">letterboxd.com</a>, open Settings → Data.</li>
        <li>Choose Export your data and download the ZIP.</li>
        <li>Import the ZIP here. It stays in this browser.</li></ol>
      <button class="btn green block" type="button" data-act="import">${lib ? "Import a newer export" : "Import export"}</button>
      ${state.importError ? `<p class="status err" role="alert">${esc(state.importError)}</p>` : ""}</div>
    <div class="card" id="lookup" style="margin-top:12px">${lookupInner()}</div>
    ${sh("This browser")}<ul class="menu">${rows.join("")}</ul>
    ${state.forgetArmed ? `<p class="status">Removes your imported export and looked-up details, plus any TMDB key you typed in.</p>` : ""}
    <div class="foot"><p>Credits Roll reads the CSV files in a Letterboxd data export. It is not made by or affiliated with Letterboxd.</p>
      <p>With your own TMDB key, film details come from The Movie Database. This product uses the TMDB API but is not endorsed or certified by TMDB.
      Inside the Claude app, details come from Claude's knowledge of each film instead, so check anything surprising.</p>
      <p>On a computer? <a href="desktop.html">Open the desktop version</a>. It uses the same import.</p></div>`;
}

/* ---------- pushed detail screens ---------- */
function detailScreen(d, s) {
  if (d.type === "cat") {
    const data = s[d.field], best = state.catSort === "best";
    const list = best ? data.best : data.most;
    return `<div class="toggles" style="margin-top:16px">${[["most", "Most watched"], ["best", "Highest rated"]].map(([v, l]) =>
      `<button class="toggle" type="button" data-catsort="${v}" aria-pressed="${v === state.catSort}">${l}</button>`).join("")}</div>` +
      sh(`${fmtN(list.length)} ${d.title.toLowerCase()}`) + (list.map((c) => catRow(c, list[0].count, best)).join("") || `<div class="empty">Nothing to show for this period.</div>`);
  }
  const films = [...d.films].sort((a, b) => (b.rating || 0) - (a.rating || 0) || (b.year || 0) - (a.year || 0));
  return `<div class="dhead">${d.person && d.person.key ? avatar(d.person, "xl") : ""}<div class="name">${esc(d.title)}</div><div class="sub">${esc(d.sub)}</div></div>` +
    sh("Films", `<span class="num">${fmtN(films.length)}</span>`) + posterGrid(films);
}

const SCREENS = { profile: profileScreen, people: peopleScreen, diary: diaryScreen, films: filmsScreen, data: dataScreen };
</script>
<script>
/* ---------- importing ---------- */
async function importFiles(files) {
  state.importError = "";
  try {
    const rows = await readExport(files);
    const saved = store.set(KEYS.rows, rows);
    MY_LIB = buildLibrary(rows);
    Object.assign(state, { mode: "mine", scope: "all", view: "profile", stack: [], peopleLimit: 50, diaryLimit: 60 });
    job.note = saved ? "" : "This browser wouldn't save your export, so you'll need to import it again next time.";
    job.err = !saved;
    setTimeout(() => autoLookup(MY_LIB));
  } catch (e) {
    state.importError = (e && e.message) || "Couldn't read that file. Import the ZIP from Letterboxd → Settings → Data.";
    Object.assign(state, { view: "data", stack: [] });
  }
  saveView();
  render();
  window.scrollTo(0, 0);
}

/* ---------- taps ---------- */
let forgetTimer = null;
function act(t) {
  const a = t.dataset.act;
  if (a === "import") $("#file-input").click();
  else if (a === "back") pop();
  else if (a === "people") { Object.assign(state, { view: "people", role: t.dataset.role || "c", stack: [], peopleLimit: 50 }); saveView(); render(); window.scrollTo(0, 0); }
  else if (a === "cat") push({ type: "cat", field: t.dataset.field, title: t.dataset.field[0].toUpperCase() + t.dataset.field.slice(1) });
  else if (a === "all-rated" || a === "liked") {
    const films = STATS.films.filter((f) => a === "liked" ? f.liked : f.rating);
    push({ type: "films", title: a === "liked" ? "Liked" : "Highest rated", sub: plural(films.length, "film"), films });
  }
  else if (a === "more-people") { state.peopleLimit += 100; render(); }
  else if (a === "more-diary") { state.diaryLimit += 120; render(); }
  else if (a === "example" || a === "mine") { Object.assign(state, { mode: a === "example" ? "example" : "mine", scope: "all", view: "profile", stack: [] }); saveView(); render(); window.scrollTo(0, 0); }
  else if (a === "forget") {
    if (!state.forgetArmed) {
      state.forgetArmed = true; render();
      forgetTimer = setTimeout(() => { state.forgetArmed = false; if (state.view === "data") render(); }, 6000);
      return;
    }
    clearTimeout(forgetTimer); state.forgetArmed = false;
    if (job.running && job.ctl) job.ctl.abort();
    Object.values(KEYS).forEach((k) => store.del(k)); store.del(VIEW_KEY);
    META = {}; PHOTOS = {}; MY_LIB = null;
    Object.assign(state, { mode: "example", scope: "all", stack: [] });
    job.note = "Deleted your saved data from this browser."; job.err = false;
    render();
  }
  else if (a === "tmdb") startTmdb(MY_LIB);
  else if (a === "change-key") { editKey = true; renderLookup(); $("#tmdb-key")?.focus(); }
  else if (a === "claude") runClaude(MY_LIB);
  else if (a === "claude-retry") retryClaudeMisses(MY_LIB);
  else if (a === "stop") job.ctl && job.ctl.abort();
}

function bind() {
  const fileInput = $("#file-input");
  fileInput.addEventListener("change", () => { const files = [...fileInput.files]; fileInput.value = ""; if (files.length) importFiles(files); });
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act],[data-view],[data-scope],[data-push],[data-role],[data-crew],[data-sort],[data-catsort]");
    if (!t) return;
    if (t.dataset.act) return act(t);
    if (t.dataset.view) {
      const same = state.view === t.dataset.view && !state.stack.length;
      Object.assign(state, { view: t.dataset.view, stack: [], forgetArmed: false });
      saveView(); render();
      if (!same) window.scrollTo(0, 0);
    }
    else if (t.dataset.scope) { Object.assign(state, { scope: t.dataset.scope, peopleLimit: 50, diaryLimit: 60 }); saveView(); render(); }
    else if (t.dataset.push) { const L = LISTS.get(t.dataset.push); if (L) push({ type: "films", title: L.title, sub: L.sub, films: L.films, person: L.person }); }
    else if (t.dataset.role) { Object.assign(state, { role: t.dataset.role, peopleLimit: 50 }); render(); }
    else if (t.dataset.crew) { state.crew = t.dataset.crew; render(); }
    else if (t.dataset.sort) { state.sort = t.dataset.sort; render(); }
    else if (t.dataset.catsort) { state.catSort = t.dataset.catsort; render(); }
  });

  // tooltips for chart marks; a tap shows one on a phone
  const tip = $("#tip");
  const place = (x, y) => {
    const r = tip.getBoundingClientRect();
    let left = x + 12, top = y - r.height - 14;
    if (left + r.width > innerWidth - 8) left = x - r.width - 12;
    if (top < 8) top = y + 20;
    tip.style.left = Math.max(8, left) + "px"; tip.style.top = top + "px";
  };
  document.addEventListener("pointerover", (e) => {
    const t = e.target.closest && e.target.closest("[data-tip]");
    if (!t) { tip.hidden = true; return; }
    tip.textContent = t.dataset.tip; tip.hidden = false; place(e.clientX, e.clientY);
  });
  document.addEventListener("pointermove", (e) => { if (!tip.hidden) place(e.clientX, e.clientY); });
  window.addEventListener("scroll", () => { tip.hidden = true; }, { passive: true });

  // a dropped export works too, for anyone using this on a computer
  const hasFiles = (e) => [...((e.dataTransfer && e.dataTransfer.types) || [])].includes("Files");
  window.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener("drop", (e) => { if (!hasFiles(e)) return; e.preventDefault(); const files = [...e.dataTransfer.files]; if (files.length) importFiles(files); });
}

function init() {
  const ex = buildExample();
  EXAMPLE_META = Object.fromEntries(Object.entries(ex.meta).map(([k, m]) => [k, cleanMeta(m)]));
  EXAMPLE_LIB = buildLibrary(ex.rows);
  const saved = store.get(KEYS.rows, null);
  if (saved) { try { MY_LIB = buildLibrary(saved); } catch { MY_LIB = null; } }
  const view = store.get(VIEW_KEY, {});
  state.mode = MY_LIB && view.mode !== "example" ? "mine" : "example";
  if (view.scope) state.scope = view.scope;
  if (SCREENS[view.view]) state.view = view.view;
  bind();
  render();
  // A saved key picks up films not yet looked up, or matched before matching improved.
  if (MY_LIB) autoLookup(MY_LIB);
}
init();
</script>
</body>
</html>
