    const a0 = mean(early, "age"), a1 = mean(late, "age");
    if (a0 != null && a1 != null && Math.abs(a1 - a0) >= 3) tastes.lines.push({ dir: a1 > a0 ? "up" : "down", big: a1 > a0 ? "Older films" : "Newer films",
      text: a1 > a0 ? `You're watching older films: on average ${Math.round(a1)} years old when you saw them in ${L0}, against ${Math.round(a0)} in ${E0}.`
        : `You're watching newer films: on average ${Math.round(a1)} years old when you saw them in ${L0}, against ${Math.round(a0)} in ${E0}.`,
      to: thenNow("Release years, then and now", (f) => !!f.year, { sort: "old", note: (f) => `Released ${f.year}` }) });
    const n0 = mean(early, "nonEnglish"), n1 = mean(late, "nonEnglish");
    if (n0 != null && n1 != null && Math.abs(n1 - n0) >= 10) tastes.lines.push({ dir: n1 > n0 ? "up" : "down", big: n1 > n0 ? "World cinema" : "More English",
      text: `Films not in English went from ${Math.round(n0)}% of your watching in ${E0} to ${Math.round(n1)}% in ${L0}.`, to: thenNow("Not in English, then and now", notEnglish, { note: langNote }) });
    const r0 = mean(early, "avgRating"), r1 = mean(late, "avgRating");
    if (r0 != null && r1 != null && Math.abs(r1 - r0) >= 0.2) tastes.lines.push({ dir: r1 > r0 ? "up" : "down", big: r1 > r0 ? "Kinder" : "Tougher",
      text: r1 > r0 ? `You've grown more generous: your average rating rose from ${starsNum(r0)} in ${E0} to ${starsNum(r1)} in ${L0}.`
        : `You've grown tougher: your average rating fell from ${starsNum(r0)} in ${E0} to ${starsNum(r1)} in ${L0}.`, to: thenNow("Your ratings, then and now", (f) => !!f.rating) });
    const w0 = mean(early, "films"), w1 = mean(late, "films");
    if (w0 && w1 && Math.abs(w1 - w0) / w0 >= 0.25) tastes.lines.push({ dir: w1 > w0 ? "up" : "down", big: w1 > w0 ? "More films" : "Fewer films",
      text: `You watch ${w1 > w0 ? "more" : "fewer"} films than you used to: about ${Math.round(w1)} a year in ${L0}, against ${Math.round(w0)} in ${E0}.`,
      to: D.groups("How much you watch", `${L0} against ${E0}`, [late, early].map((g, i) => { const es = g.flatMap((p) => p.E); return D.entries(i ? E0 : L0, entriesSub(es), es); })) });
    tastes.table = { genres: top, years: usable.map((p) => ({ year: p.year, p, shares: top.map((g) => p.withMeta ? Math.round((p.genres.get(g) || 0) / p.withMeta * 100) : null) })) };

  const crowd = CROWDS[crowdKey] || CROWDS.tmdb;

    const m = metaOf(f); if (!m) continue;

      let x = gmap.get(g); if (!x) { x = { name: g, films: [], mine: [], vsCrowd: [] }; gmap.set(g, x); }

      if (f.rating) { x.mine.push(f.rating); const c = crowd.score(m, f); if (c) x.vsCrowd.push(f.rating - c / 2); }
    }
  }
  const withMetaCount = lib.films.filter((f) => metaOf(f)).length;
  const genres = [...gmap.values()].filter((g) => g.mine.length >= 3).map((g) => ({
    name: g.name, films: g.films, count: g.films.length, share: pctOf(g.films.length, withMetaCount), mine: avg(g.mine),
    vsMe: avg(g.mine) - overallAvg, vsCrowd: g.vsCrowd.length >= 3 ? avg(g.vsCrowd) : null,
  })).sort((a, b) => b.count - a.count);
  const genreLines = [];
  const solid = genres.filter((g) => g.mine.length >= 5 || g.count >= 5);
  const loved = [...solid].sort((a, b) => b.vsMe - a.vsMe)[0];
  const gFilms = (g) => D.films(g.name, filmsSub(g.films), g.films);
  if (loved && loved.vsMe >= 0.15) genreLines.push({ text: `You rate ${loved.name} ${loved.vsMe.toFixed(1)}★ above your average, more than any other genre.`, to: gFilms(loved) });
  const lukewarm = solid.slice(0, 5).filter((g) => g.vsMe <= -0.15).sort((a, b) => a.vsMe - b.vsMe)[0];
  if (lukewarm) genreLines.push({ text: `${lukewarm.name} is among the genres you watch most (${lukewarm.share}% of your films), but you rate it ${Math.abs(lukewarm.vsMe).toFixed(1)}★ below your average.`, to: gFilms(lukewarm) });
  const withCrowd = genres.filter((g) => g.vsCrowd != null);

  if (above && above.vsCrowd >= 0.2) genreLines.push({ text: `Next to ${crowd.label}, you're kindest to ${above.name}: ${above.vsCrowd.toFixed(1)}★ above them on average.`, to: crowdDrill(above.films, crowdKey, `${above.name} against ${crowd.label}`) });
  if (below && below !== above && below.vsCrowd <= -0.2) genreLines.push({ text: `You're harshest on ${below.name}: ${Math.abs(below.vsCrowd).toFixed(1)}★ below ${crowd.label} on average.`, to: crowdDrill(below.films, crowdKey, `${below.name} against ${crowd.label}`) });

  /* ----- people: obsessions, companions, binges, discoveries ----- */
  const peopleFrom = (role) => {
    const map = new Map();
    for (const e of E) {
      const m = metaOf(e.film); if (!m) continue;
      const names = roleNames(m, role);

    // the genre the month leans to most: the biggest share over its share of the rest of the period's films
    const withMeta = films.filter((f) => metaOf(f)).length;
    const lean = [...g].filter(([x, n]) => n >= minLean && periodFilms.length - withMeta > 0).map(([x, n]) => {

    const other = Y ? allYears.filter((y) => y !== Y).map((y) => ymOf(y, i)).filter(live) : [];
    const otherE = other.flatMap((k) => byMonth.get(k) || []);
    return { i, name, E: es, years: ms.length, perYear: ms.length ? es.length / ms.length : 0, avg: avg(ratings), rated: ratings.length, films,
      lean: lean || null, leanFilms: lean ? films.filter((f) => { const m = metaOf(f); return m && m.g.includes(lean.x); }) : [],
      usual: other.length ? otherE.length / other.length : null, usualE: otherE, usualYears: other.length };

    ? `<td><button class="mg-c" type="button" ${dl(DR.month(m.E, m.key))} style="--a:${alpha(m.E.length)}" title="${monthName(m.key)}: ${plural(m.E.length, "film")}">${m.E.length}</button></td>`
    : `<td><span class="mg-0" title="${monthName(m.key)}: none">·</span></td>`;
  const foot = G.Y ? ["Usual", (c) => c.usual != null ? dlink(monthEnts(`${c.name} in your other years`, c.usualE, plural(c.usualYears, "year")), fix(c.usual)) : "—"]
    : ["A year", (c) => c.years ? dlink(monthEnts(`${c.name}, every year`, c.E, plural(c.years, "year")), fix(c.perYear)) : "—"];
  return `<div class="scroll"><table class="mgrid"><thead><tr><th></th>${MONTHS.map((m) => `<th>${m[0]}<span>${m.slice(1)}</span></th>`).join("")}<th class="n">All</th></tr></thead>
    <tbody>${[...G.rows].reverse().map((r) => `<tr><th>${r.year}</th>${r.months.map(cell).join("")}<td class="n">${dlink(monthEnts(`Diary of ${r.year}`, r.E), fmtN(r.E.length))}</td></tr>`).join("")}</tbody>
    <tfoot><tr><th>${foot[0]}</th>${G.cal.map((c) => `<td>${foot[1](c)}</td>`).join("")}<td></td></tr></tfoot></table></div>`;
}
// "Westerns 19% (10% the rest)": a month's lean, as a link to its films.
const leanHtml = (c, title) => c.lean ? `${dlink(D.films(`${c.lean.x}, ${title}`, filmsSub(c.leanFilms), c.leanFilms), esc(c.lean.x))} <span class="muted">${pc(c.lean.share)}% · ${pc(c.lean.rest)}% otherwise</span>` : "—";
// The line that sums it up: the fullest and emptiest months across the years, or the month of a year furthest from usual.
function monthsLine(G) {
  if (!G) return "";
  const live = G.cal.filter((c) => c.years && c.E.length), fix = (v) => v.toFixed(1);
  if (!G.Y) {
    const by = [...live].sort((a, b) => b.perYear - a.perYear), hi = by[0], lo = by[by.length - 1];
    return hi && lo && hi !== lo ? `${dlink(monthEnts(`${hi.name}, every year`, hi.E), hi.name)} is your fullest month, ${fix(hi.perYear)} films a year; ${dlink(monthEnts(`${lo.name}, every year`, lo.E), lo.name)} your emptiest, ${fix(lo.perYear)}.` : "";
  }
  const vs = live.filter((c) => c.usual != null).sort((a, b) => (b.E.length - b.usual) - (a.E.length - a.usual))[0];
  return vs && vs.E.length > vs.usual ? `${dlink(monthEnts(`${vs.name} ${G.Y}`, vs.E), `${vs.name} ${esc(G.Y)}`)} ran furthest ahead of your usual: ${plural(vs.E.length, "film")}, against ${fix(vs.usual)} in a typical ${vs.name}.`
    : `Each month of ${esc(G.Y)}, against your usual for it.`;
}
</script>
<script>
/* ---------- Compare: other members' exports next to yours ----------
   Friends' exports are read the same way as yours and kept in this browser only. Their films share
   the cast & crew cache with yours, keyed by title and year, so a film is looked up once for everyone. */
let FRIENDS = [];         // [{ id, name, rows, lib }]
let EXAMPLE_FRIENDS = []; // made-up members shown with the example diary
let friendsSaveFailed = false;

function loadFriends() {
  FRIENDS = store.get(KEYS.friends, []).map((f) => ({ ...f, lib: buildLibrary(f.rows) }));
}
function saveFriends() {
  friendsSaveFailed = !store.set(KEYS.friends, FRIENDS.map(({ id, name, rows }) => ({ id, name, rows })));
}
async function addFriend(files) {
  const rows = await readExport(files);
  const lib = buildLibrary(rows);
  const name = lib.profile.username || `Friend ${FRIENDS.length + 1}`;
  const existing = FRIENDS.find((f) => f.name.toLowerCase() === name.toLowerCase());
  if (existing) Object.assign(existing, { rows, lib }); // a newer export of the same member replaces the old one
  else FRIENDS.push({ id: "f" + Date.now().toString(36), name, rows, lib });
  saveFriends();
  return existing ? existing.id : FRIENDS[FRIENDS.length - 1].id;
}
function removeFriend(id) { FRIENDS = FRIENDS.filter((f) => f.id !== id); saveFriends(); }
// The site owner's card of ratings (docs/taste.json), when they let visitors compare with them: read once a page,
// checked like everything else from outside, and never saved except as a friend the visitor chose to add.
let TASTE = null, tasteReady = Promise.resolve();
function loadTasteCard() {
  if (IN_VIEWER || !/^https?:$/.test(location.protocol)) return tasteReady;
  tasteReady = fetch(`taste.json?t=${Date.now()}`, { cache: "no-store" }).then((r) => r.ok ? r.json() : null).then((j) => { TASTE = safeTaste(j); }).catch(() => {});
  return tasteReady;
}
function safeTaste(j) {
  if (!j || typeof j.user !== "string" || !Array.isArray(j.films)) return null;
  const user = j.user.replace(/[^\w.-]/g, "").slice(0, 40);
  if (!user) return null;
  const films = j.films.filter((x) => Array.isArray(x) && typeof x[0] === "string" && x[0].trim()).slice(0, 30000)
    .map(([n, y, r, l]) => [String(n).slice(0, 300), parseInt(y, 10) || 0, Math.min(5, Math.max(0, Math.round((Number(r) || 0) * 2) / 2)), l ? 1 : 0]);
  return { user, from: String(j.from || "").slice(0, 30), at: String(j.at || "").slice(0, 30), films };
}
// The card as an export's rows, so it compares like any friend's export (no diary: habits stay empty).
const tasteRows = (T) => ({ profile: [{ Username: T.user }], diary: [], reviews: [], watchlist: [],
  watched: T.films.map(([n, y]) => ({ Name: n, Year: y ? String(y) : "" })),
  ratings: T.films.filter((x) => x[2]).map(([n, y, r]) => ({ Name: n, Year: y ? String(y) : "", Rating: String(r) })),
  likes: T.films.filter((x) => x[3]).map(([n, y]) => ({ Name: n, Year: y ? String(y) : "" })) });
// A visitor (not the owner) who hasn't added them yet is offered the owner.
const tasteOffer = () => TASTE && MY_LIB && state.mode === "mine" && String(MY_LIB.profile.username || "").toLowerCase() !== TASTE.user.toLowerCase()
  && !FRIENDS.some((f) => f.id === "site" || f.name.toLowerCase() === TASTE.user.toLowerCase());
function addSiteOwner() {
  const rows = tasteRows(TASTE), lib = buildLibrary(rows);
  const existing = FRIENDS.find((f) => f.id === "site" || f.name.toLowerCase() === TASTE.user.toLowerCase());
  if (existing) Object.assign(existing, { rows, lib }); else FRIENDS.push({ id: "site", name: TASTE.user, rows, lib });
  saveFriends();

}
// A visitor who added the owner keeps up with a newer card.
function tasteRefresh() {
  const f = TASTE && FRIENDS.find((x) => x.id === "site");
  if (f && JSON.stringify(f.rows.ratings) !== JSON.stringify(tasteRows(TASTE).ratings)) { addSiteOwner(); return true; }
  return false;
}
document.addEventListener("click", (e) => {
  if (!e.target.closest("[data-compare-owner]") || !TASTE) return;
  state.cmp = addSiteOwner();
  Object.assign(state, { cmpError: "", cmpTab: "overview" });
  DATA_REV++;
  autoLookup(allFilmsLib());
  render();
});
// The offer, for Compare on either layout.
const tasteOfferHtml = (phone) => tasteOffer() ? `<div class="${phone ? "card glow" : "site-in taste-offer"}" style="margin-top:12px"><p class="${phone ? "title" : "sub-h"}">Compare with @${esc(TASTE.user)}</p>
  <p class="status">@${esc(TASTE.user)}, who runs this site, shares their ratings: see how your taste matches theirs, with nothing to send.</p>
  <button class="btn ${phone ? "green block" : "primary small"}" type="button" data-compare-owner>Compare with @${esc(TASTE.user)}</button></div>` : "";
// Everyone in the comparison: you first, then friends (example ones with the example diary).
function comparePeople() {
  const ex = state.mode === "example";
  const me = { id: "me", name: "You", me: true, lib: state.lib };
  return [me, ...(ex ? EXAMPLE_FRIENDS : FRIENDS)];
}
// Every film anyone has logged, for looking up cast & crew once for all of them.
function allFilmsLib() {
  const seen = new Map();
  for (const lib of [MY_LIB, ...FRIENDS.map((f) => f.lib)]) if (lib) for (const f of lib.films) if (!seen.has(f.key)) seen.set(f.key, f);
  // your watchlist too, for Watch next
  if (MY_LIB) for (const w of MY_LIB.watchlistFilms) if (!seen.has(w.key)) seen.set(w.key, w);
  return { films: [...seen.values()], profile: (MY_LIB || {}).profile || {} };
}

/* ----- one person's taste in numbers ----- */
function tasteProfile(p, metaOf) {
  const lib = p.lib, films = lib.films, rated = films.filter((f) => f.rating), E = lib.entries;
  const genres = new Map(), directors = new Map(), actors = new Map();
  let withMeta = 0, langKnown = 0, nonEng = 0;
  for (const f of films) {
    const m = metaOf(f); if (!m) continue;
    withMeta++;
    new Set(m.g).forEach((g) => bump(genres, g)); new Set(roleNames(m, "d")).forEach((d) => bump(directors, d)); new Set(castOf(m)).forEach((c) => bump(actors, c));
    if (m.l) { langKnown++; if (m.l !== "English") nonEng++; }
  }
  const spread = Array(10).fill(0);
  for (const f of rated) spread[Math.round(f.rating * 2) - 1]++;
  const span = E.length > 1 ? (dayIndex(E[E.length - 1].date) - dayIndex(E[0].date) + 1) / 365.25 : 0;
  const dated = films.filter((f) => f.year);
  return {
    ...p, films, rated, byKey: new Map(films.map((f) => [f.key, f])),
    avg: avg(rated.map((f) => f.rating)), spread: spread.map((n) => rated.length ? n / rated.length * 100 : 0),
    genres, directors, actors, withMeta,
    nonEnglish: langKnown >= 5 ? Math.round(nonEng / langKnown * 100) : null,
    avgYear: dated.length ? Math.round(avg(dated.map((f) => f.year))) : null,
    perYear: span >= 0.5 ? Math.round(E.length / span) : null,
    weekend: E.length >= 10 ? pctOf(E.filter((e) => weekdayOf(e.date) >= 5).length, E.length) : null,
    rewatch: E.length >= 10 ? pctOf(E.filter((e) => e.rewatch).length, E.length) : null,
    watchlist: new Map(lib.watchlistFilms.map((w) => [w.key, w])),
  };
}
const genreShare = (P, g) => P.withMeta ? (P.genres.get(g) || 0) / P.withMeta * 100 : 0;
// 0–100: mostly how close your ratings are on films you've both rated, partly whether you rank them alike.
function matchScore(pairs) {
  if (pairs.length < 5) return { score: null, n: pairs.length };
  const mad = avg(pairs.map((x) => Math.abs(x.a - x.b)));
  const r = pearson(pairs.map((x) => x.a), pairs.map((x) => x.b));
  const score = Math.round(100 * Math.max(0, Math.min(1, 0.6 * (1 - mad / 2) + 0.4 * (((r ?? 0) + 1) / 2))));
  return { score, mad, r, n: pairs.length, within: pctOf(pairs.filter((x) => Math.abs(x.a - x.b) <= 0.5).length, pairs.length) };
}
const matchWords = (s) => s >= 80 ? "Film twins" : s >= 65 ? "Strong match" : s >= 50 ? "Some common ground" : s >= 35 ? "Different tastes" : "Opposites";

/* ----- what a click in Compare opens ----- */
// A film card with what each person logged for it.
const cardFor = (people) => (f) => D.film(f, { lib: people[0].lib, people: people.map((P) => ({ name: P.me ? "You" : P.name, lib: P.lib, film: P.byKey.get(f.key),
  missing: P.watchlist.has(f.key) ? "On the watchlist, not seen yet." : "Not logged." })) });
const whose = (P) => P.me ? "Your" : `${P.name}'s`;
// One person's films (or diary entries), each opening with everyone's records.
const filmsOf = (P, title, films, people, o) => D.films(title, filmsSub(films), films, { lib: P.lib, cardOf: cardFor(people), ...o });
const entriesOf = (P, title, es, o) => D.entries(title, entriesSub(es), es, { lib: P.lib, who: P.me ? null : P.name, ...o });
// Films two people have both rated, with both ratings, closest first or furthest first.
function ratedByBoth(P, Q, title, order = "close") {
  const rows = P.films.map((f) => ({ f, a: f.rating, b: (Q.byKey.get(f.key) || {}).rating })).filter((x) => x.a && x.b)
    .sort((x, y) => order === "close" ? Math.abs(x.a - x.b) - Math.abs(y.a - y.b) || y.a - x.a : Math.abs(y.a - y.b) - Math.abs(x.a - x.b));
  const by = new Map(rows.map((x) => [x.f, x]));
  return D.films(title, `${plural(rows.length, "film")} rated by both, ${order === "close" ? "closest" : "furthest apart"} first`, rows.map((x) => x.f), { sort: "given", lib: P.lib, cardOf: cardFor([P, Q]),
    note: (f) => { const x = by.get(f); return `${P.me ? "You" : P.name} ${stars(x.a)} · ${Q.name} ${stars(x.b)}`; } });
}
const pairOf = (title, sub, a, b) => D.groups(title, sub, [a, b]);

/* ----- you and one other person ----- */
function comparePair(A, B, metaOf) {
  const shared = A.films.filter((f) => B.byKey.has(f.key));
  const union = A.films.length + B.films.length - shared.length;
  const pairs = shared.map((f) => ({ f, a: f.rating, b: B.byKey.get(f.key).rating })).filter((x) => x.a && x.b);
  const match = matchScore(pairs);
  const by = (fn) => (x, y) => fn(y) - fn(x);
  const popularity = (f) => { const x = LBX[f.key], m = metaOf(f); return (x && x.n) || (m && (m.iv || m.vc)) || 0; };
  const recs = (from, to) => from.films.filter((f) => f.rating >= 4 && !to.byKey.has(f.key))
    .sort((x, y) => y.rating - x.rating || popularity(y) - popularity(x)).slice(0, 12)
    .map((f) => ({ f, onWatchlist: to.watchlist.has(f.key) }));
  const topGenres = [...new Set([...A.genres.keys(), ...B.genres.keys()])]
    .map((g) => ({ g, a: genreShare(A, g), b: genreShare(B, g) })).sort((x, y) => (y.a + y.b) - (x.a + x.b)).slice(0, 10);
  const both = [A, B], card = cardFor(both);
  // each side of a comparison: your films that pass a test, then theirs
  const sides = (title, sub, test, o) => pairOf(title, sub, ...both.map((P) => { const fs = P.films.filter(test); return filmsOf(P, P.me ? "You" : B.name, fs, both, o); }));
  const to = {
    shared: D.films("Seen by both", `${plural(shared.length, "film")} you've both logged`, shared, { lib: A.lib, cardOf: card, note: (f) => `You ${stars(f.rating) || "–"} · ${B.name} ${stars(B.byKey.get(f.key).rating) || "–"}` }),
    onlyA: filmsOf(A, "Only you", A.films.filter((f) => !B.byKey.has(f.key)), both),
    onlyB: filmsOf(B, `Only ${B.name}`, B.films.filter((f) => !A.byKey.has(f.key)), both),
    rated: ratedByBoth(A, B, "Films you've both rated"),
    apart: ratedByBoth(A, B, "Where you disagree", "far"),
    ratings: sides("Ratings", "Each person's rated films", (f) => f.rating),
    genre: (g) => sides(g, "Each person's films in the genre", hasGenre(g)),
    age: sides("Release years", "Each person's films, oldest first", (f) => !!f.year, { sort: "old", note: (f) => `Released ${f.year}` }),
    nonEnglish: sides("Not in English", "Each person's films not in English", notEnglish, { note: langNote }),
    stars: (r) => sides(`Rated ${stars(r)}`, "Films each of you gave this rating", (f) => f.rating === r),
    person: (name, role) => pairOf(name, "Each person's films with them", ...both.map((P) => ({ ...personDrill(P.lib, name, role), title: P.me ? "You" : B.name, cardOf: card }))),
    personOf: (P, name, role) => ({ ...personDrill(P.lib, name, role), title: name, sub: `${whose(P)} films`, cardOf: card }),
    diary: (P) => entriesOf(P, `${whose(P)} diary`, P.lib.entries),
    weekend: (P) => entriesOf(P, `${whose(P)} weekends`, P.lib.entries.filter((e) => weekdayOf(e.date) >= 5)),
    rewatches: (P) => entriesOf(P, `${whose(P)} rewatches`, P.lib.entries.filter((e) => e.rewatch)),
    films: (P, title, test = () => true, o) => filmsOf(P, title || `${whose(P)} films`, P.films.filter(test), both, o),
    card,
  };
  const lines = [];
  if (shared.length) lines.push({ to: to.shared, text: `You've both seen ${plural(shared.length, "film")}: ${pctOf(shared.length, A.films.length)}% of yours and ${pctOf(shared.length, B.films.length)}% of ${B.name}'s.` });
  if (match.score != null) lines.push({ to: to.rated, text: `On the ${plural(match.n, "film")} you've both rated, your ratings are within half a star ${match.within}% of the time, and ${match.mad.toFixed(1)}★ apart on average.` });
  if (A.avg && B.avg && Math.abs(A.avg - B.avg) >= 0.15) lines.push({ to: to.ratings, text: `${A.avg > B.avg ? "You rate" : `${B.name} rates`} ${Math.abs(A.avg - B.avg).toFixed(1)}★ higher on average (${starsNum(Math.max(A.avg, B.avg))} against ${starsNum(Math.min(A.avg, B.avg))}).` });
  for (const x of topGenres.filter((x) => Math.abs(x.a - x.b) >= 6).sort((x, y) => Math.abs(y.a - y.b) - Math.abs(x.a - x.b)).slice(0, 3))
    lines.push({ to: to.genre(x.g), text: `${x.g} is ${Math.round(x.b)}% of ${B.name}'s films and ${Math.round(x.a)}% of yours.` });
  if (A.avgYear && B.avgYear && Math.abs(A.avgYear - B.avgYear) >= 5) lines.push({ to: to.age, text: `${A.avgYear < B.avgYear ? "You watch" : `${B.name} watches`} older films: an average release year of ${Math.min(A.avgYear, B.avgYear)} against ${Math.max(A.avgYear, B.avgYear)}.` });
  if (A.nonEnglish != null && B.nonEnglish != null && Math.abs(A.nonEnglish - B.nonEnglish) >= 10) lines.push({ to: to.nonEnglish, text: `Films not in English are ${B.nonEnglish}% of ${B.name}'s and ${A.nonEnglish}% of yours.` });
  if (A.perYear && B.perYear && Math.abs(A.perYear - B.perYear) / Math.min(A.perYear, B.perYear) >= 0.3)
    lines.push({ to: pairOf("Diary entries", "Each person's diary", to.diary(A), to.diary(B)), text: `${B.name} logs about ${fmtN(B.perYear)} films a year to your ${fmtN(A.perYear)}.` });
  const people = (mapA, mapB) => ({
    shared: [...mapA].filter(([n]) => mapB.has(n)).map(([n, a]) => ({ name: n, a, b: mapB.get(n) })).sort((x, y) => Math.min(y.a, y.b) - Math.min(x.a, x.b) || (y.a + y.b) - (x.a + x.b)).slice(0, 8),
    onlyA: [...mapA].filter(([n, c]) => c >= 2 && !mapB.has(n)).sort((x, y) => y[1] - x[1]).slice(0, 6),
    onlyB: [...mapB].filter(([n, c]) => c >= 2 && !mapA.has(n)).sort((x, y) => y[1] - x[1]).slice(0, 6),
  });
  return {
    A, B, shared, union, pairs, match, lines, topGenres, to,
    overlap: { onlyA: A.films.length - shared.length, both: shared.length, onlyB: B.films.length - shared.length, jaccard: union ? shared.length / union : 0 },
    bothLoved: pairs.filter((x) => x.a >= 4.5 && x.b >= 4.5).sort(by((x) => x.a + x.b)).slice(0, 12),
    aHigher: pairs.filter((x) => x.a - x.b >= 1.5).sort(by((x) => x.a - x.b)).slice(0, 12),
    bHigher: pairs.filter((x) => x.b - x.a >= 1.5).sort(by((x) => x.b - x.a)).slice(0, 12),
    forA: recs(B, A), forB: recs(A, B),
    together: [...A.watchlist.values()].filter((w) => B.watchlist.has(w.key)),
    directors: people(A.directors, B.directors), actors: people(A.actors, B.actors),

}

// The habits table in a pair comparison: label, then your cell and theirs, each opening what it counts.
function habitRows(C) {
  const { A, B, to } = C;
  const pct = (v) => v != null ? v + "%" : null;
  const row = (k, val, mk) => [k, ...[A, B].map((P) => { const v = val(P); return v == null ? "—" : dlink(mk(P), v); })];
  return [
    row("Films logged", (P) => fmtN(P.films.length), (P) => to.films(P)),
    row("Diary entries a year", (P) => P.perYear && fmtN(P.perYear), (P) => to.diary(P)),
    row("Average rating", (P) => P.avg && P.avg.toFixed(2), (P) => to.films(P, `${whose(P)} ratings`, (f) => f.rating)),
    row("Average release year", (P) => P.avgYear, (P) => to.films(P, `${whose(P)} films by release year`, (f) => !!f.year, { sort: "old", note: (f) => `Released ${f.year}` })),
    row("Not in English", (P) => pct(P.nonEnglish), (P) => to.films(P, `${whose(P)} films not in English`, notEnglish, { note: langNote })),
    row("On weekends", (P) => pct(P.weekend), (P) => to.weekend(P)),
    row("Rewatches", (P) => pct(P.rewatch), (P) => to.rewatches(P)),
  ];
}

/* ----- everyone at once ----- */
function compareGroup(profiles) {
  const n = profiles.length;
  const matrix = profiles.map((P) => profiles.map((Q) => {
    if (P === Q) return null;
    const pairs = P.films.map((f) => ({ a: f.rating, b: (Q.byKey.get(f.key) || {}).rating })).filter((x) => x.a && x.b);
    return matchScore(pairs);
  }));
  const ratings = new Map(); // film key → { f, by: [{ name, r }] }
  for (const P of profiles) for (const f of P.rated) {
    let x = ratings.get(f.key); if (!x) { x = { f, by: [] }; ratings.set(f.key, x); }
    x.by.push({ name: P.name, r: f.rating });
  }
  const sd = (xs) => { const m = avg(xs); return Math.sqrt(avg(xs.map((x) => (x - m) ** 2))); };
  const multi = [...ratings.values()].filter((x) => x.by.length >= Math.min(3, n)).map((x) => ({ ...x, mean: avg(x.by.map((b) => b.r)), sd: sd(x.by.map((b) => b.r)) }));
  const seenBy = new Map();
  for (const P of profiles) for (const f of P.films) seenBy.set(f.key, (seenBy.get(f.key) || 0) + 1);
  const wanted = new Map();
  for (const P of profiles) for (const w of P.watchlist.values()) { const x = wanted.get(w.key) || { w, by: [] }; x.by.push(P.name); wanted.set(w.key, x); }
  // a movie-night pick: on several watchlists, or loved by someone and unseen by most of the group
  const picks = [...wanted.values()].filter((x) => x.by.length >= 2).sort((a, b) => b.by.length - a.by.length).map((x) => ({ name: x.w.name, year: x.w.year, why: `On ${x.by.length} watchlists: ${x.by.join(", ")}` }));
  for (const x of [...ratings.values()].filter((x) => x.by.some((b) => b.r >= 4.5) && (seenBy.get(x.f.key) || 0) <= n / 2).sort((a, b) => Math.max(...b.by.map((q) => q.r)) - Math.max(...a.by.map((q) => q.r))).slice(0, 8)) {
    const fans = x.by.filter((b) => b.r >= 4.5).map((b) => b.name);
    if (!picks.some((p) => p.name === x.f.name && p.year === x.f.year)) picks.push({ name: x.f.name, year: x.f.year, f: x.f, why: `${fans.join(" and ")} gave it ${stars(Math.max(...x.by.map((b) => b.r)))}; ${n - (seenBy.get(x.f.key) || 0)} of ${n} haven't seen it` });
  }
  const allSeen = profiles[0].films.filter((f) => seenBy.get(f.key) === n);
  return {
    card: cardFor(profiles), pairTo: (i, j) => ratedByBoth(profiles[i], profiles[j], `${profiles[i].me ? "You" : profiles[i].name} and ${profiles[j].name}`),
    everyoneTo: D.films("Seen by everyone", plural(allSeen.length, "film"), allSeen, { lib: profiles[0].lib, cardOf: cardFor(profiles) }),
    matrix, everyone: allSeen.length,
    divisive: multi.filter((x) => x.sd >= 0.75).sort((a, b) => b.sd - a.sd).slice(0, 8),
    loved: multi.filter((x) => x.mean >= 4.25 && x.sd <= 0.5).sort((a, b) => b.mean - a.mean).slice(0, 8),
    picks: picks.slice(0, 8),
  };
}

<script>
/* ---------- reviews: the words behind the ratings ---------- */
const STOPWORDS = new Set(`the and for that this with was but are not you all any can had her his one our out get has him how its may new now see two who did let put say she too use from have they will been more when what were your than then them some just into only also very much even such here most like over well back many does make made each those after where which while about would could there their these other being still really thing things through every because before again first last never ever though think know going felt feel feels lot little bit enough always something nothing anything everything someone without within around another itself himself herself myself yourself whole kind sort maybe almost quite rather pretty seem seems seemed got gets getting goes went come came comes take took make makes making give gave look looks looked watch watched watching rewatch rewatched film films movie movies cinema scene scenes character characters story time times way ways year years day days man men people`.split(/\s+/));
const reviewWords = (text) => (text.toLowerCase().match(/\p{L}[\p{L}'’-]*/gu) || [])
  .map((w) => w.replace(/’/g, "'").replace(/'s$/, "").replace(/-+$/, "")).filter((w) => w.length > 2 && !STOPWORDS.has(w));
const reviewsIn = (lib, Y) => lib.reviews.filter((r) => r.text && (!Y || (r.date || "").startsWith(Y)));

// Counts, lengths, which films you review, and the words you use, overall or for one year.
function computeReviewInsights(lib, Y) {
  const R = reviewsIn(lib, Y);
  if (!R.length) return null;
  const total = R.reduce((s, r) => s + r.words, 0);
  const byLength = [...R].sort((a, b) => b.words - a.words);
  const median = byLength[Math.floor(byLength.length / 2)].words;
  const docFreq = (list) => { const m = new Map(); for (const r of list) for (const w of new Set(reviewWords(r.text))) bump(m, w); return m; };
  const top = [...docFreq(R)].filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 24);
  // words that set your reviews of loved films apart from the rest, and the other way round
  const hi = R.filter((r) => r.rating >= 4.5), lo = R.filter((r) => r.rating && r.rating <= 3);
  let love = [], cold = [];
  if (hi.length >= 4 && lo.length >= 3) {
    const dh = docFreq(hi), dl = docFreq(lo);
    const lean = (w) => Math.log(((dh.get(w) || 0) + 0.5) / (hi.length + 1)) - Math.log(((dl.get(w) || 0) + 0.5) / (lo.length + 1));
    love = [...dh.keys()].filter((w) => dh.get(w) >= 2 && lean(w) > 0).sort((a, b) => lean(b) - lean(a)).slice(0, 8);
    cold = [...dl.keys()].filter((w) => dl.get(w) >= 2 && lean(w) < 0).sort((a, b) => lean(a) - lean(b)).slice(0, 8);
  }
  const films = Y ? [...new Set(lib.entries.filter((e) => e.date.startsWith(Y)).map((e) => e.film))] : lib.films;
  const reviewed = new Set(R.map((r) => r.film));
  const rated = films.filter((f) => f.rating);
  const avgReviewed = avg(rated.filter((f) => reviewed.has(f)).map((f) => f.rating)), avgOthers = avg(rated.filter((f) => !reviewed.has(f)).map((f) => f.rating));
  const shareAt = (test) => { const fs = rated.filter((f) => test(f.rating)); return fs.length >= 3 ? pctOf(fs.filter((f) => reviewed.has(f)).length, fs.length) : null; };
  const loveShare = shareAt((r) => r >= 4.5), lowShare = shareAt((r) => r <= 2.5);
  const all = D.reviews(Y ? `Reviews of ${Y}` : "Your reviews", `${plural(R.length, "review")} · ${fmtN(total)} words`, R);
  const split = (title, fs) => D.groups(title, Y ? `Films you logged in ${Y}` : "Every film you've logged", [
    D.films("Reviewed", filmsSub(fs.filter((f) => reviewed.has(f))), fs.filter((f) => reviewed.has(f))), D.films("Not reviewed", filmsSub(fs.filter((f) => !reviewed.has(f))), fs.filter((f) => !reviewed.has(f)))]);
  const lines = [
    { text: `${Y ? `In ${Y} you wrote` : "You've written"} ${plural(R.length, "review")}, about ${fmtN(total)} words in all${total >= 600 ? `: roughly ${fmtN(Math.round(total / 300))} pages of a paperback` : ""}.`, to: all },
    { text: `A typical review runs ${plural(median, "word")}; the longest, for ${byLength[0].film.name}, runs ${fmtN(byLength[0].words)}.`, to: D.reviews(Y ? `Your ${Y} reviews by length` : "Your reviews by length", `A typical one runs ${plural(median, "word")}`, byLength) },
  ];
  if (films.length) lines.push({ text: `You've reviewed ${pctOf(reviewed.size, films.length)}% of the films you logged${Y ? ` in ${Y}` : ""}.`, to: split("Reviewed and not", films) });
  if (avgReviewed && avgOthers && Math.abs(avgReviewed - avgOthers) >= 0.15)
    lines.push({ text: `You review the films you ${avgReviewed > avgOthers ? "like more" : "like less"}: ${starsNum(avgReviewed)} on average for the ones you reviewed, against ${starsNum(avgOthers)} for the rest.`, to: split("Reviewed and not", rated) });
  if (loveShare != null && lowShare != null && Math.abs(loveShare - lowShare) >= 10)
    lines.push({ text: `You review ${loveShare}% of the films you rate 4½★ or more, and ${lowShare}% of those you rate 2½★ or less.`,
      to: D.groups("Which films you review", "", [split("", rated.filter((f) => f.rating >= 4.5)).groups.map((g) => ({ ...g, title: `Rated 4½★ or more: ${g.title.toLowerCase()}` })),
        split("", rated.filter((f) => f.rating <= 2.5)).groups.map((g) => ({ ...g, title: `Rated 2½★ or less: ${g.title.toLowerCase()}` }))].flat()) });
  const perYear = Y ? [] : [...new Set(R.map((r) => (r.date || "").slice(0, 4)).filter(Boolean))].sort()
    .map((y) => { const list = R.filter((r) => (r.date || "").startsWith(y)); return { year: y, count: list.length, to: D.reviews(`Reviews of ${y}`, plural(list.length, "review"), list) }; });
  // the reviews that use a word, from all of them or just the loved or unloved ones
  const words = new Map(R.map((r) => [r, new Set(reviewWords(r.text))]));
  const withWord = (w, among = R, label) => { const list = among.filter((r) => words.get(r).has(w)); return D.reviews(`“${w}”`, `${plural(list.length, "review")}${label ? ` ${label}` : ""} use it`, list, { mark: w }); };
  return { count: R.length, total, median, longest: byLength[0], top, love, cold, lines, perYear, all,
    wordTo: (w) => withWord(w), loveTo: (w) => withWord(w, hi, "of films you rated 4½★ or more"), coldTo: (w) => withWord(w, lo, "of films you rated 3★ or less") };
}
// Reviews of the same film by two people, both with text.
function bothReviewed(A, B) {
  const theirs = new Map(B.lib.reviews.filter((r) => r.text).map((r) => [r.film.key, r]));
  return A.lib.reviews.filter((r) => r.text && theirs.has(r.film.key)).map((r) => ({ f: r.film, mine: r, theirs: theirs.get(r.film.key) }));
}
// A short plain-text excerpt for side-by-side views.
const excerpt = (text, n = 220) => text.length > n ? text.slice(0, n).replace(/\s+\S*$/, "") + "…" : text;
</script>
<script>
/* ---------- drill-downs: what a click on any number opens ----------
   A drill describes the data behind a stat: the films, diary entries, reviews, people or single film it counts.
   Each link registers one under an id (data-list="…"); the pop-up and the full page render it the same way. */
let LISTS = new Map(), PANEL = new Map(), listSeq = 0, regInto = null;
function drill(d) { const id = "l" + (++listSeq); (regInto || LISTS).set(id, d); return id; }
const drillGet = (id) => PANEL.get(id) || LISTS.get(id);
// Render something whose links belong to the pop-up, so a page re-render can't drop them.
function inPanel(fn) { const was = regInto; regInto = PANEL; try { return fn(); } finally { regInto = was; } }
function reg(title, sub, films, person) { return drill({ kind: "films", title, sub, films, person }); }
const D = {
  films: (title, sub, films, o) => ({ kind: "films", title, sub, films, ...o }),
  entries: (title, sub, entries, o) => ({ kind: "entries", title, sub, entries, ...o }),
  reviews: (title, sub, reviews, o) => ({ kind: "reviews", title, sub, reviews, ...o }),
  names: (title, sub, items, o) => ({ kind: "names", title, sub, items, ...o }),
  plain: (title, sub, items, o) => ({ kind: "plain", title, sub, items, ...o }),
  groups: (title, sub, groups, o) => ({ kind: "groups", title, sub, groups: groups.filter(Boolean), ...o }),
  film: (f, o) => ({ kind: "film", film: f, title: f.name, sub: f.year ? String(f.year) : "", ...o }),
};
const dl = (d) => `data-list="${drill(d)}"`;
// a number or name that opens its drill; a whole sentence that does
const dlink = (d, html) => d ? `<button class="dlink" type="button" ${dl(d)}>${html}</button>` : html;
const dline = (d, html) => d ? `<button class="dline" type="button" ${dl(d)}>${html}<span class="go" aria-hidden="true">&nbsp;›</span></button>` : html;

const PANEL_CAP = 25;
const drillSize = (d) => d.kind === "film" ? 1 : d.kind === "search" || d.kind === "share" || d.kind === "story" || d.kind === "filters" ? 0 : d.kind === "groups" ? d.groups.reduce((s, g) => s + drillSize(g), 0)
  : (d.films || d.entries || d.reviews || d.items || []).length;

/* ----- sub-lines ----- */
const runtimeOf = (f) => { const m = metaOf(f); return (m && m.r) || 0; };
const viewsIn = (f, scope) => !scope || scope === "all" ? f.entries.length : f.entries.filter((e) => e.date.startsWith(scope)).length;
const filmsSub = (films, extra) => {
  const r = films.filter((f) => f.rating);
  return `${plural(films.length, "film")}${r.length ? ` · ${avg(r.map((f) => f.rating)).toFixed(2)} average` : ""}${extra ? ` · ${extra}` : ""}`;
};
const entriesSub = (es, extra) => {
  const n = new Set(es.map((e) => e.film)).size;
  return `${plural(es.length, "diary entry", "diary entries")}${n !== es.length ? ` of ${plural(n, "film")}` : ""}${extra ? ` · ${extra}` : ""}`;
};
const dateSpan = (a, b) => a === b ? fmtDate(a) : a.slice(0, 4) === b.slice(0, 4) ? `${fmtDate(a).replace(/ \d{4}$/, "")} – ${fmtDate(b)}` : `${fmtDate(a)} – ${fmtDate(b)}`;
const monthName = (ym) => `${MONTHS_LONG[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
const lbUrl = (f) => /^https?:\/\//.test(f.uri || "") ? f.uri : `https://letterboxd.com/search/films/${encodeURIComponent(`${f.name}${f.year ? ` ${f.year}` : ""}`)}/`;

/* ----- ready-made drills for the stats both layouts show ----- */
const DR = {
  films: (s, title) => D.films(title || (s.scope === "all" ? "All films" : `Films of ${s.scope}`), filmsSub(s.films), s.films, { scope: s.scope, sort: "watched" }),
  diary: (s) => D.entries(s.scope === "all" ? "Your diary" : `Diary of ${s.scope}`, entriesSub(s.entries), s.entries),
  rated: (s) => D.films("Rated films", filmsSub(s.films.filter((f) => f.rating)), s.films.filter((f) => f.rating), { scope: s.scope }),
  liked: (s) => D.films("Liked films", filmsSub(s.films.filter((f) => f.liked)), s.films.filter((f) => f.liked), { scope: s.scope }),
  rewatches: (s) => { const es = s.entries.filter((e) => e.rewatch); return D.entries("Rewatches", entriesSub(es, `${s.entries.length ? Math.round(es.length / s.entries.length * 100) : 0}% of the diary`), es); },
  runtime: (s) => {
    const fs = s.films.filter((f) => runtimeOf(f));
    return D.films("Hours, film by film", `${fmtN(Math.round(s.minutes / 60))} hours over ${plural(fs.length, "film")} with a known runtime`, fs, { scope: s.scope, sort: "runtime",
      note: (f) => { const v = viewsIn(f, s.scope); return `${runtimeOf(f)} min${v > 1 ? ` × ${v} viewings = ${fmtN(runtimeOf(f) * v)} min` : ""}`; } });
  },
  released: (s, y) => { const fs = s.films.filter((f) => String(f.year) === String(y)); return D.films(`Released in ${y}`, filmsSub(fs), fs, { scope: s.scope }); },
  inDiary: (s) => { const fs = s.films.filter((f) => f.entries.length); return D.films("Films in your diary", filmsSub(fs), fs, { scope: s.scope, sort: "watched" }); },
  watchlist: (lib) => D.plain("Watchlist", plural(lib.watchlistFilms.length, "film"), lib.watchlistFilms),
  streak: (s) => {
    const end = s.streak.end, start = end - s.streak.days + 1;
    const es = s.entries.filter((e) => { const d = dayIndex(e.date); return d >= start && d <= end; });
    return D.entries("Longest streak", `${s.streak.days} days in a row, ${dateSpan(isoOfDay(start), isoOfDay(end))} · ${entriesSub(es)}`, es, { order: "asc" });
  },
  day: (es, iso, list = es.filter((e) => e.date === iso)) => D.entries(fmtDate(iso), `${WEEKDAYS_LONG[weekdayOf(iso)]} · ${entriesSub(list)}`, list, { order: "asc" }),
  month: (es, ym) => { const list = es.filter((e) => e.date.startsWith(ym)); return D.entries(monthName(ym), entriesSub(list), list, { order: "asc" }); },
  year: (es, y) => { const list = es.filter((e) => e.date.startsWith(y)); return D.entries(`Diary of ${y}`, entriesSub(list), list); },
  weekday: (es, i) => {
    const list = es.filter((e) => weekdayOf(e.date) === i);
    return D.entries(`${WEEKDAYS_LONG[i]}s`, entriesSub(list, `${es.length ? Math.round(list.length / es.length * 100) : 0}% of the diary`), list);
  },
  rating: (films, r) => { const fs = films.filter((f) => f.rating === r); return D.films(`Rated ${stars(r)}`, plural(fs.length, "film"), fs, { sort: "watched" }); },
  decade: (x) => D.films(`The ${x.decade}s`, filmsSub(x.films), x.films, { sort: "old" }),
  film: (f, o) => D.film(f, o),
  person: (p, o) => D.films(p.name, personSub(p), p.films, { person: p, ...o }),
};
// Every week, month or year of the diary with its count, each opening its entries.
const unitsDrill = (cols, unit, per) => D.names(`Diary entries by ${unit}`, `${per.toFixed(1)} a ${unit} on average`,
  cols.filter((c) => c.to).reverse().map((c) => ({ name: c.tipLabel, value: fmtN(c.es.length), note: entriesSub(c.es), to: c.to })));
// Every film in a library with one person in it: a director, writer or one of the top-billed cast.
function personDrill(lib, name, role, among = lib.films) {
  const k = personKey(name);
  const films = among.filter((f) => { const m = metaOf(f); return m && roleNames(m, role).some((n) => personKey(n) === k); });
  const ratings = films.filter((f) => f.rating).map((f) => f.rating);
  return DR.person({ key: k, name, films, ratings, count: films.length, avg: avg(ratings) }, { lib });
}
// How many films of a library count each person in a role, by `personKey` (kept until the library or the people change).
const COUNTED = new WeakMap();
function countedIn(lib, role) {
  const P = peopleIndex();
  let c = COUNTED.get(lib.films);
  if (!c || c.P !== P) COUNTED.set(lib.films, (c = { P }));
  if (!c[role]) {
    c[role] = new Map();
    for (const f of lib.films) { const m = metaOf(f); if (m) for (const n of roleNames(m, role)) { const k = personKey(n); c[role].set(k, (c[role].get(k) || 0) + 1); } }
  }
  return c[role];
}
// Every film in a library with one genre, country or language.
function catDrill(lib, v, field) {
  const films = lib.films.filter((f) => { const m = metaOf(f); return m && (field === "l" ? m.l === v : (m[field] || []).includes(v)); });
  return D.films(v, filmsSub(films), films, { lib });
}

/* ----- rendering, shared by the pop-up and the full page ----- */
function thumb(f, big) {
  const m = metaOf(f);
  const img = showImages && m && m.poster ? `<img src="${IMG}${esc(m.poster)}" alt="" loading="lazy">` : "";
  return `<span class="thumb${big ? " big" : ""}" aria-hidden="true"><span class="tt">${big ? esc(f.name) : esc(initials(f.name) || "?")}</span>${img}</span>`;
}
const SORTS = {
  rating: (a, b) => (b.rating || 0) - (a.rating || 0) || (b.year || 0) - (a.year || 0) || a.name.localeCompare(b.name),
  runtime: (a, b) => runtimeOf(b) - runtimeOf(a) || a.name.localeCompare(b.name),
  short: (a, b) => runtimeOf(a) - runtimeOf(b) || a.name.localeCompare(b.name),
  old: (a, b) => (a.year || 9999) - (b.year || 9999) || a.name.localeCompare(b.name),
  watched: (a, b) => lastSeen(b).localeCompare(lastSeen(a)) || (b.rating || 0) - (a.rating || 0),
  name: (a, b) => a.name.localeCompare(b.name),
};
const lastSeen = (f) => f.entries.length ? f.entries[f.entries.length - 1].date : "";
function itemsOf(d) {
  if (d.kind === "films") return d.sort === "given" ? d.films : [...d.films].sort(SORTS[d.sort || "rating"]);
  if (d.kind === "entries") {
    const es = [...d.entries].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.order - b.order);
    return d.order === "asc" ? es : es.reverse();
  }
  return d.reviews || d.items || [];
}
const icons = (e, f) => `${e && e.rewatch ? '<span class="ic" title="Rewatch">↻</span>' : ""}${f.liked ? '<span class="ic heart" title="Liked">♥</span>' : ""}${e && e.review ? '<span class="ic" title="Reviewed">≡</span>' : ""}`;
function filmRowHtml(f, d) {
  const n = f.entries.length, last = n ? f.entries[n - 1].date : null;
  const note = d.note ? d.note(f) : last ? `Watched ${fmtDate(last)}${n > 1 ? ` · ${n} viewings` : ""}` : "Logged without a date";
  const r = d.ratingOf ? d.ratingOf(f) : f.rating;
  return `<button class="drill-row" type="button" ${dl(d.cardOf ? d.cardOf(f) : D.film(f, { lib: d.lib, who: d.who }))}>${thumb(f)}
    <span class="dr-main"><span class="dr-t">${esc(f.name)} <span class="dr-y">${f.year || ""}</span></span><span class="dr-s">${esc(note)}</span></span>
    <span class="dr-r"><span class="stars">${stars(r)}</span>${icons(null, f)}</span></button>`;
}
function entryRowsHtml(list, all, d) {
  const per = new Map();
  for (const e of all) per.set(e.date.slice(0, 7), (per.get(e.date.slice(0, 7)) || 0) + 1);
  let html = "", month = "";
  for (const e of list) {
    const m = e.date.slice(0, 7), f = e.film;
    if (m !== month) { month = m; html += `<div class="drill-month"><span>${monthName(m)}</span><span>${fmtN(per.get(m))}</span></div>`; }
    const note = d.note ? d.note(e) : "";
    html += `<button class="drill-row entry" type="button" ${dl(d.cardOf ? d.cardOf(f) : D.film(f, { lib: d.lib, entry: e, who: d.who }))}>
      <span class="dr-d"><b>${+e.date.slice(8, 10)}</b><small>${WEEKDAYS[weekdayOf(e.date)]}</small></span>${thumb(f)}
      <span class="dr-main"><span class="dr-t">${esc(f.name)} <span class="dr-y">${f.year || ""}</span></span>${note ? `<span class="dr-s">${esc(note)}</span>` : ""}</span>
      <span class="dr-r"><span class="stars">${stars(e.rating)}</span>${icons(e, f)}</span></button>`;
  }
  return html;
}

function crowdBits(f, m) {

  const smallList = () => D.names("Small parts, not counted", `${f.name}: billed below the principal cast, or a bit part`,
    small.map((p) => { const it = { key: personKey(p.name), name: p.name, films: [f], note: smallWhy(p) };

  const smallLine = !small.length ? "" : `<p class="dr-s fc-cameos">Small parts, not counted: ${named.map((p) => esc(p.name)).join(", ")}${

<script>
/* ---------- the daily Letterboxd feed ----------
   A GitHub workflow reads the member's public RSS feed each day into feed/<username>.json on this site.
   Entries the export doesn't have yet are added to the diary when the page opens; the export itself is
   left as it was, so a fresh import simply takes over. */
let FEED = null, FEED_ADDED = [];
// The repository a GitHub Pages copy is published from, for the link that adds a username to the feed.
// The site's own GitHub repository, from its address: sjnift.github.io/bogie1946/ is sjnift/bogie1946, and the
// short sjnift.github.io/ (a repository named sjnift.github.io) is sjnift/sjnift.github.io.
function repoOfPage(host, path) {
  const m = String(host).match(/^([\w-]+)\.github\.io$/i);
  if (!m) return null;
  const first = String(path).split("/")[1] || "";
  return `https://github.com/${m[1]}/${first && !first.includes(".") ? first : `${m[1].toLowerCase()}.github.io`}`;
}
const SITE_REPO = repoOfPage(location.hostname, location.pathname);
async function loadFeed(user) {
  if (IN_VIEWER || !user || !/^https?:$/.test(location.protocol)) return null;
  try {
    const r = await fetch(`feed/${encodeURIComponent(user.toLowerCase())}.json`, { cache: "no-cache" });
    const feed = r.ok ? await r.json() : null;
    return feed && Array.isArray(feed.items) ? feed : null;
  } catch { return null; }
}
// The export's rows plus the feed's entries it doesn't have: diary, watched, rating, like and review.
function withFeed(rows, feed) {
  if (!rows || !feed) return { rows, added: [] };
  const out = { ...rows, diary: [...(rows.diary || [])], watched: [...(rows.watched || [])], ratings: [...(rows.ratings || [])], reviews: [...(rows.reviews || [])], likes: [...(rows.likes || [])] };
  const k = (r) => filmKey(r.Name, r.Year);
  // the export's spelling of each title, so a feed film is the same film however its title is written
  const spelled = new Map();
  for (const r of [...out.watched, ...out.diary, ...out.ratings]) if (!spelled.has(titleKey(r.Name, r.Year))) spelled.set(titleKey(r.Name, r.Year), r.Name);
  // An entry logged before the export's newest one is in the export already, perhaps with its date
  // changed since; adding it again would count that viewing twice.
  const exportedUpTo = out.diary.reduce((m, r) => (r.Date || "") > m ? r.Date : m, "");
  // what the export has, by the title key, so a differently written title still counts as the same film
  const t = (r) => titleKey(r.Name, r.Year);
  const inDiary = new Set(out.diary.map((r) => `${t(r)}|${r["Watched Date"] || r.Date}`));
  const watched = new Set(out.watched.map(t)), rated = new Set(out.ratings.map(t)), liked = new Set(out.likes.map(t));
  const added = [];
  for (const x of [...feed.items].sort((a, b) => a.watched.localeCompare(b.watched))) {
    const title = spelled.get(titleKey(x.title, x.year)) || unescapeText(x.title);
    const base = { Name: title, Year: x.year ? String(x.year) : "" }, fk = k(base), tk = t(base);
    if (x.tmdb) KNOWN_IDS[fk] = x.tmdb;
    if (inDiary.has(`${tk}|${x.watched}`) || (x.logged && x.logged < exportedUpTo)) continue;
    inDiary.add(`${tk}|${x.watched}`);
    const entry = { ...base, Date: x.logged || x.watched, "Watched Date": x.watched, Rating: x.rating ? String(x.rating) : "", Rewatch: x.rewatch ? "Yes" : "", Tags: "" };
    out.diary.push(entry);
    if (!watched.has(tk)) { out.watched.push({ ...base, Date: x.logged || x.watched, "Letterboxd URI": "" }); watched.add(tk); }
    if (x.rating && !rated.has(tk)) { out.ratings.push({ ...base, Rating: String(x.rating) }); rated.add(tk); }
    if (x.liked && !liked.has(tk)) { out.likes.push(base); liked.add(tk); }
    if (x.review) out.reviews.push({ ...entry, Review: x.review, feed: true });
    added.push({ ...x, title });
  }
  return { rows: out, added };
}
// Builds your library from the saved export and whatever the feed adds.
function myLibrary() {
  const saved = store.get(KEYS.rows, null);
  if (!saved) return null;
  const user = ((saved.profile || [])[0] || {}).Username || "";
  const fit = FEED && user && FEED.user.toLowerCase() === user.toLowerCase();
  const { rows, added } = withFeed(saved, fit ? FEED : null);

}
// The feed's line in the Cast & crew box, or how to switch it on.
function feedBlock(lib, phone) {
  if (IN_VIEWER || !lib || state.mode !== "mine") return "";
  const title = phone ? `<p class="title" style="margin-top:6px">Daily diary updates</p>` : `<h3 class="sub-h">Daily diary updates</h3>`;
  const user = lib.profile.username;
  if (FEED && user && FEED.user.toLowerCase() === user.toLowerCase()) {
    const newest = FEED.items[0];
    const es = lib.entries.filter((e) => FEED_ADDED.some((x) => filmKey(x.title, x.year) === e.film.key && x.watched === e.date));
    return title + `<p class="status">Your Letterboxd feed is read once a day.${newest ? ` Newest entry: ${esc(newest.title)}, ${fmtDate(newest.watched)}.` : ""}
      ${es.length ? `${dlink(D.entries("From your Letterboxd feed", `${entriesSub(es)} logged since your export`, es), plural(es.length, "diary entry", "diary entries"))} came from it since your export.` : "Your export already has everything in it."}</p>`;
  }
  // switching it on means changing this site's repository: only for the device of the site's owner (it has their GitHub key)
  if (!user || !SITE_REPO || !SITEPUB || !siteSameUser()) return "";
  return title + `<p class="status">New diary entries can show up here each day without a fresh export. Add <b>${esc(user)}</b> on a line of its own to
    <a href="${SITE_REPO}/edit/main/feed-users.txt" target="_blank" rel="noopener">feed-users.txt</a> in your GitHub repository and commit it.
    Your diary must be public on Letterboxd; the entries are then also public on this site.</p>`;
}

// Settings: where this device gets posters and photos (TMDB, or the relay where TMDB can't be reached; see 05-core).
function picturesBlock(phone) {
  if (IN_VIEWER) return "";
  const title = phone ? `<p class="title" style="margin-top:6px">Posters and photos</p>` : `<h3 class="sub-h">Posters and photos</h3>`;
  return title + `<p class="status" data-img-status>${imgStatusHtml()}</p>`;

/* ---------- backups: the same diary on another device ---------- */
function backupData(withKeys) {
  const b = { app: "credits-roll", v: 1, at: new Date().toISOString(), rows: store.get(KEYS.rows, null), meta: META, photos: PHOTOS, lbx: LBX, facts: FACTS, friends: store.get(KEYS.friends, []) };
  if (withKeys) b.keys = { tmdb: store.get(KEYS.tmdb, ""), omdb: store.get(KEYS.omdb, ""), apify: store.get(KEYS.apify, "") };
  return b;
}
function downloadBackup(withKeys) {
  const blob = new Blob([JSON.stringify(backupData(withKeys))], { type: "application/json" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: `credits-roll-backup-${new Date().toISOString().slice(0, 10)}.json` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const isBackupFile = (files) => files.length === 1 && /\.json$/i.test(files[0].name);
// Restores a backup made on another device: its export replaces this one; details and averages are added.
async function restoreBackup(file) {
  let b;
  try { b = JSON.parse(await file.text()); } catch { throw new Error("That file isn't a Credits Roll backup."); }
  if (!b || b.app !== "credits-roll" || !b.rows) throw new Error("That file isn't a Credits Roll backup.");
  store.set(KEYS.rows, b.rows);
  META = { ...META, ...safeMetaMap(b.meta) }; PHOTOS = { ...PHOTOS, ...safePhotos(b.photos) }; LBX = { ...LBX, ...safeLbx(b.lbx) }; FACTS = { ...FACTS, ...safeFacts(b.facts) };
  saveMeta(); store.set(KEYS.lbx, LBX); store.set(KEYS.facts, FACTS);
  if (Array.isArray(b.friends) && b.friends.length) { store.set(KEYS.friends, safeFriends(b.friends)); loadFriends(); }
  for (const k of ["tmdb", "omdb", "apify"]) if (typeof (b.keys || {})[k] === "string" && b.keys[k]) store.set(KEYS[k], b.keys[k]); // only the keys, nothing else
  await store.flush();
  return `Restored the backup from ${fmtDate(String(b.at || "").slice(0, 10))}${b.keys ? ", keys included" : ""}.`;
}

/* ---------- search ---------- */
let SEARCH_INDEX = null;
function searchIndex(lib) {
  if (SEARCH_INDEX && SEARCH_INDEX.lib === lib && SEARCH_INDEX.n === Object.keys(META).length) return SEARCH_INDEX;
  const people = new Map(), cats = new Map();
  const ROLE = { d: "Director", c: "Actor", v: "Voice actor", w: "Writer", p: "Cinematographer", m: "Composer" };
  for (const f of lib.films) {
    const m = metaOf(f);
    if (!m) continue;
    for (const role of ["d", "c", "v", "w", "p", "m"]) for (const name of roleNames(m, role)) {
      const k = personKey(name);
      let p = people.get(k);
      if (!p) { p = { key: k, name, films: new Set(), roles: new Map(), k }; people.set(k, p); }
      p.films.add(f); p.roles.set(role, (p.roles.get(role) || 0) + 1);
    }
    for (const [field, vals] of [["g", m.g], ["k", m.k], ["l", m.l ? [m.l] : []]]) for (const v of new Set(vals)) {
      let c = cats.get(v);
      if (!c) { c = { name: v, field, films: [], k: personKey(v) }; cats.set(v, c); }
      c.films.push(f);
    }
  }
  SEARCH_INDEX = { lib, n: Object.keys(META).length, films: lib.films.map((f) => ({ f, k: personKey(f.name) })),
    people: [...people.values()].map((p) => ({ ...p, films: [...p.films], role: [...p.roles].sort((a, b) => b[1] - a[1])[0][0], roleName: ROLE })), cats: [...cats.values()] };
  return SEARCH_INDEX;
}
function searchResultsHtml(d) {
  const lib = state.lib, q = personKey(d.q || "");
  if (!q) return `<p class="dr-s search-hint">Type a film's title, or the name of a director, actor, writer, genre, country or language.</p>`;
  const score = (k) => k === q ? 4 : k.startsWith(q) ? 3 : (" " + k).includes(" " + q) ? 2 : k.includes(q) ? 1 : 0;
  const I = searchIndex(lib);

// Words wrapped to a width, at most `lines` lines, the last cut with an ellipsis.
function wrapText(ctx, text, width, lines) {

    const next = cur ? `${cur} ${w}` : w;
    if (ctx.measureText(next).width <= width || !cur) cur = next; else { out.push(cur); cur = w; }
  }
  if (cur) out.push(cur);
  if (out.length > lines) { out.length = lines; let last = out[lines - 1]; while (last && ctx.measureText(last + "…").width > width) last = last.slice(0, -1); out[lines - 1] = last + "…"; }

  let t = String(text);

  while (t && ctx.measureText(t + "…").width > width) t = t.slice(0, -1);
  return t + "…";
}

<script>
/* ---------- your diary on this site, locked with a password ----------
   A copy lives on the site itself: docs/diary/ in the site's own repository, committed through GitHub's API. It is
   encrypted (AES-GCM, with a key made from the owner's password by PBKDF2) in parts: the export, the keys (TMDB,
   OMDb, Apify and the GitHub key that lets a device update the site), Letterboxd averages, friends, and film
   details and people's photos spread over 16 parts each, so a few newly found films send only the few parts they
   fall in. Every device given the password once shows the diary with no import, has the keys without typing them,
   and keeps the site up to date itself: what it looks up goes up, what other devices looked up comes down, and
   nothing is looked up twice. The export's email address is never in it, and nothing is ever there unencrypted.
   index.json says, in the clear, whose diary it is, when each part last changed, and how to make the key from the
   password. (Version 1 diaries had parts rows, meta, extra, keys; they're read, and replaced on the next update.) */
const SITE_REC = "cr-site-v1";      // every device that opened it: { salt, key, user, at, have: { part: at }, sums: { part: sha-256 } }
const SITE_PUB = "cr-site-pub-v1";  // a device that puts it there: { repo, token, at }
const SITE_DIRTY = "cr-site-dirty"; // changes here not yet on the site: { at, now: a new import, friend or key }
const SITE_SHARDS = 16;
const SITE_PARTS = ["rows", "keys", "lbx", "friends", ...Array.from({ length: SITE_SHARDS }, (_, i) => `m${i}`), ...Array.from({ length: SITE_SHARDS }, (_, i) => `p${i}`)];
const siteShard = (key) => hash32(String(key)) % SITE_SHARDS;
const SITE_KEYS = ["tmdb", "omdb", "apify"]; // with the GitHub key, these travel with the diary
const SITE_PATH = "docs/diary/";    // in the repository; the site serves docs/ at its root
const SITE_ITER = 600000;
const SITE_MIN_PASS = 10;
const SITE_ON = !IN_VIEWER && /^https?:$/.test(location.protocol);
const SITE_DEVICE = document.querySelector(".tabbar") ? "phone" : "computer";
const SITE_GH_REPO = SITE_REPO ? SITE_REPO.split("/").slice(3, 5).join("/") : "";
const PUBLISHED = new Set([KEYS.rows, KEYS.meta, KEYS.photos, KEYS.lbx, KEYS.friends, ...SITE_KEYS.map((k) => KEYS[k])]);
const SITE_SOON = new Set([KEYS.rows, KEYS.friends, ...SITE_KEYS.map((k) => KEYS[k])]); // go up within seconds
let SITE = ls.get(SITE_REC, null), SITEPUB = ls.get(SITE_PUB, null);
// the key works for the site's repository whatever it's called, so a renamed one is followed

/* ----- the site (for reading) and GitHub (for changing it) ----- */
async function siteGet(name, version) {

/* ----- checking the site, opening the diary with its password ----- */
async function siteCheck(draw) {

    const key = await deriveKey(pass, idx.salt);

      <details class="site-help"><summary>Share a different TMDB key instead</summary><label class="status" for="site-sharekey">A TMDB key to share, say from a second TMDB account (leave empty to share yours)</label>

/* ----- letting visitors compare with you ----- */
// The owner can put a card of their ratings beside the pages (docs/taste.json, in the clear: each film's name, year,

const TASTE_FILE = "taste.json";
const taste = { on: null, checking: false, busy: "", note: "", err: false };
const fileThere = async (commit, name) => { try { return (await gh(`/contents/docs?ref=${commit}`)).some((f) => f.name === name); } catch (e) { if (e.status === 404) return false; throw e; } };
const tasteCard = () => ({ v: 1, user: MY_LIB.profile.username, from: rowsWhen(store.get(KEYS.rows, {}) || {}), at: new Date().toISOString(),

// On the owner's device: once a newer import is here than the card on the site was made from, the card follows it.

function tasteBox() {

    : `<p class="status">Let anyone who opens this site with their own export compare their taste with yours in one tap, with no files to send. This puts your films, with your ratings and likes, on the site for anyone to read (much as your Letterboxd profile shows them): no diary dates, reviews, watchlist, email or keys. Your diary stays locked.</p>
      ${btn("taste-on", "Let visitors compare with me", true)}${taste.on === "?" ? btn("taste-off", "Stop it") : ""}${unsure}${say}`;

}

/* ----- counting visits (asked 25 Oct 2026) -----
   The owner wanted to know how many people open the site and where from, for their eyes only. A site on GitHub Pages
   has no visitor logs, so visits are counted by GoatCounter (free for personal sites, no cookies, nothing personal
   kept: it notes the country and region a visit comes from), whose pages are behind the owner's own login. Turned on
   from Settings like the shared key: docs/visits.json holds the GoatCounter code alone. Each page load sends one count,
   a picture request made by our own code (no outside script runs). The owner's own devices aren't counted. */
const VISITS_FILE = "visits.json", VISIT_RE = /^[a-z0-9][a-z0-9-]{1,48}$/;
const visits = { on: null, code: "", checking: false, busy: "", note: "", err: false };
let VISIT_CODE = ""; // the code the site counts with, as this page read it
async function countVisit() {
  if (IN_VIEWER || !/^https?:$/.test(location.protocol)) return;
  try {
    const j = await fetch(`${VISITS_FILE}?t=${Date.now()}`, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null));
    VISIT_CODE = j && typeof j.goatcounter === "string" && VISIT_RE.test(j.goatcounter) ? j.goatcounter : "";
    for (const e of document.querySelectorAll("[data-visits-note]")) e.hidden = !VISIT_CODE;
    if (!VISIT_CODE || SITE || isSiteOwner()) return; // the owner's own devices aren't counted
    const q = new URLSearchParams({ p: location.pathname, t: document.title, r: document.referrer || "",
      s: `${screen.width},${screen.height},${window.devicePixelRatio || 1}`, rnd: Math.random().toString(36).slice(2) });
    new Image().src = `https://${VISIT_CODE}.goatcounter.com/count?${q}`;
  } catch {}
}
async function visitsRead(commit) {
  let list;
  try { list = await gh(`/contents/docs?ref=${commit}`); } catch (e) { if (e.status === 404) return null; throw e; }
  const f = list.find((x) => x.name === VISITS_FILE);
  if (!f) return null;
  try { return JSON.parse(new TextDecoder().decode(await blobBytes(f.sha))) || {}; } catch { return {}; }
}
async function visitsCheck() {
  if (!SITEPUB || visits.checking) return;
  visits.checking = true;
  try { const j = await visitsRead((await repoHead()).commit); visits.on = !!(j && j.goatcounter); visits.code = (j && VISIT_RE.test(j.goatcounter || "") && j.goatcounter) || ""; }
  catch { visits.on = "?"; }
  visits.checking = false;
  siteRedraw();
}
async function visitsSet(code) {
  if (!SITEPUB || visits.busy) return;
  if (code !== null) {
    code = String(code || "").trim().toLowerCase().replace(/^https?:\/\//, "").replace(/\.goatcounter\.com.*$/, "");
    if (!VISIT_RE.test(code)) { Object.assign(visits, { note: "Type the code you chose on GoatCounter (the part before .goatcounter.com).", err: true }); return siteRedraw(); }
  }
  Object.assign(visits, { busy: code ? "Turning counting on…" : "Turning it off…", note: "", err: false });
  siteRedraw();
  try {
    for (let attempt = 0; ; attempt++) {
      if (attempt === 4) throw ghFail("Another device kept changing the site at the same moment. Try again in a minute.");
      const head = await repoHead();
      if (!code && !(await visitsRead(head.commit))) break;
      const body = code ? new TextEncoder().encode(JSON.stringify({ goatcounter: code, at: new Date().toISOString() }, null, 1) + "\n") : null;
      if (await commitFiles(head, { [VISITS_FILE]: body }, code ? "Count visits to the site" : "Stop counting visits to the site", "docs/")) break;
    }
    Object.assign(visits, { on: !!code, code: code || "", busy: "", err: false,
      note: code ? "On. Visits are counted from the next time someone opens the site (within a minute or two)." : "Off. Visits aren't counted any more." });
  } catch (e) { Object.assign(visits, { busy: "", note: e.message || "Couldn't change it.", err: true }); }
  siteRedraw();
}
// "Send a test visit": one count from this device (its own visits aren't counted otherwise), saying whether it reached
// GoatCounter or the browser stopped it. A tracker blocker (uBlock Origin) or a private window's tracker protection
// (Safari, Firefox) stops these counts; the owner's tests in private tabs showed nothing (25 Oct 2026).
function visitsTest() {
  const code = visits.code || VISIT_CODE;
  if (!code || visits.busy) return;
  Object.assign(visits, { busy: "Sending a test visit…", note: "", err: false });
  siteRedraw();
  let over = false;
  const done = (ok) => {
    if (over) return; over = true; clearTimeout(t);
    Object.assign(visits, { busy: "", err: !ok, note: ok
      ? `It reached GoatCounter. Refresh ${code}.goatcounter.com in a minute: a visit to "/test-visit" should be there. (If it isn't, see that GoatCounter's settings don't ignore your connection's address.)`
      : `This browser stopped it before it reached GoatCounter: usually an ad blocker such as uBlock Origin, or a private window's tracker protection (Safari, Firefox). Visitors with those aren't counted either. Pause the blocker for this site and try again, or check the code (${code}) is the one GoatCounter gave you.` });
    siteRedraw();
  };
  const t = setTimeout(() => done(false), 12000), img = new Image();
  img.onload = () => done(true); img.onerror = () => done(false);
  img.src = `https://${code}.goatcounter.com/count?${new URLSearchParams({ p: "/test-visit", t: "Test visit from Settings", rnd: Math.random().toString(36).slice(2) })}`;
}
// In Settings, under the diary on the site: on a device with the GitHub key and its own diary.
function visitsBox() {
  if (!SITE_ON || !SITEPUB || !MY_LIB || !siteSameUser()) return "";
  if (visits.on === null) { if (!visits.checking) setTimeout(visitsCheck); return ""; }
  const phone = SITE_DEVICE === "phone";
  const btn = (act, label, main) => `<button class="${phone ? `btn${main ? " green" : ""} block` : `btn${main ? " primary" : ""} small`}" type="button" data-site="${act}"${visits.busy ? " disabled" : ""}>${label}</button>`;
  const say = visits.busy ? `<p class="status" role="status">${esc(visits.busy)}</p>` : visits.note ? `<p class="status${visits.err ? " err" : ""}" role="status">${esc(visits.note)}</p>` : "";
  const page = visits.code && `https://${visits.code}.goatcounter.com/`;
  const body = visits.on === true
    ? `<p class="status">Visits to this site are counted.${page ? ` See how many people came, and from which countries and regions, at <a href="${esc(page)}" target="_blank" rel="noopener">${esc(visits.code)}.goatcounter.com</a>: you log in with your GoatCounter account, so only you can see them.` : ""}
      Your own devices aren't counted (so a test from here needs the button). Ad blockers and private windows' tracker protection stop counts, so treat the numbers as at least this many. Visitors are told in the small print that visits are counted, without cookies or anything personal.</p>${btn("visits-test", "Send a test visit")}${btn("visits-off", "Stop counting")}${say}`
    : `<p class="status">See how many people open this site and from which countries and regions, on a page only you can open. It uses GoatCounter: free for personal sites, no cookies, and nothing personal is kept about visitors.</p>
      <ol class="status steps"><li>Create a free account at <a href="https://www.goatcounter.com/signup" target="_blank" rel="noopener">goatcounter.com</a>. Choose a code, for example ${esc(String(MY_LIB.profile.username || "mysite").toLowerCase())}: your counts will be at <i>code</i>.goatcounter.com.</li>
        <li>Type the code here and press Start counting.</li></ol>
      <label class="status" for="site-visitcode">Your GoatCounter code</label><input class="key" id="site-visitcode" name="visitcode" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. ${esc(String(MY_LIB.profile.username || "mysite").toLowerCase())}">
      ${btn("visits-on", "Start counting", true)}${visits.on === "?" ? btn("visits-off", "Stop counting") : ""}${say}`;
  const title = visits.on === true ? "Visitor counts are on" : "Count visitors";
  return phone ? `<div class="card site-card"><p class="title">${title}</p>${body}</div>` : `<div class="site-in"><h3 class="sub-h">${title}</h3>${body}</div>`;
}
</script>
<script>
/* ---------- the study: what the diary says about taste and habits, and why ----------
   Worked out from the diary alone, the same for both layouts: the stretches that stood apart from the rest (chapters),
   how taste has moved (drifts), what ratings follow and what's liked beyond a film's reputation, how one film led to
   another (threads), and the habits behind it all. Nothing the Stats page shows is repeated here.
   A finding is only said when it's big enough to matter and unlikely to be chance: a difference has to be STUDY_Z
   standard errors or more from what the rest of the diary would give (about 1 in 700 by chance). Every sentence opens
   the films or diary entries it rests on. Taste is read from first watches (each film once, on the day it was first
   seen), habits from every diary entry. */
const STUDY_Z = 3;
// what ratings follow: anything accounting for less than this share (%) of their ups and downs isn't worth saying
const FOLLOW_MIN = 3;
const sq = (x) => x * x;
const medianOf = (a) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), i = s.length >> 1; return s.length % 2 ? s[i] : (s[i - 1] + s[i]) / 2; };
const sdOf = (a) => { if (a.length < 2) return 0; const m = avg(a); return Math.sqrt(a.reduce((t, x) => t + sq(x - m), 0) / (a.length - 1)); };
// how far k of n is from what a share p0 would give, in standard errors
const zShare = (k, n, p0) => n && p0 > 0 && p0 < 1 ? (k - n * p0) / Math.sqrt(n * p0 * (1 - p0)) : 0;
// two averages, or two shares, apart in standard errors
const zMeans = (a, b) => { if (a.length < 4 || b.length < 4) return 0; const v = sq(sdOf(a)) / a.length + sq(sdOf(b)) / b.length; return v ? (avg(a) - avg(b)) / Math.sqrt(v) : 0; };
const zProps = (k1, n1, k2, n2) => { if (!n1 || !n2) return 0; const p = (k1 + k2) / (n1 + n2), v = p * (1 - p) * (1 / n1 + 1 / n2); return v ? (k1 / n1 - k2 / n2) / Math.sqrt(v) : 0; };
const pc = (x) => Math.round(x * 100);
const joinAnd = (a) => a.length < 2 ? a.join("") : `${a.slice(0, -1).join(", ")} and ${a[a.length - 1]}`;
const capFirst = (s) => s.charAt(0).toUpperCase() + s.slice(1);
// "February – June 2022", "November 2023 – March 2024", "May 2024"
const monthSpan = (a, b) => a.slice(0, 7) === b.slice(0, 7) ? monthName(a) : a.slice(0, 4) === b.slice(0, 4) ? `${MONTHS_LONG[+a.slice(5, 7) - 1]} – ${monthName(b)}` : `${monthName(a)} – ${monthName(b)}`;
// A straight line through points weighted by how many films each stands for: where it starts and ends, and how sure
// the slope is (its t: slope over its standard error).
function fitLine(pts) {
  pts = pts.filter((p) => p.w > 0 && p.y != null && isFinite(p.y));
  if (pts.length < 4) return null;
  let W = 0, mx = 0, my = 0;
  for (const p of pts) { W += p.w; mx += p.w * p.x; my += p.w * p.y; }
  mx /= W; my /= W;
  let sxx = 0, sxy = 0, syy = 0;
  for (const p of pts) { sxx += p.w * sq(p.x - mx); sxy += p.w * (p.x - mx) * (p.y - my); syy += p.w * sq(p.y - my); }
  if (!sxx) return null;
  const b = sxy / sxx, a = my - b * mx;
  let sse = 0;
  for (const p of pts) sse += p.w * sq(p.y - a - b * p.x);
  const se = Math.sqrt(sse / (pts.length - 2) / sxx);
  const x0 = Math.min(...pts.map((p) => p.x)), x1 = Math.max(...pts.map((p) => p.x));
  return { b, t: se ? b / se : (b ? Math.sign(b) * 99 : 0), r2: syy ? 1 - sse / syy : 0, from: a + b * x0, to: a + b * x1 };
}

/* ----- what each film is, as the study sees it ----- */
const PLACE = { "United States of America": "the US", "United Kingdom": "the UK", "Soviet Union": "the Soviet Union", Netherlands: "the Netherlands", Philippines: "the Philippines",
  "Czech Republic": "the Czech Republic", "Dominican Republic": "the Dominican Republic", "United Arab Emirates": "the UAE", "Russian Federation": "Russia" };
const placeName = (k) => PLACE[k] || k;
const GENRE_NOUN = { Documentary: "documentaries", Animation: "animated films", "TV Movie": "TV films", Western: "westerns" };
const genreNoun = (g) => GENRE_NOUN[g] || `${g.toLowerCase()} films`;
// The things a film can be, each with how to say it: "61% were crime films", "from the 1940s", "in Japanese", "by …".
const FACETS = {
  g: { vals: (x) => x.g, were: genreNoun, season: (v) => `${v} season`, meta: true },
  dec: { vals: (x) => x.dec ? [x.dec] : [], were: (v) => `from the ${v}s`, season: (v) => `${v}s season` },
  l: { vals: (x) => x.l ? [x.l] : [], were: (v) => `in ${v}`, season: (v) => `${v} season`, meta: true },
  k: { vals: (x) => x.k, were: (v) => `from ${placeName(v)}`, season: (v) => `${placeName(v).replace(/^the /, "")} season`, meta: true },
  d: { vals: (x) => x.d, were: (v) => `by ${v}`, season: (v) => `${v} season`, meta: true, person: true },
  c: { vals: (x) => x.c, were: (v) => `with ${v}`, season: (v) => `${v} season`, meta: true, person: true },
};
const rtBand = (r) => r < 90 ? "Under 90 minutes" : r < 120 ? "90 minutes to 2 hours" : r < 150 ? "2 to 2½ hours" : "2½ hours or more";
const popBand = (q) => q >= 0.8 ? "Most popular fifth" : q >= 0.4 ? "Middle" : q > 0.2 ? "Less known" : "Least known fifth";
const ageWord = (n) => `${Math.round(n)} year${Math.round(n) === 1 ? "" : "s"} old`;

// Every film once, as first seen in the diary, with what the study needs to know about it.
function studyBase(lib, metaOf, crowdKey) {
  const crowd = CROWDS[crowdKey] || CROWDS.tmdb;
  const E = lib.entries;
  // how many people have rated a film, from whichever source covers most of the diary
  const srcs = [["Letterboxd", (f) => LBX[f.key] && LBX[f.key].n], ["IMDb", (f, m) => m && m.iv], ["TMDB", (f, m) => m && m.vc]];
  const inDiary = [...new Set(E.map((e) => e.film))];
  const cover = srcs.map(([, get]) => inDiary.filter((f) => get(f, metaOf(f))).length);
  const [popSrc, popGet] = srcs[cover.indexOf(Math.max(...cover))];
  const xs = [], seen = new Set(), seenDir = new Set();
  for (const e of E) {
    const f = e.film, m = metaOf(f);
    if (!seen.has(f)) {
      seen.add(f);
      if (!e.rewatch) {
        const cs = crowd.score(m, f), votes = popGet(f, m);
        const x = { f, e, date: e.date, m: !!m, g: m ? [...new Set(m.g)] : [], k: m ? [...new Set(m.k)] : [], l: (m && m.l) || null,
          d: m ? [...new Set(roleNames(m, "d"))] : [], c: m ? [...new Set(castOf(m).slice(0, 6))] : [], w: m ? [...new Set(roleNames(m, "w"))] : [],
          dec: f.year ? Math.floor(f.year / 10) * 10 : null, age: f.year ? Math.max(0, +e.date.slice(0, 4) - f.year) : null, rt: (m && m.r) || null,
          crowd: cs ? cs / 2 : null, votes: votes || null, rating: f.rating || null, rAt: e.rating || null };
        x.newDir = x.d.length > 0 && x.d.every((n) => !seenDir.has(personKey(n)));
        xs.push(x);
      }
    }
    if (m) for (const n of roleNames(m, "d")) seenDir.add(personKey(n));
  }
  // where each film stands in popularity within this diary, 0 (least rated) to 1 (most)
  const withVotes = xs.filter((x) => x.votes).sort((a, b) => a.votes - b.votes);
  withVotes.forEach((x, i) => { x.popQ = withVotes.length > 1 ? i / (withVotes.length - 1) : 0.5; });
  for (const x of xs) if (x.popQ === undefined) x.popQ = null;
  const byFilm = new Map(xs.map((x) => [x.f, x]));
  return { lib, crowd, crowdKey, popSrc, xs, byFilm, E, counts: facetCounts(xs) };
}
function facetCounts(xs) {
  const out = { n: { dec: xs.filter((x) => x.dec).length, meta: xs.filter((x) => x.m).length } };
  for (const [id, fc] of Object.entries(FACETS)) { const m = new Map(); for (const x of xs) for (const v of fc.vals(x)) bump(m, v); out[id] = m; }
  return out;
}

/* ----- what sets a group of films apart from the rest of the diary ----- */
// `strict` is for chapters: people need four films and an eighth of the stretch before they count. `o` lowers the bar
// for a leaning ({ z, ratio }); `B.counts` can be another set's (a year's, for its seasons).
function standouts(F, B, strict, o = {}) {
  const out = [], C = B.counts, zBar = o.z ?? STUDY_Z, ratio = o.ratio ?? 1.6;
  const nOf = (fid, list) => fid === "dec" ? list.filter((x) => x.dec).length : list.filter((x) => x.m).length;
  for (const [fid, fc] of Object.entries(FACETS)) {
    const n = nOf(fid, F), N = fid === "dec" ? C.n.dec : C.n.meta;
    if (n < 6 || N - n < 6) continue;
    const here = new Map();
    for (const x of F) for (const v of fc.vals(x)) bump(here, v);
    for (const [v, k] of here) {
      const p0 = ((C[fid].get(v) || 0) - k) / (N - n), share = k / n;
      const minK = fc.person ? (strict ? 4 : 3) : Math.max(4, Math.ceil(n * 0.08));
      const minGap = fc.person ? (strict ? 0.12 : 0.05) : 0.08;
      if (k < minK || share - p0 < minGap || share < ratio * p0) continue;
      const z = zShare(k, n, Math.max(p0, 0.5 / N));
      if (z < zBar) continue;
      out.push({ fid, v, k, n, share, p0, z, xs: F.filter((x) => fc.vals(x).includes(v)) });
    }
  }
