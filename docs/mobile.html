  try {
    // Apify stops a run after an hour by default; give very large libraries two
    const timeout = mode === "all" && lib.films.length > 1500 ? "?timeout=7200" : "";
    const run = await apify(`/acts/${LB_ACTOR}/runs${timeout}`, { method: "POST", body: JSON.stringify(input) });
    store.set(KEYS.lbRun, { id: run.data.id, dataset: run.data.defaultDatasetId, at: Date.now(), mode });
    await pollLetterboxd(lib);
  } catch (e) { finishLetterboxd(e); }
}

// Waits for the run, then reads its results. Also called on page load, so a run started earlier
// is picked up even if the page was closed in the meantime.
async function pollLetterboxd(lib) {
  const r = store.get(KEYS.lbRun, null);
  if (!r || !apifyKey()) return;
  Object.assign(lbJob, { running: true, started: r.at, note: "", err: false });
  renderLookup();
  try {
    for (;;) {
      const run = await apify(`/actor-runs/${r.id}`);
      const st = run.data.status;
      if (st === "SUCCEEDED") break;
      if (st === "FAILED" || st === "ABORTED" || st === "TIMED-OUT") { store.del(KEYS.lbRun); return finishLetterboxd({ code: "run", status: st }); }
      renderLookupProgress();
      await sleep(8000);
    }
    const items = [];
    for (let offset = 0; ; offset += 1000) {
      const page = await apify(`/datasets/${r.dataset}/items?clean=true&offset=${offset}&limit=1000&fields=recordType,title,year,filmSlug,averageRating,ratingsCount`);
      items.push(...page);
      if (page.length < 1000) break;
    }
    const byTitle = new Map(lib.films.map((f) => [`${personKey(f.name)}|${f.year || ""}`, f]));
    const today = new Date().toISOString().slice(0, 10);
    let matched = 0;
    for (const it of items) {
      if (it.recordType && it.recordType !== "film") continue;
      const f = byTitle.get(`${personKey(it.title || "")}|${it.year || ""}`);
      if (!f || !(Number(it.averageRating) > 0)) continue;
      LBX[f.key] = { r: Number(it.averageRating), n: Number(it.ratingsCount) || 0, slug: it.filmSlug || null, at: today };
      matched++;
    }
    store.set(KEYS.lbx, LBX);
    store.del(KEYS.lbRun);
    finishLetterboxd(null, matched, r.mode);
  } catch (e) { finishLetterboxd(e); }
}
function finishLetterboxd(e, matched, mode) {
  lbJob.running = false;
  lbJob.err = !!e;
  lbJob.badKey = !!e && e.code === "auth";
  lbJob.note = !e ? `Done. Added Letterboxd averages for ${plural(matched, "film")}.${mode === "recent" && lbMissing(state.lib || MY_LIB).length ? " Some films are still missing; refresh all to catch them." : ""}`
    : e.code === "auth" ? "Apify didn't accept that token. Copy it again from Apify Console → Settings → API & Integrations."
    : e.code === "credit" ? "Apify refused the run, usually because the account is out of credit or the actor needs to be added to your account first. Open the actor's page on Apify, then try again."
    : e.code === "run" ? `The Apify run ended with "${e.status}". Open Apify Console → Runs to see why, then try again.`
    : e instanceof TypeError ? "Couldn't reach Apify. Check your connection; a run already started is picked up next time you open the page."
    : "Something went wrong talking to Apify. Try again in a minute.";
  scheduleRender();
}

// The Letterboxd part of the Cast & crew box, for both layouts.
function letterboxdBlock(lib, phone) {
  if (IN_VIEWER || !lib) return "";
  const title = phone ? `<p class="title" style="margin-top:6px">Letterboxd averages</p>` : `<h3 class="sub-h">Letterboxd averages</h3>`;
  const btn = (act, label, primary) => phone ? `<button class="btn ${primary ? "green " : ""}block" type="button" data-lb="${act}">${label}</button>` : `<button class="btn${primary ? " primary" : ""}" type="button" data-lb="${act}">${label}</button>`;
  const link = (act, label) => `<button class="linkish" type="button" data-lb="${act}">${label}</button>`;
  const note = lbJob.note ? `<p class="status${lbJob.err ? " err" : ""}" role="status">${esc(lbJob.note)}</p>` : "";
  if (lbJob.running) return title + `<p class="status" id="lb-progress" role="status">${lbProgressText()}</p>`;
  if (!apifyKey() || editApify || lbJob.badKey) {
    const input = `<label class="sr-only" for="apify-key">Apify API token</label><input ${phone ? 'class="key" ' : ""}id="apify-key" type="password" autocomplete="off" spellcheck="false" placeholder="Apify API token (optional)" value="${esc(apifyKey())}">`;
    return title + (phone ? input + btn("save", "Save token") : `<div class="lookup-row">${input}${btn("save", "Save token")}</div>`) +
      `<p class="status">Compares your ratings with Letterboxd's own averages. An <a href="https://apify.com/solidcode/letterboxd-scraper" target="_blank" rel="noopener">Apify actor</a> reads your films page for you,
      billed to your Apify account at about $3.60 per 1,000 films on Apify's free plan, which includes $5 of credit a month. Your token is under Apify Console → Settings → API &amp; Integrations, and is kept in this browser only.</p>` + note;
  }
  const total = lib.films.length, missing = lbMissing(lib).length, have = total - missing;
  const all = cost(runCost(total));
  let body;
  if (!have) body = (phone ? "" : `<div class="lookup-row">`) + btn("all", `Get Letterboxd averages for ${plural(total, "film")}`, true) + (phone ? "" : `<span class="status">Costs ${all}, billed by Apify.</span></div>`) + (phone ? `<p class="status">Costs ${all}, billed by Apify.</p>` : "");
  else if (missing) body = `<p class="status">${fmtN(have)} of ${plural(total, "film")} have Letterboxd averages.</p>` +
    (phone ? "" : `<div class="lookup-row">`) + btn(missing <= 200 ? "recent" : "all", `Get the ${plural(missing, "missing film")}`, true) +
    (phone ? `<p class="status">Costs ${cost(runCost(missing <= 200 ? missing + 25 : total))}. ${link("all", `Refresh all (${all})`)}</p>` : `<span class="status">${cost(runCost(missing <= 200 ? missing + 25 : total))} · ${link("all", `Refresh all (${all})`)}</span></div>`);
  else body = `<p class="status">Every film has a Letterboxd average. ${link("all", `Refresh all (${all})`)}</p>`;
  return title + body + `<p class="status">${link("change", "Change Apify token")}</p>` + note;
}
function lbProgressText() {
  const mins = Math.max(0, Math.round((Date.now() - lbJob.started) / 60000));
  return `Apify is reading your Letterboxd films (started ${mins ? `${mins} min ago` : "just now"}). Big libraries take several minutes; you can close this page and the results are picked up when you come back.`;
}
function lbAction(act, lib) {
  if (act === "save") {
    const key = ($("#apify-key")?.value || "").trim();
    if (!key) { Object.assign(lbJob, { note: "Paste your Apify token first.", err: true }); renderLookup(); return; }
    store.set(KEYS.apify, key); editApify = false; lbJob.badKey = false; lbJob.note = ""; renderLookup();
  } else if (act === "change") { editApify = true; renderLookup(); $("#apify-key")?.focus(); }
  else if (act === "all" || act === "recent") startLetterboxd(lib, act);
}
</script>
<script>
/* ---------- insights: patterns across the whole diary, shared by both layouts ----------
   Year trends come from diary dates. Crowd comparisons need a crowd score per film, out of 10:
   Letterboxd members (through Apify), TMDB users (from the TMDB lookup), IMDb users and critics (from OMDb). */
const CROWDS = {
  letterboxd: { label: "Letterboxd members", short: "Letterboxd", score: (m, f) => { const x = f && LBX[f.key]; return x && x.r && x.n >= 10 ? x.r * 2 : null; } },
  imdb: { label: "IMDb users", short: "IMDb", score: (m) => m && m.ir && (m.iv || 0) >= 100 ? m.ir : null },
  tmdb: { label: "TMDB users", short: "TMDB", score: (m) => m && m.va && (m.vc || 0) >= 25 ? m.va : null },
  critics: { label: "Critics (Metacritic)", short: "Critics", score: (m) => m && m.mc ? m.mc / 10 : null },
};
// A crowd's score the way that crowd shows it: Letterboxd in stars out of 5, the others out of 10.
const crowdScore = (key, stars5) => key === "letterboxd" ? `${stars5.toFixed(1)}★` : (stars5 * 2).toFixed(1);
const pctOf = (n, d) => d ? Math.round(n / d * 100) : 0;
const starsNum = (x) => `${x.toFixed(1)}★`;
const signed = (x, digits = 1) => Math.abs(x) < 0.5 * Math.pow(10, -digits) ? (0).toFixed(digits) : `${x >= 0 ? "+" : "−"}${Math.abs(x).toFixed(digits)}`;
function pearson(xs, ys) {
  const n = xs.length; if (n < 3) return null;
  const mx = avg(xs), my = avg(ys);
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) { const dx = xs[i] - mx, dy = ys[i] - my; sxy += dx * dy; sxx += dx * dx; syy += dy * dy; }
  return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null;
}
const topOf = (map) => { let best = null; for (const [k, v] of map) if (!best || v > best[1]) best = [k, v]; return best; };
const bump = (map, k, n = 1) => map.set(k, (map.get(k) || 0) + n);

// "…, and your taste follows theirs closely (correlation 0.71)", or nothing when it can't be measured.
const followText = (r) => r == null ? "" : `, and your taste follows theirs ${r >= 0.6 ? "closely" : r >= 0.35 ? "loosely" : "hardly at all"} (correlation ${r.toFixed(2)})`;

function computeInsights(lib, metaOf, crowdKey) {
  const E = lib.entries, rated = lib.films.filter((f) => f.rating);
  const overallAvg = avg(rated.map((f) => f.rating));
  const today = new Date(), thisYear = String(today.getFullYear());
  const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 1)) / 864e5) + 1;

  /* ----- year by year ----- */
  const years = [...new Set(E.map((e) => e.date.slice(0, 4)))].sort();
  const perYear = years.map((y) => {
    const es = E.filter((e) => e.date.startsWith(y));
    const films = [...new Set(es.map((e) => e.film))];
    let minutes = 0;
    for (const e of es) { const m = metaOf(e.film); if (m && m.r) minutes += m.r; }
    const ratings = es.map((e) => e.rating || e.film.rating).filter(Boolean);
    const dated = films.filter((f) => f.year);
    const langs = films.map(metaOf).filter((m) => m && m.l);
    const genres = new Map(), directors = new Map(), actors = new Map(), countries = new Set();
    let withMeta = 0;
    for (const f of films) {
      const m = metaOf(f); if (!m) continue; withMeta++;
      m.g.forEach((g) => bump(genres, g)); m.d.forEach((d) => bump(directors, d));
      m.c.slice(0, CAST_DEPTH).forEach((c) => bump(actors, c)); m.k.forEach((k) => countries.add(k));
    }
    const pace = y === thisYear && dayOfYear > 30 && dayOfYear < 360 ? Math.round(films.length / dayOfYear * 365) : null;
    return {
      year: y, films: films.length, entries: es.length, rewatches: es.filter((e) => e.rewatch).length, hours: minutes / 60, pace,
      avgRating: avg(ratings), age: dated.length ? avg(dated.map((f) => +y - f.year)) : null,
      newShare: dated.length ? pctOf(dated.filter((f) => f.year >= +y - 1).length, dated.length) : null,
      nonEnglish: langs.length >= 3 ? pctOf(langs.filter((m) => m.l !== "English").length, langs.length) : null,
      genres, withMeta, countries: countries.size,
      topGenre: topOf(genres), topDirector: topOf(directors), topActor: topOf(actors),
    };
  });
  const usable = perYear.filter((p) => p.films >= 5);
  const busiest = perYear.reduce((a, p) => !a || p.films > a.films ? p : a, null);

  /* ----- changing tastes: the earliest years against the latest ----- */
  const tastes = { lines: [], table: null };
  if (usable.length >= 2) {
    const span = usable.length >= 4 ? 2 : 1;
    const early = usable.slice(0, span), late = usable.slice(-span);
    const label = (g) => g.length > 1 ? `${g[0].year}–${g[g.length - 1].year.slice(2)}` : g[0].year;
    const share = (group, genre) => { const n = group.reduce((s, p) => s + (p.genres.get(genre) || 0), 0), d = group.reduce((s, p) => s + p.withMeta, 0); return d ? n / d * 100 : null; };
    const mean = (group, k) => { const v = group.map((p) => p[k]).filter((x) => x != null); return v.length ? avg(v) : null; };
    const E0 = label(early), L0 = label(late);
    const allGenres = new Map();
    for (const p of perYear) for (const [g, n] of p.genres) bump(allGenres, g, n);
    const top = [...allGenres].sort((a, b) => b[1] - a[1]).slice(0, 8).map(([g]) => g);
    const moves = top.map((g) => ({ g, from: share(early, g), to: share(late, g) })).filter((x) => x.from != null && x.to != null).map((x) => ({ ...x, d: x.to - x.from }));
    const risers = moves.filter((x) => x.d >= 5).sort((a, b) => b.d - a.d).slice(0, 2);
    const fallers = moves.filter((x) => x.d <= -5).sort((a, b) => a.d - b.d).slice(0, 2);
    for (const x of risers) tastes.lines.push({ dir: "up", big: x.g, text: `${x.g} grew from ${Math.round(x.from)}% of your films in ${E0} to ${Math.round(x.to)}% in ${L0}.` });
    for (const x of fallers) tastes.lines.push({ dir: "down", big: `Less ${x.g}`, text: `${x.g} fell from ${Math.round(x.from)}% of your films in ${E0} to ${Math.round(x.to)}% in ${L0}.` });
    const a0 = mean(early, "age"), a1 = mean(late, "age");
    if (a0 != null && a1 != null && Math.abs(a1 - a0) >= 3) tastes.lines.push({ dir: a1 > a0 ? "up" : "down", big: a1 > a0 ? "Older films" : "Newer films",
      text: a1 > a0 ? `You're watching older films: on average ${Math.round(a1)} years old when you saw them in ${L0}, against ${Math.round(a0)} in ${E0}.`
        : `You're watching newer films: on average ${Math.round(a1)} years old when you saw them in ${L0}, against ${Math.round(a0)} in ${E0}.` });
    const n0 = mean(early, "nonEnglish"), n1 = mean(late, "nonEnglish");
    if (n0 != null && n1 != null && Math.abs(n1 - n0) >= 10) tastes.lines.push({ dir: n1 > n0 ? "up" : "down", big: n1 > n0 ? "World cinema" : "More English",
      text: `Films not in English went from ${Math.round(n0)}% of your watching in ${E0} to ${Math.round(n1)}% in ${L0}.` });
    const r0 = mean(early, "avgRating"), r1 = mean(late, "avgRating");
    if (r0 != null && r1 != null && Math.abs(r1 - r0) >= 0.2) tastes.lines.push({ dir: r1 > r0 ? "up" : "down", big: r1 > r0 ? "Kinder" : "Tougher",
      text: r1 > r0 ? `You've grown more generous: your average rating rose from ${starsNum(r0)} in ${E0} to ${starsNum(r1)} in ${L0}.`
        : `You've grown tougher: your average rating fell from ${starsNum(r0)} in ${E0} to ${starsNum(r1)} in ${L0}.` });
    const w0 = mean(early, "films"), w1 = mean(late, "films");
    if (w0 && w1 && Math.abs(w1 - w0) / w0 >= 0.25) tastes.lines.push({ dir: w1 > w0 ? "up" : "down", big: w1 > w0 ? "More films" : "Fewer films",
      text: `You watch ${w1 > w0 ? "more" : "fewer"} films than you used to: about ${Math.round(w1)} a year in ${L0}, against ${Math.round(w0)} in ${E0}.` });
    tastes.table = { genres: top, years: usable.map((p) => ({ year: p.year, shares: top.map((g) => p.withMeta ? Math.round((p.genres.get(g) || 0) / p.withMeta * 100) : null) })) };
  }

  /* ----- genres: what you watch, how you rate it, and how the crowd does ----- */
  const crowd = CROWDS[crowdKey] || CROWDS.tmdb;
  const gmap = new Map();
  for (const f of lib.films) {
    const m = metaOf(f); if (!m) continue;
    for (const g of m.g) {
      let x = gmap.get(g); if (!x) { x = { name: g, films: [], mine: [], vsCrowd: [] }; gmap.set(g, x); }
      x.films.push(f);
      if (f.rating) { x.mine.push(f.rating); const c = crowd.score(m, f); if (c) x.vsCrowd.push(f.rating - c / 2); }
    }
  }
  const withMetaCount = lib.films.filter((f) => metaOf(f)).length;
  const genres = [...gmap.values()].filter((g) => g.mine.length >= 3).map((g) => ({
    name: g.name, films: g.films, count: g.films.length, share: pctOf(g.films.length, withMetaCount), mine: avg(g.mine),
    vsMe: avg(g.mine) - overallAvg, vsCrowd: g.vsCrowd.length >= 3 ? avg(g.vsCrowd) : null,
  })).sort((a, b) => b.count - a.count);
  const genreLines = [];
  const solid = genres.filter((g) => g.mine.length >= 5 || g.count >= 5);
  const loved = [...solid].sort((a, b) => b.vsMe - a.vsMe)[0];
  if (loved && loved.vsMe >= 0.15) genreLines.push(`You rate ${loved.name} ${loved.vsMe.toFixed(1)}★ above your average, more than any other genre.`);
  const lukewarm = solid.slice(0, 5).filter((g) => g.vsMe <= -0.15).sort((a, b) => a.vsMe - b.vsMe)[0];
  if (lukewarm) genreLines.push(`${lukewarm.name} is among the genres you watch most (${lukewarm.share}% of your films), but you rate it ${Math.abs(lukewarm.vsMe).toFixed(1)}★ below your average.`);
  const withCrowd = genres.filter((g) => g.vsCrowd != null);
  const above = [...withCrowd].sort((a, b) => b.vsCrowd - a.vsCrowd)[0], below = [...withCrowd].sort((a, b) => a.vsCrowd - b.vsCrowd)[0];
  if (above && above.vsCrowd >= 0.2) genreLines.push(`Next to ${crowd.label}, you're kindest to ${above.name}: ${above.vsCrowd.toFixed(1)}★ above them on average.`);
  if (below && below !== above && below.vsCrowd <= -0.2) genreLines.push(`You're harshest on ${below.name}: ${Math.abs(below.vsCrowd).toFixed(1)}★ below ${crowd.label} on average.`);

  /* ----- people: obsessions, companions, binges, discoveries ----- */
  const peopleFrom = (role) => {
    const map = new Map();
    for (const e of E) {
      const m = metaOf(e.film); if (!m) continue;
      const names = role === "c" ? m.c.slice(0, CAST_DEPTH) : m[role];
      for (const n of names) {
        const k = personKey(n);
        let p = map.get(k); if (!p) { p = { key: k, name: n, firstSeen: new Map(), years: new Set() }; map.set(k, p); }
        if (!p.firstSeen.has(e.film)) p.firstSeen.set(e.film, e.date);
        p.years.add(e.date.slice(0, 4));
      }
    }
    return [...map.values()].map((p) => ({ ...p, films: [...p.firstSeen.keys()], count: p.firstSeen.size }));
  };
  const directors = peopleFrom("d"), actors = peopleFrom("c");
  const latest = usable.length ? usable[usable.length - 1].year : years[years.length - 1];
  const obsessions = (list) => list.map((p) => {
    const inLatest = [...p.firstSeen.values()].filter((d) => d.startsWith(latest)).length;
    return { ...p, inLatest, before: p.count - inLatest };
  }).filter((p) => p.inLatest >= 2 && p.before === 0).sort((a, b) => b.inLatest - a.inLatest || a.name.localeCompare(b.name)).slice(0, 6);
  const companions = (list) => list.filter((p) => p.years.size >= 3).sort((a, b) => b.years.size - a.years.size || b.count - a.count).slice(0, 6);
  const binges = directors.map((p) => {
    const dates = [...p.firstSeen.values()].sort();
    let best = null;
    for (let i = 0; i < dates.length; i++) {
      let j = i;
      while (j + 1 < dates.length && dayIndex(dates[j + 1]) - dayIndex(dates[i]) <= 30) j++;
      const n = j - i + 1;
      if (n >= 3 && (!best || n > best.n)) best = { n, from: dates[i], to: dates[j] };
    }
    return best ? { ...p, binge: best } : null;
  }).filter(Boolean).sort((a, b) => b.binge.n - a.binge.n || (b.binge.to > a.binge.to ? 1 : -1)).slice(0, 5);
  const firstYear = new Map();
  for (const p of directors) { const y = [...p.firstSeen.values()].sort()[0].slice(0, 4); bump(firstYear, y); }
  const discoveries = years.slice(1).map((y) => ({ year: y, count: firstYear.get(y) || 0 }));

  /* ----- against the crowd ----- */
  const pairs = rated.map((f) => { const c = crowd.score(metaOf(f), f); return c ? { f, you: f.rating, crowd: c / 2, diff: f.rating - c / 2 } : null; }).filter(Boolean);
  const crowdOut = { key: crowdKey, label: crowd.label, short: crowd.short, n: pairs.length, available: {} };
  for (const k of Object.keys(CROWDS)) crowdOut.available[k] = rated.filter((f) => CROWDS[k].score(metaOf(f), f)).length;
  if (pairs.length >= 5) {
    crowdOut.r = pearson(pairs.map((p) => p.you), pairs.map((p) => p.crowd));
    crowdOut.meanDiff = avg(pairs.map((p) => p.diff));
    crowdOut.higher = pairs.filter((p) => p.diff >= 0.75).sort((a, b) => b.diff - a.diff || b.you - a.you).slice(0, 12);
    crowdOut.lower = pairs.filter((p) => p.diff <= -0.75).sort((a, b) => a.diff - b.diff || a.you - b.you).slice(0, 12);
  }
  const popularity = (f) => { const x = LBX[f.key], m = metaOf(f); return x && x.n ? { n: x.n, src: "Letterboxd" } : m && m.iv ? { n: m.iv, src: "IMDb" } : m && m.vc ? { n: m.vc, src: "TMDB" } : null; };
  crowdOut.gems = rated.filter((f) => f.rating >= 4.5).map((f) => ({ f, pop: popularity(f) }))
    .filter((x) => x.pop && x.pop.n < { Letterboxd: 5000, IMDb: 25000, TMDB: 1000 }[x.pop.src])
    .sort((a, b) => b.f.rating - a.f.rating || a.pop.n - b.pop.n).slice(0, 12);

  /* ----- habits ----- */
  const habits = [];
  if (E.length) {
    const weekend = E.filter((e) => weekdayOf(e.date) >= 5).length;
    const wk = pctOf(weekend, E.length);
    habits.push({ k: wk >= 36 ? "Weekend watcher" : wk <= 22 ? "Weeknight watcher" : "Weekends", v: `${wk}%`, notable: wk >= 36 || wk <= 22,
      text: `of your diary falls on a Saturday or Sunday, against 29% if you watched evenly through the week.` });
    const months = Array(12).fill(0), seen = Array(12).fill(0);
    for (const e of E) months[+e.date.slice(5, 7) - 1]++;
    const first = E[0].date, last = E[E.length - 1].date;
    for (let y = +first.slice(0, 4); y <= +last.slice(0, 4); y++) for (let m = 0; m < 12; m++) {
      const k = `${y}-${String(m + 1).padStart(2, "0")}`;
      if (k >= first.slice(0, 7) && k <= last.slice(0, 7)) seen[m]++;
    }
    const rates = months.map((n, i) => seen[i] ? n / seen[i] : 0), mean = avg(rates.filter((_, i) => seen[i]));
    const best = rates.indexOf(Math.max(...rates));
    if (mean && rates[best] / mean >= 1.15) habits.push({ k: "Film month", v: MONTHS_LONG[best], notable: rates[best] / mean >= 1.3, text: `is when you watch most: ${Math.round((rates[best] / mean - 1) * 100)}% more films than an average month.` });
    const loggedKnown = E.filter((e) => e.logged);
    if (loggedKnown.length >= 10) habits.push({ k: "Same-day logging", v: `${pctOf(loggedKnown.filter((e) => e.logged === e.date).length, loggedKnown.length)}%`, text: "of films are logged on the day you watch them." });
    const perDay = new Map(); for (const e of E) bump(perDay, e.date);
    const bingeDays = [...perDay.values()].filter((n) => n >= 3).length;
    if (bingeDays) habits.push({ k: "Marathon days", v: fmtN(bingeDays), text: `${bingeDays === 1 ? "day" : "days"} with three or more films.` });
    const catches = E.filter((e) => !e.rewatch && e.film.year && +e.date.slice(0, 4) <= e.film.year + 0).length;
    habits.push({ k: "Same-year catches", v: fmtN(catches), text: `${catches === 1 ? "film" : "films"} seen in the year ${catches === 1 ? "it" : "they"} came out.` });
    const rw = pctOf(E.filter((e) => e.rewatch).length, E.length);
    habits.push({ k: "Rewatches", v: `${rw}%`, text: "of your diary entries are rewatches." });
    const runtimes = lib.films.map(metaOf).filter((m) => m && m.r).map((m) => m.r);
    if (runtimes.length >= 10) habits.push({ k: "Typical length", v: `${Math.round(avg(runtimes))} min`, text: `is your average film; ${pctOf(runtimes.filter((r) => r >= 150).length, runtimes.length)}% run 2½ hours or more.` });
  }

  /* ----- at a glance: the strongest few findings ----- */
  const glance = [];
  if (busiest) {
    const cur = perYear.find((p) => p.year === thisYear);
    glance.push({ k: "Busiest year", big: busiest.year, text: `${plural(busiest.films, "film")} that year${cur && cur.pace && cur !== busiest ? `. ${thisYear} is on pace for about ${fmtN(cur.pace)}.` : "."}` });
  }
  if (overallAvg) {
    const high = pctOf(rated.filter((f) => f.rating >= 4).length, rated.length);
    const style = overallAvg >= 3.75 ? "a generous rater" : overallAvg <= 3 ? "a tough rater" : "a middle-of-the-road rater";
    glance.push({ k: "Rating style", big: starsNum(overallAvg), text: `average makes you ${style}: ${high}% of your rated films get 4★ or more.` });
  }
  if (crowdOut.meanDiff != null) glance.push({ k: `You vs ${crowd.label}`, big: `${signed(crowdOut.meanDiff)}★`, text: `on average against ${crowd.label}${followText(crowdOut.r)}, across ${plural(pairs.length, "film")}.` });
  if (tastes.lines.length) glance.push({ k: "Changing taste", big: tastes.lines[0].big, text: tastes.lines[0].text });
  if (loved && loved.vsMe >= 0.15) glance.push({ k: "Best-loved genre", big: loved.name, text: `gets ${loved.vsMe.toFixed(1)}★ more from you than your average film.` });
  const obsD = obsessions(directors);
  if (obsD.length) glance.push({ k: `New in ${latest}`, big: obsD[0].name, text: `${obsD[0].inLatest} films in ${latest}, none before. Your newest director obsession.` });
  else { const comp = companions(directors)[0]; if (comp) glance.push({ k: "Constant companion", big: comp.name, text: `turns up in your diary in ${comp.years.size} different years.` }); }
  const habit = habits.find((h) => h.notable);
  if (habit) glance.push({ k: habit.k, big: habit.v, text: habit.text });

  return {
    years: perYear, usable, latest, tastes, genres, genreLines, overallAvg,
    people: { obsDirectors: obsD, obsActors: obsessions(actors), compDirectors: companions(directors), compActors: companions(actors), binges, discoveries },
    crowd: crowdOut, habits, glance,
  };
}
// The crowd to compare with: Letterboxd members when enough rated films have their average, then IMDb, then TMDB.
function defaultCrowd(lib, metaOf) {
  const rated = lib.films.filter((f) => f.rating);
  const n = (k) => rated.filter((f) => CROWDS[k].score(metaOf(f), f)).length;
  const enough = (k) => n(k) >= Math.max(5, n("tmdb") * 0.5);
  return enough("letterboxd") ? "letterboxd" : enough("imdb") ? "imdb" : "tmdb";
}
</script>
<script>
/* ---------- app state ---------- */
const state = {
  mode: "example", lib: null, scope: "all", view: "profile", stack: [],
  role: "c", crew: "w", sort: "most", catSort: "most", peopleLimit: 50, diaryLimit: 60, crowd: null,
};
let MY_LIB = null, EXAMPLE_LIB = null, STATS = null;
const IMG = "https://image.tmdb.org/t/p/w185";
const showImages = !IN_VIEWER; // pages inside Claude can't load outside images
const VIEW_KEY = "cr-mview-v1";
const TITLES = { profile: "Profile", people: "People", diary: "Diary", films: "Films", data: "Import" };
const CHEV = `<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>`;
const BACK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>`;

function metaOf(f) {
  if (state.mode === "example") return EXAMPLE_META[f.key] || null;
  const m = META[f.key];
  if (m && !m.miss) return m;
  return EXAMPLE_META[f.key] || null;
}
let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}
function saveView() { store.set(VIEW_KEY, { scope: state.scope, mode: state.mode, view: state.view }); }

function render() {
  if (state.mode === "mine" && !MY_LIB) state.mode = "example";
  state.lib = state.mode === "mine" ? MY_LIB : EXAMPLE_LIB;
  const years = [...new Set(state.lib.entries.map((e) => e.date.slice(0, 4)))].sort().reverse();
  if (state.scope !== "all" && !years.includes(state.scope)) state.scope = "all";
  STATS = computeStats(state.lib, metaOf, state.scope);
  LISTS = new Map();
  const d = state.stack[state.stack.length - 1];
  renderTop(years, d);
  $("#screen").innerHTML = d ? detailScreen(d, STATS) : SCREENS[state.view](STATS);
  for (const b of document.querySelectorAll(".tabbar [data-view]")) {
    if (b.dataset.view === state.view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  }
  const cal = $(".cal-wrap");
  if (cal) cal.scrollLeft = cal.scrollWidth;
}
function renderTop(years, d) {
  $("#top").classList.toggle("detail", !!d);
  $("#nav-left").innerHTML = d ? `<button class="nav-btn" type="button" data-act="back">${BACK}<span class="sr-only">Back</span></button>` : "";
  const who = state.mode === "example" ? "Example diary" : state.lib.profile.username || "Your diary";
  $("#nav-title").textContent = d ? d.title : state.view === "profile" ? who : TITLES[state.view];
  $("#nav-right").innerHTML = !d ? `<button class="nav-btn" type="button" data-act="insights">Insights</button>` : "";
  $("#scopes").innerHTML = ["all", ...years].map((y) =>
    `<button class="scope" type="button" data-scope="${y}" aria-pressed="${y === state.scope}">${y === "all" ? "All time" : y}</button>`).join("");
}
function push(entry) {
  entry.ret = window.scrollY;
  state.stack.push(entry);
  render();
  window.scrollTo(0, 0);
}
function pop() {
  const d = state.stack.pop();
  render();
  window.scrollTo(0, d ? d.ret : 0);
}

/* ---------- pieces ---------- */
const sh = (label, right = "") => `<div class="sh"><span>${label}</span>${right}</div>`;
function avatar(p, size) {
  const ph = showImages && p.key && PHOTOS[p.key];
  return `<span class="avatar ${size}" aria-hidden="true">${esc(initials(p.name || "?"))}${ph ? `<img src="${IMG}${esc(ph)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;
}
function poster(f) {
  const m = metaOf(f);
  const img = showImages && m && m.poster ? `<img src="${IMG}${esc(m.poster)}" alt="" loading="lazy" onerror="this.remove()">` : "";
  return `<span class="poster"><span class="ph">${esc(f.name)}<small>${f.year || ""}</small></span>${img}</span>`;
}
function posterGrid(films) {
  return `<div class="pgrid">${films.map((f) => `<div class="pitem" title="${esc(f.name)}${f.year ? ` (${f.year})` : ""}">${poster(f)}
    <span class="pmeta"><span class="stars">${stars(f.rating)}</span>${f.liked ? '<span class="heart" aria-label="liked">♥</span>' : ""}</span></div>`).join("")}</div>`;
}
const filmsTitle = (p) => `${plural(p.count, "film")}${p.avg ? ` · ★ ${p.avg.toFixed(2)} average` : ""}`;
function personRow(p, rank, sortBest) {
  return `<button class="prow" type="button" data-push="${reg(p.name, filmsTitle(p), p.films, p)}">
    <span class="rk">${rank}</span>${avatar(p, "md")}
    <span style="min-width:0"><span class="nm" style="display:block">${esc(p.name)}</span><span class="sub">${filmsTitle(p)}</span></span>
    <span class="val">${sortBest ? p.avg.toFixed(2) : fmtN(p.count)}</span>${CHEV}</button>`;
}
function catRow(c, max, sortBest) {
  const w = sortBest ? c.avg / 5 : c.count / max;
  return `<button class="prow cat" type="button" data-push="${reg(c.name, filmsTitle(c), c.films)}">
    <span class="nm">${esc(c.name)}</span><span class="mini" aria-hidden="true"><span style="width:${(w * 100).toFixed(1)}%"></span></span>
    <span class="val" style="text-align:right">${sortBest ? c.avg.toFixed(2) : fmtN(c.count)}</span>${CHEV}</button>`;
}
const needMeta = () => `<div class="card" style="margin-top:14px"><p class="title">No cast or crew yet</p>
  <p>Letterboxd's export lists your films, dates and ratings, but not who's in them. Fill them in from the Import tab.</p>
  <button class="btn green" type="button" data-view="data">Fill in cast &amp; crew</button></div>`;

/* ---------- Profile ---------- */
function profileScreen(s) {
  const ex = state.mode === "example", lib = state.lib;
  const name = ex ? "Example diary" : lib.profile.name || lib.profile.username || "Your diary";
  const handle = ex ? `<span class="pill">Example</span>` : lib.profile.joined ? `Member since ${MONTHS_LONG[+lib.profile.joined.slice(5, 7) - 1]} ${lib.profile.joined.slice(0, 4)}` : "";
  const notice = ex ? `<div class="card notice"><p class="title">This is an example diary, not yours.</p>
      <p>Export your data from Letterboxd (Settings → Data → Export your data), then import the ZIP here. Your files stay in this browser.</p>
      <button class="btn green block" type="button" data-act="import">Import your export</button></div>` : "";
  const total = lib.films.length, have = lib.films.filter((f) => metaOf(f)).length;
  const fill = !ex && have < total ? `<button class="row" type="button" data-view="data" style="border-top:1px solid var(--line); margin-top:16px">
      <span>${job.running ? `Looking up cast &amp; crew · ${fmtN(job.done)} of ${fmtN(job.total)}` : `Cast &amp; crew for ${fmtN(have)} of ${plural(total, "film")}`}</span>
      <span class="count" style="color:var(--green)">${job.running ? "" : "Fill in"}</span>${CHEV}</button>` : "";
  const hours = Math.round(s.minutes / 60);
  const strip = `<div class="strip">
    <div><b class="num">${fmtN(s.films.length)}</b><span>Films</span></div>
    <div><b class="num">${s.timed ? fmtN(hours) : "—"}</b><span>Hours</span></div>
    <div><b class="num">${fmtN(s.entries.length)}</b><span>Entries</span></div>
    <div><b class="num">${s.avgRating ? s.avgRating.toFixed(2) : "—"}</b><span>Average</span></div></div>`;
  const top = s.films.filter((f) => f.rating).sort((a, b) => b.rating - a.rating || b.entries.length - a.entries.length || (b.year || 0) - (a.year || 0));
  const topRated = top.length ? sh("Top rated", `<button class="more" type="button" data-act="all-rated">See all</button>`) + posterGrid(top.slice(0, 4)) : "";
  const ratings = s.rated ? sh("Ratings", `<span class="num">${fmtN(s.rated)}</span>`) +
    colChart(s.spread.map((x) => ({ a: x.count, b: 0, tip: `${stars(x.r)} · ${plural(x.count, "film")}` })), "How many films you gave each rating", "", 72)
      .replace('class="chart"', 'class="chart slate"').replace(/<div class="axis"[^]*?<\/div>/, "") +
    `<div class="hist-ends" style="margin-right:26px"><span class="stars">★</span><span class="stars">★★★★★</span></div>` : "";
  const strip2 = (label, data, role) => {
    const list = data.most.slice(0, 10);
    if (!list.length) return "";
    return sh(label, `<button class="more" type="button" data-act="people" data-role="${role}">See all</button>`) +
      `<div class="scroller">${list.map((p) => `<button class="pcard" type="button" data-push="${reg(p.name, filmsTitle(p), p.films, p)}">
        ${avatar(p, "lg")}<span class="nm">${esc(p.name)}</span><span class="ct">${plural(p.count, "film")}</span></button>`).join("")}</div>`;
  };
  const people = s.withMeta ? strip2("Most watched actors", s.cast, "c") + strip2("Most watched directors", s.directors, "d") : "";
  const rows = [
    ["Actors", s.cast.total, `data-act="people" data-role="c"`],
    ["Directors", s.directors.total, `data-act="people" data-role="d"`],
    ["Diary", s.entries.length, `data-view="diary"`],
    ["Genres", s.genres.most.length, `data-act="cat" data-field="genres"`],
    ["Countries", s.countries.most.length, `data-act="cat" data-field="countries"`],
    ["Languages", s.languages.most.length, `data-act="cat" data-field="languages"`],
    ["Rewatches", s.rewatches, `data-view="films"`],
    ["Liked", s.likes, `data-act="liked"`],
  ].map(([k, n, attrs]) => `<li><button class="row" type="button" ${attrs}><span>${k}</span><span class="count">${fmtN(n)}</span>${CHEV}</button></li>`).join("");
  return `<div class="profile">${avatar({ name: ex ? "Example" : lib.profile.username || "You" }, "xl")}
      <div class="name">${esc(name)}</div><div class="handle">${handle}</div></div>
    ${notice}${strip}
    <button class="row" type="button" data-act="insights"><span>Insights</span><span class="count">Trends, tastes, the crowd</span>${CHEV}</button>
    ${fill}${topRated}${ratings}${people}
    ${sh(state.scope === "all" ? "All time" : state.scope)}<ul class="menu">${rows}</ul>`;
}

/* ---------- People ---------- */
function peopleScreen(s) {
  const role = state.role;
  const data = role === "c" ? s.cast : role === "d" ? s.directors : { w: s.writers, p: s.dop, m: s.music }[state.crew];
  const best = state.sort === "best";
  const list = best ? data.best : data.most;
  const segs = [["c", "Actors"], ["d", "Directors"], ["crew", "Crew"]].map(([v, l]) =>
    `<button type="button" data-role="${v}" aria-pressed="${v === role}">${l}</button>`).join("");
  const crew = role === "crew" ? `<div class="toggles">${[["w", "Writers"], ["p", "Camera"], ["m", "Music"]].map(([v, l]) =>
    `<button class="toggle" type="button" data-crew="${v}" aria-pressed="${v === state.crew}">${l}</button>`).join("")}</div>` : "";
  const sorts = `<div class="toggles">${[["most", "Most watched"], ["best", "Highest rated"]].map(([v, l]) =>
    `<button class="toggle" type="button" data-sort="${v}" aria-pressed="${v === state.sort}">${l}</button>`).join("")}</div>`;
  const head = `<div class="segctl" role="group" aria-label="Role">${segs}</div>${crew}${sorts}`;
  if (!s.withMeta) return head + needMeta();
  const note = role === "c" ? `Top ${CAST_DEPTH} billed cast of each film.` : "";
  const bestNote = best ? `${note ? " " : ""}Highest rated needs ${s.minRated} or more rated films.` : "";
  const rows = list.slice(0, state.peopleLimit).map((p, i) => personRow(p, i + 1, best)).join("");
  const more = list.length > state.peopleLimit ? `<button class="row" type="button" data-act="more-people"><span>Show more</span><span class="count">${fmtN(list.length - state.peopleLimit)} more</span>${CHEV}</button>` : "";
  return head + sh(`${fmtN(list.length)} ${role === "c" ? "actors" : role === "d" ? "directors" : "people"}`) +
    (note + bestNote ? `<p class="status" style="margin:-2px 0 4px">${esc(note + bestNote)}</p>` : "") +
    (rows || `<div class="empty">Nobody to show for this period.</div>`) + more;
}
</script>
<script>
/* ---------- Diary ---------- */
const fact = (k, v, f) => `<div class="fact"><span class="k">${k}</span><span class="v">${esc(v)}${tmdbLink(f)}</span></div>`;
function diaryScreen(s) {
  if (!s.entries.length) return `<div class="empty" style="padding-top:28px">No diary dates in ${s.scope === "all" ? "your export" : s.scope}. Films logged without a date still count on the other tabs.</div>`;
  const cols = timeline(s);
  const unit = s.scope !== "all" ? "week" : cols[0].key.length === 7 ? "month" : "year";
  const bm = s.busiestMonth, fav = s.weekday.indexOf(Math.max(...s.weekday));
  const facts = `<div class="facts">${[
    fact("Busiest month", bm ? `${MONTHS[+bm.key.slice(5, 7) - 1]} ${bm.key.slice(0, 4)} · ${plural(bm.count, "film")}` : "—"),
    fact("Longest streak", s.streak.days > 1 ? `${s.streak.days} days` : "1 day"),
    fact("Most in a day", s.busiestDay ? `${plural(s.busiestDay.count, "film")} · ${fmtDate(s.busiestDay.key).replace(/ \d{4}$/, s.scope === "all" ? "$&" : "")}` : "—"),
    fact("Favourite day", WEEKDAYS_LONG[fav]),
  ].join("")}</div>`;
  const legend = s.rewatches ? `<div class="legend"><span><i style="background:var(--green-mark)"></i>First watch</span><span><i style="background:var(--blue-mark)"></i>Rewatch</span></div>` : "";
  let chart = colChart(cols, `Diary entries by ${unit}`, legend, 110);
  if (cols.length > 24) chart = chart.replace('class="axis"', 'class="axis dense"');
  const wmax = Math.max(1, ...s.weekday);
  const weekdays = `<div class="weekdays" role="img" aria-label="Diary entries by day of the week">${s.weekday.map((n, i) =>
    `<div class="wd" data-tip="${WEEKDAYS_LONG[i]}: ${plural(n, "film")}"><span class="cnt">${n}</span><div class="bar-v"><span style="height:${(n / wmax * 100).toFixed(1)}%"></span></div><span class="lbl">${WEEKDAYS[i].slice(0, 1)}</span></div>`).join("")}</div>`;
  const list = [...s.entries].reverse().slice(0, state.diaryLimit);
  let rows = "", month = "";
  for (const e of list) {
    const m = e.date.slice(0, 7);
    if (m !== month) { month = m; rows += `<div class="month-h">${MONTHS_LONG[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}</div>`; }
    rows += `<div class="drow"><span class="day">${+e.date.slice(8, 10)}</span>${poster(e.film)}
      <span style="min-width:0"><span class="t" style="display:block">${esc(e.film.name)} <span>${e.film.year || ""}</span></span>
      <span class="m"><span class="stars">${stars(e.rating)}</span></span></span>
      <span class="icons">${e.rewatch ? '<span class="rewatch" title="Rewatch">↻</span>' : ""}${e.film.liked ? '<span class="heart" title="Liked">♥</span>' : ""}${e.review ? '<span title="Reviewed">≡</span>' : ""}</span></div>`;
  }
  const more = s.entries.length > state.diaryLimit ? `<button class="row" type="button" data-act="more-diary"><span>Show older entries</span><span class="count">${fmtN(s.entries.length - state.diaryLimit)} more</span>${CHEV}</button>` : "";
  return facts + sh(`Films by ${unit}`, `<span class="num">${fmtN(s.entries.length)}</span>`) + chart +
    sh("By day of the week") + weekdays +
    sh(s.scope === "all" ? "Last 12 months" : `Every day of ${s.scope}`) + heatmap(s).replace("Fewer", "Less") +
    sh("Diary", `<span class="num">${plural(s.entries.length, "entry", "entries")}</span>`) + `<div>${rows}</div>` + more;
}

/* ---------- Films ---------- */
function filmsScreen(s) {
  const views = (f) => s.scope === "all" ? f.entries.length : f.entries.filter((e) => e.date.startsWith(s.scope)).length;
  const rated = s.films.filter((f) => f.rating).sort((a, b) => b.rating - a.rating || views(b) - views(a) || (b.year || 0) - (a.year || 0));
  let html = rated.length ? sh("Highest rated", `<button class="more" type="button" data-act="all-rated">See all</button>`) + posterGrid(rated.slice(0, 8)) : "";
  const best = state.catSort === "best";
  if (s.withMeta) {
    html += `<div class="toggles" style="margin-top:22px">${[["most", "Most watched"], ["best", "Highest rated"]].map(([v, l]) =>
      `<button class="toggle" type="button" data-catsort="${v}" aria-pressed="${v === state.catSort}">${l}</button>`).join("")}</div>`;
    for (const [label, data, field] of [["Genres", s.genres, "genres"], ["Countries", s.countries, "countries"], ["Languages", s.languages, "languages"]]) {
      const list = (best ? data.best : data.most);
      html += sh(label, list.length > 6 ? `<button class="more" type="button" data-act="cat" data-field="${field}">See all</button>` : "") +
        (list.length ? list.slice(0, 6).map((c) => catRow(c, list[0].count, best)).join("") : `<div class="empty">${best ? "Needs 3 or more rated films each." : "Nothing yet."}</div>`);
    }
  } else html += needMeta();

  if (s.decades.length) {
    const all = s.decades, cols = [];
    for (let d = all[0].decade; d <= all[all.length - 1].decade; d += 10) {
      const x = all.find((y) => y.decade === d);
      cols.push({ a: x ? x.count : 0, b: 0, label: `’${String(d).slice(2)}`, tip: `${d}s: ${plural(x ? x.count : 0, "film")}${x && x.avg ? ` · ${x.avg.toFixed(2)} average` : ""}` });
    }
    const ranked = all.filter((x) => x.ratings.length >= 3).sort((a, b) => b.avg - a.avg).slice(0, 5)
      .map((x) => ({ name: `${x.decade}s`, films: x.films, count: x.count, avg: x.avg }));
    html += sh("Decades") + colChart(cols, "Films by decade of release", "", 90) +
      (ranked.length ? `<p class="status" style="margin:14px 0 0">Highest-rated decades</p>` + ranked.map((c) => catRow(c, 1, true)).join("") : "");
  }

  const re = s.films.filter((f) => views(f) > 1).sort((a, b) => views(b) - views(a) || (b.rating || 0) - (a.rating || 0)).slice(0, 8);
  if (re.length) html += sh("Most rewatched") + re.map((f) => `<div class="drow" style="grid-template-columns:34px minmax(0,1fr) auto">${poster(f)}
    <span style="min-width:0"><span class="t" style="display:block">${esc(f.name)} <span>${f.year || ""}</span></span><span class="m"><span class="stars">${stars(f.rating)}</span></span></span>
    <span class="val num">${views(f)}×</span></div>`).join("");

  const E = s.entries;
  if (E.length) {
    const marks = s.scope === "all" ? [50, 100, 250, 500, 750, 1000, 1500, 2000, 2500, 3000, 4000, 5000, 7500, 10000] : [25, 50, 100, 150, 200, 250, 300, 365, 400, 500];
    const items = [["First film", E[0]], ...marks.filter((n) => n < E.length).slice(-5).map((n) => [`${ordinal(n)} film`, E[n - 1]])];
    if (E.length > 1) items.push(["Latest", E[E.length - 1]]);
    html += sh("Milestones") + `<div class="pgrid">${items.map(([k, e]) => `<div class="pitem" title="${esc(e.film.name)}${e.film.year ? ` (${e.film.year})` : ""}">
      <span class="mlabel">${k}</span>${poster(e.film)}
      <span class="pmeta"><span class="stars">${stars(e.rating)}</span>${e.rewatch ? '<span class="rewatch" aria-label="rewatch">↻</span>' : ""}</span>
      <span class="mdate">${fmtDate(e.date)}</span></div>`).join("")}</div>`;
  }

  const timed = s.films.filter((f) => metaOf(f) && metaOf(f).r);
  const longest = timed.reduce((a, f) => !a || metaOf(f).r > metaOf(a).r ? f : a, null);
  const shortest = timed.reduce((a, f) => !a || metaOf(f).r < metaOf(a).r ? f : a, null);
  const dated = s.films.filter((f) => f.year);
  const oldest = dated.reduce((a, f) => !a || f.year < a.year ? f : a, null);
  const newest = dated.reduce((a, f) => !a || f.year > a.year ? f : a, null);
  const rec = [
    longest && fact("Longest", `${longest.name} · ${metaOf(longest).r} min`, longest), shortest && fact("Shortest", `${shortest.name} · ${metaOf(shortest).r} min`, shortest),
    oldest && fact("Oldest", `${oldest.name} · ${oldest.year}`, oldest), newest && fact("Newest", `${newest.name} · ${newest.year}`, newest),
  ].filter(Boolean).join("");
  if (rec) html += sh("Records") + `<div class="facts" style="margin-top:0">${rec}</div>`;
  return html || `<div class="empty">No films in this period.</div>`;
}

/* ---------- Import ---------- */
function lookupInner() {
  if (state.mode === "example" || !MY_LIB) {
    return `<p class="title">Cast &amp; crew</p><p>Letterboxd's export lists your films, dates and ratings, but not who's in them.
      After you import yours, you can fill them in${IN_VIEWER ? " with Claude" : " from TMDB with your API key"}. The example has them filled in already.</p>`;
  }
  const lib = MY_LIB, total = lib.films.length;
  const have = lib.films.filter((f) => metaOf(f)).length;
  const fromTmdb = lib.films.filter((f) => META[f.key] && META[f.key].src === "tmdb" && !META[f.key].miss).length;
  const pct = total ? Math.round(have / total * 100) : 0;
  const src = fromTmdb ? (fromTmdb === have ? "From TMDB" : "From TMDB and Claude") : have ? "From Claude's film knowledge" : "Not looked up yet";
  const head = `<p class="title">Cast &amp; crew</p><div class="meter" role="progressbar" aria-label="Films with cast and crew" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span id="lookup-meter" style="width:${pct}%"></span></div>
    <p class="status">${fmtN(have)} of ${plural(total, "film")} · ${src}</p>`;
  const note = job.note ? `<p class="status${job.err ? " err" : ""}" role="status">${esc(job.note)}</p>` : "";
  const saveNote = job.saveFailed ? `<p class="status err">This browser wouldn't save the results, so they'll be gone when you close the page.</p>` : "";
  if (job.running) return head + `<p class="status" id="lookup-progress" role="status">${progressText()}</p><button class="btn block" type="button" data-act="stop">Stop</button>`;
  let body;
  if (!IN_VIEWER) {
    const todo = needsLookup(lib, "tmdb").length;
    const askKey = !tmdbKey() || editKey || job.badKey;
    body = todo && !askKey ? `<button class="btn green block" type="button" data-act="tmdb">Look up ${plural(todo, "film")} on TMDB</button>
      <p class="status">Using your saved TMDB key. <button class="linkish" type="button" data-act="change-key">Change key</button></p>` :
      todo ? `<label class="sr-only" for="tmdb-key">TMDB API key or read access token</label>
      <input class="key" id="tmdb-key" type="password" autocomplete="off" spellcheck="false" placeholder="TMDB API key or read access token" value="${esc(tmdbKey())}">
      <button class="btn green block" type="button" data-act="tmdb">Look up ${plural(todo, "film")} on TMDB</button>
      <p class="status">Get a free key at <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org/settings/api</a>. It's saved in this browser and sent only to TMDB.</p>` : have < total ? `<p>TMDB had no match for ${plural(total - have, "film")}.</p>` : `<p>Every film has details from TMDB.</p>`;
  } else if (sampleState === "ready") {
    const todo = needsLookup(lib, "claude").length;
    const misses = lib.films.filter((f) => META[f.key] && META[f.key].miss && META[f.key].src === "claude").length;
    body = `<p>Pages inside Claude can't reach TMDB, so Claude fills in each film from what it knows. Obscure films can come back wrong or empty.</p>` +
      (todo ? `<button class="btn green block" type="button" data-act="claude">Look up ${plural(todo, "film")} with Claude</button>
        <p class="status">About ${plural(Math.ceil(todo / CLAUDE_BATCH), "request")} on your Claude plan.</p>` :
      misses ? `<button class="btn block" type="button" data-act="claude-retry">Try the ${plural(misses, "film")} Claude didn't recognise</button>` : "");
  } else if (sampleState === "pending") {
    body = `<p class="status">Connecting to Claude…</p>`;
  } else {
    body = `<p>Lookups aren't available in this view. Open the downloadable copy of this page in a browser and use a TMDB key.</p>`;
  }
  return head + body + note + saveNote + imdbBlock(MY_LIB, true) + letterboxdBlock(MY_LIB, true);
}
function progressText() {
  return job.kind === "claude" && job.done === 0 ? `Asking Claude about ${plural(job.total, "film")}… the first batch takes up to a minute.`
    : `Looked up ${fmtN(job.done)} of ${plural(job.total, "film")} ${job.kind === "tmdb" ? "on TMDB" : "with Claude"}…`;
}
function renderLookup() { const el = $("#lookup"); if (el) el.innerHTML = lookupInner(); }
function renderLookupProgress() {
  const p = $("#lookup-progress");
  if (p) p.textContent = progressText();
  const ip = $("#imdb-progress");
  if (ip) ip.textContent = imdbProgressText();
  const lp = $("#lb-progress");
  if (lp) lp.textContent = lbProgressText();
  const m = $("#lookup-meter");
  if (m && MY_LIB) m.style.width = `${Math.round(MY_LIB.films.filter((f) => metaOf(f)).length / Math.max(1, MY_LIB.films.length) * 100)}%`;
}
function dataScreen() {
  const lib = MY_LIB;
  const status = lib ? `${plural(lib.films.length, "film")} and ${plural(lib.entries.length, "diary entry", "diary entries")} imported${lib.profile.username ? ` for @${esc(lib.profile.username)}` : ""}.` : "Nothing imported yet.";
  const rows = [];
  if (state.mode === "mine") rows.push(`<li><button class="row" type="button" data-act="example"><span>View the example diary</span>${CHEV}</button></li>`);
  else if (lib) rows.push(`<li><button class="row" type="button" data-act="mine"><span>Back to my diary</span>${CHEV}</button></li>`);
  rows.push(`<li><button class="row danger" type="button" data-act="forget"><span>${state.forgetArmed ? "Tap again to delete" : "Delete saved data from this browser"}</span></button></li>`);
  return `<div class="card" style="margin-top:18px"><p class="title">Your Letterboxd export</p><p>${status}</p>
      <ol style="margin:0; padding-left:18px; display:grid; gap:4px">
        <li>On <a href="https://letterboxd.com/settings/data/" target="_blank" rel="noopener">letterboxd.com</a>, open Settings → Data.</li>
        <li>Choose Export your data and download the ZIP.</li>
        <li>Import the ZIP here. It stays in this browser.</li></ol>
      <button class="btn green block" type="button" data-act="import">${lib ? "Import a newer export" : "Import export"}</button>
      ${state.importError ? `<p class="status err" role="alert">${esc(state.importError)}</p>` : ""}</div>
    <div class="card" id="lookup" style="margin-top:12px">${lookupInner()}</div>
    ${sh("This browser")}<ul class="menu">${rows.join("")}</ul>
    ${state.forgetArmed ? `<p class="status">Removes your imported export and looked-up details, plus any keys you typed in.</p>` : ""}
    <div class="foot"><p>Credits Roll reads the CSV files in a Letterboxd data export. It is not made by or affiliated with Letterboxd.</p>
      <p>With your own TMDB key, film details come from The Movie Database. This product uses the TMDB API but is not endorsed or certified by TMDB.
      Inside the Claude app, details come from Claude's knowledge of each film instead, so check anything surprising.</p>
      <p>On a computer? <a href="desktop.html">Open the desktop version</a>. It uses the same import.</p>
      <p>Updated 22 Oct 2026, 09:51 UTC</p></div>`;
}

/* ---------- pushed detail screens ---------- */
function detailScreen(d, s) {
  if (d.type === "insights") return insightsScreen();
  if (d.type === "cat") {
    const data = s[d.field], best = state.catSort === "best";
    const list = best ? data.best : data.most;
    return `<div class="toggles" style="margin-top:16px">${[["most", "Most watched"], ["best", "Highest rated"]].map(([v, l]) =>
      `<button class="toggle" type="button" data-catsort="${v}" aria-pressed="${v === state.catSort}">${l}</button>`).join("")}</div>` +
      sh(`${fmtN(list.length)} ${d.title.toLowerCase()}`) + (list.map((c) => catRow(c, list[0].count, best)).join("") || `<div class="empty">Nothing to show for this period.</div>`);
  }
  const films = [...d.films].sort((a, b) => (b.rating || 0) - (a.rating || 0) || (b.year || 0) - (a.year || 0));
  return `<div class="dhead">${d.person && d.person.key ? avatar(d.person, "xl") : ""}<div class="name">${esc(d.title)}</div><div class="sub">${esc(d.sub)}</div></div>` +
    sh("Films", `<span class="num">${fmtN(films.length)}</span>`) + posterGrid(films);
}

const SCREENS = { profile: profileScreen, people: peopleScreen, diary: diaryScreen, films: filmsScreen, data: dataScreen };
</script>
<script>
/* ---------- phone: the Insights screen, pushed from the nav bar or Profile ---------- */
function insightsScreen() {
  const lib = state.lib;
  const I = computeInsights(lib, metaOf, state.crowd || defaultCrowd(lib, metaOf));
  if (!lib.entries.length) return `<div class="empty" style="padding-top:28px">Insights come from your diary dates, and this diary has none yet.</div>`;
  const first = lib.entries[0].date, last = lib.entries[lib.entries.length - 1].date;
  const intro = `<p class="status" style="margin:16px 0 0">Patterns across ${plural(I.years.length, "year")} of diary, ${fmtDate(first)} to ${fmtDate(last)}.</p>`;
  return intro + mGlance(I) + mYears(I) + mTastes(I) + mGenres(I) + mPeople(I) + mCrowd(I) + mHabits(I);
}
const twoYears = (what) => `<div class="empty">${what} need diary entries from at least two years, with five or more films in each.</div>`;

function mGlance(I) {
  if (!I.glance.length) return "";
  return sh("At a glance") + `<div class="icards">${I.glance.map((g) => `<div class="icard"><span class="k">${esc(g.k)}</span><span class="big">${esc(g.big)}</span><p>${esc(g.text)}</p></div>`).join("")}</div>`;
}

function mYears(I) {
  if (I.years.length < 2) return sh("Year by year") + twoYears("Year-by-year trends");
  const mult = (title, value, tip, extra) => `<div class="mult"><p class="mt">${title}</p>${colChart(I.years.map((p) => ({ a: Math.max(0, value(p) || 0), b: extra ? extra(p) : 0, label: `’${p.year.slice(2)}`, tip: tip(p) })), title + " by year", "", 64)}</div>`;
  const anyPace = I.years.some((p) => p.pace && p.pace > p.films);
  const legend = anyPace ? `<div class="legend" style="margin-top:2px"><span><i style="background:var(--green-mark)"></i>Watched</span><span><i style="background:var(--blue-mark)"></i>Rest of this year at your pace</span></div>` : "";
  const rows = [...I.years].reverse().map((p) => `<tr><td>${p.year}</td><td class="n">${fmtN(p.films)}${p.pace ? ` <span class="dim">→${fmtN(p.pace)}</span>` : ""}</td><td class="n">${fmtN(Math.round(p.hours))}</td>
    <td class="n">${p.avgRating ? p.avgRating.toFixed(2) : "—"}</td><td class="n">${p.nonEnglish != null ? p.nonEnglish + "%" : "—"}</td>
    <td>${p.topGenre ? esc(p.topGenre[0]) : "—"}</td><td>${p.topDirector && p.topDirector[1] > 1 ? esc(p.topDirector[0]) : "—"}</td></tr>`).join("");
  return sh("Year by year") + legend + `<div class="mults">
    ${mult("Films", (p) => p.films, (p) => `${p.year}: ${plural(p.films, "film")}${p.pace ? `, on pace for about ${fmtN(p.pace)}` : ""}`, (p) => p.pace && p.pace > p.films ? p.pace - p.films : 0)}
    ${mult("Hours", (p) => Math.round(p.hours), (p) => `${p.year}: ${fmtN(Math.round(p.hours))} hours`)}
    ${mult("Average rating", (p) => p.avgRating, (p) => `${p.year}: ${p.avgRating ? starsNum(p.avgRating) : "no ratings"}`)}
    ${mult("Film age when watched", (p) => p.age, (p) => `${p.year}: ${p.age != null ? Math.round(p.age) + " years old on average" : "—"}`)}
    ${mult("Not in English (%)", (p) => p.nonEnglish, (p) => `${p.year}: ${p.nonEnglish != null ? p.nonEnglish + "%" : "not enough details"}`)}
    ${mult("Rewatches (%)", (p) => pctOf(p.rewatches, p.entries), (p) => `${p.year}: ${pctOf(p.rewatches, p.entries)}% of entries`)}</div>
    <div class="tscroll"><table class="mtable"><thead><tr><th>Year</th><th class="n">Films</th><th class="n">Hours</th><th class="n">Avg</th><th class="n">Not Eng.</th><th>Top genre</th><th>Top director</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function mTastes(I) {
  if (!I.tastes.table) return sh("Changing tastes") + twoYears("Changes in taste");
  const lines = I.tastes.lines.length ? I.tastes.lines.map((l) => `<div class="tline"><span class="mk ${l.dir}" aria-hidden="true">${l.dir === "up" ? "▲" : "▼"}</span><span>${esc(l.text)}</span></div>`).join("")
    : `<p style="margin:0">Your taste has held steady between your earliest and latest years.</p>`;
  const t = I.tastes.table;
  const heat = `<div class="tscroll"><table class="mtable heat"><thead><tr><th>Genre</th>${t.years.map((y) => `<th class="n">’${y.year.slice(2)}</th>`).join("")}</tr></thead>
    <tbody>${t.genres.map((g, gi) => `<tr><td>${esc(g)}</td>${t.years.map((y) => { const v = y.shares[gi];
      return `<td class="n" style="background:color-mix(in srgb, var(--green-mark) ${v == null ? 0 : Math.min(65, v * 1.5)}%, transparent)">${v == null ? "—" : v}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="status">Percent of each year's films in the genre.</p>`;
  return sh("Changing tastes") + lines + heat;
}

function mGenres(I) {
  if (!I.genres.length) return sh("Genres") + needMeta();
  const max = Math.max(0.5, ...I.genres.map((g) => Math.abs(g.vsCrowd || 0)), ...I.genres.map((g) => Math.abs(g.vsMe)));
  const bar = (d) => d == null ? `<span class="dim">—</span>` : `<span class="dbar" aria-hidden="true"><span class="mid"></span><span class="fill ${d >= 0 ? "pos" : "neg"}" style="width:${Math.min(50, Math.abs(d) / max * 50).toFixed(1)}%"></span></span>`;
  const lines = I.genreLines.map((t) => `<div class="tline"><span class="mk" aria-hidden="true">●</span><span>${esc(t)}</span></div>`).join("");
  const rows = I.genres.map((g) => `<button class="grow" type="button" data-push="${reg(g.name, `${plural(g.count, "film")} · ${g.mine.toFixed(2)} average`, g.films)}">
    <span style="min-width:0"><span class="nm">${esc(g.name)}</span><span class="sub">${plural(g.count, "film")} · ★ ${g.mine.toFixed(2)}</span></span>
    <span class="gcol">${bar(g.vsMe)}<span class="v">${signed(g.vsMe)}</span></span><span class="gcol">${bar(g.vsCrowd)}<span class="v">${g.vsCrowd == null ? "" : signed(g.vsCrowd)}</span></span>${CHEV}</button>`).join("");
  return sh("Genres") + lines + `<div class="ghead"><span></span><span>vs your avg</span><span>vs ${esc(I.crowd.short)}</span><span></span></div>${rows}
    <div class="legend" style="margin-top:8px"><span><i style="background:var(--green-mark)"></i>Higher</span><span><i style="background:var(--blue-mark)"></i>Lower</span><span>in stars</span></div>`;
}

function mPeople(I) {
  const P = I.people;
  const row = (p, i, value, sub) => `<button class="prow" type="button" data-push="${reg(p.name, sub(p), p.films, p)}">
    <span class="rk">${i + 1}</span>${avatar(p, "md")}<span style="min-width:0"><span class="nm" style="display:block">${esc(p.name)}</span><span class="sub">${esc(sub(p))}</span></span>
    <span class="val">${value}</span>${CHEV}</button>`;
  const obs = [...P.obsDirectors.map((p) => ({ ...p, role: "Director" })), ...P.obsActors.map((p) => ({ ...p, role: "Actor" }))].sort((a, b) => b.inLatest - a.inLatest).slice(0, 6);
  const comp = [...P.compDirectors.map((p) => ({ ...p, role: "Director" })), ...P.compActors.map((p) => ({ ...p, role: "Actor" }))].sort((a, b) => b.years.size - a.years.size || b.count - a.count).slice(0, 6);
  if (!obs.length && !comp.length && !P.binges.length) return sh("People") + `<div class="empty">People trends need cast &amp; crew details and a few years of diary.</div>`;
  let html = "";
  if (obs.length) html += sh(`New in ${I.latest}`) + obs.map((p, i) => row(p, i, `${p.inLatest}`, (q) => `${q.role} · ${plural(q.inLatest, "film")} in ${I.latest}, none before`)).join("");
  if (comp.length) html += sh("Long-time companions") + comp.map((p, i) => row(p, i, `${p.years.size}y`, (q) => `${q.role} · ${plural(q.years.size, "year")} of your diary`)).join("");
  if (P.binges.length) html += sh("Director binges") + P.binges.map((p, i) => row(p, i, `${p.binge.n}`, (q) => `${q.binge.n} films, ${fmtDate(q.binge.from)} – ${fmtDate(q.binge.to)}`)).join("");
  if (P.discoveries.length >= 2) html += sh("Directors discovered each year") +
    colChart(P.discoveries.map((d) => ({ a: d.count, b: 0, label: `’${d.year.slice(2)}`, tip: `${d.year}: ${plural(d.count, "new director")}` })), "New directors by year", "", 64);
  return html;
}

function mCrowd(I) {
  const C = I.crowd;
  const toggles = `<div class="toggles">${Object.entries(CROWDS).map(([k, c]) => (C.available[k] || 0) >= 5 || k === C.key
    ? `<button class="toggle" type="button" data-crowdsel="${k}" aria-pressed="${k === C.key}">${c.short}</button>` : "").join("")}</div>`;
  if (C.n < 5) {
    const why = IN_VIEWER ? `Crowd scores come from TMDB and OMDb, which pages inside Claude can't reach. Open <a href="https://sjnift.github.io/credits-roll/" target="_blank" rel="noopener">the web version</a>.`
      : C.key === "tmdb" ? "Crowd scores come with TMDB details. Look your films up in the Import tab."
      : C.key === "letterboxd" ? "Letterboxd averages need an Apify token, added in the Import tab." : "IMDb and critics' scores need a free OMDb key, added in the Import tab.";
    return sh("Against the crowd") + toggles + `<div class="empty">${why}</div>`;
  }
  const grid = (items) => `<div class="pgrid">${items.map((p) => `<div class="pitem" title="You ${p.you}★ · ${C.label} ${crowdScore(C.key, p.crowd)}">${poster(p.f)}
    <span class="pmeta"><span class="stars">${stars(p.you)}</span></span><span class="mdate">${C.short} ${crowdScore(C.key, p.crowd)} · <b class="dv">${signed(p.diff)}★</b></span></div>`).join("")}</div>`;
  let html = sh("Against the crowd") + toggles + `<p class="lead">You give ${Math.abs(C.meanDiff).toFixed(2)}★ ${C.meanDiff >= 0 ? "more" : "less"} than ${esc(C.label)} on average${followText(C.r)}, across ${plural(C.n, "film")}.</p>`;
  html += sh(`Liked more than ${esc(C.short)}`) + (C.higher.length ? grid(C.higher) : `<div class="empty">No film you rated ¾★ or more above them.</div>`);
  html += sh(`Liked less than ${esc(C.short)}`) + (C.lower.length ? grid(C.lower) : `<div class="empty">No film you rated ¾★ or more below them.</div>`);
  if (C.gems.length) html += sh("Hidden gems") + `<p class="status" style="margin:-2px 0 10px">Rated 4½★ or more by you, and by few others.</p><div class="pgrid">${C.gems.map((g) => `<div class="pitem">${poster(g.f)}
    <span class="pmeta"><span class="stars">${stars(g.f.rating)}</span></span><span class="mdate">${fmtN(g.pop.n)} ${g.pop.src} votes</span></div>`).join("")}</div>`;
  return html;
}

function mHabits(I) {
  if (!I.habits.length) return "";
  return sh("Habits") + `<div class="facts" style="margin-top:0">${I.habits.map((h) => `<div class="fact"><span class="k">${esc(h.k)}</span><span class="v">${esc(h.v)}</span><span class="t">${esc(h.text)}</span></div>`).join("")}</div>`;
}
</script>
<script>
/* ---------- importing ---------- */
async function importFiles(files) {
  state.importError = "";
  try {
    const rows = await readExport(files);
    const saved = store.set(KEYS.rows, rows);
    MY_LIB = buildLibrary(rows);
    Object.assign(state, { mode: "mine", scope: "all", view: "profile", stack: [], peopleLimit: 50, diaryLimit: 60 });
    job.note = saved ? "" : "This browser wouldn't save your export, so you'll need to import it again next time.";
    job.err = !saved;
    setTimeout(() => autoLookup(MY_LIB));
  } catch (e) {
    state.importError = (e && e.message) || "Couldn't read that file. Import the ZIP from Letterboxd → Settings → Data.";
    Object.assign(state, { view: "data", stack: [] });
  }
  saveView();
  render();
  window.scrollTo(0, 0);
}

/* ---------- taps ---------- */
let forgetTimer = null;
function act(t) {
  const a = t.dataset.act;
  if (a === "import") $("#file-input").click();
  else if (a === "insights") push({ type: "insights", title: "Insights" });
  else if (a === "back") pop();
  else if (a === "people") { Object.assign(state, { view: "people", role: t.dataset.role || "c", stack: [], peopleLimit: 50 }); saveView(); render(); window.scrollTo(0, 0); }
  else if (a === "cat") push({ type: "cat", field: t.dataset.field, title: t.dataset.field[0].toUpperCase() + t.dataset.field.slice(1) });
  else if (a === "all-rated" || a === "liked") {
    const films = STATS.films.filter((f) => a === "liked" ? f.liked : f.rating);
    push({ type: "films", title: a === "liked" ? "Liked" : "Highest rated", sub: plural(films.length, "film"), films });
  }
  else if (a === "more-people") { state.peopleLimit += 100; render(); }
  else if (a === "more-diary") { state.diaryLimit += 120; render(); }
  else if (a === "example" || a === "mine") { Object.assign(state, { mode: a === "example" ? "example" : "mine", scope: "all", view: "profile", stack: [] }); saveView(); render(); window.scrollTo(0, 0); }
  else if (a === "forget") {
    if (!state.forgetArmed) {
      state.forgetArmed = true; render();
      forgetTimer = setTimeout(() => { state.forgetArmed = false; if (state.view === "data") render(); }, 6000);
      return;
    }
    clearTimeout(forgetTimer); state.forgetArmed = false;
    if (job.running && job.ctl) job.ctl.abort();
    Object.values(KEYS).forEach((k) => store.del(k)); store.del(VIEW_KEY);
    META = {}; PHOTOS = {}; LBX = {}; MY_LIB = null;
    Object.assign(state, { mode: "example", scope: "all", stack: [] });
    job.note = "Deleted your saved data from this browser."; job.err = false;
    render();
  }
  else if (a === "tmdb") startTmdb(MY_LIB);
  else if (a === "change-key") { editKey = true; renderLookup(); $("#tmdb-key")?.focus(); }
  else if (a === "omdb") startOmdb(MY_LIB);
  else if (a === "change-omdb") { editOmdb = true; renderLookup(); $("#omdb-key")?.focus(); }
  else if (a === "claude") runClaude(MY_LIB);
  else if (a === "claude-retry") retryClaudeMisses(MY_LIB);
  else if (a === "stop") job.ctl && job.ctl.abort();
}

function bind() {
  const fileInput = $("#file-input");
  fileInput.addEventListener("change", () => { const files = [...fileInput.files]; fileInput.value = ""; if (files.length) importFiles(files); });
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-lb],[data-crowdsel],[data-act],[data-view],[data-scope],[data-push],[data-role],[data-crew],[data-sort],[data-catsort]");
    if (!t) return;
    if (t.dataset.lb) { lbAction(t.dataset.lb, MY_LIB); return; }
    if (t.dataset.crowdsel) { state.crowd = t.dataset.crowdsel; render(); return; }
    if (t.dataset.act) return act(t);
    if (t.dataset.view) {
      const same = state.view === t.dataset.view && !state.stack.length;
      Object.assign(state, { view: t.dataset.view, stack: [], forgetArmed: false });
      saveView(); render();
      if (!same) window.scrollTo(0, 0);
    }
    else if (t.dataset.scope) { Object.assign(state, { scope: t.dataset.scope, peopleLimit: 50, diaryLimit: 60 }); saveView(); render(); }
    else if (t.dataset.push) { const L = LISTS.get(t.dataset.push); if (L) push({ type: "films", title: L.title, sub: L.sub, films: L.films, person: L.person }); }
    else if (t.dataset.role) { Object.assign(state, { role: t.dataset.role, peopleLimit: 50 }); render(); }
    else if (t.dataset.crew) { state.crew = t.dataset.crew; render(); }
    else if (t.dataset.sort) { state.sort = t.dataset.sort; render(); }
    else if (t.dataset.catsort) { state.catSort = t.dataset.catsort; render(); }
  });

  // tooltips for chart marks; a tap shows one on a phone
  const tip = $("#tip");
  const place = (x, y) => {
    const r = tip.getBoundingClientRect();
    let left = x + 12, top = y - r.height - 14;
    if (left + r.width > innerWidth - 8) left = x - r.width - 12;
    if (top < 8) top = y + 20;
    tip.style.left = Math.max(8, left) + "px"; tip.style.top = top + "px";
  };
  document.addEventListener("pointerover", (e) => {
    const t = e.target.closest && e.target.closest("[data-tip]");
    if (!t) { tip.hidden = true; return; }
    tip.textContent = t.dataset.tip; tip.hidden = false; place(e.clientX, e.clientY);
  });
  document.addEventListener("pointermove", (e) => { if (!tip.hidden) place(e.clientX, e.clientY); });
  window.addEventListener("scroll", () => { tip.hidden = true; }, { passive: true });

  // a dropped export works too, for anyone using this on a computer
  const hasFiles = (e) => [...((e.dataTransfer && e.dataTransfer.types) || [])].includes("Files");
  window.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener("drop", (e) => { if (!hasFiles(e)) return; e.preventDefault(); const files = [...e.dataTransfer.files]; if (files.length) importFiles(files); });
}

function init() {
  const ex = buildExample();
  EXAMPLE_META = Object.fromEntries(Object.entries(ex.meta).map(([k, m]) => [k, cleanMeta(m)]));
  EXAMPLE_LIB = buildLibrary(ex.rows);
  const saved = store.get(KEYS.rows, null);
  if (saved) { try { MY_LIB = buildLibrary(saved); } catch { MY_LIB = null; } }
  const view = store.get(VIEW_KEY, {});
  state.mode = MY_LIB && view.mode !== "example" ? "mine" : "example";
  if (view.scope) state.scope = view.scope;
  if (SCREENS[view.view]) state.view = view.view;
  bind();
  render();
  // A saved key picks up films not yet looked up, or matched before matching improved.
  if (MY_LIB) { autoLookup(MY_LIB); pollLetterboxd(MY_LIB); }
}
init();
</script>
</body>
</html>
