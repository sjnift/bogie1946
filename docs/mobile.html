<script>
/* ---------- Letterboxd averages, through an Apify actor ----------
   Letterboxd has no public API and browsers can't read its pages from another site, so an Apify
   actor (solidcode/letterboxd-scraper) reads Letterboxd in Apify's cloud and returns each film's
   average. Apify's free plan needs no card and gives $5 of credit a month, and on that plan runs
   just stop when the credit is used up. So each run is capped to fit inside $5, whatever a run
   finishes is kept, and the next run asks only for the films still missing. Titles and years come
   from Letterboxd itself, so they match the export exactly. */
const LB_ACTOR = "solidcode~letterboxd-scraper";
// Apify's price for this actor on its free plan: per film, plus a fee per run.
const LB_PRICE_PER_FILM = 0.0036, LB_PRICE_PER_RUN = 0.005;
const LB_RUN_CAP = 1300; // films per run: about $4.69, inside the free plan's $5 a month
const runCost = (films) => films * LB_PRICE_PER_FILM + LB_PRICE_PER_RUN;
const cost = (n) => n < 0.01 ? "under 1¢" : `about $${n.toFixed(2)}`;
// film key → { r: average out of 5, n: ratings, slug, at } once found, or { tries } while not yet found
let LBX = store.get(KEYS.lbx, {});
const apifyKey = () => store.get(KEYS.apify, "");
const lbJob = { running: false, started: 0, note: "", err: false, badKey: false };
let editApify = false;

async function apify(path, opts = {}) {
  const res = await fetch("https://api.apify.com/v2" + path, {
    ...opts, headers: { "Content-Type": "application/json", Authorization: "Bearer " + apifyKey() },
  });
  if (res.status === 401) throw { code: "auth" };
  if (res.status === 402 || res.status === 403) throw { code: "credit" };
  if (!res.ok) throw { code: "http", status: res.status };
  return res.json();
}
const lbFound = (f) => LBX[f.key] && LBX[f.key].r;
// A film looked for by address and not found is left alone. Tries from before both addresses were asked for at once don't count.
const lbTries = (f) => { const x = LBX[f.key]; return x && x.v === 2 ? x.tries || 0 : 0; };

// Letterboxd's address for a film: its title in lowercase with hyphens, accents and most punctuation dropped
const LB_LETTERS = { "ø": "o", "æ": "ae", "œ": "oe", "ß": "ss", "ł": "l", "đ": "d", "ð": "d", "þ": "th", "ı": "i" };
const lbSlug = (name) => String(name).toLowerCase().replace(/½/g, " half ").replace(/[øæœßłđðþı]/g, (c) => LB_LETTERS[c])
  .normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/['’*.]/g, "").replace(/&/g, " ").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

// several films. Asking for both in one run costs nothing extra for the one that doesn't exist.
const lbUrls = (f) => { const s = lbSlug(f.name); return s ? [s, ...(f.year ? [`${s}-${f.year}`] : [])] : []; };
const LB_SPARE = 1.15; // a plain address can lead to another film of the same name, which Apify still charges for

async function startLetterboxd(lib, mode) {
  const user = lib.profile.username;
  let input, keys = [], slugs = {};
  if (mode === "all") {
    if (!user) { Object.assign(lbJob, { note: "Your import has no Letterboxd username. Import the whole export ZIP, which includes profile.csv.", err: true }); renderLookup(); return; }
    input = { startUrls: [`https://letterboxd.com/${user}/films/`], includeReviews: false, maxResults: Math.min(lib.films.length + 20, LB_RUN_CAP) };
  } else {
    const films = lbMissing(lib).slice(0, Math.floor(LB_RUN_CAP / LB_SPARE));
    keys = films.map((f) => f.key);
    for (const f of films) for (const s of lbUrls(f)) slugs[s] = f.key;
    input = { startUrls: Object.keys(slugs).map((s) => `https://letterboxd.com/film/${s}/`), includeReviews: false, maxResults: Math.min(LB_RUN_CAP, Math.ceil(films.length * LB_SPARE) + 5) };
  }
  Object.assign(lbJob, { running: true, started: Date.now(), note: "", err: false, badKey: false });
  renderLookup();
  try {
    const run = await apify(`/acts/${LB_ACTOR}/runs`, { method: "POST", body: JSON.stringify(input) });
    store.set(KEYS.lbRun, { id: run.data.id, dataset: run.data.defaultDatasetId, at: Date.now(), mode, keys, slugs, asked: input.maxResults });

// Waits for the run, then keeps whatever it found, even if it stopped early. Also called on page
// load, so a run started earlier is picked up after the page was closed.
async function pollLetterboxd(lib) {
  const r = store.get(KEYS.lbRun, null);
  if (!r || !apifyKey()) return;
  Object.assign(lbJob, { running: true, started: r.at, note: "", err: false });
  renderLookup();
  try {

      if (f) return f;
      const asked = byKey.get((r.slugs || {})[it.filmSlug]);
      return asked && near(asked, y) ? asked : null;
    };
    const today = new Date().toISOString().slice(0, 10);
    let matched = 0, films = 0, stray = 0;
    const hit = new Set();
    for (const it of items) {
      if (it.recordType && it.recordType !== "film") continue;
      films++;
      const f = match(it);
      if (!f) { stray++; continue; }
      if (!(Number(it.averageRating) > 0)) continue;
      if (!lbFound(f)) matched++;
      hit.add(f.key);
      LBX[f.key] = { r: Number(it.averageRating), n: Number(it.ratingsCount) || 0, slug: it.filmSlug || null, at: today };

  }

  } else body = `<p class="status">${fmtN(found)} of ${plural(total, "film")} have Letterboxd averages. ${link("all", `Refresh them (${cost(runCost(Math.min(total, LB_RUN_CAP)))})`)}</p>`;
  const goneList = gone && D.films("Not found on Letterboxd", "Not found at either of the addresses their titles give", lbNotFound(lib), { sort: "name" });
  const goneNote = gone ? `<p class="status">${dlink(goneList, plural(gone, "film"))} couldn't be found on Letterboxd by title, so ${gone === 1 ? "it's" : "they're"} left out of Letterboxd comparisons.</p>` : "";

}
function lbProgressText() {
  const mins = Math.max(0, Math.round((Date.now() - lbJob.started) / 60000));
  return `Apify is reading Letterboxd for you (started ${mins ? `${mins} min ago` : "just now"}). Big libraries take several minutes; you can close this page and the results are picked up when you come back.`;
}
function lbAction(act, lib) {

<script>
/* ---------- insights: patterns across the whole diary, shared by both layouts ----------

   Letterboxd members (through Apify), TMDB users (from the TMDB lookup), IMDb users and critics (from OMDb). */
const CROWDS = {
  letterboxd: { label: "Letterboxd members", short: "Letterboxd", score: (m, f) => { const x = f && LBX[f.key]; return x && x.r && x.n >= 10 ? x.r * 2 : null; } },
  imdb: { label: "IMDb users", short: "IMDb", score: (m) => m && m.ir && (m.iv || 0) >= 100 ? m.ir : null },
  tmdb: { label: "TMDB users", short: "TMDB", score: (m) => m && m.va && (m.vc || 0) >= 25 ? m.va : null },
  critics: { label: "Critics (Metacritic)", short: "Critics", score: (m) => m && m.mc ? m.mc / 10 : null },

// A crowd's score the way that crowd shows it: Letterboxd in stars out of 5, the others out of 10.
const crowdScore = (key, stars5) => key === "letterboxd" ? `${stars5.toFixed(1)}★` : (stars5 * 2).toFixed(1);
const pctOf = (n, d) => d ? Math.round(n / d * 100) : 0;
const starsNum = (x) => `${x.toFixed(1)}★`;
const signed = (x, digits = 1) => Math.abs(x) < 0.5 * Math.pow(10, -digits) ? (0).toFixed(digits) : `${x >= 0 ? "+" : "−"}${Math.abs(x).toFixed(digits)}`;
function pearson(xs, ys) {
  const n = xs.length; if (n < 3) return null;
  const mx = avg(xs), my = avg(ys);
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) { const dx = xs[i] - mx, dy = ys[i] - my; sxy += dx * dy; sxx += dx * dx; syy += dy * dy; }
  return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null;
}
const topOf = (map) => { let best = null; for (const [k, v] of map) if (!best || v > best[1]) best = [k, v]; return best; };

// Films rated by you and by a crowd, with both scores, the ones you rate furthest above them first.
function crowdDrill(films, key, title, rOf = (f) => f.rating) {
  const c = CROWDS[key] || CROWDS.tmdb;
  const rows = films.map((f) => { const r = rOf(f), s = r && c.score(metaOf(f), f); return s ? { f, crowd: s / 2, diff: r - s / 2 } : null; })
    .filter(Boolean).sort((a, b) => b.diff - a.diff);
  const by = new Map(rows.map((x) => [x.f, x]));
  return D.films(title || `You against ${c.label}`, rows.length ? `${plural(rows.length, "film")} · ${signed(avg(rows.map((x) => x.diff)), 2)}★ against them on average` : "", rows.map((x) => x.f),
    { sort: "given", ratingOf: rOf, note: (f) => { const x = by.get(f); return `${c.short} ${crowdScore(c === CROWDS[key] ? key : "tmdb", x.crowd)} · you ${signed(x.diff)}★`; } });

const notEnglish = (f) => { const m = metaOf(f); return !!m && !!m.l && m.l !== "English"; };

// Diary entries logged the day you watched, and the ones logged later.
function loggingDrill(es, pct) {

  return D.groups("Same-day logging", `${pct}% logged the day you watched`, [D.entries("Logged the same day", entriesSub(same), same),
    D.entries("Logged on another day", entriesSub(later), later, { note: (e) => { const d = dayIndex(e.logged) - dayIndex(e.date); return `Logged ${fmtDate(e.logged)}, ${plural(Math.abs(d), "day")} ${d >= 0 ? "later" : "earlier"}`; } })]);
}
// The data behind one year's number in the year-by-year view.
function yearDrill(p, what) {
  const y = p.year;
  if (what === "entries") return D.entries(`Diary of ${y}`, entriesSub(p.E), p.E);
  if (what === "hours") return D.films(`Hours in ${y}`, `${fmtN(Math.round(p.hours))} hours`, p.F.filter(runtimeOf), { scope: y, sort: "runtime",
    note: (f) => { const v = viewsIn(f, y); return `${runtimeOf(f)} min${v > 1 ? ` × ${v} viewings` : ""}`; } });
  if (what === "rating") {
    const last = new Map();
    for (const e of p.E) if (e.rating) last.set(e.film, e.rating);
    const r = (f) => last.has(f) ? last.get(f) : f.rating;
    const fs = p.F.filter(r).sort((a, b) => r(b) - r(a));
    return D.films(`Ratings in ${y}`, `${p.avgRating ? p.avgRating.toFixed(2) : "—"} average · ${plural(fs.length, "film")}`, fs, { sort: "given", ratingOf: r });
  }
  if (what === "age") return D.films(`Film age in ${y}`, p.age != null ? `${Math.round(p.age)} years old on average when watched` : "", p.F.filter((f) => f.year), { sort: "old", note: (f) => `${plural(+y - f.year, "year")} old` });
  if (what === "nonEnglish") return D.films(`Not in English, ${y}`, filmsSub(p.nonEngFilms), p.nonEngFilms, { scope: y, note: langNote });
  if (what === "rewatches") { const es = p.E.filter((e) => e.rewatch); return D.entries(`Rewatches in ${y}`, entriesSub(es), es); }
  if (what === "new") { const fs = p.F.filter((f) => f.year >= +y - 1); return D.films(`New releases in ${y}`, `${plural(fs.length, "film")} from ${+y - 1} or ${y}`, fs, { scope: y }); }

// "…, and your taste follows theirs closely (correlation 0.71)", or nothing when it can't be measured.
const followText = (r) => r == null ? "" : `, and your taste follows theirs ${r >= 0.6 ? "closely" : r >= 0.35 ? "loosely" : "hardly at all"} (correlation ${r.toFixed(2)})`;

function computeInsights(lib, metaOf, crowdKey) {

  const today = new Date(), thisYear = String(today.getFullYear());
  const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 1)) / 864e5) + 1;

    const films = [...new Set(es.map((e) => e.film))];

    for (const e of es) { const m = metaOf(e.film); if (m && m.r) minutes += m.r; }
    const ratings = es.map((e) => e.rating || e.film.rating).filter(Boolean);

      year: y, E: es, F: films, nonEngFilms, films: films.length, entries: es.length, rewatches: es.filter((e) => e.rewatch).length, hours: minutes / 60, pace,
      avgRating: avg(ratings), age: dated.length ? avg(dated.map((f) => +y - f.year)) : null,
      newShare: dated.length ? pctOf(dated.filter((f) => f.year >= +y - 1).length, dated.length) : null,
      nonEnglish: langs.length >= 3 ? pctOf(langs.filter((m) => m.l !== "English").length, langs.length) : null,
      genres, withMeta, countries: countries.size,
      topGenre: topOf(genres), topDirector: topOf(directors), topActor: topOf(actors),

  });

  const busiest = perYear.reduce((a, p) => !a || p.films > a.films ? p : a, null);

  /* ----- changing tastes: the earliest years against the latest ----- */
  const tastes = { lines: [], table: null };
  if (usable.length >= 2) {
    const span = usable.length >= 4 ? 2 : 1;
    const early = usable.slice(0, span), late = usable.slice(-span);
    const label = (g) => g.length > 1 ? `${g[0].year}–${g[g.length - 1].year.slice(2)}` : g[0].year;
    const share = (group, genre) => { const n = group.reduce((s, p) => s + (p.genres.get(genre) || 0), 0), d = group.reduce((s, p) => s + p.withMeta, 0); return d ? n / d * 100 : null; };
    const mean = (group, k) => { const v = group.map((p) => p[k]).filter((x) => x != null); return v.length ? avg(v) : null; };
    const E0 = label(early), L0 = label(late);
    const allGenres = new Map();
    for (const p of perYear) for (const [g, n] of p.genres) bump(allGenres, g, n);
    const top = [...allGenres].sort((a, b) => b[1] - a[1]).slice(0, 8).map(([g]) => g);
    const moves = top.map((g) => ({ g, from: share(early, g), to: share(late, g) })).filter((x) => x.from != null && x.to != null).map((x) => ({ ...x, d: x.to - x.from }));
    const filmsIn = (group, test) => [...new Set(group.flatMap((p) => p.F))].filter(test);

        : `You're watching newer films: on average ${Math.round(a1)} years old when you saw them in ${L0}, against ${Math.round(a0)} in ${E0}.`,

      text: `Films not in English went from ${Math.round(n0)}% of your watching in ${E0} to ${Math.round(n1)}% in ${L0}.`, to: thenNow("Not in English, then and now", notEnglish, { note: langNote }) });

      text: r1 > r0 ? `You've grown more generous: your average rating rose from ${starsNum(r0)} in ${E0} to ${starsNum(r1)} in ${L0}.`
        : `You've grown tougher: your average rating fell from ${starsNum(r0)} in ${E0} to ${starsNum(r1)} in ${L0}.`, to: thenNow("Your ratings, then and now", (f) => !!f.rating) });
    const w0 = mean(early, "films"), w1 = mean(late, "films");
    if (w0 && w1 && Math.abs(w1 - w0) / w0 >= 0.25) tastes.lines.push({ dir: w1 > w0 ? "up" : "down", big: w1 > w0 ? "More films" : "Fewer films",
      text: `You watch ${w1 > w0 ? "more" : "fewer"} films than you used to: about ${Math.round(w1)} a year in ${L0}, against ${Math.round(w0)} in ${E0}.`,
      to: D.groups("How much you watch", `${L0} against ${E0}`, [late, early].map((g, i) => { const es = g.flatMap((p) => p.E); return D.entries(i ? E0 : L0, entriesSub(es), es); })) });
    tastes.table = { genres: top, years: usable.map((p) => ({ year: p.year, p, shares: top.map((g) => p.withMeta ? Math.round((p.genres.get(g) || 0) / p.withMeta * 100) : null) })) };

    name: g.name, films: g.films, count: g.films.length, share: pctOf(g.films.length, withMetaCount), mine: avg(g.mine),
    vsMe: avg(g.mine) - overallAvg, vsCrowd: g.vsCrowd.length >= 3 ? avg(g.vsCrowd) : null,
  })).sort((a, b) => b.count - a.count);
  const genreLines = [];
  const solid = genres.filter((g) => g.mine.length >= 5 || g.count >= 5);
  const loved = [...solid].sort((a, b) => b.vsMe - a.vsMe)[0];
  const gFilms = (g) => D.films(g.name, filmsSub(g.films), g.films);
  if (loved && loved.vsMe >= 0.15) genreLines.push({ text: `You rate ${loved.name} ${loved.vsMe.toFixed(1)}★ above your average, more than any other genre.`, to: gFilms(loved) });
  const lukewarm = solid.slice(0, 5).filter((g) => g.vsMe <= -0.15).sort((a, b) => a.vsMe - b.vsMe)[0];
  if (lukewarm) genreLines.push({ text: `${lukewarm.name} is among the genres you watch most (${lukewarm.share}% of your films), but you rate it ${Math.abs(lukewarm.vsMe).toFixed(1)}★ below your average.`, to: gFilms(lukewarm) });

  const above = [...withCrowd].sort((a, b) => b.vsCrowd - a.vsCrowd)[0], below = [...withCrowd].sort((a, b) => a.vsCrowd - b.vsCrowd)[0];
  if (above && above.vsCrowd >= 0.2) genreLines.push({ text: `Next to ${crowd.label}, you're kindest to ${above.name}: ${above.vsCrowd.toFixed(1)}★ above them on average.`, to: crowdDrill(above.films, crowdKey, `${above.name} against ${crowd.label}`) });
  if (below && below !== above && below.vsCrowd <= -0.2) genreLines.push({ text: `You're harshest on ${below.name}: ${Math.abs(below.vsCrowd).toFixed(1)}★ below ${crowd.label} on average.`, to: crowdDrill(below.films, crowdKey, `${below.name} against ${crowd.label}`) });

    for (const e of E) {
      const m = metaOf(e.film); if (!m) continue;
      const names = role === "c" ? m.c.slice(0, CAST_DEPTH) : m[role];
      for (const n of names) {
        const k = personKey(n);
        let p = map.get(k); if (!p) { p = { key: k, name: n, firstSeen: new Map(), years: new Set() }; map.set(k, p); }
        if (!p.firstSeen.has(e.film)) p.firstSeen.set(e.film, e.date);
        p.years.add(e.date.slice(0, 4));

    return { ...p, inLatest, before: p.count - inLatest };

  const binges = directors.map((p) => {

    let best = null;
    for (let i = 0; i < dates.length; i++) {
      let j = i;
      while (j + 1 < dates.length && dayIndex(dates[j + 1]) - dayIndex(dates[i]) <= 30) j++;
      const n = j - i + 1;
      if (n >= 3 && (!best || n > best.n)) best = { n, from: dates[i], to: dates[j] };
    }
    if (best) best.entries = E.filter((e) => p.firstSeen.get(e.film) === e.date && e.date >= best.from && e.date <= best.to);
    return best ? { ...p, binge: best } : null;
  }).filter(Boolean).sort((a, b) => b.binge.n - a.binge.n || (b.binge.to > a.binge.to ? 1 : -1)).slice(0, 5);
  const firstYear = new Map();
  for (const p of directors) { const y = [...p.firstSeen.values()].sort()[0].slice(0, 4); if (!firstYear.has(y)) firstYear.set(y, []); firstYear.get(y).push(p); }
  const discoveries = years.slice(1).map((y) => { const people = (firstYear.get(y) || []).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name)); return { year: y, count: people.length, people }; });

  /* ----- against the crowd ----- */
  const pairs = rated.map((f) => { const c = crowd.score(metaOf(f), f); return c ? { f, you: f.rating, crowd: c / 2, diff: f.rating - c / 2 } : null; }).filter(Boolean);
  const crowdOut = { key: crowdKey, label: crowd.label, short: crowd.short, n: pairs.length, available: {} };
  for (const k of Object.keys(CROWDS)) crowdOut.available[k] = rated.filter((f) => CROWDS[k].score(metaOf(f), f)).length;
  if (pairs.length >= 5) {
    crowdOut.r = pearson(pairs.map((p) => p.you), pairs.map((p) => p.crowd));
    crowdOut.meanDiff = avg(pairs.map((p) => p.diff));
    crowdOut.higher = pairs.filter((p) => p.diff >= 0.75).sort((a, b) => b.diff - a.diff || b.you - a.you).slice(0, 12);
    crowdOut.lower = pairs.filter((p) => p.diff <= -0.75).sort((a, b) => a.diff - b.diff || a.you - b.you).slice(0, 12);
  }

  crowdOut.gems = rated.filter((f) => f.rating >= 4.5).map((f) => ({ f, pop: popularity(f) }))
    .filter((x) => x.pop && x.pop.n < { Letterboxd: 5000, IMDb: 25000, TMDB: 1000 }[x.pop.src])

    const weekendE = E.filter((e) => weekdayOf(e.date) >= 5);
    const wk = pctOf(weekendE.length, E.length);
    habits.push({ k: wk >= 36 ? "Weekend watcher" : wk <= 22 ? "Weeknight watcher" : "Weekends", v: `${wk}%`, notable: wk >= 36 || wk <= 22,
      text: `of your diary falls on a Saturday or Sunday, against 29% if you watched evenly through the week.`, to: D.entries("Weekend diary", entriesSub(weekendE, `${wk}% of the diary`), weekendE) });
    const months = Array(12).fill(0), seen = Array(12).fill(0);

    const best = rates.indexOf(Math.max(...rates));

      to: D.entries(`Every ${MONTHS_LONG[best]}`, entriesSub(monthE), monthE) });

    const marathonE = E.filter((e) => perDay.get(e.date) >= 3);
    if (bingeDays) habits.push({ k: "Marathon days", v: fmtN(bingeDays), text: `${bingeDays === 1 ? "day" : "days"} with three or more films.`, to: D.entries("Marathon days", `${plural(bingeDays, "day")} with three or more films · ${entriesSub(marathonE)}`, marathonE) });
    const catchE = E.filter((e) => !e.rewatch && e.film.year && +e.date.slice(0, 4) <= e.film.year + 0), catches = catchE.length;
    habits.push({ k: "Same-year catches", v: fmtN(catches), text: `${catches === 1 ? "film" : "films"} seen in the year ${catches === 1 ? "it" : "they"} came out.`, to: catches ? D.entries("Seen the year they came out", entriesSub(catchE), catchE) : null });
    const rwE = E.filter((e) => e.rewatch), rw = pctOf(rwE.length, E.length);
    habits.push({ k: "Rewatches", v: `${rw}%`, text: "of your diary entries are rewatches.", to: rwE.length ? D.entries("Rewatches", entriesSub(rwE, `${rw}% of the diary`), rwE) : null });
    const timedFilms = lib.films.filter((f) => runtimeOf(f)), runtimes = timedFilms.map(runtimeOf);
    if (runtimes.length >= 10) habits.push({ k: "Typical length", v: `${Math.round(avg(runtimes))} min`, text: `is your average film; ${pctOf(runtimes.filter((r) => r >= 150).length, runtimes.length)}% run 2½ hours or more.`,

  }

  /* ----- at a glance: the strongest few findings ----- */
  const glance = [];
  if (busiest) {
    const cur = perYear.find((p) => p.year === thisYear);
    glance.push({ k: "Busiest year", big: busiest.year, text: `${plural(busiest.films, "film")} that year${cur && cur.pace && cur !== busiest ? `. ${thisYear} is on pace for about ${fmtN(cur.pace)}.` : "."}`,
      to: D.films(`Films of ${busiest.year}`, filmsSub(busiest.F), busiest.F, { scope: busiest.year, sort: "watched" }) });
  }
  if (overallAvg) {
    const high = pctOf(rated.filter((f) => f.rating >= 4).length, rated.length);
    const style = overallAvg >= 3.75 ? "a generous rater" : overallAvg <= 3 ? "a tough rater" : "a middle-of-the-road rater";
    glance.push({ k: "Rating style", big: starsNum(overallAvg), text: `average makes you ${style}: ${high}% of your rated films get 4★ or more.`, to: D.films("Rated films", filmsSub(rated), rated) });
  }
  crowdOut.to = crowdDrill(rated, crowdKey);
  if (crowdOut.meanDiff != null) glance.push({ k: `You vs ${crowd.label}`, big: `${signed(crowdOut.meanDiff)}★`, text: `on average against ${crowd.label}${followText(crowdOut.r)}, across ${plural(pairs.length, "film")}.`, to: crowdOut.to });
  if (tastes.lines.length) glance.push({ k: "Changing taste", big: tastes.lines[0].big, text: tastes.lines[0].text, to: tastes.lines[0].to });
  if (loved && loved.vsMe >= 0.15) glance.push({ k: "Best-loved genre", big: loved.name, text: `gets ${loved.vsMe.toFixed(1)}★ more from you than your average film.`, to: gFilms(loved) });
  const obsD = obsessions(directors);
  if (obsD.length) glance.push({ k: `New in ${latest}`, big: obsD[0].name, text: `${obsD[0].inLatest} films in ${latest}, none before. Your newest director obsession.`, to: D.films(obsD[0].name, `${plural(obsD[0].inLatest, "film")} in ${latest}, none before`, obsD[0].films, { person: obsD[0] }) });
  else { const comp = companions(directors)[0]; if (comp) glance.push({ k: "Constant companion", big: comp.name, text: `turns up in your diary in ${comp.years.size} different years.`, to: D.films(comp.name, `In your diary in ${[...comp.years].sort().join(", ")}`, comp.films, { person: comp }) }); }
  const habit = habits.find((h) => h.notable);
  if (habit) glance.push({ k: habit.k, big: habit.v, text: habit.text, to: habit.to });

  return {
    years: perYear, usable, latest, tastes, genres, genreLines, overallAvg,
    people: { obsDirectors: obsD, obsActors: obsessions(actors), compDirectors: companions(directors), compActors: companions(actors), binges, discoveries },
    crowd: crowdOut, habits, glance,
  };
}
// The crowd to compare with: Letterboxd members when enough rated films have their average, then IMDb, then TMDB.
function defaultCrowd(lib, metaOf) {
  const rated = lib.films.filter((f) => f.rating);
  const n = (k) => rated.filter((f) => CROWDS[k].score(metaOf(f), f)).length;
  const enough = (k) => n(k) >= Math.max(5, n("tmdb") * 0.5);
  return enough("letterboxd") ? "letterboxd" : enough("imdb") ? "imdb" : "tmdb";
}

/* ---------- one year's insights: that year against the one before, and against your whole diary ---------- */

  const changes = [];
  if (cur && prev) {
    const row = (label, a, b, fmt, what) => { if (a != null && b != null) changes.push({ label, now: fmt(a), before: fmt(b), d: fmt(a) === fmt(b) ? 0 : a - b, to: both(label, what) }); };

      .map((g) => ({ g, a: (cur.genres.get(g) || 0) / cur.withMeta * 100, b: (prev.genres.get(g) || 0) / prev.withMeta * 100 })).map((x) => ({ ...x, d: x.a - x.b }));

<script>
/* ---------- Compare: other members' exports next to yours ----------

}
function saveFriends() {

}
async function addFriend(files) {

  else FRIENDS.push({ id: "f" + Date.now().toString(36), name, rows, lib });
  saveFriends();
  return existing ? existing.id : FRIENDS[FRIENDS.length - 1].id;
}
function removeFriend(id) { FRIENDS = FRIENDS.filter((f) => f.id !== id); saveFriends(); }
// Everyone in the comparison: you first, then friends (example ones with the example diary).
function comparePeople() {
  const ex = state.mode === "example";
  const me = { id: "me", name: "You", me: true, lib: state.lib };
  return [me, ...(ex ? EXAMPLE_FRIENDS : FRIENDS)];
}
// Every film anyone has logged, for looking up cast & crew once for all of them.
function allFilmsLib() {
  const seen = new Map();
  for (const lib of [MY_LIB, ...FRIENDS.map((f) => f.lib)]) if (lib) for (const f of lib.films) if (!seen.has(f.key)) seen.set(f.key, f);
  // your watchlist too, for Watch next
  if (MY_LIB) for (const w of MY_LIB.watchlistFilms) if (!seen.has(w.key)) seen.set(w.key, w);
  return { films: [...seen.values()], profile: (MY_LIB || {}).profile || {} };
}

/* ----- one person's taste in numbers ----- */
function tasteProfile(p, metaOf) {
  const lib = p.lib, films = lib.films, rated = films.filter((f) => f.rating), E = lib.entries;
  const genres = new Map(), directors = new Map(), actors = new Map();
  let withMeta = 0, langKnown = 0, nonEng = 0;
  for (const f of films) {
    const m = metaOf(f); if (!m) continue;
    withMeta++;
    new Set(m.g).forEach((g) => bump(genres, g)); new Set(m.d).forEach((d) => bump(directors, d)); new Set(m.c.slice(0, CAST_DEPTH)).forEach((c) => bump(actors, c));
    if (m.l) { langKnown++; if (m.l !== "English") nonEng++; }
  }
  const spread = Array(10).fill(0);
  for (const f of rated) spread[Math.round(f.rating * 2) - 1]++;
  const span = E.length > 1 ? (dayIndex(E[E.length - 1].date) - dayIndex(E[0].date) + 1) / 365.25 : 0;
  const dated = films.filter((f) => f.year);
  return {
    ...p, films, rated, byKey: new Map(films.map((f) => [f.key, f])),
    avg: avg(rated.map((f) => f.rating)), spread: spread.map((n) => rated.length ? n / rated.length * 100 : 0),
    genres, directors, actors, withMeta,
    nonEnglish: langKnown >= 5 ? Math.round(nonEng / langKnown * 100) : null,
    avgYear: dated.length ? Math.round(avg(dated.map((f) => f.year))) : null,
    perYear: span >= 0.5 ? Math.round(E.length / span) : null,
    weekend: E.length >= 10 ? pctOf(E.filter((e) => weekdayOf(e.date) >= 5).length, E.length) : null,
    rewatch: E.length >= 10 ? pctOf(E.filter((e) => e.rewatch).length, E.length) : null,
    watchlist: new Map(lib.watchlistFilms.map((w) => [w.key, w])),
  };
}
const genreShare = (P, g) => P.withMeta ? (P.genres.get(g) || 0) / P.withMeta * 100 : 0;
// 0–100: mostly how close your ratings are on films you've both rated, partly whether you rank them alike.
function matchScore(pairs) {
  if (pairs.length < 5) return { score: null, n: pairs.length };
  const mad = avg(pairs.map((x) => Math.abs(x.a - x.b)));
  const r = pearson(pairs.map((x) => x.a), pairs.map((x) => x.b));
  const score = Math.round(100 * Math.max(0, Math.min(1, 0.6 * (1 - mad / 2) + 0.4 * (((r ?? 0) + 1) / 2))));
  return { score, mad, r, n: pairs.length, within: pctOf(pairs.filter((x) => Math.abs(x.a - x.b) <= 0.5).length, pairs.length) };
}
const matchWords = (s) => s >= 80 ? "Film twins" : s >= 65 ? "Strong match" : s >= 50 ? "Some common ground" : s >= 35 ? "Different tastes" : "Opposites";

/* ----- what a click in Compare opens ----- */
// A film card with what each person logged for it.
const cardFor = (people) => (f) => D.film(f, { lib: people[0].lib, people: people.map((P) => ({ name: P.me ? "You" : P.name, lib: P.lib, film: P.byKey.get(f.key),
  missing: P.watchlist.has(f.key) ? "On the watchlist, not seen yet." : "Not logged." })) });
const whose = (P) => P.me ? "Your" : `${P.name}'s`;
// One person's films (or diary entries), each opening with everyone's records.
const filmsOf = (P, title, films, people, o) => D.films(title, filmsSub(films), films, { lib: P.lib, cardOf: cardFor(people), ...o });
const entriesOf = (P, title, es, o) => D.entries(title, entriesSub(es), es, { lib: P.lib, who: P.me ? null : P.name, ...o });
// Films two people have both rated, with both ratings, closest first or furthest first.
function ratedByBoth(P, Q, title, order = "close") {
  const rows = P.films.map((f) => ({ f, a: f.rating, b: (Q.byKey.get(f.key) || {}).rating })).filter((x) => x.a && x.b)
    .sort((x, y) => order === "close" ? Math.abs(x.a - x.b) - Math.abs(y.a - y.b) || y.a - x.a : Math.abs(y.a - y.b) - Math.abs(x.a - x.b));
  const by = new Map(rows.map((x) => [x.f, x]));
  return D.films(title, `${plural(rows.length, "film")} rated by both, ${order === "close" ? "closest" : "furthest apart"} first`, rows.map((x) => x.f), { sort: "given", lib: P.lib, cardOf: cardFor([P, Q]),
    note: (f) => { const x = by.get(f); return `${P.me ? "You" : P.name} ${stars(x.a)} · ${Q.name} ${stars(x.b)}`; } });
}
const pairOf = (title, sub, a, b) => D.groups(title, sub, [a, b]);

/* ----- you and one other person ----- */
function comparePair(A, B, metaOf) {
  const shared = A.films.filter((f) => B.byKey.has(f.key));
  const union = A.films.length + B.films.length - shared.length;
  const pairs = shared.map((f) => ({ f, a: f.rating, b: B.byKey.get(f.key).rating })).filter((x) => x.a && x.b);
  const match = matchScore(pairs);
  const by = (fn) => (x, y) => fn(y) - fn(x);
  const popularity = (f) => { const x = LBX[f.key], m = metaOf(f); return (x && x.n) || (m && (m.iv || m.vc)) || 0; };
  const recs = (from, to) => from.films.filter((f) => f.rating >= 4 && !to.byKey.has(f.key))
    .sort((x, y) => y.rating - x.rating || popularity(y) - popularity(x)).slice(0, 12)
    .map((f) => ({ f, onWatchlist: to.watchlist.has(f.key) }));
  const topGenres = [...new Set([...A.genres.keys(), ...B.genres.keys()])]
    .map((g) => ({ g, a: genreShare(A, g), b: genreShare(B, g) })).sort((x, y) => (y.a + y.b) - (x.a + x.b)).slice(0, 10);
  const both = [A, B], card = cardFor(both);
  // each side of a comparison: your films that pass a test, then theirs
  const sides = (title, sub, test, o) => pairOf(title, sub, ...both.map((P) => { const fs = P.films.filter(test); return filmsOf(P, P.me ? "You" : B.name, fs, both, o); }));
  const to = {
    shared: D.films("Seen by both", `${plural(shared.length, "film")} you've both logged`, shared, { lib: A.lib, cardOf: card, note: (f) => `You ${stars(f.rating) || "–"} · ${B.name} ${stars(B.byKey.get(f.key).rating) || "–"}` }),
    onlyA: filmsOf(A, "Only you", A.films.filter((f) => !B.byKey.has(f.key)), both),
    onlyB: filmsOf(B, `Only ${B.name}`, B.films.filter((f) => !A.byKey.has(f.key)), both),
    rated: ratedByBoth(A, B, "Films you've both rated"),
    apart: ratedByBoth(A, B, "Where you disagree", "far"),
    ratings: sides("Ratings", "Each person's rated films", (f) => f.rating),
    genre: (g) => sides(g, "Each person's films in the genre", hasGenre(g)),
    age: sides("Release years", "Each person's films, oldest first", (f) => !!f.year, { sort: "old", note: (f) => `Released ${f.year}` }),
    nonEnglish: sides("Not in English", "Each person's films not in English", notEnglish, { note: langNote }),
    stars: (r) => sides(`Rated ${stars(r)}`, "Films each of you gave this rating", (f) => f.rating === r),
    person: (name, role) => pairOf(name, "Each person's films with them", ...both.map((P) => ({ ...personDrill(P.lib, name, role), title: P.me ? "You" : B.name, cardOf: card }))),
    personOf: (P, name, role) => ({ ...personDrill(P.lib, name, role), title: name, sub: `${whose(P)} films`, cardOf: card }),
    diary: (P) => entriesOf(P, `${whose(P)} diary`, P.lib.entries),
    weekend: (P) => entriesOf(P, `${whose(P)} weekends`, P.lib.entries.filter((e) => weekdayOf(e.date) >= 5)),
    rewatches: (P) => entriesOf(P, `${whose(P)} rewatches`, P.lib.entries.filter((e) => e.rewatch)),
    films: (P, title, test = () => true, o) => filmsOf(P, title || `${whose(P)} films`, P.films.filter(test), both, o),
    card,
  };
  const lines = [];
  if (shared.length) lines.push({ to: to.shared, text: `You've both seen ${plural(shared.length, "film")}: ${pctOf(shared.length, A.films.length)}% of yours and ${pctOf(shared.length, B.films.length)}% of ${B.name}'s.` });
  if (match.score != null) lines.push({ to: to.rated, text: `On the ${plural(match.n, "film")} you've both rated, your ratings are within half a star ${match.within}% of the time, and ${match.mad.toFixed(1)}★ apart on average.` });
  if (A.avg && B.avg && Math.abs(A.avg - B.avg) >= 0.15) lines.push({ to: to.ratings, text: `${A.avg > B.avg ? "You rate" : `${B.name} rates`} ${Math.abs(A.avg - B.avg).toFixed(1)}★ higher on average (${starsNum(Math.max(A.avg, B.avg))} against ${starsNum(Math.min(A.avg, B.avg))}).` });
  for (const x of topGenres.filter((x) => Math.abs(x.a - x.b) >= 6).sort((x, y) => Math.abs(y.a - y.b) - Math.abs(x.a - x.b)).slice(0, 3))
    lines.push({ to: to.genre(x.g), text: `${x.g} is ${Math.round(x.b)}% of ${B.name}'s films and ${Math.round(x.a)}% of yours.` });
  if (A.avgYear && B.avgYear && Math.abs(A.avgYear - B.avgYear) >= 5) lines.push({ to: to.age, text: `${A.avgYear < B.avgYear ? "You watch" : `${B.name} watches`} older films: an average release year of ${Math.min(A.avgYear, B.avgYear)} against ${Math.max(A.avgYear, B.avgYear)}.` });
  if (A.nonEnglish != null && B.nonEnglish != null && Math.abs(A.nonEnglish - B.nonEnglish) >= 10) lines.push({ to: to.nonEnglish, text: `Films not in English are ${B.nonEnglish}% of ${B.name}'s and ${A.nonEnglish}% of yours.` });
  if (A.perYear && B.perYear && Math.abs(A.perYear - B.perYear) / Math.min(A.perYear, B.perYear) >= 0.3)
    lines.push({ to: pairOf("Diary entries", "Each person's diary", to.diary(A), to.diary(B)), text: `${B.name} logs about ${fmtN(B.perYear)} films a year to your ${fmtN(A.perYear)}.` });
  const people = (mapA, mapB) => ({
    shared: [...mapA].filter(([n]) => mapB.has(n)).map(([n, a]) => ({ name: n, a, b: mapB.get(n) })).sort((x, y) => Math.min(y.a, y.b) - Math.min(x.a, x.b) || (y.a + y.b) - (x.a + x.b)).slice(0, 8),
    onlyA: [...mapA].filter(([n, c]) => c >= 2 && !mapB.has(n)).sort((x, y) => y[1] - x[1]).slice(0, 6),
    onlyB: [...mapB].filter(([n, c]) => c >= 2 && !mapA.has(n)).sort((x, y) => y[1] - x[1]).slice(0, 6),
  });
  return {
    A, B, shared, union, pairs, match, lines, topGenres, to,
    overlap: { onlyA: A.films.length - shared.length, both: shared.length, onlyB: B.films.length - shared.length, jaccard: union ? shared.length / union : 0 },
    bothLoved: pairs.filter((x) => x.a >= 4.5 && x.b >= 4.5).sort(by((x) => x.a + x.b)).slice(0, 12),
    aHigher: pairs.filter((x) => x.a - x.b >= 1.5).sort(by((x) => x.a - x.b)).slice(0, 12),
    bHigher: pairs.filter((x) => x.b - x.a >= 1.5).sort(by((x) => x.b - x.a)).slice(0, 12),
    forA: recs(B, A), forB: recs(A, B),
    together: [...A.watchlist.values()].filter((w) => B.watchlist.has(w.key)),
    directors: people(A.directors, B.directors), actors: people(A.actors, B.actors),
  };
}

// The habits table in a pair comparison: label, then your cell and theirs, each opening what it counts.
function habitRows(C) {
  const { A, B, to } = C;
  const pct = (v) => v != null ? v + "%" : null;
  const row = (k, val, mk) => [k, ...[A, B].map((P) => { const v = val(P); return v == null ? "—" : dlink(mk(P), v); })];
  return [
    row("Films logged", (P) => fmtN(P.films.length), (P) => to.films(P)),
    row("Diary entries a year", (P) => P.perYear && fmtN(P.perYear), (P) => to.diary(P)),
    row("Average rating", (P) => P.avg && P.avg.toFixed(2), (P) => to.films(P, `${whose(P)} ratings`, (f) => f.rating)),
    row("Average release year", (P) => P.avgYear, (P) => to.films(P, `${whose(P)} films by release year`, (f) => !!f.year, { sort: "old", note: (f) => `Released ${f.year}` })),
    row("Not in English", (P) => pct(P.nonEnglish), (P) => to.films(P, `${whose(P)} films not in English`, notEnglish, { note: langNote })),
    row("On weekends", (P) => pct(P.weekend), (P) => to.weekend(P)),
    row("Rewatches", (P) => pct(P.rewatch), (P) => to.rewatches(P)),
  ];
}

/* ----- everyone at once ----- */
function compareGroup(profiles) {
  const n = profiles.length;
  const matrix = profiles.map((P) => profiles.map((Q) => {
    if (P === Q) return null;
    const pairs = P.films.map((f) => ({ a: f.rating, b: (Q.byKey.get(f.key) || {}).rating })).filter((x) => x.a && x.b);
    return matchScore(pairs);
  }));
  const ratings = new Map(); // film key → { f, by: [{ name, r }] }
  for (const P of profiles) for (const f of P.rated) {
    let x = ratings.get(f.key); if (!x) { x = { f, by: [] }; ratings.set(f.key, x); }
    x.by.push({ name: P.name, r: f.rating });
  }
  const sd = (xs) => { const m = avg(xs); return Math.sqrt(avg(xs.map((x) => (x - m) ** 2))); };
  const multi = [...ratings.values()].filter((x) => x.by.length >= Math.min(3, n)).map((x) => ({ ...x, mean: avg(x.by.map((b) => b.r)), sd: sd(x.by.map((b) => b.r)) }));
  const seenBy = new Map();
  for (const P of profiles) for (const f of P.films) seenBy.set(f.key, (seenBy.get(f.key) || 0) + 1);
  const wanted = new Map();
  for (const P of profiles) for (const w of P.watchlist.values()) { const x = wanted.get(w.key) || { w, by: [] }; x.by.push(P.name); wanted.set(w.key, x); }
  // a movie-night pick: on several watchlists, or loved by someone and unseen by most of the group
  const picks = [...wanted.values()].filter((x) => x.by.length >= 2).sort((a, b) => b.by.length - a.by.length).map((x) => ({ name: x.w.name, year: x.w.year, why: `On ${x.by.length} watchlists: ${x.by.join(", ")}` }));
  for (const x of [...ratings.values()].filter((x) => x.by.some((b) => b.r >= 4.5) && (seenBy.get(x.f.key) || 0) <= n / 2).sort((a, b) => Math.max(...b.by.map((q) => q.r)) - Math.max(...a.by.map((q) => q.r))).slice(0, 8)) {
    const fans = x.by.filter((b) => b.r >= 4.5).map((b) => b.name);
    if (!picks.some((p) => p.name === x.f.name && p.year === x.f.year)) picks.push({ name: x.f.name, year: x.f.year, f: x.f, why: `${fans.join(" and ")} gave it ${stars(Math.max(...x.by.map((b) => b.r)))}; ${n - (seenBy.get(x.f.key) || 0)} of ${n} haven't seen it` });
  }
  const allSeen = profiles[0].films.filter((f) => seenBy.get(f.key) === n);
  return {
    card: cardFor(profiles), pairTo: (i, j) => ratedByBoth(profiles[i], profiles[j], `${profiles[i].me ? "You" : profiles[i].name} and ${profiles[j].name}`),
    everyoneTo: D.films("Seen by everyone", plural(allSeen.length, "film"), allSeen, { lib: profiles[0].lib, cardOf: cardFor(profiles) }),
    matrix, everyone: allSeen.length,
    divisive: multi.filter((x) => x.sd >= 0.75).sort((a, b) => b.sd - a.sd).slice(0, 8),
    loved: multi.filter((x) => x.mean >= 4.25 && x.sd <= 0.5).sort((a, b) => b.mean - a.mean).slice(0, 8),
    picks: picks.slice(0, 8),
  };
}
</script>
<script>
/* ---------- reviews: the words behind the ratings ---------- */
const STOPWORDS = new Set(`the and for that this with was but are not you all any can had her his one our out get has him how its may new now see two who did let put say she too use from have they will been more when what were your than then them some just into only also very much even such here most like over well back many does make made each those after where which while about would could there their these other being still really thing things through every because before again first last never ever though think know going felt feel feels lot little bit enough always something nothing anything everything someone without within around another itself himself herself myself yourself whole kind sort maybe almost quite rather pretty seem seems seemed got gets getting goes went come came comes take took make makes making give gave look looks looked watch watched watching rewatch rewatched film films movie movies cinema scene scenes character characters story time times way ways year years day days man men people`.split(/\s+/));
const reviewWords = (text) => (text.toLowerCase().match(/\p{L}[\p{L}'’-]*/gu) || [])
  .map((w) => w.replace(/’/g, "'").replace(/'s$/, "").replace(/-+$/, "")).filter((w) => w.length > 2 && !STOPWORDS.has(w));
const reviewsIn = (lib, Y) => lib.reviews.filter((r) => r.text && (!Y || (r.date || "").startsWith(Y)));

// Counts, lengths, which films you review, and the words you use, overall or for one year.
function computeReviewInsights(lib, Y) {
  const R = reviewsIn(lib, Y);
  if (!R.length) return null;
  const total = R.reduce((s, r) => s + r.words, 0);
  const byLength = [...R].sort((a, b) => b.words - a.words);
  const median = byLength[Math.floor(byLength.length / 2)].words;
  const docFreq = (list) => { const m = new Map(); for (const r of list) for (const w of new Set(reviewWords(r.text))) bump(m, w); return m; };
  const top = [...docFreq(R)].filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 24);
  // words that set your reviews of loved films apart from the rest, and the other way round
  const hi = R.filter((r) => r.rating >= 4.5), lo = R.filter((r) => r.rating && r.rating <= 3);
  let love = [], cold = [];
  if (hi.length >= 4 && lo.length >= 3) {
    const dh = docFreq(hi), dl = docFreq(lo);
    const lean = (w) => Math.log(((dh.get(w) || 0) + 0.5) / (hi.length + 1)) - Math.log(((dl.get(w) || 0) + 0.5) / (lo.length + 1));
    love = [...dh.keys()].filter((w) => dh.get(w) >= 2 && lean(w) > 0).sort((a, b) => lean(b) - lean(a)).slice(0, 8);
    cold = [...dl.keys()].filter((w) => dl.get(w) >= 2 && lean(w) < 0).sort((a, b) => lean(a) - lean(b)).slice(0, 8);
  }
  const films = Y ? [...new Set(lib.entries.filter((e) => e.date.startsWith(Y)).map((e) => e.film))] : lib.films;
  const reviewed = new Set(R.map((r) => r.film));
  const rated = films.filter((f) => f.rating);
  const avgReviewed = avg(rated.filter((f) => reviewed.has(f)).map((f) => f.rating)), avgOthers = avg(rated.filter((f) => !reviewed.has(f)).map((f) => f.rating));
  const shareAt = (test) => { const fs = rated.filter((f) => test(f.rating)); return fs.length >= 3 ? pctOf(fs.filter((f) => reviewed.has(f)).length, fs.length) : null; };
  const loveShare = shareAt((r) => r >= 4.5), lowShare = shareAt((r) => r <= 2.5);
  const all = D.reviews(Y ? `Reviews of ${Y}` : "Your reviews", `${plural(R.length, "review")} · ${fmtN(total)} words`, R);
  const split = (title, fs) => D.groups(title, Y ? `Films you logged in ${Y}` : "Every film you've logged", [
    D.films("Reviewed", filmsSub(fs.filter((f) => reviewed.has(f))), fs.filter((f) => reviewed.has(f))), D.films("Not reviewed", filmsSub(fs.filter((f) => !reviewed.has(f))), fs.filter((f) => !reviewed.has(f)))]);
  const lines = [
    { text: `${Y ? `In ${Y} you wrote` : "You've written"} ${plural(R.length, "review")}, about ${fmtN(total)} words in all${total >= 600 ? `: roughly ${fmtN(Math.round(total / 300))} pages of a paperback` : ""}.`, to: all },
    { text: `A typical review runs ${plural(median, "word")}; the longest, for ${byLength[0].film.name}, runs ${fmtN(byLength[0].words)}.`, to: D.reviews(Y ? `Your ${Y} reviews by length` : "Your reviews by length", `A typical one runs ${plural(median, "word")}`, byLength) },
  ];
  if (films.length) lines.push({ text: `You've reviewed ${pctOf(reviewed.size, films.length)}% of the films you logged${Y ? ` in ${Y}` : ""}.`, to: split("Reviewed and not", films) });
  if (avgReviewed && avgOthers && Math.abs(avgReviewed - avgOthers) >= 0.15)
    lines.push({ text: `You review the films you ${avgReviewed > avgOthers ? "like more" : "like less"}: ${starsNum(avgReviewed)} on average for the ones you reviewed, against ${starsNum(avgOthers)} for the rest.`, to: split("Reviewed and not", rated) });
  if (loveShare != null && lowShare != null && Math.abs(loveShare - lowShare) >= 10)
    lines.push({ text: `You review ${loveShare}% of the films you rate 4½★ or more, and ${lowShare}% of those you rate 2½★ or less.`,
      to: D.groups("Which films you review", "", [split("", rated.filter((f) => f.rating >= 4.5)).groups.map((g) => ({ ...g, title: `Rated 4½★ or more: ${g.title.toLowerCase()}` })),
        split("", rated.filter((f) => f.rating <= 2.5)).groups.map((g) => ({ ...g, title: `Rated 2½★ or less: ${g.title.toLowerCase()}` }))].flat()) });
  const perYear = Y ? [] : [...new Set(R.map((r) => (r.date || "").slice(0, 4)).filter(Boolean))].sort()
    .map((y) => { const list = R.filter((r) => (r.date || "").startsWith(y)); return { year: y, count: list.length, to: D.reviews(`Reviews of ${y}`, plural(list.length, "review"), list) }; });
  // the reviews that use a word, from all of them or just the loved or unloved ones
  const words = new Map(R.map((r) => [r, new Set(reviewWords(r.text))]));
  const withWord = (w, among = R, label) => { const list = among.filter((r) => words.get(r).has(w)); return D.reviews(`“${w}”`, `${plural(list.length, "review")}${label ? ` ${label}` : ""} use it`, list, { mark: w }); };

/* ---------- the film data check: release year, countries and language on Letterboxd, TMDB and IMDb ----------
   Letterboxd's export gives each film's title and year; Letterboxd takes countries and languages from TMDB,
   so for those the check sets TMDB against IMDb (from OMDb). What's worth a look comes first: a TMDB film dated
   years away from Letterboxd's (maybe the wrong film), countries or a language with nothing in common, and films
   with no match. Differences that aren't errors are listed apart: a release a year or two apart, IMDb's year

const LANG_SAME = { "norwegian bokmal": "norwegian", "norwegian bokmål": "norwegian", filipino: "tagalog", farsi: "persian", chinese: "mandarin", none: "no language" };

  const list = (a) => a.length ? a.map((x) => x === "None" ? "none (silent)" : x).join(", ") : "none listed";
  for (const f of lib.films) {
    const m = META[f.key];
    if (!m || m.miss || m.src !== "tmdb") { out.nomatch.push(row(f, "TMDB has no film by this title and year. Fix it from its card: Wrong film?")); continue; }
    out.films++;

    if (m.why) out.fixed.push(row(f, `Corrected: ${m.why}`));

    const sure = m.pin || fromKnownId(f, m);
    const wrong = m.y && f.year && Math.abs(m.y - f.year) > 2 && !sure;
    if (wrong) out.look.push(row(f, `Letterboxd ${f.year} · TMDB ${m.y}: maybe matched to the wrong film`, 100 + Math.abs(m.y - f.year)));
    else if (m.y && f.year && m.y !== f.year) out.yearSmall.push(row(f, `Letterboxd ${f.year} · TMDB ${m.y}${sure ? " (checked: the right film)" : ""}`, Math.abs(m.y - f.year)));
    if (!wrong && m.iy && f.year && m.iy !== f.year) out.imdbYear.push(row(f, `Letterboxd ${f.year} · IMDb ${m.iy}`, Math.abs(m.iy - f.year)));
    if (m.ik && m.ik.length && m.k.length) {
      const a = new Set(m.k.map((c) => c.toLowerCase())), b = new Set(m.ik.map((c) => c.toLowerCase()));
      const shared = [...a].filter((c) => b.has(c)).length;

const checkPending = (C) => [C.noImdb ? `IMDb details are still to come for ${plural(C.noImdb, "film")} (OMDb's free key allows 1,000 a day; they fill in by themselves)` : "",
  C.notOnImdb ? `${plural(C.notOnImdb, "film")} ${C.notOnImdb === 1 ? "isn't" : "aren't"} on IMDb by the id TMDB gives` : ""].filter(Boolean);

    C.groups.filter((g) => g.items.length).map((g) => D.names(g.small ? `${g.title} (not an error)` : g.title, plural(g.items.length, "film"), g.items)), { empty: "Every film agrees." });

function dataCheckText(lib) {

  for (const g of C.groups) if (g.items.length && !g.small) parts.push("", `${g.title} (${g.items.length})`, ...g.items.map((x) => `- ${x.name}: ${x.note}`));
  const small = C.groups.filter((g) => g.small && g.items.length);

function dataCheckBlock(lib, phone) {
  if (IN_VIEWER || !lib || state.mode !== "mine") return "";

  const C = dataCheck(lib);

  const why = `Compares each film's release year, countries and language on Letterboxd, TMDB and IMDb. Letterboxd takes countries and languages from TMDB, so those are TMDB against IMDb${omdbKey() ? "" : "; add an OMDb key above to bring IMDb in"}.`;
  const drillTo = dataCheckDrill(C);

    (C.fixed.length ? `, ${plural(C.fixed.length, "film")} corrected by hand` : "") + (C.small ? `, and ${dlink(drillTo, plural(C.small, "small difference"))} that ${C.small === 1 ? "isn't an error" : "aren't errors"}` : "") + ".";
  const pending = checkPending(C);
  const btns = C.total || C.small ? (phone ? `<button class="btn green block" type="button" ${dl(drillTo)}>Show the list</button><button class="btn block" type="button" data-copycheck>Copy the list</button>`
    : `<div class="lookup-row"><button class="btn primary" type="button" ${dl(drillTo)}>Show the list</button><button class="btn" type="button" data-copycheck>Copy the list</button></div>`) : "";
  return title + `<p class="status">${why}</p><p class="status">${found}${pending.length ? ` ${esc(pending.join("; "))}.` : ""}</p>` + btns;

// Copies the list, and says so on the button.
async function copyDataCheck(btn) {
  const text = dataCheckText(MY_LIB);
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied. Paste it into a message"; }
  catch {
    const area = Object.assign(document.createElement("textarea"), { value: text, readOnly: true, className: "key copy-area" });

<script>

const loadImg = (src) => new Promise((resolve) => {

// Words wrapped to a width, at most `lines` lines, the last cut with an ellipsis.
function wrapText(ctx, text, width, lines) {

async function drawYear(lib, Y, withPosters) {

}

<script>
/* ---------- your diary on this site, locked with a password ----------
   The device where the export is imported puts a copy on the site itself: docs/diary/ in the site's own
   repository, committed through GitHub's API with a key that only that device keeps. The copy is encrypted
   (AES-GCM, with a key made from the owner's password by PBKDF2) in three parts: the export, film details,
   and the rest (photos, Letterboxd averages, friends), so a change sends only its own part again. Any device
   that opens the site and is given the password once shows the diary with no import, and keeps up with it.
   The export's email address and the API keys are never in it. index.json says, in the clear, whose diary it
   is, when each part last changed, and how to make the key from the password. */
const SITE_REC = "cr-site-v1";      // every device that opened it: { salt, key, user, at, have: { part: at }, sums: { part: sha-256 } }
const SITE_PUB = "cr-site-pub-v1";  // a device that puts it there: { repo, token, at }
const SITE_DIRTY = "cr-site-dirty"; // changes here not yet on the site: { at, now: a new import or friend }
const SITE_PARTS = ["rows", "meta", "extra"];
const SITE_PATH = "docs/diary/";    // in the repository; the site serves docs/ at its root
const SITE_ITER = 600000;
const SITE_MIN_PASS = 10;
const SITE_META_EVERY = 12 * 3600e3; // film details go up at most twice a day: each update stays in the repository's history
const SITE_ON = !IN_VIEWER && /^https?:$/.test(location.protocol);
const SITE_DEVICE = document.querySelector(".tabbar") ? "phone" : "computer";
const SITE_GH_REPO = SITE_REPO ? SITE_REPO.split("/").slice(3, 5).join("/") : "";
const PUBLISHED = new Set([KEYS.rows, KEYS.meta, KEYS.photos, KEYS.lbx, KEYS.friends]);
let SITE = ls.get(SITE_REC, null), SITEPUB = ls.get(SITE_PUB, null);
// the key works for the site's repository whatever it's called, so a renamed one is followed
if (SITEPUB && SITE_GH_REPO && SITEPUB.repo !== SITE_GH_REPO) { SITEPUB.repo = SITE_GH_REPO; ls.set(SITE_PUB, SITEPUB); }

const site = { index: undefined, offline: false, checked: 0, busy: "", note: "", err: false, noteIn: "publish", applying: false, armed: null, timer: null, due: 0, job: null };
const saveSite = () => { SITE ? ls.set(SITE_REC, SITE) : ls.del(SITE_REC); SITEPUB ? ls.set(SITE_PUB, SITEPUB) : ls.del(SITE_PUB); };

/* ----- bytes, hashes and the lock ----- */
const bytesToB64 = (bytes) => { let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };

const canon = (v) => JSON.stringify(v, (k, x) => (x && typeof x === "object" && !Array.isArray(x) ? Object.fromEntries(Object.keys(x).sort().map((n) => [n, x[n]])) : x));

const importKey = (b64) => crypto.subtle.importKey("raw", b64ToBytes(b64), "AES-GCM", true, ["encrypt", "decrypt"]);

    body = await squeeze(body, "out");

/* ----- the site (for reading) and GitHub (for changing it) ----- */
async function siteGet(name, version) {
  const res = await fetch(`diary/${name}${version ? `?v=${encodeURIComponent(version)}` : ""}`, { cache: version ? "default" : "no-cache" });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`The site said ${res.status}.`);
  return name.endsWith(".json") ? res.json() : new Uint8Array(await res.arrayBuffer());
}
const ghFail = (msg, extra = {}) => Object.assign(new Error(msg), extra);
async function gh(path, opts = {}) {
  let res;
  try {
    res = await fetch(`https://api.github.com/repos/${SITEPUB.repo}${path}`, { ...opts,
      headers: { Authorization: `Bearer ${SITEPUB.token}`, Accept: "application/vnd.github+json", ...(opts.body ? { "Content-Type": "application/json" } : {}) } });
  } catch { throw ghFail("Couldn't reach GitHub. Your changes are kept here and go up next time."); }
  if (res.status === 401) throw ghFail("GitHub didn't accept the key. It may have expired: make a new one (same steps as before) and paste it here.", { key: true });
  if (res.status === 404 && !path) throw ghFail(`GitHub can't find ${SITEPUB.repo} with this key. Check that the key was given that repository.`, { key: true });
  if (res.status === 403) throw ghFail("This key can read the site's repository but not change it. Give it Contents: Read and write.", { key: true });
  if (!res.ok) throw ghFail(`GitHub said ${res.status}.`, { status: res.status });
  return res.status === 204 ? null : res.json();
}
async function repoHead() {
  const branch = (await gh("")).default_branch || "main";
  // (the time on the end stops the browser answering from its own copy of a minute ago)
  const commit = (await gh(`/git/ref/heads/${branch}?t=${Date.now()}`)).object.sha;
  return { branch, commit, tree: (await gh(`/git/commits/${commit}`)).tree.sha };
}
// The diary's files in the repository as it is now: { name: blob sha }.
async function hostedFiles(commit) {
  try { return Object.fromEntries((await gh(`/contents/${SITE_PATH.slice(0, -1)}?ref=${commit}`)).filter((f) => f.type === "file").map((f) => [f.name, f.sha])); }
  catch (e) { if (e.status === 404) return {}; throw e; }
}
const blobBytes = async (sha) => b64ToBytes((await gh(`/git/blobs/${sha}`)).content);
// Writes files (null deletes one) as one commit; false when someone else changed the repository first.
async function commitFiles(head, files, message) {
  const tree = [];
  for (const [name, bytes] of Object.entries(files)) {
    const sha = bytes && (await gh("/git/blobs", { method: "POST", body: JSON.stringify({ content: bytesToB64(bytes), encoding: "base64" }) })).sha;
    tree.push({ path: SITE_PATH + name, mode: "100644", type: "blob", sha: sha || null });
  }
  const t = await gh("/git/trees", { method: "POST", body: JSON.stringify({ base_tree: head.tree, tree }) });
  const c = await gh("/git/commits", { method: "POST", body: JSON.stringify({ message, tree: t.sha, parents: [head.commit] }) });
  try { await gh(`/git/refs/heads/${head.branch}`, { method: "PATCH", body: JSON.stringify({ sha: c.sha, force: false }) }); return true; }
  catch (e) { if (e.status === 422 || e.status === 409) return false; throw e; }
}

/* ----- what goes up from this device, and bringing the site's copy in ----- */
const PROFILE_KEEP = ["Username", "Date Joined", "Given Name", "Family Name"];
function siteRows(rows) {
  if (!rows) return null;
  const r = { ...rows, profile: (rows.profile || []).map((p) => Object.fromEntries(PROFILE_KEEP.filter((k) => k in p).map((k) => [k, p[k]]))) };
  delete r.site;
  return r;
}
const siteLocal = () => ({ rows: siteRows(store.get(KEYS.rows, null)), meta: META,
  extra: { photos: PHOTOS, lbx: LBX, friends: store.get(KEYS.friends, []).map((f) => ({ ...f, rows: siteRows(f.rows) })) } });
const siteUser = (rows) => (((rows && rows.profile) || [])[0] || {}).Username || "";
// Which of two imports is newer: by when it was imported, or for imports from before that was noted,
// by the newest diary entry and then by size.
const rowsWhen = (r) => r.importedAt || (r.diary || []).reduce((m, e) => ((e.Date || "") > m ? e.Date : m), "");
const rowsSize = (r) => (r.diary || []).length + (r.watched || []).length + (r.reviews || []).length;
const newerRows = (a, b) => (rowsWhen(a) !== rowsWhen(b) ? rowsWhen(a) > rowsWhen(b) : rowsSize(a) > rowsSize(b));
// The better of two copies of a film's details: matched by hand, then found, then a newer kind of match, then more filled in.
const metaScore = (m) => (!m ? -1 : (m.pin ? 1e6 : 0) + (m.miss ? 0 : 1e4) + (m.v || 0) * 100 + (m.om ? 10 : 0) + (m.ik ? 5 : 0));
const mergeMeta = (a, b) => { const out = { ...a }; for (const [k, m] of Object.entries(b || {})) if (metaScore(m) > metaScore(out[k])) out[k] = m; return out; };
const mergeLbx = (a, b) => { const out = { ...a }; for (const [k, x] of Object.entries(b || {})) if (!out[k] || (x && x.r && !out[k].r)) out[k] = x; return out; };
// friends are matched by name (each device gives a friend its own id); the newer export of each is kept
const mergeFriends = (a, b) => {
  const by = new Map((a || []).map((f) => [f.name.toLowerCase(), f]));
  for (const f of b || []) { const k = f.name.toLowerCase(), had = by.get(k); if (!had || newerRows(f.rows, had.rows)) by.set(k, had ? { ...f, id: had.id } : f); }
  return [...by.values()];
};
// Parts from the site come into this device: an import newer than this device's (or one that came from the site
// before) replaces it; film details, averages, photos and friends are combined with what's here.
async function siteTake(parts, idx, draw) {
  let newRows = false;
  site.applying = true;
  try {
    if (parts.rows) {
      const mine = store.get(KEYS.rows, null);
      if (!mine || mine.site || newerRows(parts.rows, mine)) { store.set(KEYS.rows, { ...parts.rows, site: idx.parts.rows }); newRows = true; }
    }
    if (parts.meta) META = mergeMeta(META, parts.meta);
    if (parts.extra) {
      const x = parts.extra;
      if (x.photos) PHOTOS = { ...x.photos, ...PHOTOS };
      if (x.lbx) { LBX = mergeLbx(LBX, x.lbx); store.set(KEYS.lbx, LBX); }
      if (x.friends) { store.set(KEYS.friends, mergeFriends(store.get(KEYS.friends, []), x.friends)); loadFriends(); }
    }
    if (parts.meta || parts.extra) saveMeta();
  } finally { site.applying = false; }
  store.flush();
  for (const p of Object.keys(parts)) { SITE.have[p] = idx.parts[p]; SITE.sums[p] = await sha256(canon(parts[p])); }
  SITE.at = idx.at; SITE.user = idx.user; saveSite();
  try { MY_LIB = myLibrary(); LOAD_ERROR = ""; } catch (e) { LOAD_ERROR = (e && e.message) || "unknown error"; }
  if (MY_LIB) state.mode = "mine";
  DATA_REV++; SEARCH_INDEX = null;
  if (draw) {
    render();
    // a diary that just arrived gets the daily feed's newer entries, and any films still to look up
    if (newRows && MY_LIB) refreshFeed().then(() => autoLookup(allFilmsLib())).catch(() => {});
  }
}
// The parts this device doesn't have yet, read from the site (or from GitHub, just before sending).
async function siteBring(idx, read, draw) {
  const key = await importKey(SITE.key), parts = {};
  const have = store.get(KEYS.rows, null) ? SITE.have || {} : {}; // nothing saved here any more: everything again
  SITE.have = SITE.have || {}; SITE.sums = SITE.sums || {};
  for (const p of SITE_PARTS) {
    if (!idx.parts[p] || have[p] === idx.parts[p]) continue;
    const bytes = await read(p);
    if (bytes) parts[p] = await unseal(key, bytes);
  }
  if (Object.keys(parts).length) await siteTake(parts, idx, draw);
  else { SITE.at = idx.at; saveSite(); }
}

/* ----- checking the site, opening the diary with its password ----- */
async function siteCheck(draw) {
  if (!SITE_ON) return;
  site.checked = Date.now();
  try { site.index = await siteGet("index.json"); site.offline = false; }
  catch { site.offline = true; if (draw) siteRedraw(); return; } // offline: what's saved here still shows
  const idx = site.index;
  if (idx && SITE && SITE.salt === idx.salt && (idx.at !== SITE.at || !store.get(KEYS.rows, null))) {
    try { await siteBring(idx, (p) => siteGet(`${p}.bin`, idx.parts[p]), draw); }
    catch (e) { Object.assign(site, { note: e.message || "Couldn't bring in the site's diary.", err: true, noteIn: "publish" }); }
  }
  if (draw) siteRedraw();
}
async function siteUnlock(pass, where) {
  if (!pass) return siteSay("Type the password.", true, where);
  siteBusy("Opening…", where);
  try {
    const idx = await siteGet("index.json");
    if (!idx) throw new Error("There's no diary on this site any more.");
    const key = await deriveKey(pass, idx.salt);
    try { await unseal(key, b64ToBytes(idx.check)); } catch { throw new Error("That password doesn't open it. Check it and try again."); }
    site.index = idx;
    SITE = { salt: idx.salt, key: await exportKey(key), user: idx.user, at: null, have: {}, sums: {} };
    saveSite();
    await siteBring(idx, (p) => siteGet(`${p}.bin`, idx.parts[p]), true);
    siteDone("", where);
  } catch (e) { siteDone(e.message || "Couldn't open it.", where, true); }
}

/* ----- putting the diary on the site ----- */
// `password` locks it afresh: the first time, or a new password.
function sitePublish({ password } = {}) {
  if (!SITE_ON || !SITEPUB || (!password && !SITE)) return Promise.resolve();
  if (site.job) return site.job;
  site.job = (async () => {
    const dirty = JSON.stringify(ls.get(SITE_DIRTY, null)), fresh = !!password, had = site.index;
    siteBusy(fresh ? (had ? "Changing the password…" : "Putting your diary on the site…") : "Updating the site…");
    try {
      if (!store.get(KEYS.rows, null)) throw ghFail("Import your Letterboxd export first.");
      let key, salt, check, said = "The site is up to date.";
      if (fresh) { salt = bytesToB64(crypto.getRandomValues(new Uint8Array(16))); key = await deriveKey(password, salt); check = bytesToB64(await seal(key, "credits-roll", true)); }
      for (let attempt = 0; ; attempt++) {
        if (attempt === 4) throw ghFail("Another device kept changing the site at the same moment. Try again in a minute.");
        const head = await repoHead(), files = await hostedFiles(head.commit);
        const idx = files["index.json"] ? JSON.parse(new TextDecoder().decode(await blobBytes(files["index.json"]))) : null;
        const known = idx && SITE && SITE.salt === idx.salt;
        if (idx && !known) throw ghFail(fresh && !had ? "A diary was put on this site from another device a moment ago. Refresh the page in a minute and type its password."
          : "The diary on the site has a password this device doesn't know yet. Type it first.");
        if (known && idx.at !== SITE.at) await siteBring(idx, async (p) => files[`${p}.bin`] && blobBytes(files[`${p}.bin`]), true); // another device changed it: that first
        if (!fresh) { key = await importKey(SITE.key); salt = SITE.salt; check = idx ? idx.check : bytesToB64(await seal(key, "credits-roll", true)); }
        const local = siteLocal(), now = new Date().toISOString(), sums = (!fresh && known && SITE.sums) || {}, up = {};
        for (const p of SITE_PARTS) {
          const sum = await sha256(canon(local[p]));
          if (fresh || !idx || !idx.parts[p] || sums[p] !== sum) up[p] = sum;
        }
        if (!Object.keys(up).length) break;
        const parts = { ...(fresh || !idx ? {} : idx.parts) };
        const out = {};
        for (const p of Object.keys(up)) { out[`${p}.bin`] = await seal(key, local[p]); parts[p] = now; }
        const next = { app: "credits-roll", v: 1, user: siteUser(local.rows) || (idx && idx.user) || "", imported: rowsWhen(local.rows), at: now, from: SITE_DEVICE,
          salt, iter: SITE_ITER, check, parts };
        out["index.json"] = new TextEncoder().encode(JSON.stringify(next, null, 1) + "\n");
        if (!(await commitFiles(head, out, `Diary on the site: ${fresh ? (idx ? "new password" : "first copy") : "updated"} from a ${SITE_DEVICE}`))) continue;
        SITE = { salt, key: await exportKey(key), user: next.user, at: now, have: { ...(fresh ? {} : SITE.have), ...Object.fromEntries(Object.keys(up).map((p) => [p, now])) },
          sums: { ...sums, ...up } };
        SITEPUB.at = now; site.index = next; saveSite();
        said = fresh ? (idx ? "Password changed. Your other devices will ask for the new one." : "Your diary is on the site. On your other devices, open the site and type the password.") : "Updated the site.";
        break;
      }
      if (JSON.stringify(ls.get(SITE_DIRTY, null)) === dirty) ls.del(SITE_DIRTY); // a change made meanwhile goes next time
      siteDone(said);
    } catch (e) {
      if (e.key && !SITEPUB.at) SITEPUB = null; // a key that never worked isn't kept
      saveSite();
      siteDone(e.message || "Couldn't update the site.", "publish", true);
    } finally {
      site.job = null;
      if (ls.get(SITE_DIRTY, null) && !site.err) siteLater();
      siteRedraw();
    }
  })();
  return site.job;
}
// Takes the diary off the site; every device keeps its own copy, and nothing goes up again until it's put back.
async function siteRemove() {
  siteBusy("Taking it off the site…");
  try {
    for (let attempt = 0; attempt < 4; attempt++) {
      const head = await repoHead(), files = await hostedFiles(head.commit);
      if (!Object.keys(files).length || await commitFiles(head, Object.fromEntries(Object.keys(files).map((n) => [n, null])), `Diary taken off the site from a ${SITE_DEVICE}`)) {
        SITE = null; site.index = null; ls.del(SITE_DIRTY); saveSite();
        return siteDone("Your diary is off the site. Every device keeps the copy it has.");
      }
    }
    throw ghFail("Another device kept changing the site at the same moment. Try again in a minute.");
  } catch (e) { siteDone(e.message || "Couldn't take it off.", "publish", true); }
}
function siteKey(repo, token) {
  repo = String(repo || SITE_GH_REPO).trim().replace(/^https?:\/\/github\.com\//i, "").replace(/\.git$|\/+$/g, "");
  token = String(token || "").trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) return siteSay("Type the site's repository as name/repository, for example sjnift/credits-roll.", true), false;
  if (!token) return siteSay("Paste the GitHub key.", true), false;
  SITEPUB = { repo, token, at: null }; saveSite();
  return true;
}
// Forgets everything about the site on this device (with "Delete saved data from this browser").
function siteForget() { clearTimeout(site.timer); site.timer = null; SITE = null; SITEPUB = null; ls.del(SITE_DIRTY); saveSite(); Object.assign(site, { note: "", err: false }); }

// A change on this device goes up by itself: a new import or friend within seconds, film details and averages
// once lookups have finished, at most twice a day.
STORE_HOOK = (k) => {
  if (site.applying || !SITEPUB || !SITE || !PUBLISHED.has(k)) return;
  const d = ls.get(SITE_DIRTY, null) || { at: Date.now() };
  if (k === KEYS.rows || k === KEYS.friends) d.now = true;
  ls.set(SITE_DIRTY, d);
  siteLater();
};
function siteLater() {
  const d = ls.get(SITE_DIRTY, null);
  if (!d || !SITEPUB || !SITE) return;
  const wait = d.now ? 4000 : Math.max(10 * 60e3, (SITEPUB.at ? Date.parse(SITEPUB.at) + SITE_META_EVERY : 0) - Date.now());
  if (site.timer && site.due <= Date.now() + wait) return; // already going sooner
  clearTimeout(site.timer); site.due = Date.now() + wait;
  site.timer = setTimeout(function go() {
    if (!d.now && [job, imdbJob, lbJob].some((j) => j && j.running)) { site.timer = setTimeout(go, 60e3); return; }
    site.timer = null; sitePublish();
  }, wait);
}
// Going into the background sends a new import straight away; coming back checks the site for a newer copy.
addEventListener("visibilitychange", () => {
  if (!SITE_ON) return;
  if (document.visibilityState === "hidden") { const d = ls.get(SITE_DIRTY, null); if (d && d.now && SITEPUB) sitePublish(); }
  else if (Date.now() - site.checked > 10 * 60e3) siteCheck(true);

/* ----- the boxes: "open" (asks for the password) and "publish" (in Settings, or at the foot of the page) ----- */

  if (!idx) {
    return box("Put your diary on this site", `<p class="status">Lock it with a password and every device can open it: just open the site and type the password once, with no importing. Your email address and API keys stay out of it.</p>
      ${field("newpass", `Choose a password (at least ${SITE_MIN_PASS} characters; you'll type it once on each device)`, "text", "new-password")}

  }

// Redraws the boxes whose content changed (so a password being typed isn't wiped by an unrelated redraw).
const siteDrawn = new WeakMap();
function siteRedraw() {
  for (const el of document.querySelectorAll("[data-sitebox]")) {
    const html = siteBox(el.dataset.sitebox);

  }
}

// Enter in the password box opens the diary
document.addEventListener("keydown", (e) => {

// After the first screen: check the site for its diary (or a newer copy), and send anything still waiting.
function siteStart() {
  if (!SITE_ON) return;
  siteRedraw();

function morph(el, html) {

let screenKey = "", SCROLL = {};

function render(motion) {

  YEARS = memo("years", () => [...new Set(state.lib.entries.map((e) => e.date.slice(0, 4)))].sort().reverse());
  if (state.scope !== "all" && !YEARS.includes(state.scope)) state.scope = "all";

  const fresh = key !== screenKey;
