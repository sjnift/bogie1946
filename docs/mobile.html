<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2128">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Credits Roll">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Credits Roll Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a phone app in the style of the Letterboxd app. A sticky nav bar with year tabs,
   one scrolling screen per bottom tab, list rows with chevrons, and pushed detail screens.
   Dark only, like the app. On wide screens the app sits in a centred 480px column. */
:root {
  --bg: #14181C;
  --bar: #1B2128;
  --card: #202830;
  --card-2: #2C3440;
  --line: #2C3440;
  --ink: #FFFFFF;
  --ink-1: #DDE6EE;
  --ink-2: #99AABB;
  --muted: #6E8193;
  --green: #00E054;
  --green-mark: #00A83E;
  --blue: #40BCF4;
  --blue-mark: #2E95D3;
  --orange: #FF8000;
  --slate-mark: #62788D;
  --heat-1: #0E5C2C;
  --heat-2: #13873F;
  --heat-3: #2FC266;
  --danger: #FF7A7A;
  --frame: rgba(221, 238, 255, .2);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Roboto, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --navbar: 48px;
  --scopebar: 40px;
  --tabbar: 56px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { color: var(--ink-2); font-family: var(--sans); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
a { color: var(--blue); text-decoration: none; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 24px); }
@media (min-width: 520px) { .app { border-inline: 1px solid var(--line); } }
.screen {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- nav bar + year tabs ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); border-bottom: 1px solid var(--line); }
.nav {
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; height: var(--navbar);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.nav h1 { color: var(--ink); font-size: 17px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
.nav .left { justify-self: start; } .nav .right { justify-self: end; }
.nav-btn { background: none; border: 0; color: var(--green); font-size: 15px; font-weight: 500; padding: 8px 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
.nav-btn svg { width: 22px; height: 22px; }
.scopes {
  display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; height: var(--scopebar); align-items: stretch;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.scopes::-webkit-scrollbar { display: none; }
.scope {
  all: unset; flex: none; cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); border-bottom: 2px solid transparent; display: flex; align-items: center;
}
.scope[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--green); }
.scope:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.top.detail .scopes { display: none; }

/* ---------- common pieces ---------- */
.sh {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 26px 0 10px; padding-bottom: 7px;
  border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2);
}
.sh .more { all: unset; cursor: pointer; color: var(--ink-2); font-size: 12px; letter-spacing: .08em; }
.sh .more:hover { color: var(--ink); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: 0;
  border-radius: 6px; padding: 11px 16px; font-weight: 600; font-size: 15px; background: var(--card-2); color: var(--ink);
}
.btn.green { background: var(--green-mark); color: #fff; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.card { background: var(--card); border-radius: 8px; padding: 14px; display: grid; gap: 10px; }
.card p { margin: 0; }
.card .title { color: var(--ink); font-weight: 600; font-size: 15px; }
.status { font-size: 13.5px; color: var(--ink-2); }
.status.err { color: var(--danger); }
.tmdb-link { font-size: 11px; font-weight: 500; color: var(--blue); white-space: nowrap; margin-left: 4px; }
.linkish { all: unset; cursor: pointer; color: var(--blue); }
.linkish:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.stars { color: var(--green); letter-spacing: .02em; white-space: nowrap; }
.heart { color: var(--orange); }
.rewatch { color: var(--green); }
.chev { width: 16px; height: 16px; color: var(--muted); flex: none; }
.empty { color: var(--muted); padding: 16px 0; font-size: 14px; }
.meter { height: 4px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--green-mark); width: 0; transition: width .3s; }

/* ---------- profile ---------- */
.profile { display: grid; justify-items: center; gap: 6px; padding-top: 22px; text-align: center; }
.avatar {
  border-radius: 50%; background: var(--card-2); display: grid; place-items: center; overflow: hidden; position: relative;
  color: var(--ink-1); font-weight: 700; flex: none; box-shadow: inset 0 0 0 1px var(--frame);
}
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
.avatar.xl { width: 84px; height: 84px; font-size: 28px; }
.avatar.lg { width: 64px; height: 64px; font-size: 21px; }
.avatar.md { width: 44px; height: 44px; font-size: 15px; }
.profile .name { color: var(--ink); font-size: 20px; font-weight: 700; margin-top: 6px; }
.profile .handle { font-size: 13.5px; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--bg); background: var(--ink-2); border-radius: 3px; padding: 2px 6px; }
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 18px; border-block: 1px solid var(--line); }
.strip div { display: grid; justify-items: center; padding: 12px 2px; gap: 1px; min-width: 0; }
.strip div + div { border-left: 1px solid var(--line); }
.strip b { color: var(--ink); font-size: 19px; font-weight: 700; }
.strip span { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
.notice { margin-top: 16px; }

/* ---------- menu rows ---------- */
.menu { list-style: none; margin: 0; padding: 0; }
.row {
  all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: flex; align-items: center; gap: 12px;
  padding: 13px 0; border-bottom: 1px solid var(--line); color: var(--ink-1); font-size: 16px;
}
.row:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.row .count { margin-left: auto; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.row.danger { color: var(--danger); }

/* ---------- people ---------- */
.scroller { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; padding-bottom: 2px; }
.scroller::-webkit-scrollbar { display: none; }
.pcard { all: unset; cursor: pointer; flex: none; width: 74px; display: grid; justify-items: center; gap: 5px; text-align: center; }
.pcard .nm { color: var(--ink-1); font-size: 12px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pcard .ct { font-size: 11.5px; color: var(--ink-2); margin-top: -3px; }
.segctl { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--card); border-radius: 8px; padding: 2px; gap: 2px; margin-top: 14px; }
.segctl button { all: unset; text-align: center; padding: 7px 0; border-radius: 6px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.segctl button[aria-pressed="true"] { background: var(--card-2); color: var(--ink); }
.segctl button:focus-visible { outline: 2px solid var(--blue); }
.toggles { display: flex; gap: 18px; margin-top: 14px; }
.toggle { all: unset; cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-bottom: 3px; border-bottom: 2px solid transparent; }
.toggle[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--green); }
.prow {
  all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 24px 44px minmax(0, 1fr) auto 16px;
  align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line);
}
.prow:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.prow .rk { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.prow .nm { color: var(--ink); font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .sub { font-size: 12.5px; color: var(--ink-2); }
.prow .val { color: var(--ink-1); font-size: 14px; font-variant-numeric: tabular-nums; }
.prow.cat { grid-template-columns: minmax(0, 1fr) 90px 44px 16px; }
.mini { height: 6px; background: var(--card-2); border-radius: 3px; overflow: hidden; }
.mini span { display: block; height: 100%; background: var(--slate-mark); border-radius: 3px; }

/* ---------- posters ---------- */
.pgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 8px; }
.pitem { all: unset; cursor: default; display: grid; gap: 4px; min-width: 0; }
.poster {
  position: relative; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 4px; overflow: hidden;
  background: linear-gradient(165deg, #2F3946, #1C232B);
}
.poster::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--frame); pointer-events: none; }
.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.poster .ph { position: absolute; inset: 0; padding: 7px 6px; display: flex; flex-direction: column; justify-content: flex-end; color: var(--ink-1); font-size: 11px; font-weight: 600; line-height: 1.15; overflow-wrap: break-word; }
.poster .ph small { color: var(--ink-2); font-weight: 400; font-size: 10px; margin-top: 2px; }
.pmeta { display: flex; gap: 4px; align-items: center; font-size: 11px; min-height: 14px; }
.mlabel { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mdate { font-size: 11px; color: var(--muted); margin-top: -2px; }

/* ---------- diary ---------- */
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.fact { background: var(--card); border-radius: 8px; padding: 10px 12px; display: grid; gap: 1px; min-width: 0; }
.fact .k { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.fact .v { color: var(--ink); font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.month-h {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--navbar) + var(--scopebar) + 1px); z-index: 5;
  background: var(--bg); padding: 10px 0 6px; border-bottom: 1px solid var(--line);
  font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2);
}
.drow { display: grid; grid-template-columns: 30px 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.drow .day { font-size: 22px; font-weight: 300; color: var(--ink-2); text-align: center; font-variant-numeric: tabular-nums; }
.drow .poster { width: 34px; }
.drow .poster .ph { display: none; }
.drow .t { color: var(--ink); font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drow .t span { color: var(--ink-2); font-weight: 400; }
.drow .m { font-size: 12px; display: flex; gap: 6px; align-items: center; }
.drow .icons { display: flex; gap: 6px; font-size: 14px; }

/* ---------- charts ---------- */
.chart { position: relative; margin-right: 26px; margin-top: 8px; }
.cols { position: relative; z-index: 1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: end; gap: 1px; border-bottom: 1px solid var(--line); padding-top: 8px; }
.col { height: 100%; display: flex; flex-direction: column-reverse; align-items: center; min-width: 0; }
.col .seg { width: 100%; max-width: 24px; }
.col .seg + .seg { margin-bottom: 2px; }
.col .seg.a { background: var(--green-mark); }
.col .seg.b { background: var(--blue-mark); }
.col .seg:last-child { border-radius: 3px 3px 0 0; }
.col:hover .seg { filter: brightness(1.25); }
.chart.slate .col .seg.a { background: var(--slate-mark); }
.chart + .axis { margin-right: 26px; }
.axis { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 1px; margin-top: 5px; }
.axis span { font-size: 10.5px; color: var(--muted); text-align: center; white-space: nowrap; }
.axis.dense span.minor { visibility: hidden; }
.gridline { position: absolute; left: 0; right: -26px; border-top: 1px solid var(--line); pointer-events: none; }
.gridline span { position: absolute; right: 0; top: -8px; font-size: 10.5px; line-height: 16px; color: var(--muted); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
.weekdays { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.wd { display: grid; gap: 4px; justify-items: center; }
.wd .bar-v { width: 100%; max-width: 24px; height: 60px; display: flex; align-items: flex-end; }
.wd .bar-v span { display: block; width: 100%; background: var(--green-mark); border-radius: 3px 3px 0 0; }
.wd .lbl { font-size: 11px; color: var(--muted); }
.wd .cnt { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cal-wrap { overflow-x: auto; padding-bottom: 4px; }
.cal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 10px); grid-auto-columns: 10px; gap: 3px; width: max-content; }
.cal i { display: block; border-radius: 2px; background: var(--card-2); }
.cal i.l1 { background: var(--heat-1); } .cal i.l2 { background: var(--heat-2); } .cal i.l3 { background: var(--heat-3); }
.cal i.pad { background: transparent; }
.cal-months { display: grid; grid-auto-flow: column; grid-auto-columns: 10px; gap: 3px; width: max-content; margin-bottom: 4px; }
.cal-months span { font-size: 10px; color: var(--muted); white-space: nowrap; width: 10px; }
.heat-key { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.heat-key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; background: var(--card-2); }
.hist-ends { display: flex; justify-content: space-between; font-size: 11px; margin-top: 4px; }

/* ---------- detail screens ---------- */
.dhead { display: grid; justify-items: center; gap: 4px; padding-top: 22px; text-align: center; }
.dhead .name { color: var(--ink); font-size: 21px; font-weight: 700; margin-top: 8px; }
.dhead .sub { font-size: 13.5px; }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--bar); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabbar nav { max-width: 448px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: var(--tabbar); }
.tabbar button { all: unset; cursor: pointer; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--muted); font-size: 10.5px; font-weight: 500; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button:focus-visible { outline: 2px solid var(--blue); outline-offset: -4px; border-radius: 8px; }

/* ---------- insights ---------- */
.icards { display: grid; gap: 8px; }
.yearpick { overflow-x: auto; scrollbar-width: none; flex-wrap: nowrap; margin-top: 14px; padding-bottom: 2px; }
.yearpick::-webkit-scrollbar { display: none; }
.yearpick .toggle { flex: none; }
.icard { background: var(--card); border-radius: 8px; padding: 12px 14px; display: grid; gap: 3px; }
.icard .k { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.icard .big { color: var(--ink); font-size: 22px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.icard p { margin: 0; font-size: 14px; }
.mults { display: grid; gap: 14px; }
.mult .mt { margin: 0 0 2px; font-size: 12px; color: var(--ink-2); }
.tscroll { overflow-x: auto; margin-top: 14px; margin-inline: -16px; padding-inline: 16px; }
.mtable { border-collapse: collapse; font-size: 13px; width: max-content; min-width: 100%; }
.mtable th, .mtable td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.mtable th { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.mtable td { color: var(--ink-1); }
.mtable .n { text-align: right; font-variant-numeric: tabular-nums; }
.mtable.heat td.n { text-align: center; min-width: 40px; }
.dim { color: var(--muted); }
.tline { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; color: var(--ink-1); font-size: 14.5px; }
.tline .mk { font-size: 10px; flex: none; color: var(--ink-2); }
.ghead { display: grid; grid-template-columns: minmax(0, 1fr) 84px 84px 16px; gap: 10px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin-top: 10px; }
.grow { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) 84px 84px 16px; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.grow .nm { display: block; color: var(--ink); font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow .sub { font-size: 12px; }
.gcol { display: grid; gap: 2px; justify-items: center; }
.gcol .v { font-size: 11.5px; color: var(--ink-1); font-variant-numeric: tabular-nums; }
.dbar { position: relative; display: block; width: 100%; height: 8px; }
.dbar .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; border-left: 1px solid var(--muted); }
.dbar .fill { position: absolute; top: 0; bottom: 0; }
.dbar .fill.pos { left: 50%; background: var(--green-mark); border-radius: 0 3px 3px 0; }
.dbar .fill.neg { right: 50%; background: var(--blue-mark); border-radius: 3px 0 0 3px; }
.lead { margin: 4px 0 0; color: var(--ink-1); font-size: 15px; }
.fact .t { font-size: 12.5px; color: var(--ink-2); }
.dv { color: var(--ink); font-weight: 600; }
/* ---------- reviews ---------- */
.mrev { padding: 14px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.mrev-head { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; }
.mrev-head .poster .ph { display: none; }
.mrev .t { color: var(--ink); font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrev .t span { color: var(--ink-2); font-weight: 400; }
.mrev .m { display: flex; gap: 6px; align-items: center; font-size: 12.5px; }
.rv-text { color: var(--ink-1); font-size: 14.5px; line-height: 1.55; overflow-wrap: anywhere; }
.rv-text p { margin: 0 0 .7em; } .rv-text p:last-child { margin-bottom: 0; }
.rv-text blockquote { margin: .3em 0 .7em; padding-left: 10px; border-left: 2px solid var(--card-2); color: var(--ink-2); }
.rv-text ul, .rv-text ol { margin: .3em 0 .7em; padding-left: 1.2em; }
.rv-text a { color: var(--blue); }

#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink-1); color: var(--bg); font-size: 12.5px; padding: 6px 9px; border-radius: 6px; max-width: 240px; line-height: 1.35; }
.foot { font-size: 12.5px; color: var(--muted); margin-top: 26px; display: grid; gap: 6px; }
.foot p { margin: 0; }
input.key { width: 100%; padding: 11px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); font-family: var(--mono); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* ---------- links into the data ---------- */
/* A number that opens its data carries a fine grey underline (none in tables); in a sentence the link is white
   against the grey text, as Letterboxd does it, and tags are grey pills. */
.dlink { all: unset; cursor: pointer; text-decoration: underline 1px; text-underline-offset: 4px;
  text-decoration-color: color-mix(in srgb, var(--ink-2) 45%, transparent); -webkit-tap-highlight-color: transparent; }
.mtable .dlink { text-decoration: none; }
.dlink:active { color: var(--green); }
.status .dlink, .lead .dlink, .tline .dlink, .legend .dlink, .fc-dir .dlink, .mrev .t .dlink { text-decoration: none; color: var(--ink); font-weight: 600; }
.fc-tags, .fc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fc-tags { margin-top: 6px !important; }
.fc-tags .dlink, .fc-chips .dlink { text-decoration: none; background: var(--card); color: var(--ink-2); border-radius: 4px; padding: 4px 9px; font-size: 13px; line-height: 1.35; }
.fc-tags .dlink:active, .fc-chips .dlink:active { background: var(--card-2); color: var(--ink); }
.dline { all: unset; cursor: pointer; display: block; }
.tline:has(.dline) { align-items: flex-start; }
.tline:has(.dline) .mk { line-height: 1.4; padding-top: .25em; }
.dline .go { color: var(--green); }
button.col, button.wd, button.pitem, button.icard, button.fact, button.drow, .wordcloud button.w, .wchips button {
  appearance: none; font: inherit; text-align: left; cursor: pointer; margin: 0; }
button.col, button.wd { background: none; border: 0; padding: 0; color: inherit; width: 100%; }
button.pitem { color: inherit; }
button.icard, button.fact { border: 0; color: inherit; width: 100%; }
button.icard .go, button.fact .go { color: var(--green); }
button.drow { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 30px 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.wordcloud button.w { all: unset; cursor: pointer; color: var(--ink); font-weight: 600; line-height: 1.3; }
.wchips button { border: 0; background: var(--card); border-radius: 4px; padding: 4px 9px; font-size: 13px; color: var(--ink-1); }
.cal i[data-list] { cursor: pointer; }
.mtable td .dlink { font-variant-numeric: tabular-nums; }
.strip button { all: unset; display: grid; justify-items: center; padding: 12px 2px; gap: 1px; min-width: 0; cursor: pointer; }
.strip button + button { border-left: 1px solid var(--line); }

/* ---------- the sheet and the full screen ---------- */
dialog.sheet { position: fixed; inset: auto 0 0 0; margin: 0 auto; width: 100%; max-width: 480px; max-height: 86vh; padding: 0; border: 0; border-radius: 14px 14px 0 0;
  background: var(--bar); color: var(--ink-2); display: none; flex-direction: column; box-shadow: 0 -10px 40px rgba(0, 0, 0, .5); }
dialog.sheet[open] { display: flex; animation: sheet-up .22s ease-out; }

@keyframes sheet-up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet-grip { width: 38px; height: 5px; border-radius: 3px; background: var(--card-2); margin: 8px auto 0; flex: none; }

.sheet-title { display: flex; gap: 10px; align-items: center; justify-content: center; text-align: center; min-width: 0; }
.sheet-title h2 { color: var(--ink); font-size: 16px; font-weight: 600; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-title p { margin: 1px 0 0; font-size: 12px; color: var(--ink-2); }
.sheet-head .done { font-weight: 600; }
.sheet-body { overflow: auto; padding: 0 16px 14px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet-foot { padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); flex: none; }
.avatar.sm { width: 32px; height: 32px; font-size: 12px; flex: none; }
.drill-page { margin-top: 10px; }
.drill-row { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.drill-row.entry { grid-template-columns: 30px 34px minmax(0, 1fr) auto; }

.dr-main { display: grid; min-width: 0; }

.dr-s { font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }

.thumb { position: relative; display: grid; place-items: center; width: 34px; aspect-ratio: 2 / 3; border-radius: 3px; overflow: hidden; background: var(--card-2);

/* Turns the table above into the same shape an imported export produces:
   a library of films plus diary entries, and a metadata map keyed by film. */
function buildExample() {
  let seed = 20261021;
  const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const start = Date.UTC(2021, 0, 4), end = Date.UTC(2026, 9, 18), day = 864e5;
  const iso = (t) => new Date(t).toISOString().slice(0, 10);
  // Never before a film came out; later years a little busier; and the example's taste drifts
  // from English-language films toward world cinema, so Insights has a change to find.
  const pick = (year, lang) => {
    const lo = Math.max(start, Date.UTC(year, 2, 1));
    let p = Math.pow(rand(), 0.8);
    p = lang === "English" ? p * 0.8 : 0.35 + 0.65 * p;
    return lo + Math.floor(p * (end - lo) / day) * day;
  };
  const logDate = (t) => iso(t + (rand() < 0.25 ? (1 + Math.floor(rand() * 5)) * day : 0));
  const rows = { profile: [{ Username: "example" }], watched: [], ratings: [], diary: [], likes: [], reviews: [] };
  const meta = {};
  const split = (s) => s ? s.split("|") : [];
  EXAMPLE_FILMS.forEach((f, i) => {
    const [name, year, rating, liked, d, c, g, k, l, r, w, p, m] = f;
    const base = { Name: name, Year: String(year), "Letterboxd URI": "" };
    rows.watched.push({ ...base, Date: iso(start) });
    rows.ratings.push({ ...base, Rating: String(rating) });
    if (liked) rows.likes.push(base);
    const crowd = EXAMPLE_CROWD[name] || [];
    meta[filmKey(name, year)] = { src: "example", d: split(d), c: split(c), g: split(g), k: split(k), l, r, w: split(w), p: split(p), m: split(m), va: crowd[0], vc: crowd[1] };
    if (i % 9 === 4) return; // logged as watched without a diary date
    const first = pick(year, l);
    rows.diary.push({ ...base, Date: logDate(first), "Watched Date": iso(first), Rating: String(rating), Rewatch: "", Tags: "" });
    if (rating >= 4.5 && rand() < 0.55) {
      const again = first + Math.floor(rand() * (end - first) / day) * day;
      if (again > first) rows.diary.push({ ...base, Date: logDate(again), "Watched Date": iso(again), Rating: String(rating), Rewatch: "Yes", Tags: "" });
    }
    if (EXAMPLE_REVIEWS[name]) rows.reviews.push({ ...base, Date: logDate(first), "Watched Date": iso(first), Rating: String(rating), Review: EXAMPLE_REVIEWS[name] });
  });
  for (const [name, year, d, c, g, k, l, r, w, p, m, va, vc] of EXAMPLE_EXTRA)
    meta[filmKey(name, year)] = { src: "example", d: split(d), c: split(c), g: split(g), k: split(k), l, r, w: split(w), p: split(p), m: split(m), va, vc };
  rows.watchlist = EXAMPLE_WATCHLIST.map(([Name, Year]) => ({ Name, Year: String(Year) }));
  return { rows, meta };
}

/* Two made-up members for Compare: one leans to horror and science fiction, one to comedy and romance.
   They rate the example films from the "you" diary's ratings, nudged by their tastes, and each has
   seen a few films "you" haven't. */
function buildExampleFriends() {
  let seed = 7;
  const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const half = (x) => Math.min(5, Math.max(0.5, Math.round(x * 2) / 2));
  const iso = (t) => new Date(t).toISOString().slice(0, 10);
  const people = [
    { id: "ex-a", name: "Friend A", likes: ["Horror", "Science Fiction", "Thriller", "Crime"], dislikes: ["Romance", "Family"], keep: 0.55,
      extra: ["Hereditary", "The Thing", "Alien", "Heat", "The Shining", "Midsommar"], watchlist: ["Seven Samurai", "Paddington 2"] },
    { id: "ex-b", name: "Friend B", likes: ["Comedy", "Romance", "Animation", "Family"], dislikes: ["Horror", "Thriller"], keep: 0.5,
      extra: ["Amélie", "Superbad", "Paddington 2", "Seven Samurai"], watchlist: ["The Thing", "The Shining"] },
  ];
  const films = [...EXAMPLE_FILMS.map((f) => ({ name: f[0], year: f[1], base: f[2], g: f[6].split("|"), extra: false })),
    ...EXAMPLE_EXTRA.map((f) => ({ name: f[0], year: f[1], base: f[11] / 2, g: f[4].split("|"), extra: true }))];
  return people.map((P) => {
    const rows = { profile: [{ Username: P.name }], watched: [], ratings: [], diary: [], likes: [], reviews: [], watchlist: [] };
    for (const f of films) {
      const taste = (f.g.some((g) => P.likes.includes(g)) ? 1 : 0) - (f.g.some((g) => P.dislikes.includes(g)) ? 1 : 0);
      if (f.extra ? !P.extra.includes(f.name) : rand() > P.keep + 0.2 * taste) continue;
      const rating = half(f.base + (taste > 0 ? 1 : taste < 0 ? -1.5 : 0) + (rand() < 0.3 ? -0.5 : rand() < 0.3 ? 0.5 : 0));
      const lo = Math.max(Date.UTC(2022, 0, 1), Date.UTC(f.year, 2, 1)), hi = Date.UTC(2026, 9, 15);
      const date = iso(lo + Math.floor(rand() * (hi - lo) / 864e5) * 864e5);
      const base = { Name: f.name, Year: String(f.year) };
      rows.watched.push(base);
      rows.ratings.push({ ...base, Rating: String(rating) });
      rows.diary.push({ ...base, Date: date, "Watched Date": date, Rating: String(rating), Rewatch: "" });
      if (rating >= 4.5) rows.likes.push(base);
    }
    rows.watchlist = P.watchlist.map((n) => { const f = films.find((x) => x.name === n); return { Name: f.name, Year: String(f.year) }; });
    return { id: P.id, name: P.name, example: true, rows };
  });
}

<script>
/* ---------- small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtN = (n) => Number(n || 0).toLocaleString("en-US");
const plural = (n, one, many = one + "s") => `${fmtN(n)} ${n === 1 ? one : many}`;
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const WEEKDAYS_LONG = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const fmtDate = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; };
const stars = (r) => r ? "★".repeat(Math.floor(r)) + (r % 1 ? "½" : "") : "";
const avg = (a) => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const filmKey = (name, year) => `${String(name).trim().toLowerCase()}|${year || ""}`;
const personKey = (n) => String(n).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const dayIndex = (iso) => Math.floor(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) / 864e5);
const weekdayOf = (iso) => (new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7; // Monday = 0

const store = {
  get(k, fallback) { try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const KEYS = { rows: "cr-rows-v1", meta: "cr-meta-v1", photos: "cr-photos-v1", tmdb: "cr-tmdb-key", omdb: "cr-omdb-key", apify: "cr-apify-key", lbx: "cr-letterboxd-v1", lbRun: "cr-letterboxd-run", friends: "cr-friends-v1", view: "cr-view-v1" };

/* ---------- reading a Letterboxd export ---------- */
const WANTED = {
  diary: /(^|\/)diary\.csv$/i, watched: /(^|\/)watched\.csv$/i, ratings: /(^|\/)ratings\.csv$/i,
  reviews: /(^|\/)reviews\.csv$/i, likes: /(^|\/)likes\/films\.csv$/i, watchlist: /(^|\/)watchlist\.csv$/i,
  profile: /(^|\/)profile\.csv$/i,

const LOOSE_LIKES = /^films\.csv$/i; // likes/films.csv dropped on its own

function parseCsv(text) {
  const out = Papa.parse(text.replace(/^﻿/, ""), { header: true, skipEmptyLines: true });
  const rows = out.data.filter((r) => r && r.Name);
  rows.fields = (out.meta && out.meta.fields) || Object.keys(out.data[0] || {});

}
// Keep only the columns the stats use, so the saved copy stays small.
function slim(kind, rows) {
  const pick = (r, cols) => Object.fromEntries(cols.map((c) => [c, r[c] ?? ""]));
  const base = ["Name", "Year"];
  switch (kind) {
    case "diary": return rows.map((r) => pick(r, [...base, "Date", "Watched Date", "Rating", "Rewatch", "Tags"]));
    case "watched": return rows.map((r) => pick(r, [...base, "Date", "Letterboxd URI"]));
    case "ratings": return rows.map((r) => pick(r, [...base, "Rating"]));
    case "reviews": return rows.map((r) => pick(r, [...base, "Date", "Watched Date", "Rating", "Rewatch", "Review", "Tags"]));
    case "likes": case "watchlist": return rows.map((r) => pick(r, base));
    default: return rows;
  }
}

async function readExport(fileList) {
  if (!window.Papa) throw new Error("The CSV reader didn't load. Check your internet connection and reload the page.");
  const rows = { diary: [], watched: [], ratings: [], reviews: [], likes: [], watchlist: [], profile: [], files: [] };
  let found = 0;
  // Besides the files at the top, an export has lists/, deleted/, orphaned/ and likes/ folders, and
  // likes/ holds a reviews.csv of other people's reviews you liked. Only likes/films.csv counts from those.
  const take = (path, text) => {
    if (/(^|\/)(deleted|orphaned|lists)\//i.test(path)) return;
    const inLikes = /(^|\/)likes\//i.test(path);
    for (const [kind, re] of Object.entries(WANTED)) {
      if (inLikes && kind !== "likes") continue;
      if (re.test(path) || (kind === "likes" && LOOSE_LIKES.test(path))) {
        const parsed = kind === "profile" ? Papa.parse(text.replace(/^﻿/, ""), { header: true, skipEmptyLines: true }).data : parseCsv(text);
        if (kind === "reviews" && !parsed.fields.includes("Review")) return; // not your own reviews
        if (!parsed.length && rows[kind].length) return; // keep what an earlier copy of the file had
        rows[kind] = slim(kind, parsed); found++;
        rows.files.push((inLikes ? "likes/" : "") + path.split("/").pop().toLowerCase());
        return;
      }
    }
  };
  for (const file of fileList) {
    if (/\.zip$/i.test(file.name) || file.type.includes("zip")) {
      if (!window.JSZip) throw new Error("The ZIP reader didn't load. Check your connection, or unzip the export and import diary.csv, watched.csv and ratings.csv.");
      const zip = await JSZip.loadAsync(file);
      for (const entry of Object.values(zip.files)) {
        if (!entry.dir && /\.csv$/i.test(entry.name)) take(entry.name, await entry.async("string"));
      }
    } else if (/\.csv$/i.test(file.name)) {
      take(file.name, await file.text());
    }
  }
  if (!rows.watched.length && !rows.diary.length && !rows.ratings.length) {
    throw new Error(found
      ? "Those files have no films in them. Import the whole export ZIP, or at least diary.csv and watched.csv."
      : "That doesn't look like a Letterboxd export. Import the ZIP you get from Settings → Data → Export your data.");
  }
  return rows;
}

// Letterboxd keeps reviews with some HTML. Keep the formatting people use (paragraphs, line breaks,
// italics, bold, quotes, lists, links) and drop everything else but its text, so a review shows as
// written and nothing in it can run. A plain-text copy is kept for search and word counts.
const REVIEW_TAGS = new Set(["P", "BR", "I", "EM", "B", "STRONG", "U", "S", "STRIKE", "BLOCKQUOTE", "UL", "OL", "LI", "A"]);
function reviewParts(raw) {
  if (!raw) return { html: "", text: "" };
  const doc = new DOMParser().parseFromString(String(raw).replace(/\r\n?/g, "\n"), "text/html");
  const clean = (node) => {
    let out = "";
    for (const n of node.childNodes) {
      if (n.nodeType === 3) { out += esc(n.nodeValue).replace(/\n/g, "<br>"); continue; }
      if (n.nodeType !== 1) continue;
      const tag = n.tagName;
      if (tag === "SCRIPT" || tag === "STYLE") continue;
      const inner = clean(n);
      if (tag === "BR") out += "<br>";
      else if (!REVIEW_TAGS.has(tag)) out += inner;
      else if (tag === "A") { const href = n.getAttribute("href") || ""; out += /^https?:\/\//i.test(href) ? `<a href="${esc(href)}" target="_blank" rel="noopener nofollow">${inner}</a>` : inner; }
      else { const t = tag === "STRIKE" ? "s" : tag.toLowerCase(); out += `<${t}>${inner}</${t}>`; }
    }
    return out;
  };
  const html = clean(doc.body).replace(/^(<br>)+|(<br>)+$/g, "").trim();
  const text = html.replace(/<br>/g, "\n").replace(/<\/(p|blockquote|li)>/g, "\n\n").replace(/<[^>]+>/g, "")
    .replace(/&(amp|lt|gt|quot|#39);/g, (m, e) => ({ amp: "&", lt: "<", gt: ">", quot: '"', "#39": "'" }[e])).replace(/\n{3,}/g, "\n\n").trim();
  return { html, text };
}

/* ---------- the library: one record per film, one per diary entry ---------- */
function buildLibrary(input) {
  const rows = { diary: [], watched: [], ratings: [], reviews: [], likes: [], watchlist: [], profile: [], ...input };
  const films = new Map();
  const get = (r) => {
    const k = filmKey(r.Name, r.Year);
    let f = films.get(k);
    if (!f) { f = { key: k, name: String(r.Name).trim(), year: parseInt(r.Year, 10) || null, rating: null, liked: false, entries: [], reviews: 0, uri: "" }; films.set(k, f); }
    if (!f.uri && /^https?:\/\//.test(r["Letterboxd URI"] || "")) f.uri = r["Letterboxd URI"];
    return f;
  };
  // Watched films and diary entries decide what counts as seen. Likes and reviews only mark films
  // already in it: Letterboxd lets you like a film you never logged.
  const find = (r) => films.get(filmKey(r.Name, r.Year));
  rows.watched.forEach(get);
  const rated = rows.watched.length ? find : get; // without watched.csv, a rating is the only sign of a watch
  for (const r of rows.ratings) { const v = parseFloat(r.Rating); const f = v && rated(r); if (f) f.rating = v; }
  const entries = [];
  rows.diary.forEach((r, i) => {
    const date = r["Watched Date"] || r.Date;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date || "")) return;
    const f = get(r);
    const logged = /^\d{4}-\d{2}-\d{2}$/.test(r.Date || "") ? r.Date : null;
    const e = { film: f, date, logged, rating: parseFloat(r.Rating) || null, rewatch: /^yes$/i.test(r.Rewatch || ""), order: i, review: false };
    f.entries.push(e); entries.push(e);
  });
  for (const r of rows.likes) { const f = find(r); if (f) f.liked = true; }
  const reviews = [];
  for (const r of rows.reviews) {
    const f = find(r);
    if (!f) continue;
    f.reviews++;
    const d = r["Watched Date"] || r.Date;
    const e = f.entries.find((x) => x.date === d) || f.entries[f.entries.length - 1];
    if (e) e.review = true;
    const { html, text } = reviewParts(r.Review);
    reviews.push({ film: f, date: /^\d{4}-\d{2}-\d{2}$/.test(d || "") ? d : null, rating: parseFloat(r.Rating) || f.rating || null,
      html, text, words: text ? text.split(/\s+/).length : 0, tags: r.Tags || "", rewatch: /^yes$/i.test(r.Rewatch || "") });
  }
  reviews.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  entries.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.order - b.order);
  for (const f of films.values()) {
    f.entries.sort((a, b) => a.date < b.date ? -1 : 1);
    if (!f.rating) { const rated = f.entries.filter((e) => e.rating); if (rated.length) f.rating = rated[rated.length - 1].rating; }
  }
  const p = rows.profile[0] || {};
  return {
    films: [...films.values()], entries, reviews,
    // a saved import from before review text was kept: the reviews are counted but their words are missing
    reviewTextMissing: reviews.length > 0 && reviews.every((r) => !r.text),
    profile: { username: p.Username || "", joined: (p["Date Joined"] || "").slice(0, 10), name: [p["Given Name"], p["Family Name"]].filter(Boolean).join(" ") },
    watchlist: rows.watchlist.length,
    watchlistFilms: rows.watchlist.map((r) => ({ key: filmKey(r.Name, r.Year), name: String(r.Name).trim(), year: parseInt(r.Year, 10) || null })),
  };
}

// One line saying what an import brought in, so a missing part (say, reviews) is easy to spot.
function importSummary(rows, lib) {
  const skipped = rows.reviews.length - lib.reviews.length;
  const files = rows.files || [];
  const reviews = !rows.reviews.length ? (files.includes("reviews.csv") ? "no reviews (reviews.csv in this export is empty)"
      : `no reviews, because there was no reviews.csv among the files read (${files.join(", ")})`)
    : `${plural(lib.reviews.length, "review")}${skipped > 0 ? ` (${plural(skipped, "review")} for films not in your watched list left out)` : ""}`;
  return `Imported ${plural(lib.films.length, "film")}, ${plural(lib.entries.length, "diary entry", "diary entries")} and ${reviews}.`;
}

/* ---------- metadata: one shape whether it came from TMDB, Claude or the example ---------- */
const COUNTRY_ALIASES = {
  "united states of america": "USA", "united states": "USA", "us": "USA", "u.s.": "USA", "u.s.a.": "USA", "america": "USA",
  "united kingdom": "UK", "great britain": "UK", "england": "UK", "u.k.": "UK", "britain": "UK",
  "korea, republic of": "South Korea", "republic of korea": "South Korea", "korea": "South Korea",
  "russian federation": "Russia", "czech republic": "Czechia", "hong kong sar china": "Hong Kong",
  "people's republic of china": "China", "iran, islamic republic of": "Iran", "west germany": "Germany",
};
const country = (c) => { const t = String(c).trim(); return COUNTRY_ALIASES[t.toLowerCase()] || t; };
let langNames = null;
try { langNames = new Intl.DisplayNames(["en"], { type: "language" }); } catch {}
const LANG_FIX = { cn: "Cantonese", zh: "Mandarin", xx: "No language" };
function language(l) {
  const t = String(l || "").trim();
  if (!t) return "";
  if (/^[a-z]{2}$/i.test(t)) return LANG_FIX[t.toLowerCase()] || (langNames ? langNames.of(t.toLowerCase()) : t);
  return t === "Chinese" ? "Mandarin" : t;
}
const GENRES = ["Action", "Adventure", "Animation", "Comedy", "Crime", "Documentary", "Drama", "Family", "Fantasy", "History", "Horror", "Music", "Mystery", "Romance", "Science Fiction", "Thriller", "TV Movie", "War", "Western"];
function cleanMeta(m) {
  const list = (a, n = 20) => [...new Set((Array.isArray(a) ? a : []).map((x) => String(x).trim()).filter(Boolean))].slice(0, n);
  const genre = (g) => g === "Sci-Fi" ? "Science Fiction" : g;
  return {
    src: m.src, v: m.v || null, id: m.id || null, poster: m.poster || null,
    d: list(m.d, 6), c: list(m.c, 15), w: list(m.w, 6), p: list(m.p, 4), m: list(m.m, 4),
    g: list((m.g || []).map(genre).filter((g) => GENRES.includes(g)), 6),
    k: list((m.k || []).map(country), 6), l: language(m.l), r: Math.round(Number(m.r)) || null,
    va: Number(m.va) || null, vc: Number(m.vc) || null, // TMDB audience score out of 10, and how many votes
    im: /^tt\d+$/.test(m.im || "") ? m.im : null, // IMDb id, for IMDb scores from OMDb
    ir: Number(m.ir) || null, iv: Number(m.iv) || null, mc: Number(m.mc) || null, rt: Number(m.rt) || null, om: m.om || null, // IMDb, Metacritic, Rotten Tomatoes
  };
}

/* ---------- stats ---------- */
const CAST_DEPTH = 15; // top-billed cast counted per film

function inScope(lib, scope) {
  if (scope === "all") return { films: lib.films, entries: lib.entries };
  const entries = lib.entries.filter((e) => e.date.startsWith(scope));
  return { films: [...new Set(entries.map((e) => e.film))], entries };
}

function rankPeople(films, metaOf, role, minRated) {
  const map = new Map();
  for (const f of films) {
    const m = metaOf(f);
    if (!m || !m[role]) continue;
    const names = role === "c" ? m.c.slice(0, CAST_DEPTH) : m[role];
    const seen = new Set();
    for (const name of names) {
      const k = personKey(name);
      if (!k || seen.has(k)) continue;
      seen.add(k);
      let p = map.get(k);
      if (!p) { p = { key: k, name, films: [], ratings: [] }; map.set(k, p); }
      p.films.push(f);
      if (f.rating) p.ratings.push(f.rating);
    }
  }
  const all = [...map.values()].map((p) => ({ ...p, count: p.films.length, avg: avg(p.ratings) }));
  const most = [...all].sort((a, b) => b.count - a.count || (b.avg || 0) - (a.avg || 0) || a.name.localeCompare(b.name));
  const best = all.filter((p) => p.ratings.length >= minRated)
    .sort((a, b) => b.avg - a.avg || b.ratings.length - a.ratings.length || a.name.localeCompare(b.name));
  return { most, best, total: all.length };
}

function rankCategory(films, metaOf, field) {
  const map = new Map();
  for (const f of films) {
    const m = metaOf(f);
    if (!m) continue;
    const vals = field === "l" ? (m.l ? [m.l] : []) : m[field] || [];
    for (const v of vals) {
      let c = map.get(v);
      if (!c) { c = { key: v, name: v, films: [], ratings: [] }; map.set(v, c); }
      c.films.push(f); if (f.rating) c.ratings.push(f.rating);
    }
  }
  const all = [...map.values()].map((c) => ({ ...c, count: c.films.length, avg: avg(c.ratings) }));
  return {
    most: [...all].sort((a, b) => b.count - a.count || a.name.localeCompare(b.name)),
    best: all.filter((c) => c.ratings.length >= 3).sort((a, b) => b.avg - a.avg || b.count - a.count),
  };
}

function longestStreak(entries) {
  const days = [...new Set(entries.map((e) => dayIndex(e.date)))].sort((a, b) => a - b);
  let best = 0, run = 0, prev = null, endDay = null;
  for (const d of days) { run = prev !== null && d === prev + 1 ? run + 1 : 1; if (run > best) { best = run; endDay = d; } prev = d; }
  return { days: best, end: endDay };
}

function computeStats(lib, metaOf, scope) {
  const { films, entries } = inScope(lib, scope);
  const viewsOf = (f) => Math.max(1, scope === "all" ? f.entries.length : f.entries.filter((e) => e.date.startsWith(scope)).length);
  const withMeta = films.filter((f) => metaOf(f));
  let minutes = 0, timed = 0;
  for (const f of films) { const m = metaOf(f); if (m && m.r) { minutes += m.r * viewsOf(f); timed++; } }
  const rated = films.filter((f) => f.rating);
  const spread = Array.from({ length: 10 }, (_, i) => ({ r: (i + 1) / 2, count: 0 }));
  for (const f of rated) { const i = Math.round(f.rating * 2) - 1; if (spread[i]) spread[i].count++; }

  // activity
  const byDay = new Map();
  for (const e of entries) byDay.set(e.date, (byDay.get(e.date) || 0) + 1);
  const weekday = Array(7).fill(0);
  for (const e of entries) weekday[weekdayOf(e.date)]++;
  const byMonth = new Map();
  for (const e of entries) byMonth.set(e.date.slice(0, 7), (byMonth.get(e.date.slice(0, 7)) || 0) + 1);
  let busiestMonth = null;
  for (const [k, v] of byMonth) if (!busiestMonth || v > busiestMonth.count) busiestMonth = { key: k, count: v };
  let busiestDay = null;
  for (const [k, v] of byDay) if (!busiestDay || v > busiestDay.count) busiestDay = { key: k, count: v };

  // release decades
  const dec = new Map();
  for (const f of films) {
    if (!f.year) continue;
    const d = Math.floor(f.year / 10) * 10;
    let x = dec.get(d); if (!x) { x = { decade: d, films: [], ratings: [] }; dec.set(d, x); }
    x.films.push(f); if (f.rating) x.ratings.push(f.rating);
  }
  const decades = [...dec.values()].map((x) => ({ ...x, count: x.films.length, avg: avg(x.ratings),
    top: [...x.films].filter((f) => f.rating).sort((a, b) => b.rating - a.rating || b.entries.length - a.entries.length).slice(0, 5) }))
    .sort((a, b) => a.decade - b.decade);

  const minRated = films.length >= 150 ? 3 : 2;
  return {
    scope, films, entries, withMeta: withMeta.length, minRated,
    minutes, timed,
    avgRating: avg(rated.map((f) => f.rating)), rated: rated.length, spread,
    rewatches: entries.filter((e) => e.rewatch).length,
    reviews: scope === "all" ? films.reduce((s, f) => s + f.reviews, 0) : entries.filter((e) => e.review).length,
    likes: films.filter((f) => f.liked).length,
    byDay, byMonth, weekday, busiestMonth, busiestDay, streak: longestStreak(entries),
    decades,
    cast: rankPeople(films, metaOf, "c", minRated), directors: rankPeople(films, metaOf, "d", minRated),
    writers: rankPeople(films, metaOf, "w", minRated), dop: rankPeople(films, metaOf, "p", minRated), music: rankPeople(films, metaOf, "m", minRated),
    genres: rankCategory(films, metaOf, "g"), countries: rankCategory(films, metaOf, "k"), languages: rankCategory(films, metaOf, "l"),
    newReleases: scope === "all" ? null : films.filter((f) => String(f.year) === scope).length,
  };
}
</script>
<script>
/* ---------- cast & crew lookups ----------
   Opened as a file in a normal browser, the page calls TMDB with the viewer's own key.
   Inside the Claude app the page can't reach other sites, so Claude fills in the details. */
const IN_VIEWER = typeof window.claude === "object" && window.claude !== null;
let META = store.get(KEYS.meta, {});
let PHOTOS = store.get(KEYS.photos, {});
let EXAMPLE_META = {};
// A personal downloaded copy gets its owner's TMDB key written in here at build time; published pages leave it empty.
const BUILT_IN_TMDB_KEY = "" /*TMDB_KEY*/;
const tmdbKey = () => store.get(KEYS.tmdb, "") || BUILT_IN_TMDB_KEY;
let editKey = false;
let sampleFn = null;
let sampleState = IN_VIEWER ? "pending" : "absent"; // pending | ready | off | absent
const job = { running: false, kind: null, ctl: null, done: 0, total: 0, failed: 0, note: "", err: false, saveFailed: false, badKey: false };

if (IN_VIEWER && typeof window.claude.use === "function") {
  window.claude.use("sample").then((s) => { sampleFn = s; sampleState = s ? "ready" : "absent"; renderLookup(); })
    .catch(() => { sampleState = "absent"; renderLookup(); });
}

function saveMeta() {
  const ok = store.set(KEYS.meta, META) && store.set(KEYS.photos, PHOTOS);
  job.saveFailed = !ok;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function needsLookup(lib, kind) {

async function tmdbGet(path, params, key, signal) {

function pickHit(results, f, tolerance, needTitle) {

  const titled = (r) => personKey(r.title || "") === want || personKey(r.original_title || "") === want;

    .filter((r) => !f.year || !yearOf(r) || Math.abs(yearOf(r) - f.year) <= tolerance)
    .map((r) => ({ r, score: (titled(r) ? 1000 : 0) + Math.log10((r.vote_count || 0) + 1) * 100 + (yearOf(r) === f.year ? 50 : 0) - (r.video ? 100 : 0) }))

/* ---------- helpers and charts shared by the desktop and phone pages ---------- */
const initials = (name) => name.replace(/[^\p{L}\s-]/gu, "").split(/[\s-]+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();

// A small link to the TMDB page a film was matched to, so a wrong match is easy to spot.
const tmdbLink = (f) => {
  const m = f && META[f.key];
  return m && m.src === "tmdb" && m.id && !IN_VIEWER ? ` <a class="tmdb-link" href="https://www.themoviedb.org/movie/${m.id}" target="_blank" rel="noopener" title="See the film this was matched to on TMDB">TMDB ↗</a>` : "";
};
const isoOfDay = (d) => new Date(d * 864e5).toISOString().slice(0, 10);
function niceTick(max) {
  const raw = max * 0.8, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  return Math.max(1, (n >= 5 ? 5 : n >= 2 ? 2 : 1) * p);
}
const personSub = (p) => `${plural(p.count, "film")}${p.avg ? ` · ${p.avg.toFixed(2)} average from ${plural(p.ratings.length, "rating")}` : ""}`;

/* ---------- column chart: weeks, months, years, ratings, decades ---------- */
function colChart(cols, aria, legend, H = 162) {
  const max = Math.max(1, ...cols.map((c) => c.a + (c.b || 0)));
  const tick = niceTick(max);
  const bars = cols.map((c) => {
    const segs = [];
    if (c.a) segs.push(`<div class="seg a" style="height:${(c.a / max * 100).toFixed(2)}%"></div>`);
    if (c.b) segs.push(`<div class="seg b" style="height:${(c.b / max * 100).toFixed(2)}%"></div>`);

    return c.to ? `<button class="col" type="button" ${dl(c.to)} data-tip="${esc(c.tip)}" aria-label="${esc(c.tip)}">${segs.join("")}</button>`
      : `<div class="col" data-tip="${esc(c.tip)}">${segs.join("")}</div>`;

    <div class="cols" style="height:${H + 8}px" role="img" aria-label="${esc(aria)}">${bars}</div></div><div class="axis" aria-hidden="true">${axis}</div>`;
}
function timeline(s) {

    c.tip = `${c.tipLabel}: ${plural(c.a + c.b, "film")}${c.b ? ` (${plural(c.b, "rewatch", "rewatches")})` : ""}`;

  const cells = [], months = [];
  for (let i = 0; i < pad; i++) cells.push('<i class="pad"></i>');
  for (let d = start; d <= end; d++) {

    <div class="heat-key" aria-hidden="true">Fewer <i></i><i style="background:var(--heat-1)"></i><i style="background:var(--heat-2)"></i><i style="background:var(--heat-3)"></i> More</div>`;
}
