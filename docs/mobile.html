<style>
/* Layout: a phone app in the style of the Letterboxd app, brought up to date. A see-through header that frosts
   over as you scroll, a profile with a poster backdrop, big numbers, rounded cards, year chips that stay in reach,
   five tabs, screens that slide in and sheets that slide up (and swipe away). Dark only, like the app.
   On wide screens the app sits in a centred column. */
:root {
  --bg: #14181C;
  --bg-deep: #0D1013;
  --surface: #1C2329;
  --surface-2: #252E37;
  --surface-3: #303B46;
  --line: rgba(255, 255, 255, .07);
  --line-2: rgba(255, 255, 255, .12);
  --ink: #FFFFFF;
  --ink-1: #D9E2EA;
  --ink-2: #9BABBB;
  --muted: #8A9BAC;
  --green: #00E054;
  --green-mark: #00B848;
  --green-tint: rgba(0, 224, 84, .14);
  --blue: #40BCF4;
  --blue-mark: #2E95D3;
  --orange: #FF8000;
  --heart: #FF4757; /* a liked film's heart: red, bright enough to stand out on the dark screens */
  --hi: #F2C14E; /* the highest of a column in a table: gold */
  --lo: #B3A4FF; /* and the lowest: purple */
  --slate-mark: #5E7387;
  --heat-1: #0E5C2C;
  --heat-2: #13873F;
  --heat-3: #2FC266;
  --danger: #FF7A7A;
  --frame: rgba(255, 255, 255, .1);
  --glass: rgba(20, 24, 28, .86);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Roboto, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --top: env(safe-area-inset-top, 0px);
  --bottom: env(safe-area-inset-bottom, 0px);
  --navbar: 52px;
  --chips: 52px;
  --tabbar: 58px;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  color-scheme: dark;
}
html:root { padding: 0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink-2); font-family: var(--sans); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overscroll-behavior-y: none; }
button, input { font: inherit; color: inherit; }
a { color: var(--blue); text-decoration: none; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.dim { color: var(--muted); }
svg { flex: none; }

.app { max-width: 520px; margin: 0 auto; min-height: 100vh; position: relative; }
@media (min-width: 560px) { .app { border-inline: 1px solid var(--line); } }
.screen {
  padding: calc(var(--top) + var(--navbar)) var(--gutter) calc(var(--tabbar) + var(--bottom) + 32px);
  min-height: 100vh;
}
.screen.enter-push { animation: push-in .32s var(--ease); }
.screen.enter-pop { animation: pop-in .32s var(--ease); }
.screen.enter-tab { animation: tab-in .24s ease-out; }
@keyframes push-in { from { transform: translateX(36px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop-in { from { transform: translateX(-36px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes tab-in { from { opacity: .3; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- header: clear over the top of a screen, frosted once you scroll ---------- */
.top { position: fixed; z-index: 30; inset: 0 0 auto; padding-top: var(--top); pointer-events: none; }
.top::before { content: ""; position: absolute; inset: 0; background: var(--glass); -webkit-backdrop-filter: saturate(170%) blur(20px); backdrop-filter: saturate(170%) blur(20px);
  border-bottom: 1px solid var(--line); opacity: 0; transition: opacity .2s; }
.top.solid::before, .top.detail::before { opacity: 1; }
.nav { position: relative; max-width: 520px; margin: 0 auto; height: var(--navbar); display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px;
  padding-inline: max(10px, env(safe-area-inset-left, 0px)); }
.nav h1 { color: var(--ink); font-size: 16.5px; font-weight: 700; letter-spacing: -.01em; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 58vw;
  opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s; }
.top.solid .nav h1, .top.detail .nav h1 { opacity: 1; transform: none; }
.nav .left { justify-self: start; display: flex; gap: 6px; pointer-events: auto; } .nav .right { justify-self: end; display: flex; gap: 6px; pointer-events: auto; }
.nav-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer; color: var(--ink);
  background: rgba(30, 37, 44, .55); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transition: transform .15s, background .15s; }
.top.solid .nav-btn, .top.detail .nav-btn { background: transparent; }
.nav-btn:active { transform: scale(.9); background: var(--surface-3); }
.nav-btn svg { width: 21px; height: 21px; }
.nav-btn.text { width: auto; border-radius: 999px; padding: 0 12px; font-size: 15px; font-weight: 600; color: var(--green); }

/* ---------- large titles, year chips, sub-tabs ---------- */
.lt { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 6px 0 4px; }
.ltitle { color: var(--ink); font-size: 32px; font-weight: 800; letter-spacing: -.025em; line-height: 1.1; }
.lt-sub { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }
.scopes {
  position: sticky; top: calc(var(--top) + var(--navbar)); z-index: 20; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin-inline: calc(-1 * var(--gutter)); padding: 8px var(--gutter) 10px; background: linear-gradient(var(--bg) 70%, rgba(20, 24, 28, 0));
}
.top.solid ~ .screen .scopes, .screen .scopes.stuck { background: var(--bg); }
.scopes::-webkit-scrollbar, .chips::-webkit-scrollbar, .utabs::-webkit-scrollbar, .scroller::-webkit-scrollbar { display: none; }
.scope, .chip {
  all: unset; flex: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 15px; border-radius: 999px;
  font-size: 14px; font-weight: 600; color: var(--ink-1); background: var(--surface-2); transition: background .15s, color .15s, transform .15s; font-variant-numeric: tabular-nums;
}
.scope[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.scope:active, .chip:active { transform: scale(.95); }
.scope:focus-visible, .chip:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 4px calc(-1 * var(--gutter)) 0; padding: 4px var(--gutter); }
.chip { height: 32px; padding: 0 13px; font-size: 13.5px; background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--green-tint); box-shadow: inset 0 0 0 1px rgba(0, 224, 84, .45); color: var(--green); }
.chip .avatar { margin-left: -9px; }
.chip.add { color: var(--green); box-shadow: inset 0 0 0 1px rgba(0, 224, 84, .35); }
.chip svg { width: 16px; height: 16px; flex: none; margin: 0 5px 0 -3px; }
/* underlined sub-tabs, as the Letterboxd app does them */
.utabs { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; margin: 10px calc(-1 * var(--gutter)) 0; padding: 0 var(--gutter); border-bottom: 1px solid var(--line); }
.utab { all: unset; flex: none; cursor: pointer; padding: 10px 0 11px; font-size: 14px; font-weight: 600; color: var(--muted); position: relative; transition: color .15s; }
.utab[aria-pressed="true"] { color: var(--ink); }
.utab[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--green); }
.utab:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; padding: 3px; margin-top: 12px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.seg button { all: unset; cursor: pointer; text-align: center; padding: 8px 0; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--ink-2); transition: background .18s, color .18s; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
.seg button:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.seg.small { margin-top: 10px; max-width: 280px; }
.seg.small button { padding: 6px 0; font-size: 13px; }
.seg.five button { font-size: 12.5px; padding: 8px 2px; }

/* ---------- common pieces ---------- */
.sh { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 30px 0 12px; }
.sh h3 { color: var(--ink); font-size: 19px; font-weight: 750; letter-spacing: -.015em; line-height: 1.2; }
.sh .count, .sh .num { font-size: 14px; color: var(--ink-2); font-weight: 600; }
.more { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; color: var(--ink-2); font-size: 14px; font-weight: 600; white-space: nowrap; padding: 12px 0 12px 12px; margin: -12px 0 -12px -12px; } /* a 44px tap target that takes no more room */
.more svg { width: 14px; height: 14px; }
.more:active { color: var(--ink); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: 0; text-decoration: none;
  border-radius: 12px; padding: 13px 18px; font-weight: 650; font-size: 15.5px; background: var(--surface-3); color: var(--ink); transition: transform .15s, filter .15s;
}
.btn:active { transform: scale(.97); filter: brightness(1.15); }
.btn.green { background: var(--green-mark); color: #fff; }
.btn svg { width: 19px; height: 19px; }
.btn.block { width: 100%; }
.btn.small { padding: 9px 14px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: default; }
.card { background: var(--surface); border-radius: 18px; padding: 16px; display: grid; gap: 10px; box-shadow: inset 0 0 0 1px var(--line); }
.card + .card { margin-top: 12px; }
.card .title { color: var(--ink); font-weight: 700; font-size: 16px; }
.card.glow { background: radial-gradient(120% 140% at 0% 0%, rgba(0, 224, 84, .16), transparent 55%), var(--surface); }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card-h h4 { color: var(--ink); font-size: 15px; font-weight: 700; }
.card-h span { font-size: 13px; color: var(--ink-2); }
.status { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
.status.err { color: var(--danger); }
.note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.tmdb-link { font-size: 12px; font-weight: 500; color: var(--blue); white-space: nowrap; margin-left: 4px; }
.linkish { all: unset; cursor: pointer; color: var(--blue); font-weight: 600; }
.linkish:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.stars { color: var(--green); letter-spacing: .02em; white-space: nowrap; }
.heart { color: var(--heart); }
.rewatch { color: var(--blue); }
.chev { width: 16px; height: 16px; color: var(--muted); flex: none; }
.empty { color: var(--muted); padding: 18px 0; font-size: 14px; text-align: center; }
.meter { height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.meter > span { display: block; height: 100%; background: linear-gradient(90deg, var(--green-mark), var(--green)); width: 0; transition: width .4s var(--ease); }
.pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--bg); background: var(--ink-2); border-radius: 999px; padding: 3px 9px; }
.ico { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; flex: none; }
.ico svg { width: 19px; height: 19px; }
.ico.g { background: rgba(0, 224, 84, .14); color: var(--green); } .ico.o { background: rgba(255, 128, 0, .15); color: var(--orange); } .ico.r { background: rgba(255, 71, 87, .16); color: var(--heart); }
.ico.b { background: rgba(64, 188, 244, .15); color: var(--blue); } .ico.s { background: var(--surface-3); color: var(--ink-1); }
.lazy-more { height: 1px; }

/* ---------- avatars and posters ---------- */
.avatar {
  border-radius: 50%; display: grid; place-items: center; overflow: hidden; position: relative; flex: none;
  color: var(--ink-1); font-weight: 700; background: linear-gradient(150deg, var(--surface-3), var(--surface-2)); box-shadow: inset 0 0 0 1px var(--frame);
}
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
.avatar.xl { width: 92px; height: 92px; font-size: 30px; box-shadow: 0 0 0 3px var(--bg), 0 8px 28px rgba(0, 0, 0, .5); }
.avatar.lg { width: 68px; height: 68px; font-size: 21px; }
.avatar.md { width: 44px; height: 44px; font-size: 15px; }
.avatar.sm { width: 32px; height: 32px; font-size: 12px; }
.avatar.xs { width: 24px; height: 24px; font-size: 9.5px; }
img.fade { opacity: 0; transition: opacity .35s ease; }
img.fade.in { opacity: 1; }
.poster {
  position: relative; display: block; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 6px; overflow: hidden;
  background: linear-gradient(160deg, #2E3945, #1A2128); box-shadow: 0 6px 16px rgba(0, 0, 0, .35);
}
.poster::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--frame); pointer-events: none; }
.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.poster .ph { position: absolute; inset: 0; padding: 8px 7px; display: flex; flex-direction: column; justify-content: flex-end; color: var(--ink-1); font-size: 11px; font-weight: 650; line-height: 1.15; overflow-wrap: break-word; }
.poster .ph.long { font-size: 10px; } .poster .ph.xlong { font-size: 9px; }
.poster .ph small { color: var(--ink-2); font-weight: 400; font-size: 11px; margin-top: 2px; }
.pgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 10px; }
.pgrid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pitem { all: unset; cursor: pointer; display: grid; gap: 5px; min-width: 0; align-content: start; -webkit-tap-highlight-color: transparent; }
.pitem .poster { transition: transform .18s var(--ease); }
.pitem:active .poster { transform: scale(.95); }
.pitem:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 6px; }
.pmeta { display: flex; gap: 4px; align-items: center; font-size: 12px; min-height: 15px; }
.mlabel { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mdate { font-size: 12px; color: var(--muted); margin-top: -2px; line-height: 1.3; }
.scroller { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; margin-inline: calc(-1 * var(--gutter)); padding: 2px var(--gutter) 8px; scroll-padding-inline: var(--gutter); }
.scroller > * { scroll-snap-align: start; }
.scroller .pitem { flex: none; width: 96px; }
.pcard { all: unset; cursor: pointer; flex: none; width: 80px; display: grid; justify-items: center; gap: 6px; text-align: center; }
.pcard .avatar { transition: transform .18s var(--ease); }
.pcard:active .avatar { transform: scale(.93); }
.pcard .nm { color: var(--ink-1); font-size: 12.5px; font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pcard .ct { font-size: 12px; color: var(--ink-2); margin-top: -3px; }
/* a long name with no spaces breaks inside its own card instead of running into the next one */
.pcard .nm, .pod .nm { max-width: 100%; overflow-wrap: anywhere; }

/* ---------- profile ---------- */
.hero { position: relative; margin: calc(-1 * (var(--top) + var(--navbar))) calc(-1 * var(--gutter)) 0; padding: calc(var(--top) + var(--navbar) + 18px) var(--gutter) 6px; text-align: center; isolation: isolate; overflow: hidden; }
.hero-bg { position: absolute; inset: 0 0 auto; height: 300px; z-index: -1; display: flex; overflow: hidden;
  background: radial-gradient(40% 70% at 18% 30%, rgba(255, 128, 0, .28), transparent 70%), radial-gradient(40% 70% at 50% 20%, rgba(0, 224, 84, .24), transparent 70%), radial-gradient(40% 70% at 82% 30%, rgba(64, 188, 244, .28), transparent 70%), var(--bg-deep); }
.hero-bg img { flex: 1 1 0; min-width: 0; height: 100%; object-fit: cover; filter: blur(14px) saturate(1.3) brightness(.6); transform: scale(1.25); }
.hero-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(20, 24, 28, .15), rgba(20, 24, 28, .55) 55%, var(--bg)); }
.hero-in { display: grid; justify-items: center; gap: 4px; }
.hname { color: var(--ink); font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin-top: 10px; }
.hhandle { font-size: 14px; color: var(--ink-1); opacity: .85; min-height: 20px; }
.hstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; margin-top: 16px; padding: 12px 4px; border-radius: 18px;
  background: rgba(28, 35, 41, .72); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: inset 0 0 0 1px var(--line); }
.hstats > * { all: unset; display: grid; justify-items: center; gap: 1px; min-width: 0; cursor: default; padding: 2px; }
.hstats > button { cursor: pointer; border-radius: 12px; }
.hstats > button:active { background: var(--surface-2); }
.hstats > * + * { box-shadow: -1px 0 0 var(--line); }
.hstats b { color: var(--ink); font-size: 22px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.hstats span { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.tile { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 11px; padding: 12px; border-radius: 16px;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); transition: transform .15s var(--ease), background .15s; min-width: 0; }
.tile:active { transform: scale(.97); background: var(--surface-2); }
.tile:focus-visible { outline: 2px solid var(--blue); }
.tile b { display: block; color: var(--ink); font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile small { display: block; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notice { margin-top: 16px; }
.banner { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; margin-top: 14px; padding: 12px 14px;
  border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px rgba(0, 224, 84, .3); }
.banner b { color: var(--ink); font-size: 14.5px; display: block; } .banner small { color: var(--ink-2); font-size: 12.5px; display: block; }
.banner .meter { margin-top: 6px; }

/* ---------- lists ---------- */
.group { background: var(--surface); border-radius: 18px; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.group > * + * { box-shadow: 0 -1px 0 var(--line); }
.row {
  all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; color: var(--ink-1); font-size: 15.5px; transition: background .12s;
}
.row:active { background: var(--surface-2); }
.row:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.row .count { margin-left: auto; color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 14.5px; text-align: right; }
.row.danger { color: var(--danger); }
.row.switch .count { color: var(--ink-2); }
.toggle-ui { width: 44px; height: 26px; border-radius: 999px; background: var(--surface-3); position: relative; flex: none; margin-left: auto; transition: background .2s; }
.toggle-ui::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); }
.row[aria-checked="true"] .toggle-ui { background: var(--green-mark); }
.row[aria-checked="true"] .toggle-ui::after { transform: translateX(18px); }
.menu { list-style: none; margin: 0; padding: 0; }
.prow {
  all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 26px 44px minmax(0, 1fr) auto 14px;
  align-items: center; gap: 12px; padding: 10px 14px 10px 10px; transition: background .12s;
}
.prow:active { background: var(--surface-2); }
.prow:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.prow .rk { font-size: 13px; font-weight: 700; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.prow .nm { color: var(--ink); font-size: 15px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.prow .sub { font-size: 12.5px; color: var(--ink-2); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .val { color: var(--ink); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.prow.cat { grid-template-columns: minmax(0, 1fr) 34% 44px 14px; padding-left: 16px; }
.prow .chev { width: 14px; height: 14px; }
.mini { height: 6px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.mini span { display: block; height: 100%; background: linear-gradient(90deg, var(--green-mark), var(--green)); border-radius: 999px; }
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 8px; margin-top: 18px; }
.pod { all: unset; cursor: pointer; display: grid; justify-items: center; gap: 4px; text-align: center; padding: 14px 6px 12px; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); min-width: 0; transition: transform .15s var(--ease); }
.pod:active { transform: scale(.96); }
.pod.first { padding-top: 18px; background: radial-gradient(100% 80% at 50% 0%, rgba(0, 224, 84, .16), transparent 70%), var(--surface); }
.pod .rkb { font-size: 11px; font-weight: 800; color: var(--bg); background: var(--ink-2); border-radius: 999px; min-width: 20px; height: 20px; display: grid; place-items: center; margin-top: -16px; position: relative; z-index: 1; box-shadow: 0 0 0 3px var(--surface); }
.pod.first .rkb { background: var(--green); }
.pod .nm { color: var(--ink); font-size: 13px; font-weight: 700; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pod .ct { font-size: 12px; color: var(--ink-2); }
.pod .avatar.lg { width: 64px; height: 64px; }
.pod.first .avatar.lg { width: 76px; height: 76px; font-size: 24px; }

/* ---------- the best decade ---------- */
.decade-hero { position: relative; overflow: hidden; isolation: isolate; margin-top: 16px; gap: 6px; padding-bottom: 6px;
  background: radial-gradient(120% 120% at 0% 0%, rgba(0, 224, 84, .14), transparent 60%), var(--surface); }
.dh-bg { position: absolute; inset: 0; z-index: -1; display: flex; opacity: .55; }
.dh-bg img { flex: 1 1 0; min-width: 0; height: 100%; object-fit: cover; filter: blur(20px) saturate(1.3) brightness(.45); transform: scale(1.3); }
.dh-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(28, 35, 41, .2), var(--surface) 92%); }
.dh-k { font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--green); }
.dh-title { all: unset; cursor: pointer; display: grid; gap: 2px; }
.dh-dec { color: var(--ink); font-size: 34px; font-weight: 800; letter-spacing: -.025em; line-height: 1.05; }
.dh-sub { display: inline-flex; align-items: center; gap: 4px; font-size: 14.5px; color: var(--ink-1); }
.decade-hero .scroller { margin-top: 6px; }
.decade-run { gap: 4px; padding-bottom: 6px; }
.decade-run .dh-k { color: var(--ink-2); }
.dr-dec { color: var(--ink); font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.decade-run .dh-sub { font-size: 13.5px; }
.decade-run .scroller { margin-top: 6px; }
.decade-run .scroller .pitem { width: 76px; }
.drank { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 14px; gap: 12px; align-items: center; padding: 10px 14px 10px 12px; transition: background .12s; }
.drank:active { background: var(--surface-2); }
.drank:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.drank .rk { font-size: 13px; font-weight: 700; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.drank .nm { display: block; color: var(--ink); font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.drank .sub { display: block; font-size: 12.5px; color: var(--ink-2); }
.drank .chev { width: 14px; height: 14px; }
.mposters { display: flex; }
.mposters .poster { width: 32px; border-radius: 3px; box-shadow: 0 0 0 2px var(--surface), 0 3px 8px rgba(0, 0, 0, .35); }
.mposters .poster + .poster { margin-left: -9px; }
.mposters .poster .ph { display: none; }

/* ---------- diary ---------- */
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.facts > :last-child:nth-child(odd) { grid-column: 1 / -1; } /* a card left alone on the last row takes the whole row */
.fact { background: var(--surface); border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; box-shadow: inset 0 0 0 1px var(--line); }
.fact .k { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.fact .v { color: var(--ink); font-weight: 700; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.fact .t { font-size: 12.5px; color: var(--ink-2); line-height: 1.4; }
.month-h {
  position: sticky; top: calc(var(--top) + var(--navbar) + var(--chips)); z-index: 5; display: flex; justify-content: space-between;
  margin: 0 calc(-1 * var(--gutter)); padding: 14px var(--gutter) 8px; background: var(--bg);
  font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-1);
}
.month-h span:last-child { color: var(--muted); font-weight: 600; }
.drow { display: grid; grid-template-columns: 36px 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.drow .day { display: grid; justify-items: center; line-height: 1.05; }
.drow .day b { font-size: 21px; font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; }
.drow .day small { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.drow .poster { width: 42px; border-radius: 4px; box-shadow: 0 3px 8px rgba(0, 0, 0, .35); }
.drow .poster .ph { display: none; }
.drow .t { color: var(--ink); font-weight: 650; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.drow .t span { color: var(--ink-2); font-weight: 400; }
.drow .m { font-size: 12.5px; display: flex; gap: 6px; align-items: center; margin-top: 2px; }
.drow .icons { display: flex; gap: 7px; font-size: 14px; color: var(--muted); }
.drow .val { color: var(--ink); font-weight: 700; }

/* ---------- charts ---------- */
.chart { position: relative; margin-right: 28px; margin-top: 10px; }
.cols { position: relative; z-index: 1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: end; gap: 2px; border-bottom: 1px solid var(--line-2); padding-top: 8px; }
.col { height: 100%; display: flex; flex-direction: column-reverse; align-items: center; min-width: 0; }
.col .seg { width: 100%; max-width: 26px; border-radius: 0; }
.col .seg + .seg { margin-bottom: 2px; }
.col .seg.a { background: var(--green-mark); }
.col .seg.b { background: var(--blue-mark); }
.col .seg:last-child { border-radius: 4px 4px 1px 1px; }
.col:active .seg { filter: brightness(1.3); }
.chart.slate .col .seg.a { background: var(--slate-mark); }
.chart + .axis { margin-right: 28px; }
.axis { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; margin-top: 6px; }
.axis span { font-size: 11.5px; color: var(--muted); text-align: center; white-space: nowrap; }
.axis.dense span.minor { visibility: hidden; }
.gridline { position: absolute; left: 0; right: -28px; border-top: 1px dashed var(--line-2); pointer-events: none; }
.gridline span { position: absolute; right: 0; top: -8px; font-size: 11.5px; line-height: 16px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
.weekdays { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.wd { display: grid; gap: 5px; justify-items: center; }
.wd .bar-v { width: 100%; max-width: 28px; height: 70px; display: flex; align-items: flex-end; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.wd .bar-v span { display: block; width: 100%; background: var(--green-mark); border-radius: 6px 6px 0 0; }
.wd .lbl { font-size: 11.5px; font-weight: 600; color: var(--muted); }
.wd .cnt { font-size: 12.5px; font-weight: 700; color: var(--ink-1); font-variant-numeric: tabular-nums; }
.wd.fav .bar-v span { background: var(--green); }
.wd.fav .lbl { color: var(--ink); }
.cal-wrap { overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.cal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); grid-auto-columns: 11px; gap: 3px; width: max-content; }
.cal i { display: block; border-radius: 3px; background: var(--surface-2); }
.cal i.l1 { background: var(--heat-1); } .cal i.l2 { background: var(--heat-2); } .cal i.l3 { background: var(--heat-3); }
.cal i.pad { background: transparent; }
.cal-months { display: grid; grid-auto-flow: column; grid-auto-columns: 11px; gap: 3px; width: max-content; margin-bottom: 5px; }
.cal-months span { font-size: 11px; color: var(--muted); white-space: nowrap; width: 11px; }
.heat-key { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
.heat-key i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; background: var(--surface-2); }
.hist-ends { display: flex; justify-content: space-between; font-size: 12px; margin-top: 5px; }
.big-n { color: var(--ink); font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }

/* ---------- detail screens ---------- */
.dhead { display: grid; justify-items: center; gap: 4px; padding-top: 14px; text-align: center; }
.dhead .name { color: var(--ink); font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin-top: 8px; }
.dhead .sub { font-size: 14px; }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding-bottom: var(--bottom);
  background: var(--glass); -webkit-backdrop-filter: saturate(170%) blur(20px); backdrop-filter: saturate(170%) blur(20px); border-top: 1px solid var(--line);
}
.tabbar nav { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: var(--tabbar); padding-inline: 6px; }
.tabbar button { all: unset; cursor: pointer; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--muted); font-size: 11.5px; font-weight: 600; transition: color .15s; }
.tabbar .ti { display: grid; place-items: center; width: 54px; height: 30px; border-radius: 999px; transition: background .2s, transform .15s; }
.tabbar button svg { width: 23px; height: 23px; }
.tabbar button:active .ti { transform: scale(.9); }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button[aria-current="page"] .ti { background: rgba(255, 255, 255, .1); }
.tabbar button[aria-current="page"] svg .fill { fill: currentColor; }
.tabbar button[aria-current="page"] svg .cut { stroke: var(--bg); }
.tabbar button:focus-visible { outline: 2px solid var(--blue); outline-offset: -4px; border-radius: 12px; }

/* ---------- insights ---------- */
.icards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: row dense; gap: 10px; }
.icard { background: var(--surface); border-radius: 16px; padding: 13px 14px; display: grid; gap: 4px; align-content: start; box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.icard.wide { grid-column: 1 / -1; }
.icard .k { font-size: 12px; font-weight: 650; color: var(--ink-2); }
.icard .big { color: var(--ink); font-size: 20px; font-weight: 800; letter-spacing: -.015em; line-height: 1.2; overflow-wrap: anywhere; }
.icard .p { display: block; margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.lead { margin: 6px 0 0; color: var(--ink-1); font-size: 15px; line-height: 1.5; }
.tline { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; color: var(--ink-1); font-size: 14.5px; line-height: 1.45; border-bottom: 1px solid var(--line); }
.tline:last-child { border-bottom: 0; }
.tline .mk { font-size: 10px; flex: none; color: var(--ink-2); width: 12px; text-align: center; }
.tline .mk.up { color: var(--green); } .tline .mk.down { color: var(--blue); }
.lines { background: var(--surface); border-radius: 16px; padding: 4px 14px; box-shadow: inset 0 0 0 1px var(--line); }
/* the study: findings, chapters on a strip of time, trends with small charts */
.finds { background: var(--surface); border-radius: 16px; padding: 2px 14px; box-shadow: inset 0 0 0 1px var(--line); }
.find { display: grid; gap: 3px; padding: 11px 0; color: var(--ink-1); font-size: 14.5px; line-height: 1.45; border-bottom: 1px solid var(--line); }
.find:last-child { border-bottom: 0; }
.find .fk { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--green); }
.card.chap, .card.drift { gap: 6px; }
.chap .eyebrow { font-size: 11.5px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.chap .ctitle, .drift .ctitle { margin: 0; color: var(--ink); font-size: 19px; font-weight: 800; letter-spacing: -.015em; line-height: 1.2; }
.chap .ctitle .dlink, .drift .ctitle .dlink { text-decoration: none; }
.chap .ctext, .drift .ctext { margin: 0; color: var(--ink-1); font-size: 14.5px; line-height: 1.45; }
.chap .scroller { margin-top: 6px; margin-bottom: -6px; }
.drift .chart { margin-top: 4px; }
.drift .cols { height: 56px; }
.ch-strip { position: relative; height: 22px; margin: 0 0 26px; border-radius: 8px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.ch-strip .seg { all: unset; position: absolute; top: 3px; bottom: 3px; border-radius: 5px; background: var(--green-mark); min-width: 4px; cursor: pointer; }
.ch-strip .yr { position: absolute; top: 0; bottom: -16px; border-left: 1px solid var(--line); pointer-events: none; }
.ch-strip .yr i { position: absolute; bottom: 0; left: 3px; font-size: 11px; font-style: normal; color: var(--muted); }
.mgrid-card { padding: 10px 8px; }
.mgrid { border-collapse: separate; border-spacing: 2px; width: 100%; font-variant-numeric: tabular-nums; table-layout: fixed; }
.mgrid th { font-size: 11px; font-weight: 700; color: var(--muted); text-align: center; padding: 1px; }
.mgrid th span { display: none; }
.mgrid thead th:first-child, .mgrid tbody th, .mgrid tfoot th { width: 34px; }
.mgrid thead th:last-child { width: 34px; }
.mgrid tbody th, .mgrid tfoot th { text-align: left; color: var(--ink-2); font-size: 11.5px; }
.mgrid td { text-align: center; padding: 0; height: 26px; }
.mgrid td.n { text-align: right; font-size: 11.5px; color: var(--ink-1); }
.mg-c { all: unset; box-sizing: border-box; display: grid; place-items: center; width: 100%; height: 26px; border-radius: 5px; font-size: 11px; font-weight: 700;
  background: color-mix(in srgb, var(--green) calc(var(--a) * 85%), var(--surface-2)); color: var(--ink); }
.mg-0 { color: var(--muted); font-size: 11px; }
.mg-off { background: repeating-linear-gradient(135deg, transparent 0 3px, var(--line-2) 3px 4px); border-radius: 5px; opacity: .6; }
.mgrid tfoot td { font-size: 10.5px; color: var(--ink-2); height: 22px; }
.mgrid tfoot th, .mgrid tfoot td { border-top: 1px solid var(--line-2); padding-top: 3px; }
.yrow { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 56px repeat(3, minmax(0, 1fr)); gap: 6px; align-items: center; padding: 11px 14px; }
.yrow .y { color: var(--ink); font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.yrow .c { display: grid; gap: 0; min-width: 0; }
.yrow .c b { color: var(--ink); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.yrow .c small { font-size: 12px; color: var(--muted); }
.yrow .c.hi b, .grow .sub .hi, .grow .gcol .v.hi { color: var(--hi); font-weight: 750; }
.yrow .c.lo b, .grow .sub .lo, .grow .gcol .v.lo { color: var(--lo); font-weight: 750; }
.yrow .x { grid-column: 2 / -1; font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.yhead { display: grid; grid-template-columns: 56px repeat(3, minmax(0, 1fr)); gap: 6px; padding: 0 14px 6px; font-size: 11.5px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.gshare { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 14px; }
.gshare .gname { color: var(--ink); font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spark { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; align-items: end; height: 34px; }
.spark > * { all: unset; display: block; cursor: pointer; height: 100%; display: flex; align-items: flex-end; }
.spark > * span { display: block; width: 100%; min-height: 2px; border-radius: 3px 3px 1px 1px; background: var(--green-mark); }
.spark > *:active span { filter: brightness(1.3); }
.spark-axis { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; padding: 0 14px 8px; }
.spark-axis div { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; }
.spark-axis span { font-size: 11px; color: var(--muted); text-align: center; }
.ghead { display: grid; grid-template-columns: minmax(0, 1fr) 76px 76px 14px; gap: 10px; font-size: 11.5px; font-weight: 650; text-align: center; white-space: nowrap; color: var(--muted); margin: 14px 0 6px; padding: 0 14px; }
.grow { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) 76px 76px 14px; gap: 10px; align-items: center; padding: 10px 14px; }
.grow:active { background: var(--surface-2); }
.grow .nm { display: block; color: var(--ink); font-weight: 650; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow .sub { font-size: 12px; color: var(--ink-2); }
.gcol { display: grid; gap: 3px; justify-items: center; }
.gcol .v { font-size: 11.5px; color: var(--ink-1); font-variant-numeric: tabular-nums; }
.dbar { position: relative; display: block; width: 100%; height: 8px; }
.dbar .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; border-left: 1px solid var(--muted); }
.dbar .fill { position: absolute; top: 0; bottom: 0; }
.dbar .fill.pos { left: 50%; background: var(--green-mark); border-radius: 0 4px 4px 0; }
.dbar .fill.neg { right: 50%; background: var(--blue-mark); border-radius: 4px 0 0 4px; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) 64px 64px 18px; gap: 8px; align-items: center; padding: 11px 14px; font-size: 14.5px; color: var(--ink-1); }
.crow.head { padding-block: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.crow .n { text-align: right; font-variant-numeric: tabular-nums; }
.crow .d { text-align: center; font-size: 12px; }
.crow .d.up { color: var(--green); } .crow .d.down { color: var(--blue); }
.tscroll { overflow-x: auto; margin-top: 4px; }
.mtable { border-collapse: collapse; font-size: 13.5px; width: 100%; }
.mtable th, .mtable td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.mtable tr:last-child td { border-bottom: 0; }
.mtable th { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.mtable td { color: var(--ink-1); }
.mtable .n { text-align: right; font-variant-numeric: tabular-nums; }
.mtable.heat td.n { text-align: center; min-width: 44px; border-radius: 6px; }
.dv { color: var(--ink); font-weight: 700; }
.vs { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.ring { position: relative; width: 104px; height: 104px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink); font-size: 30px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ring b small { display: block; font-size: 12px; color: var(--ink-2); font-weight: 600; letter-spacing: 0; margin-top: -26px; }

/* ---------- reviews ---------- */
.search-field { position: relative; margin-top: 12px; }
.search-field svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search-field input, .search-box input { width: 100%; font-size: 16px; padding: 11px 12px 11px 38px; border-radius: 12px; border: 0; background: var(--surface-2); color: var(--ink); }
.search-field input::placeholder, .search-box input::placeholder { color: var(--muted); }
.mrev { padding: 14px; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 10px; margin-top: 12px; }
.mrev-head { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; }
.mrev-head .poster .ph { display: none; }
.mrev .t { color: var(--ink); font-weight: 700; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrev .t span { color: var(--ink-2); font-weight: 400; }
.mrev .m { display: flex; gap: 6px; align-items: center; font-size: 12.5px; flex-wrap: wrap; }
.rv-text { color: var(--ink-1); font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
.rv-text p { margin: 0 0 .75em; } .rv-text p:last-child { margin-bottom: 0; }
.rv-text blockquote { margin: .3em 0 .7em; padding-left: 12px; border-left: 3px solid var(--surface-3); color: var(--ink-2); }
.rv-text ul, .rv-text ol { margin: .3em 0 .7em; padding-left: 1.2em; }
.rv-text a { color: var(--blue); }
.rv-text.clamp { max-height: 8em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
.mrev .linkish { justify-self: start; font-size: 13.5px; }
.wordcloud { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.wordcloud .w { color: var(--ink); font-weight: 700; line-height: 1.3; }
.wchips { display: flex; flex-wrap: wrap; gap: 7px; }
.wchips span, .wchips button { background: var(--surface-2); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--ink-1); }

/* ---------- compare ---------- */
.venn { display: flex; gap: 3px; height: 22px; border-radius: 8px; overflow: hidden; }
.venn span { min-width: 4px; }
.venn .va { background: var(--green-mark); } .venn .vboth { background: var(--slate-mark); } .venn .vb { background: var(--blue-mark); }
.phist { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; height: 120px; align-items: end; border-bottom: 1px solid var(--line-2); margin-top: 10px; }
.pgroup { display: flex; gap: 2px; align-items: flex-end; justify-content: center; height: 100%; }
.pgroup span { width: 45%; border-radius: 3px 3px 0 0; }
.pgroup .pa { background: var(--green-mark); } .pgroup .pb { background: var(--blue-mark); }
.gpair { display: grid; grid-template-columns: 96px minmax(0, 1fr) 58px; gap: 10px; align-items: center; padding: 9px 14px; }
.gpair .gname { color: var(--ink); font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gpair .gbars { display: grid; gap: 3px; }
.gpair .gbars span { display: block; height: 7px; border-radius: 0 4px 4px 0; min-width: 2px; }
.gpair .ga { background: var(--green-mark); } .gpair .gb { background: var(--blue-mark); }
.gpair .gv { text-align: right; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; color: var(--ink-1); font-size: 14.5px; }
.kv span:last-child { color: var(--ink-2); font-size: 13px; white-space: nowrap; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12.5px; font-weight: 600; padding: 7px 10px; border-radius: 10px; max-width: 250px; line-height: 1.4; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); white-space: pre-line; }
#tip b { display: block; font-size: 13.5px; font-weight: 750; }
/* the world map: the more films, the deeper the green */
.wmap { --w0: var(--surface-3); --w1: color-mix(in srgb, var(--green) 32%, var(--surface-3)); --w2: color-mix(in srgb, var(--green) 50%, var(--surface-3));
  --w3: color-mix(in srgb, var(--green) 68%, var(--surface-3)); --w4: color-mix(in srgb, var(--green) 85%, var(--surface-3)); --w5: var(--green); display: grid; gap: 10px; }
.wsvg { display: block; width: 100%; height: auto; }
.wbox { position: relative; }
.wsvg { touch-action: pan-y; } .wsvg.zoomed { touch-action: none; cursor: grab; } .wsvg.zoomed:active { cursor: grabbing; }
.wzoom { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; } /* under the map: on a phone it's too small to cover */
.wzoom button { all: unset; box-sizing: border-box; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 88%, transparent); box-shadow: inset 0 0 0 1px var(--line-2, var(--line)); color: var(--ink); font-size: 18px; line-height: 1; font-weight: 600; }
.wzoom button:disabled { opacity: .35; cursor: default; }
.wzoom button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.wsvg .wc { fill: var(--w0); stroke: var(--surface); stroke-width: .75; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.wsvg .l1 { fill: var(--w1); } .wsvg .l2 { fill: var(--w2); } .wsvg .l3 { fill: var(--w3); } .wsvg .l4 { fill: var(--w4); } .wsvg .l5 { fill: var(--w5); }
.wkey { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.wk { all: unset; display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.wk i { width: 14px; height: 9px; border-radius: 2px; background: var(--w0); }
.wk i.l1 { background: var(--w1); } .wk i.l2 { background: var(--w2); } .wk i.l3 { background: var(--w3); } .wk i.l4 { background: var(--w4); } .wk i.l5 { background: var(--w5); }
.wk-unit { color: var(--muted); }
.wgone { font-size: 13.5px; color: var(--ink-2); }
.wnote { font-size: 12.5px; color: var(--muted); }
.card.wcard { margin-bottom: 12px; }
.foot { font-size: 12.5px; color: var(--muted); margin-top: 28px; display: grid; gap: 8px; line-height: 1.5; }
.foot .stamp { color: var(--ink-2); font-weight: 600; }
input.key { width: 100%; padding: 12px 13px; border-radius: 12px; border: 0; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line-2); font-family: var(--mono); font-size: 14px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; color: var(--ink-1); font-size: 14px; }
.steps li::marker { color: var(--muted); font-weight: 700; }
.lb-steps { margin: 6px 0 12px; }
/* the diary on this site */
.site-card { margin-top: 12px; }
.site-card label.status { margin-bottom: -6px; }
/* the owner's way in, folded away for everyone else */
details.owner-open:not([open]) { background: none; box-shadow: none; padding: 4px 4px 0; }
.owner-open > summary { cursor: pointer; list-style: none; color: var(--ink-2); font-weight: 600; font-size: 14.5px; padding-block: 6px; }
.owner-open > summary::-webkit-details-marker { display: none; }
.owner-open > summary::after { content: "\00a0›"; color: var(--muted); }
.owner-open[open] > summary { color: var(--ink); margin-bottom: 8px; }
.owner-open[open] { display: grid; gap: 10px; }
.site-form { display: grid; gap: 10px; margin-top: 8px; }
.site-form label.status { margin-bottom: -6px; }
.site-btns { display: grid; gap: 8px; }
.site-help { display: grid; gap: 10px; }
.site-help summary { cursor: pointer; color: var(--blue); font-weight: 600; font-size: 14px; padding-block: 4px; }

/* ---------- links into the data ---------- */
/* A number that opens its data carries a faint underline (none in tables); in a sentence the link is white
   and bold against the grey text, as Letterboxd does it; tags are pills. */
.dlink { all: unset; cursor: pointer; text-decoration: underline 1px; text-underline-offset: 4px;
  text-decoration-color: color-mix(in srgb, var(--ink-2) 45%, transparent); -webkit-tap-highlight-color: transparent; }
.mtable .dlink, .crow .dlink, .yrow .dlink, .gshare .dlink { text-decoration: none; }
.dlink:active { color: var(--green); }
.status .dlink, .lead .dlink, .tline .dlink, .legend .dlink, .fc-dir .dlink, .mrev .t .dlink, .note .dlink, .wgone .dlink { text-decoration: none; color: var(--ink); font-weight: 650; }
.fc-tags, .fc-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.fc-tags { margin-top: 8px !important; }
.fc-tags .dlink, .fc-chips .dlink { text-decoration: none; background: var(--surface-2); color: var(--ink-1); border-radius: 999px; padding: 5px 12px; font-size: 13px; line-height: 1.35; }
.fc-tags .dlink:active, .fc-chips .dlink:active { background: var(--surface-3); color: var(--ink); }
.dline { all: unset; cursor: pointer; display: block; }
.tline:has(.dline) { align-items: flex-start; }
.tline:has(.dline) .mk { line-height: 1.45; padding-top: .3em; }
.dline .go { color: var(--muted); }
button.col, button.wd, button.pitem, button.icard, button.fact, button.drow, .wordcloud button.w, .wchips button {
  appearance: none; font: inherit; text-align: left; cursor: pointer; margin: 0; }
button.col, button.wd { background: none; border: 0; padding: 0; color: inherit; width: 100%; }
button.icard, button.fact { border: 0; color: inherit; width: 100%; transition: transform .15s var(--ease), background .15s; }
button.icard:active, button.fact:active { transform: scale(.97); background: var(--surface-2); }
button.icard .go, button.fact .go { color: var(--muted); }
button.drow { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 36px 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .12s; }
button.drow:active { background: var(--surface); }
button.drow.plain { grid-template-columns: 42px minmax(0, 1fr) auto; }
.wordcloud button.w { all: unset; cursor: pointer; color: var(--ink); font-weight: 700; line-height: 1.3; }
.wchips button { border: 0; }
.cal i[data-list] { cursor: pointer; }
.mtable td .dlink { font-variant-numeric: tabular-nums; }

/* ---------- the sheet ---------- */
dialog.sheet { position: fixed; inset: auto 0 0 0; margin: 0 auto; width: 100%; max-width: 520px; max-height: 92vh; max-height: 92dvh; padding: 0; border: 0; border-radius: 22px 22px 0 0;
  background: #1A2026; color: var(--ink-2); display: none; flex-direction: column; box-shadow: 0 -12px 50px rgba(0, 0, 0, .55), inset 0 1px 0 var(--line-2); overflow: hidden; }
dialog.sheet[open] { display: flex; animation: sheet-up .36s var(--ease); }
dialog.sheet.closing { animation: sheet-down .22s ease-in forwards; }
dialog.sheet.dragging { animation: none; transition: none; }
dialog.sheet.snap { transition: transform .25s var(--ease); }
dialog.sheet::backdrop { background: rgba(5, 7, 9, .6); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: fade-in .3s ease; }
dialog.sheet.closing::backdrop { animation: fade-out .22s ease forwards; }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes sheet-down { from { transform: translateY(var(--drag, 0px)); } to { transform: translateY(100%); } }
@keyframes fade-in { from { opacity: 0; } } @keyframes fade-out { to { opacity: 0; } }
.sheet-grab { flex: none; touch-action: none; cursor: grab; }
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--surface-3); margin: 8px auto 0; }
.sheet-head { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; align-items: center; gap: 6px; padding: 6px 10px 12px; border-bottom: 1px solid var(--line); }
.sheet-head .nav-btn { background: var(--surface-2); width: 34px; height: 34px; }
.sheet-head .nav-btn svg { width: 19px; height: 19px; }
.sheet-head .done { justify-self: end; }
.sheet-title { display: flex; gap: 10px; align-items: center; justify-content: center; text-align: center; min-width: 0; }
.sheet-title h2 { color: var(--ink); font-size: 16.5px; font-weight: 750; letter-spacing: -.01em; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-title p { margin: 1px 0 0; font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { overflow: auto; padding: 0 var(--gutter) 18px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; flex: 1 1 auto; }
.sheet-body.enter { animation: push-in .28s var(--ease); }
.sheet-body.back { animation: pop-in .28s var(--ease); }
.sheet-foot { padding: 10px var(--gutter) calc(12px + var(--bottom)); border-top: 1px solid var(--line); flex: none; background: #1A2026; }
.drill-page { margin-top: 12px; }
.drill-row { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .12s; }
.drill-row:active { background: var(--surface); }
.drill-row.entry { grid-template-columns: 32px 38px minmax(0, 1fr) auto; }
.drill-row.name, .drill-row.plain { grid-template-columns: minmax(0, 1fr) auto; padding-block: 12px; }
.drill-row.plain { cursor: default; }
.drill-row:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.dr-main { display: grid; min-width: 0; }
.dr-t { color: var(--ink); font-weight: 650; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-y { color: var(--ink-2); font-weight: 400; }
.dr-s { font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.dr-r { text-align: right; white-space: nowrap; font-size: 12px; color: var(--ink-2); }
.drill-row.name .dr-r { color: var(--ink); font-size: 15px; font-weight: 700; }
.dr-r .ic { margin-left: 5px; }
.dr-r .heart, .fc-line .heart { color: var(--heart); }
.dr-d { display: grid; justify-items: center; line-height: 1.05; }
.dr-d b { font-size: 19px; font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; }
.dr-d small { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
.drill-month { display: flex; justify-content: space-between; margin: 18px 0 2px; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-1); }
.drill-month span:last-child { color: var(--muted); }
.drill-group h4 { display: flex; justify-content: space-between; margin: 20px 0 2px; font-size: 13px; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-1); }
.dr-gsub { margin: 0 0 4px; font-size: 12.5px; }
.thumb { position: relative; display: grid; place-items: center; width: 38px; aspect-ratio: 2 / 3; border-radius: 4px; overflow: hidden; background: linear-gradient(160deg, #2E3945, #1A2128);
  box-shadow: inset 0 0 0 1px var(--frame), 0 3px 8px rgba(0, 0, 0, .3); color: var(--ink-2); font-size: 10px; font-weight: 700; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb.big { width: 104px; flex: none; font-size: 12px; line-height: 1.15; padding: 6px; text-align: center; color: var(--ink-1); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--frame), 0 10px 24px rgba(0, 0, 0, .45); }
.drill-rev { border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.drill-rev .drill-row { border-bottom: 0; }
.drill-rev .rv-text { margin: 0 0 4px 50px; color: var(--ink-1); font-size: 14.5px; }
.drill-rev .linkish { margin-left: 50px; font-size: 13px; }
.rv-text mark { background: color-mix(in srgb, var(--green-mark) 40%, transparent); color: var(--ink); border-radius: 3px; padding: 0 2px; }
.fcard { display: grid; gap: 16px; padding-top: 16px; }
.fc-badge { margin: 0; font-size: 12.5px; color: var(--green); font-weight: 700; }
.fc-top { display: flex; gap: 16px; align-items: flex-start; }
.fc-facts { display: grid; gap: 5px; min-width: 0; }
.fc-facts p { margin: 0; color: var(--ink-1); font-size: 14px; }
.fc-crowd { line-height: 1.6; }
.fc-crowd small { color: var(--muted); }
.fc-crowd .sep { color: var(--muted); }
.fc-sec { background: var(--surface); border-radius: 16px; padding: 14px; box-shadow: inset 0 0 0 1px var(--line); }
.fc-sec h4 { margin: 0 0 8px; font-size: 12px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.fc-line { margin: 0 0 8px; color: var(--ink-1); }
.fc-entries { display: grid; }
.fc-entry { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-1); }
.fc-entry small { color: var(--muted); }
.fc-entry.on { background: var(--green-tint); margin-inline: -14px; padding-inline: 14px; }
.fc-review { margin-top: 12px; }
.fc-review .dr-s { margin: 0 0 4px; }
.fc-review .rv-text { color: var(--ink-1); }
.fc-links { display: flex; gap: 8px; margin: 0; font-size: 14px; flex-wrap: wrap; }
.fc-links a { padding: 8px 14px; border-radius: 999px; background: var(--surface-2); color: var(--ink-1); font-weight: 600; }
.fc-links a:active { background: var(--surface-3); }

/* Turns the table above into the same shape an imported export produces:
   a library of films plus diary entries, and a metadata map keyed by film. */
function buildExample() {
  let seed = 20261021;
  const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const start = Date.UTC(2021, 0, 4), end = Date.UTC(2026, 9, 18), day = 864e5;
  const iso = (t) => new Date(t).toISOString().slice(0, 10);
  // Never before a film came out; later years a little busier; and the example's taste drifts
  // from English-language films toward world cinema, so Insights has a change to find.
  const pick = (year, lang) => {
    const lo = Math.max(start, Date.UTC(year, 2, 1));
    let p = Math.pow(rand(), 0.8);
    p = lang === "English" ? p * 0.8 : 0.35 + 0.65 * p;
    return lo + Math.floor(p * (end - lo) / day) * day;
  };
  const logDate = (t) => iso(t + (rand() < 0.25 ? (1 + Math.floor(rand() * 5)) * day : 0));
  const rows = { profile: [{ Username: "example" }], watched: [], ratings: [], diary: [], likes: [], reviews: [] };
  const meta = {};
  const split = (s) => s ? s.split("|") : [];
  EXAMPLE_FILMS.forEach((f, i) => {
    const [name, year, rating, liked, d, c, g, k, l, r, w, p, m] = f;
    const base = { Name: name, Year: String(year), "Letterboxd URI": "" };
    rows.watched.push({ ...base, Date: iso(start) });
    rows.ratings.push({ ...base, Rating: String(rating) });
    if (liked) rows.likes.push(base);
    const crowd = EXAMPLE_CROWD[name] || [];
    meta[filmKey(name, year)] = { src: "example", d: split(d), c: split(c), g: split(g), k: split(k), l, r, w: split(w), p: split(p), m: split(m), va: crowd[0], vc: crowd[1] };
    if (i % 9 === 4) return; // logged as watched without a diary date
    const first = pick(year, l);
    rows.diary.push({ ...base, Date: logDate(first), "Watched Date": iso(first), Rating: String(rating), Rewatch: "", Tags: "" });
    if (rating >= 4.5 && rand() < 0.55) {
      const again = first + Math.floor(rand() * (end - first) / day) * day;
      if (again > first) rows.diary.push({ ...base, Date: logDate(again), "Watched Date": iso(again), Rating: String(rating), Rewatch: "Yes", Tags: "" });
    }
    if (EXAMPLE_REVIEWS[name]) rows.reviews.push({ ...base, Date: logDate(first), "Watched Date": iso(first), Rating: String(rating), Review: EXAMPLE_REVIEWS[name] });
  });
  for (const [name, year, d, c, g, k, l, r, w, p, m, va, vc] of EXAMPLE_EXTRA)
    meta[filmKey(name, year)] = { src: "example", d: split(d), c: split(c), g: split(g), k: split(k), l, r, w: split(w), p: split(p), m: split(m), va, vc };
  rows.watchlist = EXAMPLE_WATCHLIST.map(([Name, Year]) => ({ Name, Year: String(Year) }));
  return { rows, meta };
}

/* Two made-up members for Compare: one leans to horror and science fiction, one to comedy and romance.
   They rate the example films from the "you" diary's ratings, nudged by their tastes, and each has
   seen a few films "you" haven't. */
function buildExampleFriends() {
  let seed = 7;
  const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const half = (x) => Math.min(5, Math.max(0.5, Math.round(x * 2) / 2));
  const iso = (t) => new Date(t).toISOString().slice(0, 10);
  const people = [
    { id: "ex-a", name: "Friend A", likes: ["Horror", "Science Fiction", "Thriller", "Crime"], dislikes: ["Romance", "Family"], keep: 0.55,
      extra: ["Hereditary", "The Thing", "Alien", "Heat", "The Shining", "Midsommar"], watchlist: ["Seven Samurai", "Paddington 2"] },
    { id: "ex-b", name: "Friend B", likes: ["Comedy", "Romance", "Animation", "Family"], dislikes: ["Horror", "Thriller"], keep: 0.5,
      extra: ["Amélie", "Superbad", "Paddington 2", "Seven Samurai"], watchlist: ["The Thing", "The Shining"] },
  ];
  const films = [...EXAMPLE_FILMS.map((f) => ({ name: f[0], year: f[1], base: f[2], g: f[6].split("|"), extra: false })),
    ...EXAMPLE_EXTRA.map((f) => ({ name: f[0], year: f[1], base: f[11] / 2, g: f[4].split("|"), extra: true }))];
  return people.map((P) => {
    const rows = { profile: [{ Username: P.name }], watched: [], ratings: [], diary: [], likes: [], reviews: [], watchlist: [] };
    for (const f of films) {
      const taste = (f.g.some((g) => P.likes.includes(g)) ? 1 : 0) - (f.g.some((g) => P.dislikes.includes(g)) ? 1 : 0);
      if (f.extra ? !P.extra.includes(f.name) : rand() > P.keep + 0.2 * taste) continue;
      const rating = half(f.base + (taste > 0 ? 1 : taste < 0 ? -1.5 : 0) + (rand() < 0.3 ? -0.5 : rand() < 0.3 ? 0.5 : 0));
      const lo = Math.max(Date.UTC(2022, 0, 1), Date.UTC(f.year, 2, 1)), hi = Date.UTC(2026, 9, 15);
      const date = iso(lo + Math.floor(rand() * (hi - lo) / 864e5) * 864e5);
      const base = { Name: f.name, Year: String(f.year) };
      rows.watched.push(base);
      rows.ratings.push({ ...base, Rating: String(rating) });
      rows.diary.push({ ...base, Date: date, "Watched Date": date, Rating: String(rating), Rewatch: "" });

function parseCsv(text) {

async function readExport(fileList) {

const REVIEW_TAGS = new Set(["P", "BR", "I", "EM", "B", "STRONG", "U", "S", "STRIKE", "BLOCKQUOTE", "UL", "OL", "LI", "A"]);

<script>

   actor (solidcode/letterboxd-scraper) reads Letterboxd in Apify's cloud and returns each film's
   average. Apify's free plan needs no card and gives $5 of credit a month, and on that plan runs
   just stop when the credit is used up. So each run is capped to fit inside $5, whatever a run

   from Letterboxd itself, so they match the export exactly. */

// by title; { tries: 1, v: 2, few: true, slug } when it came back without an average; and, once the film's own page has

  if (icJob.running) return title + `<p class="status" id="ic-progress" role="status">${castProgressText()}</p>`;
  if (!apifyKey()) return title + what + `<p class="status">It reads IMDb through your Apify account: save your Apify token in Letterboxd averages above first.</p>`;
  const todo = castToCheck(lib), done = lib.films.filter((f) => META[f.key] && META[f.key].cq).length, ch = castChanges(lib);

  const row = (button, text) => phone ? `${button}<p class="status">${text}</p>` : `<div class="lookup-row">${button}<span class="status">${text}</span></div>`;
  const changes = done ? `<p class="status">${fmtN(done)} of ${plural(lib.films.length, "film")} checked. IMDb ${ch.add.length ? dlink(D.names("Added from IMDb", "Credited on IMDb, not counted on TMDB", ch.add), `added ${plural(ch.add.length, "person", "people")}`) : "added nobody"}
    and ${ch.off.length ? dlink(D.names("Taken off by IMDb", "Uncredited, a cameo or archive footage on IMDb", ch.off), `took off ${plural(ch.off.length, "person", "people")}`) : "took nobody off"}${ch.films.length ? `, in ${dlink(D.films("Cast put right by IMDb", plural(ch.films.length, "film"), ch.films, { sort: "name" }), plural(ch.films.length, "film"))}` : ""}.</p>` : "";
  const start = todo.length ? row(btn(done ? `Check the other ${plural(todo.length, "film")}` : `Check ${plural(todo.length, "film")} on IMDb`),
    `Tries ${CAST_TRIAL} films first and goes on only if IMDb lets Apify in, using well under $${CAST_BUDGET.toFixed(2)} of your Apify credit for the lot (it says first if it would be more).`) : "";
  return title + what + changes + start + note;
}

<script>
/* ---------- insights: patterns across the whole diary, shared by both layouts ----------

const CROWDS = {

  imdb: { label: "IMDb users", short: "IMDb", score: (m) => m && m.ir && (m.iv || 0) >= 100 ? m.ir : null },
  tmdb: { label: "TMDB users", short: "TMDB", score: (m) => m && m.va && (m.vc || 0) >= 25 ? m.va : null },
  critics: { label: "Critics (Metacritic)", short: "Critics", score: (m) => m && m.mc ? m.mc / 10 : null },

// A crowd's score the way that crowd shows it: Letterboxd in stars out of 5, the others out of 10.
// How far apart a film must be to be listed against the crowd: ¾★ either way; for the site's owner's own diary alone,
// ½★ above (their call, 25 Oct 2026: ¾★ left them two films; everyone else, guests included, keeps ¾★).
const SITE_OWNER = "bogie1946";
const isSiteOwner = () => !!(typeof MY_LIB === "object" && MY_LIB && MY_LIB.profile && String(MY_LIB.profile.username || "").toLowerCase() === SITE_OWNER);
const crowdAbove = () => (isSiteOwner() ? 0.5 : 0.75), CROWD_BELOW = 0.75;
const starPart = (x) => (x === 0.5 ? "½★" : x === 0.75 ? "¾★" : `${x}★`);
const crowdScore = (key, stars5) => key === "letterboxd" ? `${stars5.toFixed(1)}★` : (stars5 * 2).toFixed(1);
const pctOf = (n, d) => d ? Math.round(n / d * 100) : 0;
const starsNum = (x) => `${x.toFixed(1)}★`;
// In a table that compares its rows, the highest of each column in gold and the lowest in purple (asked Oct 2026): the
// class for each row's value (" hi", " lo" or ""). Values go in as shown, so two "3.49"s tie; null leaves a row out (a
// year still under way, in counts). Only a single clear winner is marked (the owner's call, Oct 2026): an end shared by
// two or more rows, fewer than three values, or all alike leave that end unmarked.
function hiLo(values) {
  const xs = values.filter((v) => v != null && Number.isFinite(v));
  const max = Math.max(...xs), min = Math.min(...xs), ties = (x) => xs.filter((v) => v === x).length;

  const hi = ties(max) === 1, lo = ties(min) === 1;
  return values.map((v) => v == null || !Number.isFinite(v) ? "" : hi && v === max ? " hi" : lo && v === min ? " lo" : "");
}
const HILO_NOTE = "Highest in each column in gold, lowest in purple.";
// Average rating by year as columns: only the best year's number (gold) and the worst's (purple) are written over them,
// the rest show on hover or tap, so a long run of years doesn't crowd (the owner found every number congested, Oct 2026).
function avgYearsChart(years) {
  const shown = years.map((p) => p.avgRating ? +p.avgRating.toFixed(2) : null), H = hiLo(shown);
  const mark = new Map(years.map((p, i) => [p.year, H[i].trim()])), few = shown.filter((v) => v != null).length < 3;
  return { values: (c) => { const k = mark.get(c.year); return few ? c.a.toFixed(2) : k ? `<b class="${k}">${c.a.toFixed(2)}</b>` : ""; }, base: valuesBase(years.map((p) => p.avgRating), 0.25) };
}
// each calendar month: films, films a year (or the usual for that month), your average
const monthHiLo = (G, cal) => ({ films: hiLo(cal.map((c) => c.E.length)), year: hiLo(cal.map((c) => G.Y ? (c.usual != null ? +c.usual.toFixed(1) : null) : +c.perYear.toFixed(1))),
  avg: hiLo(cal.map((c) => c.avg ? +c.avg.toFixed(2) : null)) });
// each year: counts leave out a year still under way; shares and averages don't
const yearsHiLo = (ys) => ({ films: hiLo(ys.map((p) => p.pace ? null : p.films)), hours: hiLo(ys.map((p) => p.pace ? null : Math.round(p.hours))),
  rating: hiLo(ys.map((p) => p.avgRating ? +p.avgRating.toFixed(2) : null)), newShare: hiLo(ys.map((p) => p.newShare)), nonEnglish: hiLo(ys.map((p) => p.nonEnglish)), rewatches: hiLo(ys.map((p) => p.entries ? pctOf(p.rewatches, p.entries) : null)),
  countries: hiLo(ys.map((p) => p.pace ? null : p.countries || null)) });
// each genre: films, share, your average, against your average, against the crowd
const genresHiLo = (gs) => ({ count: hiLo(gs.map((g) => g.count)), share: hiLo(gs.map((g) => g.share)), mine: hiLo(gs.map((g) => +g.mine.toFixed(2))),
  vsMe: hiLo(gs.map((g) => +g.vsMe.toFixed(2))), vsCrowd: hiLo(gs.map((g) => g.vsCrowd == null ? null : +g.vsCrowd.toFixed(2))) });
const signed = (x, digits = 1) => Math.abs(x) < 0.5 * Math.pow(10, -digits) ? (0).toFixed(digits) : `${x >= 0 ? "+" : "−"}${Math.abs(x).toFixed(digits)}`;
function pearson(xs, ys) {
  const n = xs.length; if (n < 3) return null;
  const mx = avg(xs), my = avg(ys);

  for (let i = 0; i < n; i++) { const dx = xs[i] - mx, dy = ys[i] - my; sxy += dx * dy; sxx += dx * dx; syy += dy * dy; }

}
const topOf = (map) => { let best = null; for (const [k, v] of map) if (!best || v > best[1]) best = [k, v]; return best; };
const bump = (map, k, n = 1) => map.set(k, (map.get(k) || 0) + n);

// Films rated by you and by a crowd, with both scores, the ones you rate furthest above them first.
function crowdDrill(films, key, title, rOf = (f) => f.rating) {
  const c = CROWDS[key] || CROWDS.tmdb;
  const rows = films.map((f) => { const r = rOf(f), s = r && c.score(metaOf(f), f); return s ? { f, crowd: s / 2, diff: r - s / 2 } : null; })
    .filter(Boolean).sort((a, b) => b.diff - a.diff);
  const by = new Map(rows.map((x) => [x.f, x]));
  return D.films(title || `You against ${c.label}`, rows.length ? `${plural(rows.length, "film")} · ${signed(avg(rows.map((x) => x.diff)), 2)}★ against them on average` : "", rows.map((x) => x.f),
    { sort: "given", ratingOf: rOf, note: (f) => { const x = by.get(f); return `${c.short} ${crowdScore(c === CROWDS[key] ? key : "tmdb", x.crowd)} · you ${signed(x.diff)}★`; } });
}
const hasGenre = (g) => (f) => { const m = metaOf(f); return !!m && m.g.includes(g); };
const notEnglish = (f) => { const m = metaOf(f); return !!m && !!m.l && m.l !== "English"; };
const langNote = (f) => metaOf(f).l;
// Diary entries logged the day you watched, and the ones logged later.
function loggingDrill(es, pct) {
  const same = es.filter((e) => e.logged === e.date), later = es.filter((e) => e.logged !== e.date);
  return D.groups("Same-day logging", `${pct}% logged the day you watched`, [D.entries("Logged the same day", entriesSub(same), same),
    D.entries("Logged on another day", entriesSub(later), later, { note: (e) => { const d = dayIndex(e.logged) - dayIndex(e.date); return `Logged ${fmtDate(e.logged)}, ${plural(Math.abs(d), "day")} ${d >= 0 ? "later" : "earlier"}`; } })]);
}
// The data behind one year's number in the year-by-year view.
function yearDrill(p, what) {
  const y = p.year;
  if (what === "entries") return D.entries(`Diary of ${y}`, entriesSub(p.E), p.E);
  if (what === "hours") return D.films(`Hours in ${y}`, `${fmtN(Math.round(p.hours))} hours`, p.F.filter(runtimeOf), { scope: y, sort: "runtime",
    note: (f) => { const v = viewsIn(f, y); return `${runtimeOf(f)} min${v > 1 ? ` × ${v} viewings` : ""}`; } });
  if (what === "rating") {
    const last = new Map();
    for (const e of p.E) if (e.rating) last.set(e.film, e.rating);
    const r = (f) => last.has(f) ? last.get(f) : f.rating;
    const fs = p.F.filter(r).sort((a, b) => r(b) - r(a));
    return D.films(`Ratings in ${y}`, `${p.avgRating ? p.avgRating.toFixed(2) : "—"} average · ${plural(fs.length, "film")}`, fs, { sort: "given", ratingOf: r });
  }
  if (what === "age") return D.films(`Film age in ${y}`, p.age != null ? `${Math.round(p.age)} years old on average when watched` : "", p.F.filter((f) => f.year), { sort: "old", note: (f) => `${plural(+y - f.year, "year")} old` });
  if (what === "nonEnglish") return D.films(`Not in English, ${y}`, filmsSub(p.nonEngFilms), p.nonEngFilms, { scope: y, note: langNote });
  if (what === "rewatches") { const es = p.E.filter((e) => e.rewatch); return D.entries(`Rewatches in ${y}`, entriesSub(es), es); }
  if (what === "new") { const fs = p.F.filter((f) => f.year >= +y - 1); return D.films(`New releases in ${y}`, `${plural(fs.length, "film")} from ${+y - 1} or ${y}`, fs, { scope: y }); }
  if (what === "countries") {
    const m = new Map();
    for (const f of p.F) for (const k of (metaOf(f) || { k: [] }).k) { if (!m.has(k)) m.set(k, []); m.get(k).push(f); }
    const items = [...m].map(([name, films]) => ({ name, films })).sort((a, b) => b.films.length - a.films.length || a.name.localeCompare(b.name));
    return D.names(`Countries in ${y}`, plural(items.length, "country", "countries"), items, { scope: y });

}
// "…, and the films they like most tend to be the ones you like most too", or nothing when it can't be measured.
const followText = (r) => r == null ? "" : r >= 0.6 ? ", and the films they like most tend to be the ones you like most too" : r >= 0.35 ? ", and your favourites and theirs overlap a little"
  : ", and your favourites and theirs barely line up";

function computeInsights(lib, metaOf, crowdKey) {
  const E = lib.entries, rated = lib.films.filter((f) => f.rating);
  const overallAvg = avg(rated.map((f) => f.rating));
  const today = new Date(), thisYear = String(today.getFullYear());
  const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 1)) / 864e5) + 1;

  /* ----- year by year ----- */
  const years = [...new Set(E.map((e) => e.date.slice(0, 4)))].sort();
  const perYear = years.map((y) => {
    const es = E.filter((e) => e.date.startsWith(y));
    const films = [...new Set(es.map((e) => e.film))];
    let minutes = 0;
    for (const e of es) { const m = metaOf(e.film); if (m && m.r) minutes += m.r; }
    const ratings = es.map((e) => e.rating || e.film.rating).filter(Boolean);
    const dated = films.filter((f) => f.year);
    const langs = films.map(metaOf).filter((m) => m && m.l);
    const nonEngFilms = films.filter(notEnglish);
    const genres = new Map(), directors = new Map(), actors = new Map(), countries = new Set();
    let withMeta = 0;
    for (const f of films) {
      const m = metaOf(f); if (!m) continue; withMeta++;
      new Set(m.g).forEach((g) => bump(genres, g)); new Set(roleNames(m, "d")).forEach((d) => bump(directors, d));
      new Set(castOf(m)).forEach((c) => bump(actors, c)); m.k.forEach((k) => countries.add(k));
    }
    const pace = y === thisYear && dayOfYear > 30 && dayOfYear < 360 ? Math.round(films.length / dayOfYear * 365) : null;
    return {
      year: y, E: es, F: films, nonEngFilms, films: films.length, entries: es.length, rewatches: es.filter((e) => e.rewatch).length, hours: minutes / 60, pace,
      avgRating: avg(ratings), age: dated.length ? avg(dated.map((f) => +y - f.year)) : null,
      newShare: dated.length ? pctOf(dated.filter((f) => f.year >= +y - 1).length, dated.length) : null,
      nonEnglish: langs.length >= 3 ? pctOf(langs.filter((m) => m.l !== "English").length, langs.length) : null,
      genres, withMeta, countries: countries.size,
      topGenre: topOf(genres), topDirector: topOf(directors), topActor: topOf(actors),

  });

  const busiest = perYear.reduce((a, p) => !a || p.films > a.films ? p : a, null);

  /* ----- changing tastes: the earliest years against the latest ----- */
  const tastes = { lines: [], table: null };
  if (usable.length >= 2) {
    const span = usable.length >= 4 ? 2 : 1;
    const early = usable.slice(0, span), late = usable.slice(-span);
    const label = (g) => g.length > 1 ? `${g[0].year}–${g[g.length - 1].year.slice(2)}` : g[0].year;
    const share = (group, genre) => { const n = group.reduce((s, p) => s + (p.genres.get(genre) || 0), 0), d = group.reduce((s, p) => s + p.withMeta, 0); return d ? n / d * 100 : null; };
    const mean = (group, k) => { const v = group.map((p) => p[k]).filter((x) => x != null); return v.length ? avg(v) : null; };
    const E0 = label(early), L0 = label(late);
    const allGenres = new Map();
    for (const p of perYear) for (const [g, n] of p.genres) bump(allGenres, g, n);
    const top = [...allGenres].sort((a, b) => b[1] - a[1]).slice(0, 8).map(([g]) => g);
    const moves = top.map((g) => ({ g, from: share(early, g), to: share(late, g) })).filter((x) => x.from != null && x.to != null).map((x) => ({ ...x, d: x.to - x.from }));
    const filmsIn = (group, test) => [...new Set(group.flatMap((p) => p.F))].filter(test);
    const thenNow = (title, test, o) => { const a = filmsIn(late, test), b = filmsIn(early, test);
      return D.groups(title, `${L0} against ${E0}`, [D.films(L0, filmsSub(a), a, o), D.films(E0, filmsSub(b), b, o)]); };
    const risers = moves.filter((x) => x.d >= 5).sort((a, b) => b.d - a.d).slice(0, 2);
    const fallers = moves.filter((x) => x.d <= -5).sort((a, b) => a.d - b.d).slice(0, 2);
    for (const x of risers) tastes.lines.push({ dir: "up", big: x.g, text: `${x.g} grew from ${Math.round(x.from)}% of your films in ${E0} to ${Math.round(x.to)}% in ${L0}.`, to: thenNow(`${x.g}, then and now`, hasGenre(x.g)) });
