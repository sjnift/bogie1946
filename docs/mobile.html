      .replace('class="chart"', 'class="chart slate"').replace(/<div class="axis"[^]*?<\/div>/, "") +
    `<div class="hist-ends" style="margin-right:28px"><span class="stars">½</span><span class="stars">★★★★★</span></div></div>` : "";
  const strip = (label, data, role) => {
    const list = data.most.slice(0, 12);
    if (!list.length) return "";
    return sh(label, seeAll(`data-act="people" data-role="${role}"`)) +
      `<div class="scroller">${list.map((p) => `<button class="pcard" type="button" data-k="${esc(p.name)}" data-list="${reg(p.name, filmsTitle(p), p.films, p)}">
        ${avatar(p, "lg")}<span class="nm">${esc(p.name)}</span><span class="ct">${plural(p.count, "film")}</span></button>`).join("")}</div>`;
  };
  const people = s.withMeta ? strip("Most watched actors", s.cast, "c") + strip("Most watched directors", s.directors, "d") : "";
  const reimport = !ex && lib.reviewTextMissing ? mReimport() : "";
  const onSite = ex ? "" : `<div data-sitebox="open">${siteBox("open")}</div>`; // a newer copy of the diary is on the site
  const iosTip = iosTipDue() ? `<div class="card notice"><p class="title">Add Credits Roll to your Home Screen</p><p class="status">${esc(IOS_TIP_TEXT)}</p>
    <button class="btn block" type="button" data-iostip>Got it</button></div>` : "";
  const when = s.scope === "all" ? "all time" : s.scope;
  const storyRow = BASE_LIB && BASE_LIB.entries.length ? `<div class="storyrow"><button class="btn green" type="button" ${dl(D.story(s.scope))}>${ICON.next}Play ${esc(when)} as a story</button>
    <button class="btn" type="button" ${dl(D.share(s.scope))}>${ICON.share}<span class="sr-only">Share ${esc(when)} as a picture</span></button></div>` : "";
  // the best-rated decade, featured, then the second and third (the owner's call, Oct 2026)
  const ranked = rankedDecades(s), decade = ranked.length ? `<div style="margin-top:22px">${bestDecadeCard(ranked[0], s.scope)}${ranked.slice(1, 3).map((x, i) => decadeRunnerCard(x, i, s.scope)).join("")}</div>` : "";
  return hero + scopeBar() + onSite + notice + note + iosTip + reimport + fill + tiles + storyRow + recentRow + otd + decade + ratings + people;
}

/* ---------- Stats: films, people, genres ---------- */
const statsHead = () => ltitle("Stats") + scopeBar() + segBar("view", [["films", "Films"], ["people", "People"], ["genres", "Breakdown"], ["years", "Years"], ["crowd", "vs. Others"]], state.view, "five");
function peopleScreen(s) {
  const role = state.role;
  const data = { c: s.cast, v: s.voice, d: s.directors, w: s.writers, p: s.dop, m: s.music }[role] || s.cast;
  const best = state.sort === "best";
  const list = best ? data.best : data.most;
  const head = statsHead() + chipBar("role", [["c", "Actors"], ["v", "Voices"], ["d", "Directors"], ["w", "Writers"], ["p", "Camera"], ["m", "Music"]], role) +
    segBar("sort", [["most", "Most watched"], ["best", "Highest rated"]], state.sort, "small");
  if (!s.withMeta) return head + needMeta();
  const note = role === "c" ? castRuleText() : role === "v" ? "Voice roles in animation, narration and the like, counted apart from on-screen acting. Additional voices and cameos don't count." : "";
  const bestNote = best ? `${note ? " " : ""}${role === "c" ? castBarText(s) : `Highest rated needs ${s.minRated} or more rated films.`}` : "";
  const val = (p) => best ? `★ ${p.avg.toFixed(2)}` : plural(p.count, "film");
  const podium = list.length >= 3 ? `<div class="podium">${[1, 0, 2].map((i) => { const p = list[i];
    return `<button class="pod${i ? "" : " first"}" type="button" data-list="${reg(p.name, filmsTitle(p), p.films, p)}">${avatar(p, "lg")}<span class="rkb">${i + 1}</span><span class="nm">${esc(p.name)}</span><span class="ct">${val(p)}</span></button>`; }).join("")}</div>` : "";
  const from = podium ? 3 : 0;
  const rows = list.slice(from, state.peopleLimit).map((p, i) => personRow(p, i + from + 1, best)).join("");
  const more = (list.length > state.peopleLimit ? `<button class="row" type="button" data-act="more-people" data-auto><span>Show more</span><span class="count">${fmtN(list.length - state.peopleLimit)} more</span>${CHEV}</button>` : "")
    + (state.peopleLimit > 50 && list.length > 50 ? `<button class="row" type="button" data-act="less-people"><span>Show less</span><span class="count">back to the first 50</span>${CHEV}</button>` : "");
  const label = { c: "actors", v: "voice actors", d: "directors", w: "writers", p: "cinematographers", m: "composers" }[role];
  return head + (list.length ? podium + sh(`${fmtN(list.length)} ${label}`) + (note + bestNote ? `<p class="status" style="margin:-6px 0 10px">${esc(note + bestNote)}</p>` : "") +
    (rows ? `<div class="group">${rows}${more}</div>` : "") : `<div class="empty">Nobody to show for this period.${bestNote ? ` ${esc(bestNote)}` : ""}</div>`);
}
</script>
<script>
/* ---------- Diary ---------- */
// a fact that opens what it counts, or the film it names
const fact = (k, v, f, to) => { const inner = `<span class="k">${k}</span><span class="v">${esc(v)}${to || f ? '<span class="go" aria-hidden="true">&nbsp;›</span>' : ""}</span>`;
  return to || f ? `<button class="fact" type="button" ${dl(to || D.film(f))}>${inner}</button>` : `<div class="fact">${inner}</div>`; };
const cardH = (title, right = "") => `<div class="card-h"><h4>${title}</h4>${right ? `<span>${right}</span>` : ""}</div>`;
function diaryScreen(s) {
  const head = ltitle("Diary") + scopeBar();
  if (!s.entries.length) return head + `<div class="empty" style="padding-top:28px">No diary dates in ${s.scope === "all" ? "your export" : s.scope}. Films logged without a date still count on the other tabs.</div>`;
  const cols = memo(`timeline|${s.scope}`, () => timeline(s));
  const unit = s.scope !== "all" ? "week" : cols[0].key.length === 7 ? "month" : "year";
  const bm = s.busiestMonth, fav = s.weekday.indexOf(Math.max(...s.weekday));
  const facts = `<div class="facts">${[
    fact("Busiest month", bm ? `${MONTHS[+bm.key.slice(5, 7) - 1]} ${bm.key.slice(0, 4)} · ${plural(bm.count, "film")}` : "—", null, bm && DR.month(s.entries, bm.key)),
    fact("Longest streak", s.streak.days > 1 ? `${s.streak.days} days` : "1 day", null, DR.streak(s)),
    fact("Most in a day", s.busiestDay ? `${plural(s.busiestDay.count, "film")} · ${fmtDate(s.busiestDay.key).replace(/ \d{4}$/, s.scope === "all" ? "$&" : "")}` : "—", null, s.busiestDay && DR.day(s.entries, s.busiestDay.key)),
    fact("Favourite day", WEEKDAYS_LONG[fav], null, memo(`wd|${s.scope}`, () => s.weekday.map((n, i) => DR.weekday(s.entries, i)))[fav]),
  ].join("")}</div>`;
  const legend = s.rewatches ? `<div class="legend"><span><i style="background:var(--green-mark)"></i>First watch</span><span><i style="background:var(--blue-mark)"></i>Rewatch</span></div>` : "";
  let chart = colChart(cols, `Diary entries by ${unit}`, legend, 120, { unit: "films" });
  if (cols.length > 24) chart = chart.replace('class="axis"', 'class="axis dense"');
  const wmax = Math.max(1, ...s.weekday), byWeekday = memo(`wd|${s.scope}`, () => s.weekday.map((n, i) => DR.weekday(s.entries, i)));
  const weekdays = `<div class="weekdays" role="group" aria-label="Diary entries by day of the week">${s.weekday.map((n, i) =>
    `<button class="wd${i === fav ? " fav" : ""}" type="button" ${dl(byWeekday[i])} aria-label="${WEEKDAYS_LONG[i]}: ${plural(n, "film")}"><span class="cnt">${n}</span><span class="bar-v"><span style="height:${(n / wmax * 100).toFixed(1)}%"></span></span><span class="lbl">${WEEKDAYS[i].slice(0, 2)}</span></button>`).join("")}</div>`;
  const list = [...s.entries].reverse().slice(0, state.diaryLimit);
  let rows = "", month = "";
  for (const e of list) {
    const m = e.date.slice(0, 7);
    if (m !== month) { month = m; rows += `<div class="month-h" data-k="m${m}"><span>${MONTHS_LONG[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}</span><span>${fmtN(s.byMonth.get(m) || 0)}</span></div>`; }
    rows += `<button class="drow" type="button" data-k="${esc(e.film.key)}|${e.date}|${e.order}" ${dl(D.film(e.film, { entry: e }))}><span class="day"><b>${+e.date.slice(8, 10)}</b><small>${WEEKDAYS[weekdayOf(e.date)]}</small></span>${poster(e.film)}
      <span style="min-width:0"><span class="t">${esc(e.film.name)} <span>${e.film.year || ""}</span></span>
      <span class="m"><span class="stars">${stars(e.rating)}</span></span></span>
      <span class="icons">${e.rewatch ? '<span class="rewatch" title="Rewatch">↻</span>' : ""}${e.film.liked ? '<span class="heart" title="Liked">♥</span>' : ""}${e.review ? '<span title="Reviewed">≡</span>' : ""}</span></button>`;
  }
  const more = s.entries.length > state.diaryLimit ? `<button class="row" type="button" data-act="more-diary" data-auto style="padding-inline:0"><span>Show older entries</span><span class="count">${fmtN(s.entries.length - state.diaryLimit)} more</span>${CHEV}</button>` : "";
  return head + facts +
    sh(`Films by ${unit}`, `<span class="count">${plural(s.entries.length, "entry", "entries")}</span>`) + `<div class="card">${chart}</div>` +
    sh("Days of the week") + `<div class="card">${weekdays}</div>` +
    sh(s.scope === "all" ? "Last 12 months" : `Every day of ${s.scope}`) + `<div class="card">${heatmap(s).replace("Fewer", "Less")}</div>` +
    sh("Entries") + `<div>${rows}</div>` + more;
}

/* ---------- Stats › Films ---------- */
function filmsScreen(s) {
  const views = (f) => s.scope === "all" ? f.entries.length : f.entries.filter((e) => e.date.startsWith(s.scope)).length;
  const rated = s.films.filter((f) => f.rating).sort((a, b) => b.rating - a.rating || views(b) - views(a) || (b.year || 0) - (a.year || 0));
  let html = statsHead();
  if (!s.films.length) return html + `<div class="empty">No films in this period.</div>`;

  const E = s.entries;
  if (E.length) {
    const marks = s.scope === "all" ? [50, 100, 250, 500, 750, 1000, 1500, 2000, 2500, 3000, 4000, 5000, 7500, 10000] : [25, 50, 100, 150, 200, 250, 300, 365, 400, 500];
    const items = [["First film", E[0], 1], ...marks.filter((n) => n < E.length).slice(-5).map((n) => [`${ordinal(n)} film`, E[n - 1], n])];
    if (E.length > 1) items.push(["Latest", E[E.length - 1], E.length]);
    html += sh("Milestones") + `<div class="scroller">${items.map(([k, e, n]) => `<button class="pitem" type="button" ${dl(D.film(e.film, { entry: e, badge: `${k}: diary entry ${fmtN(n)} of ${fmtN(E.length)}${s.scope === "all" ? "" : ` in ${s.scope}`}, ${fmtDate(e.date)}` }))} title="${esc(e.film.name)}${e.film.year ? ` (${e.film.year})` : ""}">
      <span class="mlabel">${k}</span>${poster(e.film)}
      <span class="pmeta"><span class="stars">${stars(e.rating)}</span>${e.rewatch ? '<span class="rewatch" aria-label="rewatch">↻</span>' : ""}</span>
      <span class="mdate">${fmtDate(e.date)}</span></button>`).join("")}</div>`;
  }

  const re = s.films.filter((f) => views(f) > 1).sort((a, b) => views(b) - views(a) || (b.rating || 0) - (a.rating || 0)).slice(0, 8);
  if (re.length) html += sh("Most rewatched") + `<div>${re.map((f) => `<button class="drow plain" type="button" data-k="${esc(f.key)}" ${dl(D.film(f))}>${poster(f)}
    <span style="min-width:0"><span class="t">${esc(f.name)} <span>${f.year || ""}</span></span><span class="m"><span class="stars">${stars(f.rating)}</span>${likeMark(f)}</span></span>
    <span class="val num">${views(f)}×</span></button>`).join("")}</div>`;

  const timed = s.films.filter((f) => metaOf(f) && metaOf(f).r);
  const longest = timed.reduce((a, f) => !a || metaOf(f).r > metaOf(a).r ? f : a, null);
  const shortest = timed.reduce((a, f) => !a || metaOf(f).r < metaOf(a).r ? f : a, null);
  const dated = s.films.filter((f) => f.year);
  const oldest = dated.reduce((a, f) => !a || f.year < a.year ? f : a, null);
  const newest = dated.reduce((a, f) => !a || f.year > a.year ? f : a, null);
  const rec = [
    longest && fact("Longest", `${longest.name} · ${metaOf(longest).r}\u00a0min`, longest), shortest && fact("Shortest", `${shortest.name} · ${metaOf(shortest).r}\u00a0min`, shortest),
    oldest && fact("Oldest", `${oldest.name} · ${oldest.year}`, oldest), newest && fact("Newest", `${newest.name} · ${newest.year}`, newest),
  ].filter(Boolean).join("");
  if (rec) html += sh("Records") + `<div class="facts" style="margin-top:0">${rec}</div>`;
  // highest and lowest rated, further down than they were (the owner's call, Oct 2026)
  if (rated.length) html += sh("Highest rated", seeAll(`data-act="all-rated"`)) + posterGrid(rated.slice(0, 8));
  const low = rated.filter((f) => f.rating <= 2.5).reverse();
  if (low.length) html += sh("Lowest rated", low.length > 8 ? seeAll(dl(D.films("Lowest rated", filmsSub(low, "2½★ and under"), low, { scope: s.scope, sort: "given" }))) : "") + posterGrid(low.slice(0, 8));
  const habits = s.scope === "all" ? allInsights().habits : yearInsights(s.scope).habits.filter((h) => !["Longest streak", "Biggest day", "Oldest film"].includes(h.k));
  if (habits.length) html += mHabits(habits, "Habits");
  if (!s.withMeta) html += needMeta();
  return html + (mReviewInsights(state.lib, s.scope === "all" ? null : s.scope) || "");
}

/* ---------- Stats › Breakdown: the best decade, genres, countries, languages, decades ---------- */
// Decades with three or more rated films, best average first.
const rankedDecades = (s) => s.decades.filter((x) => x.ratings.length >= 3).sort((a, b) => b.avg - a.avg || b.count - a.count);
// The best-rated decade, up front, with its best films' posters.
function bestDecadeCard(x, scope) {
  const pics = showImages ? x.top.filter((f) => metaOf(f) && metaOf(f).poster).slice(0, 3) : [];
  return `<section class="card decade-hero"><div class="dh-bg" aria-hidden="true">${pics.map((f) => `<img src="${IMG}${esc(metaOf(f).poster)}" alt="" decoding="async">`).join("")}</div>
    <p class="dh-k">Best-rated decade${scope === "all" ? "" : ` · watched in ${esc(scope)}`}</p>
    <button class="dh-title" type="button" ${dl(DR.decade(x))}><span class="dh-dec">The ${x.decade}s</span>
      <span class="dh-sub"><span class="stars">★</span> ${x.avg.toFixed(2)} average from ${plural(x.ratings.length, "rated film")}${CHEV}</span></button>
    <div class="scroller">${x.top.map((f) => posterItem(f)).join("")}</div></section>`;
}
// The second and third best, under it on Profile, a little smaller (the owner's call, Oct 2026).
function decadeRunnerCard(x, i, scope) {
  return `<section class="card decade-run"><p class="dh-k">${i ? "Third" : "Second"} best${scope === "all" ? "" : ` · watched in ${esc(scope)}`}</p>
    <button class="dh-title" type="button" ${dl(DR.decade(x))}><span class="dr-dec">The ${x.decade}s</span>
      <span class="dh-sub"><span class="stars">★</span> ${x.avg.toFixed(2)} average from ${plural(x.ratings.length, "rated film")}${CHEV}</span></button>
    <div class="scroller">${x.top.map((f) => posterItem(f)).join("")}</div></section>`;
}
// A decade in the ranking: its average and its three best posters.
const decadeRow = (x, i) => `<button class="drank" type="button" data-k="d${x.decade}" ${dl(DR.decade(x))}><span class="rk">${i + 1}</span>
  <span style="min-width:0"><span class="nm">${x.decade}s</span><span class="sub"><span class="stars">★</span> ${x.avg.toFixed(2)} average · ${plural(x.count, "film")}</span></span>
  <span class="mposters" aria-hidden="true">${x.top.slice(0, 3).map(poster).join("")}</span>${CHEV}</button>`;
function genresScreen(s) {
  const ranked = rankedDecades(s);
  let html = statsHead() + (ranked.length ? bestDecadeCard(ranked[0], s.scope) : "") + segBar("catsort", [["most", "Most watched"], ["best", "Highest rated"]], state.catSort, "small");
  const best = state.catSort === "best";
  if (s.withMeta) {
    for (const [label, data, field] of [["Genres", s.genres, "genres"], ["Countries", s.countries, "countries"], ["Languages", s.languages, "languages"]]) {
      const list = best ? data.best : data.most;
      const map = field === "countries" ? worldMapHtml(s.countries, { scope: s.scope, total: s.films.filter((f) => metaOf(f) && (metaOf(f).k || []).length).length }) : "";
      html += sh(label, list.length > 6 ? seeAll(`data-act="cat" data-field="${field}"`, `All ${fmtN(list.length)}`) : "") +
        (map ? `<div class="card wcard">${map}<p class="wnote">Tap a country for its films. Pinch or use + and − to zoom, and drag to move around.</p></div>` : "") +
        (list.length ? `<div class="group">${list.slice(0, 6).map((c) => catRow(c, list[0].count, best)).join("")}</div>` : `<div class="empty">${best ? "Needs 3 or more rated films each." : "Nothing yet."}</div>`);
    }
  } else html += needMeta();
  if (s.decades.length) {
    const all = s.decades, cols = [];
    for (let d = all[0].decade; d <= all[all.length - 1].decade; d += 10) {
      const x = all.find((y) => y.decade === d);
      cols.push({ a: x ? x.count : 0, b: 0, label: `’${String(d).slice(2)}`, tip: `${d}s: ${plural(x ? x.count : 0, "film")}${x && x.avg ? ` · ${x.avg.toFixed(2)} average` : ""}`, to: x && DR.decade(x) });
    }
    html += (ranked.length ? sh("Decades, best rated first") + `<div class="group">${ranked.map(decadeRow).join("")}</div>` : "") +
      sh("Films by decade of release") + `<div class="card">${colChart(cols, "Films by decade of release", "", 100, { unit: "films" })}</div>`;
  }
  if (s.scope === "all" && s.withMeta) html += mGenres(allInsights());
  return html;
}

/* ---------- Settings: import, lookups, this browser ---------- */
function lookupInner() {
  if (state.mode === "example" || !MY_LIB) {
    return `<p class="title">Cast &amp; crew</p><p class="status">Letterboxd's export lists your films, dates and ratings, but not who's in them.
      After you import yours, you can fill them in${IN_VIEWER ? " with Claude" : " from TMDB with your API key"}. The example has them filled in already.</p>`;
  }
  const lib = MY_LIB, total = lib.films.length;
  const have = lib.films.filter((f) => metaOf(f)).length;
  const fromTmdb = lib.films.filter((f) => META[f.key] && META[f.key].src === "tmdb" && !META[f.key].miss).length;
  const pct = total ? Math.round(have / total * 100) : 0;
  const src = fromTmdb ? (fromTmdb === have ? "From TMDB" : "From TMDB and Claude") : have ? "From Claude's film knowledge" : "Not looked up yet";
  const head = `<p class="title">Cast &amp; crew</p><div class="meter" role="progressbar" aria-label="Films with cast and crew" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span id="lookup-meter" style="width:${pct}%"></span></div>
    <p class="status">${fmtN(have)} of ${plural(total, "film")} · ${src}</p>`;
  const note = job.note ? `<p class="status${job.err ? " err" : ""}" role="status">${esc(job.note)}</p>` : "";
  const saveNote = job.saveFailed ? `<p class="status err">This browser wouldn't save the results, so they'll be gone when you close the page.</p>` : "";
  if (job.running) return head + `<p class="status" id="lookup-progress" role="status">${progressText()}</p><button class="btn block" type="button" data-act="stop">Stop</button>`;
  let body;
  if (!IN_VIEWER) {
    const todo = needsLookup(lib, "tmdb").length;
    const askKey = !tmdbKey() || editKey || job.badKey;
    body = todo && !askKey ? `<button class="btn green block" type="button" data-act="tmdb">Look up ${plural(todo, "film")} on TMDB</button>
      <p class="status">${ownTmdbKey() ? "Using your saved TMDB key." : "Using this site's shared TMDB key."} <button class="linkish" type="button" data-act="change-key">${ownTmdbKey() ? "Change key" : "Use your own key"}</button></p>` :
      todo ? `<label class="sr-only" for="tmdb-key">TMDB API key or read access token</label>
      <input class="key" id="tmdb-key" type="password" autocomplete="off" spellcheck="false" placeholder="TMDB API key or read access token" value="${esc(ownTmdbKey())}">
      <button class="btn green block" type="button" data-act="tmdb">Look up ${plural(todo, "film")} on TMDB</button>
      <p class="status">Get a free key at <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org/settings/api</a>. It's saved in this browser (and in your locked diary on this site, if it's there) and sent only to TMDB.</p>` : have < total ? `<p class="status">TMDB had no match for ${plural(total - have, "film")}.</p>` : `<p class="status">Every film has details from TMDB.</p>`;
  } else if (sampleState === "ready") {
    const todo = needsLookup(lib, "claude").length;
    const misses = lib.films.filter((f) => META[f.key] && META[f.key].miss && META[f.key].src === "claude").length;
    body = `<p class="status">Pages inside Claude can't reach TMDB, so Claude fills in each film from what it knows. Obscure films can come back wrong or empty.</p>` +
      (todo ? `<button class="btn green block" type="button" data-act="claude">Look up ${plural(todo, "film")} with Claude</button>
        <p class="status">About ${plural(Math.ceil(todo / CLAUDE_BATCH), "request")} on your Claude plan.</p>` :
      misses ? `<button class="btn block" type="button" data-act="claude-retry">Try the ${plural(misses, "film")} Claude didn't recognise</button>` : "");
  } else if (sampleState === "pending") {
    body = `<p class="status">Connecting to Claude…</p>`;
  } else {
    body = `<p class="status">Lookups aren't available in this view. Open the downloadable copy of this page in a browser and use a TMDB key.</p>`;
  }
  const extra = [imdbBlock(MY_LIB, true), letterboxdBlock(MY_LIB, true), castCheckBlock(MY_LIB, true), peopleCheckBlock(MY_LIB, true), feedBlock(MY_LIB, true), dataCheckBlock(MY_LIB, true), picturesBlock(true)].filter(Boolean).map((h) => `</div><div class="card">${h}`).join("");
  return head + body + note + saveNote + extra;
}
function progressText() {
  return job.kind === "claude" && job.done === 0 ? `Asking Claude about ${plural(job.total, "film")}… the first batch takes up to a minute.`
    : `Looked up ${fmtN(job.done)} of ${plural(job.total, "film")} ${job.kind === "tmdb" ? "on TMDB" : "with Claude"}…`;
}
function renderLookup() { const el = $("#lookup"); if (el) { el.outerHTML = `<div id="lookup"><div class="card">${lookupInner()}</div></div>`; } }
function renderLookupProgress() {
  const p = $("#lookup-progress");
  if (p) p.textContent = progressText();
  const ip = $("#imdb-progress");
  if (ip) ip.textContent = imdbProgressText();
  const lp = $("#lb-progress");
  if (lp) lp.textContent = lbProgressText();
  const cp = $("#ic-progress");
  if (cp) cp.textContent = castProgressText();
  const fp = $("#facts-progress");
  if (fp) fp.textContent = factsProgressText();
  const m = $("#lookup-meter");
  if (m && MY_LIB) m.style.width = `${Math.round(MY_LIB.films.filter((f) => metaOf(f)).length / Math.max(1, MY_LIB.films.length) * 100)}%`;
}
function dataScreen() {
  const lib = MY_LIB;
  const status = lib ? `${plural(lib.films.length, "film")}, ${plural(lib.entries.length, "diary entry", "diary entries")} and ${plural(lib.reviews.length, "review")} imported${lib.profile.username ? ` for @${esc(lib.profile.username)}` : ""}.${lib.reviewTextMissing ? " The review text is missing, so import the export again." : ""}` : "Nothing imported yet.";
  const rows = [];
  if (lib && !IN_VIEWER) {
    rows.push(`<button class="row" type="button" data-act="backup"><span>Back up to a file</span><span class="count">for another device</span>${CHEV}</button>`);
    rows.push(`<button class="row switch" type="button" data-act="backup-keys" role="switch" aria-checked="${!!state.backupKeys}"><span>Include API keys in the backup</span><span class="toggle-ui" aria-hidden="true"></span></button>`);
  }
  rows.push(`<button class="row danger" type="button" data-act="forget"><span>${state.forgetArmed ? "Tap again to delete" : "Delete saved data from this browser"}</span></button>`);
  return `<div class="card glow" style="margin-top:12px"><div style="display:flex;gap:12px;align-items:center"><span class="ico g">${ICON.upload}</span><p class="title">Your Letterboxd export</p></div>
      <p class="status">${status}</p>
      <ol class="steps"><li>On <a href="https://letterboxd.com/settings/data/" target="_blank" rel="noopener">letterboxd.com</a>, open Settings → Data.</li>
        <li>Choose Export your data and download the ZIP.</li><li>Import the ZIP here. It stays in this browser.</li></ol>
      <button class="btn green block" type="button" data-act="import">${lib ? "Import a newer export" : "Import export"}</button>
      ${state.importError ? `<p class="status err" role="alert">${esc(state.importError)}</p>` : ""}</div>
    <div data-sitebox="publish">${siteBox("publish")}</div>
    ${sh("Film details")}<div id="lookup"><div class="card">${lookupInner()}</div></div>
    ${sh("This browser")}<div class="group">${rows.join("")}</div>
    ${state.forgetArmed ? `<p class="note">Removes your imported export and looked-up details, plus any keys you typed in. A copy of your diary on the site stays there.</p>` : ""}
    ${lib && !IN_VIEWER ? `<p class="note">A backup file also carries your diary to another device: import it there the same way as an export.</p>` : ""}
    <div class="foot"><p>Credits Roll reads the CSV files in a Letterboxd data export. It is not made by or affiliated with Letterboxd.</p>
      <p>Film details come from The Movie Database (TMDB). This product uses the TMDB API but is not endorsed or certified by TMDB.${IN_VIEWER ? `
      Inside the Claude app, details come from Claude's knowledge of each film instead, so check anything surprising.` : ""}</p>
      <p>Your diary stays in this browser: only film titles and years go to TMDB, to find cast and crew.</p>
      ${VISIT_CODE ? "<p>Visits to this site are counted with GoatCounter: no cookies and nothing personal, only the country and region a visit comes from.</p>" : ""}
      <p>On a computer? <a href="desktop.html">Open the desktop version</a>. It uses the same import.</p>
      <p class="stamp">Updated ${builtText()}</p></div>`;
}

/* ---------- pushed screens ---------- */
function detailScreen(d, s) {
  if (d.type === "data") return dataScreen();
  if (d.type === "reviews") return reviewsScreen();
  if (d.type === "drill") return drillScreen(d.d);
  if (d.type === "watchnext") return watchNextScreen();
  if (d.type === "cat") {
    const data = s[d.field], best = state.catSort === "best";
    const list = best ? data.best : data.most;
    return segBar("catsort", [["most", "Most watched"], ["best", "Highest rated"]], state.catSort, "small") +
      sh(`${fmtN(list.length)} ${d.title.toLowerCase()}`, `<span class="count">${state.scope === "all" ? "All time" : state.scope}</span>`) +
      (list.length ? `<div class="group">${list.map((c) => catRow(c, list[0].count, best)).join("")}</div>` : `<div class="empty">Nothing to show for this period.</div>`);
  }
  return "";
}

// The watchlist, likeliest favourites first, with why.
function watchNextScreen() {
  const W = memo("watchnext", () => watchNext(state.lib));
  if (!W) return `<div class="empty" style="padding-top:28px">Watch next needs a watchlist in your export and five or more rated films.</div>`;
  const list = W.picks.filter((p) => p.known && wnFits(p, state.wn));
  const rows = list.length ? drillBody(wnDrill(list, "Watch next"), 60).html : `<div class="empty">${W.picks.some((p) => p.known) ? "Nothing on your watchlist fits that length." : "Your watchlist films need cast &amp; crew details first, looked up in Settings."}</div>`;
  return chipBar("wn", WN_LENGTHS, state.wn) + `<p class="note">Best bets first: a guess at your rating from how you rate each film's director, leads and genres, and its crowd score.</p>` + rows +
    (W.missing ? `<p class="note">${plural(W.missing, "film")} on your watchlist ${W.missing === 1 ? "has" : "have"} no details yet.</p>` : "");
}
const SCREENS = { profile: profileScreen, diary: diaryScreen, films: filmsScreen, people: peopleScreen, genres: genresScreen, years: (s) => yearsScreen(s), crowd: (s) => crowdScreen(s), insights: () => insightsScreen(), compare: () => compareScreen() };
</script>
<script>
/* ---------- phone: Stats › Years and Stats › Crowd, and the numbers that used to be on the Insights tab ----------
   Year by year, genres year by year, people over the years, against the year before, what was new in a year,
   against the crowd, genres as you rate them, habits. Insights itself is now the study (m06). */
const allInsights = () => memo(`ins|${crowdKey()}`, () => computeInsights(state.lib, metaOf, crowdKey()));
const yearInsights = (Y) => memo(`yins|${Y}|${crowdKey()}`, () => computeYearInsights(state.lib, metaOf, Y, crowdKey(), allInsights()));
const twoYears = (what) => `<div class="empty">${what} need diary entries from at least two years, with five or more films in each.</div>`;

function yearsScreen(s) {
  const head = statsHead();
  if (!s.entries.length) return head + `<div class="empty">No diary entries in this period.</div>`;
  const G = memo(`months|${s.scope}`, () => monthGrid(state.lib, metaOf, s.scope === "all" ? null : s.scope));
  if (s.scope !== "all") return head + mVsPrev(yearInsights(s.scope)) + mMonths(G) + mNewIn(yearInsights(s.scope));
  const I = allInsights();
  return head + mYears(I) + mMonths(G) + (s.withMeta ? mGenreYears(I) + mPeopleYears(I) : needMeta());
}
// Month by month: the grid of every month, then each calendar month across the years (or, for a year, against usual).
function mMonths(G) {
  if (!G) return "";
  const cal = G.cal.filter((c) => c.years), H = monthHiLo(G, cal);
  const rows = cal.map((c, i) => {
    const title = G.Y ? `${c.name} ${G.Y}` : `${c.name}, every year`, rated = c.E.filter((e) => e.rating || e.film.rating);
    const cell = (v, label, h) => `<span class="c${h}"><b>${v}</b><small>${label}</small></span>`;
    return `<div class="yrow"><span class="y">${MONTHS[c.i]}</span>${cell(dlink(monthEnts(title, c.E), fmtN(c.E.length)), "films", H.films[i])}
      ${G.Y ? cell(c.usual != null ? dlink(monthEnts(`${c.name} in your other years`, c.usualE, plural(c.usualYears, "year")), c.usual.toFixed(1)) : "—", "usual", H.year[i])
        : cell(dlink(monthEnts(title, c.E, plural(c.years, "year")), c.perYear.toFixed(1)), "a year", H.year[i])}
      ${cell(c.avg ? dlink(monthEnts(`Rated in ${title}`, rated), c.avg.toFixed(2)) : "—", "average", H.avg[i])}
      ${c.lean ? `<span class="x">Leans to ${leanHtml(c, title)}</span>` : ""}</div>`;
  }).join("");
  const line = monthsLine(G);
  return sh("Month by month") + (line ? `<p class="lead" style="margin:-4px 0 12px">${line}</p>` : "") + `<div class="card mgrid-card">${monthGridHtml(G)}</div>` +
    sh(G.Y ? `Each month of ${esc(G.Y)}` : "Each month, across the years") + `<div class="group">${rows}</div><p class="note">Darker squares are busier months${G.Y ? "; “usual” is the same month in your other years" : ""}. ${HILO_NOTE} Tap any number to see the films.</p>`;
}
function crowdScreen(s) {
  const k = crowdKey();
  if (s.scope === "all") return statsHead() + mCrowd(crowdOf(k, state.lib.films));
  const R = yearInsights(s.scope);
  return statsHead() + mCrowd(crowdOf(k, R.S.films, R.ratingAt), s.scope);
}

const TRENDS = {
  films: { label: "Films", unit: "films", value: (p) => p.films, tip: (p) => `${p.year}: ${plural(p.films, "film")}${p.pace ? `, on pace for about ${fmtN(p.pace)}` : ""}`, extra: (p) => p.pace && p.pace > p.films ? p.pace - p.films : 0 },
  hours: { label: "Hours", unit: "h", value: (p) => Math.round(p.hours), tip: (p) => `${p.year}: ${fmtN(Math.round(p.hours))} hours` },
  rating: { label: "Rating", value: (p) => p.avgRating, tip: (p) => `${p.year}: ${p.avgRating ? starsNum(p.avgRating) : "no ratings"}` },
  age: { label: "Film age", unit: "yrs", value: (p) => p.age, tip: (p) => `${p.year}: ${p.age != null ? Math.round(p.age) + " years old on average" : "—"}` },
  nonEnglish: { label: "Not English", unit: "%", value: (p) => p.nonEnglish, tip: (p) => `${p.year}: ${p.nonEnglish != null ? p.nonEnglish + "% not in English" : "not enough details"}` },
  rewatches: { label: "Rewatches", unit: "%", value: (p) => pctOf(p.rewatches, p.entries), tip: (p) => `${p.year}: ${pctOf(p.rewatches, p.entries)}% of entries were rewatches` },
};
function mYears(I) {
  if (I.years.length < 2) return sh("Year by year") + twoYears("Year-by-year trends");
  const t = TRENDS[state.trend] ? state.trend : "films", T = TRENDS[t];
  const anyPace = t === "films" && I.years.some((p) => p.pace && p.pace > p.films);
  const legend = anyPace ? `<div class="legend"><span><i style="background:var(--green-mark)"></i>Watched</span><span><i style="background:var(--blue-mark)"></i>Rest of this year at your pace</span></div>` : "";
  const chart = colChart(I.years.map((p, i) => ({ a: Math.max(0, T.value(p) || 0), b: T.extra ? T.extra(p) : 0, label: yearTick(i, I.years.length, p.year), year: p.year, tip: T.tip(p), to: p.entries ? yearDrill(p, t) : null })), `${T.label} by year`, legend, 130,
    t === "rating" ? avgYearsChart(I.years) : { unit: T.unit });
  const ys = [...I.years].reverse(), H = yearsHiLo(ys);
  const rows = ys.map((p, i) => {
    const cell = (what, v, label) => `<span class="c${(H[what] || [])[i] || ""}"><b>${v == null ? "—" : dlink(yearDrill(p, what), v)}</b><small>${label}</small></span>`;
    const g = p.topGenre, gf = g && p.F.filter(hasGenre(g[0]));
    const extra = [g ? dlink(D.films(`${g[0]} in ${p.year}`, filmsSub(gf), gf, { scope: p.year }), esc(g[0])) : "",
      p.topDirector && p.topDirector[1] > 1 ? dlink(personDrill(state.lib, p.topDirector[0], "d", p.F), esc(p.topDirector[0])) : "",
      p.nonEnglish != null ? dlink(yearDrill(p, "nonEnglish"), `${p.nonEnglish}% not English`) : ""].filter(Boolean).join(" · ");
    return `<div class="yrow"><span class="y">${dlink(yearDrill(p, "entries"), p.year)}</span>${cell("films", fmtN(p.films) + (p.pace ? `<span class="dim" style="font-weight:500"> →${fmtN(p.pace)}</span>` : ""), "films")}
      ${cell("hours", fmtN(Math.round(p.hours)), "hours")}${cell("rating", p.avgRating ? p.avgRating.toFixed(2) : null, "average")}${extra ? `<span class="x">${extra}</span>` : ""}</div>`;
  }).join("");
  return sh("Year by year") + chipBar("trend", Object.entries(TRENDS).map(([k, x]) => [k, x.label]), t) + `<div class="card" style="margin-top:12px">${chart}</div>` +
    sh("Every year") + `<div class="group">${rows}</div><p class="note">${HILO_NOTE}${ys.some((p) => p.pace) ? " A year still under way isn't marked for its counts." : ""} Tap any number to see what's behind it.</p>`;
}

function mGenreYears(I) {
  if (!I.tastes.table) return sh("Genres year by year") + twoYears("Genres year by year");
  const t = I.tastes.table, years = t.years.slice(-8);
  const max = Math.max(1, ...t.genres.flatMap((g, gi) => years.map((y) => y.shares[gi] || 0)));
  const rows = t.genres.map((g, gi) => `<div class="gshare"><span class="gname">${dlink(catDrill(state.lib, g, "g"), esc(g))}</span><span class="spark">${years.map((y) => {
    const v = y.shares[gi], fs = y.p.F.filter(hasGenre(g)), h = `<span style="height:${v == null ? 0 : Math.max(4, v / max * 100).toFixed(1)}%"></span>`;
    return fs.length ? `<button type="button" ${dl(D.films(`${g} in ${y.year}`, filmsSub(fs, `${v}% of the year's films`), fs, { scope: y.year }))} aria-label="${esc(g)} in ${y.year}: ${v}%" data-tip="${y.year}: ${v}%">${h}</button>` : `<i aria-hidden="true">${h}</i>`; }).join("")}</span></div>`).join("");
  const axis = `<div class="spark-axis"><span></span><div>${years.map((y) => `<span>’${y.year.slice(2)}</span>`).join("")}</div></div>`;
  return sh("Genres year by year") + `<div class="group">${rows}${axis}</div><p class="note">Each bar is the share of that year's films in the genre. Tap one to see those films.</p>`;
}

function mGenres(I) {
  if (!I.genres.length) return "";
  const max = Math.max(0.5, ...I.genres.map((g) => Math.abs(g.vsCrowd || 0)), ...I.genres.map((g) => Math.abs(g.vsMe)));
  const bar = (d) => d == null ? `<span class="dim">—</span>` : `<span class="dbar" aria-hidden="true"><span class="mid"></span><span class="fill ${d >= 0 ? "pos" : "neg"}" style="width:${Math.min(50, Math.abs(d) / max * 50).toFixed(1)}%"></span></span>`;
  const H = genresHiLo(I.genres);
  const rows = I.genres.map((g, i) => `<button class="grow" type="button" data-list="${reg(g.name, `${plural(g.count, "film")} · ${g.mine.toFixed(2)} average`, g.films)}">
    <span style="min-width:0"><span class="nm">${esc(g.name)}</span><span class="sub"><span class="${H.count[i].trim()}">${plural(g.count, "film")}</span> · <span class="${H.mine[i].trim()}">★ ${g.mine.toFixed(2)}</span></span></span>
    <span class="gcol">${bar(g.vsMe)}<span class="v${H.vsMe[i]}">${signed(g.vsMe, 2)}</span></span><span class="gcol">${bar(g.vsCrowd)}<span class="v${H.vsCrowd[i]}">${g.vsCrowd == null ? "" : signed(g.vsCrowd, 2)}</span></span>${CHEV}</button>`).join("");
  return sh("Genres as you rate them") + `<div class="ghead"><span></span><span>vs your avg</span><span>vs ${esc(I.crowd.short)}</span><span></span></div><div class="group">${rows}</div>
    <div class="legend" style="margin-top:10px"><span><i style="background:var(--green-mark)"></i>Higher</span><span><i style="background:var(--blue-mark)"></i>Lower</span><span>in stars</span></div><p class="note">${HILO_NOTE}</p>`;
}

function mPeopleYears(I) {
  const P = I.people;
  const row = (p, i, value, sub) => `<button class="prow" type="button" data-list="${reg(p.name, sub(p), p.films, p)}">
    <span class="rk">${i + 1}</span>${avatar(p, "md")}<span style="min-width:0"><span class="nm">${esc(p.name)}</span><span class="sub">${esc(sub(p))}</span></span>
    <span class="val">${value}</span>${CHEV}</button>`;
  const obs = [...P.obsDirectors.map((p) => ({ ...p, role: "Director" })), ...P.obsActors.map((p) => ({ ...p, role: "Actor" }))].sort((a, b) => b.inLatest - a.inLatest).slice(0, 6);
  const comp = [...P.compDirectors.map((p) => ({ ...p, role: "Director" })), ...P.compActors.map((p) => ({ ...p, role: "Actor" }))].sort((a, b) => b.years.size - a.years.size || b.count - a.count).slice(0, 6);
  let html = "";
  if (obs.length) html += sh(`New in ${I.latest}`) + `<div class="group">${obs.map((p, i) => row(p, i, `${p.inLatest}`, (q) => `${q.role} · ${plural(q.inLatest, "film")} in ${I.latest}, none before`)).join("")}</div>`;
  if (comp.length) html += sh("Long-time companions") + `<div class="group">${comp.map((p, i) => row(p, i, `${p.years.size}y`, (q) => `${q.role} · ${plural(q.years.size, "year")} of your diary`)).join("")}</div>`;
  if (P.discoveries.length >= 2) html += sh("Directors discovered each year") + `<div class="card">` +
    colChart(P.discoveries.map((d, i) => ({ a: d.count, b: 0, label: yearTick(i, P.discoveries.length, d.year), tip: `${d.year}: ${plural(d.count, "new director")}`,
      to: d.count && D.names(`Directors new in ${d.year}`, plural(d.count, "director"), d.people, { faces: true }) })), "New directors by year", "", 80, { unit: "new" }) + `</div>`;
  return html;
}

function mHabits(habits, title) {
  if (!habits.length) return "";
  const go = '<span class="go" aria-hidden="true">&nbsp;›</span>';
  return sh(title) + `<div class="facts" style="margin-top:0">${habits.map((h) => { const inner = `<span class="k">${esc(h.k)}</span><span class="v">${esc(h.v)}</span><span class="t">${esc(h.text)}${h.to ? go : ""}</span>`;
    return h.to ? `<button class="fact" type="button" ${dl(h.to)}>${inner}</button>` : `<div class="fact">${inner}</div>`; }).join("")}</div>`;
}

/* ----- one year ----- */
function mVsPrev(R) {
  const prevY = String(+R.Y - 1);
  if (!R.changes.length) return sh(`Against ${prevY}`) + `<div class="empty">No diary entries in ${prevY} to compare with.</div>`;
  return sh(`${esc(R.Y)} against ${prevY}`) + `<div class="group"><div class="crow head"><span></span><span class="n">${esc(R.Y)}</span><span class="n">${prevY}</span><span></span></div>${R.changes.map((c) =>
    `<div class="crow"><span>${dlink(c.to, c.label)}</span><span class="n">${dlink(c.to.groups[0], c.now)}</span><span class="n dim">${dlink(c.to.groups[1], c.before)}</span><span class="d ${Math.abs(c.d) < 1e-9 ? "" : c.d > 0 ? "up" : "down"}">${Math.abs(c.d) < 1e-9 ? "=" : c.d > 0 ? "▲" : "▼"}</span></div>`).join("")}</div>
    <p class="note">Tap any number to see what's behind it.</p>` + (R.genreLines.length ? sh("Genres") + mLines(R.genreLines, (l) => l.dir === "up" ? "▲" : "▼") : "");
}
function mNewIn(R) {
  const Y = R.Y;
  if (R.firstYear === Y) return "";
  const prow = (items) => `<div class="group">${items.map((p, i) => `<button class="prow" type="button" data-list="${reg(p.name, filmsTitle(p), p.films, p)}"><span class="rk">${i + 1}</span>${avatar(p, "md")}
    <span style="min-width:0"><span class="nm">${esc(p.name)}</span><span class="sub">first time in your diary</span></span><span class="val">${p.count}</span>${CHEV}</button>`).join("")}</div>`;
  let h = "";
  if (R.discDirectors.length) h += sh(`New directors in ${esc(Y)}`) + prow(R.discDirectors.slice(0, 5));
  if (R.discActors.length) h += sh(`New actors in ${esc(Y)}`) + prow(R.discActors.slice(0, 5));
  const newOnes = (label, list, field) => list.length ? `${label}: ${list.map((v) => { const fs = R.S.films.filter((f) => { const m = metaOf(f); return m && (field === "l" ? m.l === v : m[field].includes(v)); });
    return dlink(D.films(`${v} in ${Y}`, filmsSub(fs), fs, { scope: Y }), esc(v)); }).join(", ")}.` : "";
  if (R.newCountries.length || R.newLangs.length) h += sh("New places and languages") + `<p class="lead">${newOnes("Countries", R.newCountries, "k")} ${newOnes("Languages", R.newLangs, "l")}</p>`;
  return h;
}

function mCrowd(C, Y) {
  // only the crowds this diary has scores from, and no switch at all when there's just one
  const crowds = Object.entries(CROWDS).filter(([k]) => (C.available[k] || 0) >= (Y ? 3 : 5) || k === C.key);
  const toggles = crowds.length > 1 ? chipBar("crowdsel", crowds.map(([k, c]) => [k, c.short]), C.key) : "";
  if (C.n < (Y ? 3 : 5)) {
    const why = Y ? `Comparing with the crowd needs three or more rated films with crowd scores in ${esc(Y)}.`
      : IN_VIEWER ? `Crowd scores come from TMDB and OMDb, which pages inside Claude can't reach. Open <a href="https://sjnift.github.io/bogie1946/" target="_blank" rel="noopener">the web version</a>.`
      : C.key === "tmdb" ? "Crowd scores come with TMDB details. Look your films up in Settings."
      : C.key === "letterboxd" ? "Letterboxd averages need an Apify token, added in Settings." : "IMDb and critics' scores need a free OMDb key, added in Settings.";
    return toggles + `<div class="empty">${why}</div>` + lbHint(true);
  }
  const cap = (p) => `<span class="pmeta"><span class="stars">${stars(p.you)}</span></span><span class="mdate">${C.short} ${crowdScore(C.key, p.crowd)} · <b class="dv">${signed(p.diff)}★</b></span>`;
  let html = toggles + `<div class="card glow" style="margin-top:12px"><p class="lead" style="margin:0">${Y ? `In ${esc(Y)} you gave` : "You give"} <b class="dv">${Math.abs(C.meanDiff).toFixed(2)}★ ${C.meanDiff >= 0 ? "more" : "less"}</b> than ${esc(C.label)} on average${Y ? "" : followText(C.r)}, across ${dlink(C.to, plural(C.n, "film"))}.</p>${apartLine(C).replace('<p class="status">', '<p class="note" style="margin:8px 0 0">')}</div>`;
  html += sh(`Liked more than ${esc(C.short)}`) + (C.higher.length ? mPosters(C.higher, cap) : `<div class="empty">No film you rated ${starPart(crowdAbove())} or more above them.</div>`);
  html += sh(`Liked less than ${esc(C.short)}`) + (C.lower.length ? mPosters(C.lower, cap) : `<div class="empty">No film you rated ¾★ or more below them.</div>`);
  if (C.gems.length) html += sh("Hidden gems") + `<p class="note" style="margin:-4px 0 12px">Rated 4½★ or more by you, and by few others.</p>` +
    mPosters(C.gems, (g) => `<span class="pmeta"><span class="stars">${stars(g.f.rating)}</span></span><span class="mdate">${fmtN(g.pop.n)} ${g.pop.src} votes</span>`);
  return lbHint(true) + html;
}
</script>
<script>
/* ---------- phone: Insights, a study of the diary (worked out in 06k-study.js). The year chips pick all years or
   one; the tabs under them pick a section. ---------- */
const INS_TABS = [["overview", "In short"], ["chapters", "Chapters"], ["months", "Months"], ["taste", "Taste"], ["ratings", "Ratings"], ["threads", "Threads"], ["habits", "Habits"]];
const YEAR_TABS = [["overview", "In short"], ["apart", "Stood out"], ["ratings", "Ratings"], ["threads", "Threads"], ["habits", "Habits"]];
// the crowd picked with the chips, or the one with the most scores
const crowdKey = () => state.crowd || memo("crowd", () => defaultCrowd(state.lib, metaOf));
const allStudy = () => memo(`study|${crowdKey()}`, () => computeStudy(state.lib, metaOf, crowdKey()));
const yearStudy = (Y) => memo(`ystudy|${Y}|${crowdKey()}`, () => computeYearStudy(state.lib, metaOf, crowdKey(), Y, allStudy()));
function insightsScreen() {
  const lib = state.lib;
  const head = ltitle("Insights") + scopeBar("All years");
  if (!lib.entries.length) return head + `<div class="empty" style="padding-top:28px">Insights come from your diary dates, and this diary has none yet.</div>`;
  if (state.scope !== "all") {
    if (!YEAR_TABS.some(([k]) => k === state.yearTab)) state.yearTab = "overview";
    return head + utabs("ytab", YEAR_TABS, state.yearTab) + mYearInsights(state.scope, state.yearTab);
  }
  if (!INS_TABS.some(([k]) => k === state.insTab)) state.insTab = "overview";
  return head + utabs("instab", INS_TABS, state.insTab) + mAllInsights(state.insTab);
}
function mAllInsights(tab) {
  const lib = state.lib, S = allStudy();
  if (tab === "chapters") return mChapters(S.chapters, S.n);
  if (tab === "months") return mMonthsIns(S.months);
  if (tab === "taste") return mDrift(S.drift);
  if (tab === "ratings") return mRatings(S.ratings);
  if (tab === "threads") return mThreads(S.threads);
  if (tab === "habits") return sh("Habits, and what they say") + mFindings(S.habits, "No habit stands out clearly yet.");
  const intro = `<p class="lead" style="margin-top:16px">A study of ${dlink(D.entries("Your diary", entriesSub(lib.entries), lib.entries), plural(S.n.entries, "diary entry", "diary entries"))}, ${fmtDate(S.n.from)} to ${fmtDate(S.n.to)}. Only clear patterns are reported; tap any of them to see the films behind it.</p>`;
  return intro + (S.overview.length ? mGlance(S.overview, "In short") : `<div class="empty">No clear patterns yet. They'll show as your diary grows.</div>`);
}
const go = '<span class="go" aria-hidden="true">&nbsp;›</span>';
// sentences that open the data they describe
const mLines = (lines, mark) => lines.length ? `<div class="lines">${lines.map((l) => `<div class="tline"><span class="mk ${l.dir || ""}" aria-hidden="true">${mark(l)}</span><span>${dline(l.to, esc(l.text))}</span></div>`).join("")}</div>` : "";
// findings: a short name over the sentence that opens its films
const mFindings = (list, empty) => list.length ? `<div class="finds">${list.map((f) => `<div class="find">${f.big ? `<span class="fk">${esc(f.big)}</span>` : ""}${dline(f.to, esc(f.text))}</div>`).join("")}</div>`
  : `<div class="empty">${empty}</div>`;
// posters that open their films
const mPosters = (items, cap) => `<div class="pgrid">${items.map((x) => `<button class="pitem" type="button" ${dl(D.film(x.f))}>${poster(x.f)}${cap(x)}</button>`).join("")}</div>`;
const mStrip = (films) => films.length ? `<div class="scroller">${films.slice(0, 8).map((f) => posterItem(f)).join("")}</div>` : "";

function mGlance(glance, title) {
  if (!glance.length) return "";
  return sh(title) + `<div class="icards">${glance.map((g, i) => { const wide = String(g.big).length > 12 || String(g.text).length > 60 || (glance.length % 2 && i === glance.length - 1);
    const inner = `<span class="k">${esc(g.k)}</span><span class="big">${esc(g.big)}</span><span class="p">${esc(g.text)}${g.to ? go : ""}</span>`;
    return g.to ? `<button class="icard${wide ? " wide" : ""}" type="button" ${dl(g.to)}>${inner}</button>` : `<div class="icard${wide ? " wide" : ""}">${inner}</div>`; }).join("")}</div>`;
}

function mChapters(chs, n, title = "Chapters") {
  if (!chs.length) return sh(title) + `<div class="empty">No stretch ${n ? "of your diary" : "of the year"} stands apart clearly enough yet.</div>`;
  const st = n && n.from ? chapterStrip(chs, n.from, n.to) : null;
  const bar = st ? `<div class="ch-strip" aria-hidden="true">${st.years.map((y) => `<span class="yr" style="left:${(y.at * 100).toFixed(2)}%"><i>’${String(y.y).slice(2)}</i></span>`).join("")}
    ${st.items.map((x) => `<button class="seg" type="button" tabindex="-1" ${dl(x.c.to)} style="left:${(x.left * 100).toFixed(2)}%;width:${(x.width * 100).toFixed(2)}%"></button>`).join("")}</div>` : "";
  return sh(title) + (n ? `<p class="note" style="margin:-4px 0 12px">Stretches of your diary that stood apart from the rest of it.</p>` : "") + bar +
    chs.map((c) => `<div class="card chap"><span class="eyebrow">${esc(c.span)} · ${plural(c.n, "film")}</span><p class="ctitle">${dlink(c.to, esc(c.title))}</p>
      <p class="ctext">${dline(c.to, esc(c.text))}</p>${mStrip(c.posters)}</div>`).join("");
}

// Through the year: each month's pace against your usual, then what stands out about the months over the years.
function mMonthsIns(M) {
  const h = sh("Through the year");
  if (!M.enough) return h + `<div class="empty">This needs a year or more of diary, with every month of the year in it.</div>`;
  const card = (x) => `<div class="card chap"><p class="ctext">${dline(x.to, esc(x.text))}</p>${mStrip(x.posters)}</div>`;
  return h + `<p class="note" style="margin:-4px 0 12px">How fast you watch in each month across your years, against your usual pace. Tap a month for its films.</p><div class="card">${paceChart(M, 96, 4)}</div>` +
    mFindings(M.pace, "") + (M.shifts.length ? sh("How your year has changed") + mFindings(M.shifts, "") : "") +
    (M.leans.length ? sh("What the months bring") + M.leans.map(card).join("") : "") +
    (M.ratings.length ? sh("Ratings through the year") + mFindings(M.ratings, "") : "");
}
function mDrift(d) {
  if (!d.enough) return sh("How your taste has moved") + `<div class="empty">Changes in taste need a few years of diary, or a year or two with plenty of films.</div>`;
  const rows = d.list.map((x) => { const c = driftCols(x);
    return `<div class="card drift"><p class="ctitle">${dlink(x.to, esc(x.big))}</p><p class="ctext">${dline(x.to, esc(x.text))}</p>${colChart(c.cols, x.big, "", 48, { grid: c.grid, unit: c.unit })}</div>`; }).join("");
  return sh("How your taste has moved") + `<p class="note" style="margin:-4px 0 12px">Your first years of diary against your latest. Each column is a stretch of it; tap one for its films.</p>` +
    (rows || `<p class="lead">No clear, lasting change in what you watch: your taste has held its course.</p>`) +
    (d.steady.length ? sh("What hasn't changed") + mLines(d.steady, () => "=") : "");
}

function mRatings(R) {
  if (R.n < 20) return sh("What your ratings follow") + `<div class="empty">This needs at least 20 rated films with cast &amp; crew details.</div>`;
  let h = "";
  // bars against at least 25%, so a small share never fills the bar
  const shown = R.follow.filter((f) => f.pct >= FOLLOW_MIN), max = Math.max(25, ...shown.map((f) => f.pct));
  if (shown.length) h += sh("What your ratings follow") + `<p class="lead" style="margin:-4px 0 12px">${esc(R.followText || "")}</p><div class="group">${shown.map((f) =>
    `<button class="prow cat" type="button" ${dl(f.to)}><span class="nm">${esc(f.label)}</span><span class="mini" aria-hidden="true"><span style="width:${(f.pct / max * 100).toFixed(1)}%"></span></span>
    <span class="val" style="text-align:right">${f.pct}%</span>${CHEV}</button>`).join("")}</div>
    <p class="note">How much of the ups and downs in your ratings each accounts for, each film guessed from the others that share it. Tap one for your averages.</p>`;
  const B = R.beyond, them = B.vsCrowd ? "the crowd does" : "usual";
  if (B.up.length) h += sh(`You like more than ${them}`) + mLines(B.up.map((x) => ({ ...x, dir: "up" })), () => "▲");
  if (B.down.length) h += sh(`You like less than ${them}`) + mLines(B.down.map((x) => ({ ...x, dir: "down" })), () => "▼");
  if (R.judge.length) h += sh("Tougher, or choosier?") + mFindings(R.judge, "");
  if (R.steady.length || R.divide.length) h += sh("Directors") + mLines([...R.steady.map((x) => ({ ...x, m: "★" })), ...R.divide.map((x) => ({ ...x, m: "↕" }))], (x) => x.m);
  return h || `<div class="empty">Nothing clear in your ratings yet.</div>`;
}

function mThreads(T, empty = "No film has led to a run of others yet: four or more by one person within a few months.") {
  let h = "";
  const card = (x) => `<div class="card chap"><p class="ctext">${dline(x.to, esc(x.text))}</p>${mStrip(x.films)}</div>`;
  if (T.gateways.length) h += sh("Doors that opened") + T.gateways.map(card).join("");
  if ((T.chains || []).length) h += sh("Chains") + `<p class="note" style="margin:-4px 0 12px">Runs where each film shared someone with one you'd watched in the days before.</p>` + T.chains.map(card).join("");
  return h || `<div class="empty">${empty}</div>`;
}

/* ----- one year ----- */
function mYearInsights(Y, tab) {
  const lib = state.lib, R = yearStudy(Y);
  if (tab === "apart") {
    let h = sh(`What set ${esc(Y)} apart`);
    h += R.differ.length ? R.differ.map((d) => `<div class="card chap"><p class="ctitle">${dlink(d.to, esc(d.big))}</p><p class="ctext">${dline(d.to, esc(d.text))}</p>${mStrip(d.posters)}</div>`).join("")
      : `<div class="empty">${R.first ? `${esc(Y)} is where your diary starts, so there's little to compare it with.` : `Nothing about ${esc(Y)} stands out clearly from your other years.`}</div>`;
    const films = [...new Set(lib.entries.filter((e) => e.date.startsWith(Y)).map((e) => e.film))];
    const newOnes = (label, list, field) => list.length ? `${label}: ${list.map((v) => { const fs = films.filter((f) => { const m = metaOf(f); return m && (field === "l" ? m.l === v : m[field].includes(v)); });
      return dlink(D.films(`${v} in ${Y}`, filmsSub(fs), fs, { scope: Y }), esc(v)); }).join(", ")}.` : "";
    if (R.newCountries.length || R.newLangs.length) h += sh("First seen this year") + `<p class="lead">${newOnes("Countries", R.newCountries, "k")} ${newOnes("Languages", R.newLangs, "l")}</p>`;
    const title = `${esc(Y)}, month by month`, seasons = R.seasons.length ? (R.chapters.length ? sh("Season by season") : "") + mLines(R.seasons, () => "◆") : "";
    return h + (R.chapters.length ? mChapters(R.chapters, null, title) : sh(title) + (seasons ? "" : `<div class="empty">No stretch of ${esc(Y)} stands apart: you kept much the same mix all year.</div>`)) + seasons;
  }
  if (tab === "ratings") return sh(`Ratings in ${esc(Y)}`) + mFindings(R.ratings, `Not enough rated films in ${esc(Y)}.`);
  if (tab === "threads") return mThreads(R.threads, `No run of films by one person began in ${esc(Y)}.`);
  if (tab === "habits") return sh(`Habits in ${esc(Y)}`) + mFindings(R.habits, `${esc(Y)} was much like your other years.`);
  const es = lib.entries.filter((e) => e.date.startsWith(Y));
  return `<p class="lead" style="margin-top:16px">How ${dlink(D.entries(`Diary of ${Y}`, entriesSub(es), es), `${esc(Y)}'s ${plural(es.length, "diary entry", "diary entries")}`)} compared with the rest of your diary.</p>` +
    (es.length ? `<div class="storyrow" style="margin-top:14px"><button class="btn green" type="button" ${dl(D.story(Y))}>${ICON.next}Play ${esc(Y)} as a story</button>
      <button class="btn" type="button" ${dl(D.share(Y))}>${ICON.share}Share ${esc(Y)} as an image</button></div>` : "") +
    (R.overview.length ? mGlance(R.overview, `${esc(Y)} in short`) : `<div class="empty">Nothing about ${esc(Y)} stands out clearly from your other years yet.</div>`);
}
</script>
<script>
/* ---------- phone: Compare, a tab of its own. Friend chips at the top; a pair splits into sections. ---------- */
const CMP_TABS = [["overview", "Overview"], ["films", "Films"], ["ratings", "Ratings"], ["people", "People"], ["picks", "Picks"], ["habits", "Habits"]];
function compareScreen() {
  const profiles = memo("profiles", () => comparePeople().map((p) => tasteProfile(p, metaOf)));
  const friends = profiles.slice(1);
  if (state.cmp === "all" ? friends.length < 2 : !friends.some((f) => f.id === state.cmp)) state.cmp = friends.length ? friends[0].id : null;
  const ex = state.mode === "example";
  const sel = friends.find((f) => f.id === state.cmp);
  const chips = friends.length || !ex ? `<div class="chips" role="group" aria-label="Friends">${friends.map((f) =>
    `<button class="chip" type="button" data-cmp="${esc(f.id)}" aria-pressed="${state.cmp === f.id}">${avatar({ name: f.name }, "xs")}${esc(f.name)}</button>`).join("")}
    ${friends.length >= 2 ? `<button class="chip" type="button" data-cmp="all" aria-pressed="${state.cmp === "all"}">Everyone</button>` : ""}
    ${ex ? "" : `<button class="chip add" type="button" data-act="add-friend"${MY_LIB ? "" : " disabled"}>${ICON.plus}Add a friend</button>`}</div>` : "";
  const note = ex ? "These are made-up example friends. Import your own export first, then add friends' exports here."
    : friends.length ? "Friends' exports stay in this browser." : "Ask a friend for their Letterboxd export (Settings → Data → Export your data), then add the ZIP here. Add as many friends as you like. Their exports stay in this browser.";
  const remove = sel && !sel.example ? ` <button class="linkish" type="button" data-unfriend="${esc(sel.id)}">${state.unfriend === sel.id ? `Tap again to remove ${esc(sel.name)}` : `Remove ${esc(sel.name)}`}</button>` : "";
  const head = ltitle("Compare") + chips + `<p class="note">${note}${remove}</p>
    ${!ex && !friends.length ? `<button class="btn green block" type="button" data-act="add-friend" style="margin-top:14px"${MY_LIB ? "" : " disabled"}>${ICON.plus}Add a friend's export</button>` : ""}
    ${state.cmpError ? `<p class="status err" role="alert" style="margin-top:10px">${esc(state.cmpError)}</p>` : ""}
    ${friendsSaveFailed ? `<p class="status err">This browser wouldn't save your friends' exports.</p>` : ""}${tasteOfferHtml(true)}`;
  if (state.cmp === "all") return head + mGroup(profiles);
  if (sel) {
    if (!CMP_TABS.some(([k]) => k === state.cmpTab)) state.cmpTab = "overview";
    return head + utabs("cmptab", CMP_TABS, state.cmpTab) + mPair(memo(`pair|${sel.id}`, () => comparePair(profiles[0], sel, metaOf)), state.cmpTab);
  }
  return head;
}

const mFilms = (items, empty, cap, card) => items.length ? `<div class="pgrid">${items.map((x) => `<button class="pitem" type="button" ${dl(card(x.f))}>${poster(x.f)}${cap(x)}</button>`).join("")}</div>` : `<div class="empty">${empty}</div>`;
const twoStars = (B) => (x) => `<span class="mdate">You <span class="stars">${stars(x.a)}</span></span><span class="mdate">${esc(B.name)} <span class="stars">${stars(x.b)}</span></span>`;
// the taste match as a ring
const ring = (score) => { const r = 44, c = 2 * Math.PI * r;
  return `<span class="ring" aria-hidden="true"><svg viewBox="0 0 104 104"><circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="9"/>
    <circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--green)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c * score / 100).toFixed(1)} ${c.toFixed(1)}"/></svg><b>${score}</b></span>`; };

function mPair(C, tab) {
  const { A, B, match, to } = C;
  if (tab === "films") return sh("You both loved") + mFilms(C.bothLoved, "No film you both rated 4½★ or more.", twoStars(B), to.card) +
    sh("You rated higher") + mFilms(C.aHigher, `Nothing you rated 1½★ or more above ${esc(B.name)}.`, twoStars(B), to.card) +
    sh(`${esc(B.name)} rated higher`) + mFilms(C.bHigher, `Nothing ${esc(B.name)} rated 1½★ or more above you.`, twoStars(B), to.card) +
    `<p class="note">${dlink(to.apart, "Every film you've both rated, furthest apart first")}</p>` + mBothReviewed(A, B, to.card);
  if (tab === "ratings") {
    let h = "";
    if (A.rated.length && B.rated.length) {
      const mx = Math.max(1, ...A.spread, ...B.spread);
      h += sh("Rating style") + `<div class="card"><div class="legend"><span><i style="background:var(--green-mark)"></i>You · ${A.avg.toFixed(2)} avg</span><span><i style="background:var(--blue-mark)"></i>${esc(B.name)} · ${B.avg.toFixed(2)} avg</span></div>
        <div class="phist" role="group" aria-label="Share of each person's ratings at each half-star">${A.spread.map((a, i) => `<button class="pgroup" type="button" ${a || B.spread[i] ? dl(to.stars((i + 1) / 2)) : "disabled"} aria-label="${stars((i + 1) / 2)}: you ${Math.round(a)}%, ${esc(B.name)} ${Math.round(B.spread[i])}%">
          <span class="pa" style="height:${(a / mx * 100).toFixed(1)}%"></span><span class="pb" style="height:${(B.spread[i] / mx * 100).toFixed(1)}%"></span></button>`).join("")}</div>
        <div class="hist-ends"><span class="stars">½</span><span class="stars">★★★★★</span></div></div>`;
    }
    if (C.topGenres.length) {
      const gmax = Math.max(1, ...C.topGenres.map((g) => Math.max(g.a, g.b)));
      h += sh("Genres", `<span class="count">share of each diary</span>`) + `<div class="group">${C.topGenres.map((g) => `<button class="gpair" type="button" ${dl(to.genre(g.g))}><span class="gname">${esc(g.g)}</span><span class="gbars"><span class="ga" style="width:${(g.a / gmax * 100).toFixed(1)}%"></span><span class="gb" style="width:${(g.b / gmax * 100).toFixed(1)}%"></span></span>
        <span class="gv">${Math.round(g.a)}·${Math.round(g.b)}%</span></button>`).join("")}</div>`;
    }
    return h || `<div class="empty">Not enough ratings to compare yet.</div>`;
  }
  if (tab === "people") {
    const rows = (items, val, toOf) => `<div class="group">${items.map((x) => `<button class="kv" type="button" ${dl(toOf(x))}><span>${esc(x.name || x[0])}</span><span>${val(x)}</span></button>`).join("")}</div>`;
    let h = "";
    if (C.directors.shared.length) h += sh("Directors you both watch") + rows(C.directors.shared, (x) => `you ${x.a} · ${esc(B.name)} ${x.b}`, (x) => to.person(x.name, "d"));
    if (C.actors.shared.length) h += sh("Actors you both watch") + rows(C.actors.shared, (x) => `you ${x.a} · ${esc(B.name)} ${x.b}`, (x) => to.person(x.name, "c"));
    return h || `<div class="empty">No director or actor you've both watched more than once yet.</div>`;
  }
  if (tab === "picks") {
    const recCap = (who) => (x) => `<span class="pmeta"><span class="stars">${stars(x.f.rating)}</span></span><span class="mdate">${who}${x.onWatchlist ? " · on your watchlist" : ""}</span>`;
    return sh(`For you, from ${esc(B.name)}`) + mFilms(C.forA, `Nothing ${esc(B.name)} rated 4★ or more that you haven't seen.`, recCap(esc(B.name)), to.card) +
      sh(`For ${esc(B.name)}, from you`) + mFilms(C.forB, `Nothing you rated 4★ or more that ${esc(B.name)} hasn't seen.`, recCap("You"), to.card) +
      sh("Watch together") + (C.together.length ? `<div class="group">${C.together.map((w) => `<a class="kv" href="${esc(lbUrl(w))}" target="_blank" rel="noopener"><span>${esc(w.name)}</span><span>${w.year || ""} ↗</span></a>`).join("")}</div>` : `<div class="empty">No film is on both of your watchlists.</div>`);
  }
  if (tab === "habits") return sh("Habits") + `<div class="group"><div class="crow head"><span></span><span class="n">You</span><span class="n">${esc(B.name)}</span><span></span></div>${habitRows(C).map(([k, a, b]) =>
    `<div class="crow"><span>${k}</span><span class="n">${a}</span><span class="n">${b}</span><span></span></div>`).join("")}</div><p class="note">Tap any number to see what's behind it.</p>`;
  const o = C.overlap, tot = o.onlyA + o.both + o.onlyB || 1;
  const seg = (cls, n, d) => n ? `<span class="${cls}" role="button" tabindex="0" ${dl(d)} style="flex:${n / tot}"></span>` : "";
  let h = match.score != null ? `<button class="icard wide" type="button" ${dl(to.rated)} style="margin-top:16px"><span class="vs">${ring(match.score)}<span style="display:grid;gap:4px"><span class="k">Taste match with ${esc(B.name)}</span>
      <span class="big">${matchWords(match.score)}</span><span class="p">${match.score}/100, from how close your ratings are on the ${plural(match.n, "film")} you've both rated.${go}</span></span></span></button>`
    : `<div class="empty">A taste match needs five or more films you've both rated. You have ${dlink(match.n && to.rated, match.n)}.</div>`;
  if (match.score != null) h += `<button class="btn block" type="button" ${dl(D.shareMatch(B.id, B.name))} style="margin-top:10px">${ICON.share}Share your taste match as a picture</button>`;
  h += sh("Overlap") + `<div class="card"><div class="venn" aria-label="${o.onlyA} only you, ${o.both} both, ${o.onlyB} only ${esc(B.name)}">

<script>

let SSTACK = [];

  sheet.innerHTML = head + `<div class="sheet-body${how && !REDUCED ? ` ${how === "back" ? "back" : "enter"}` : ""}">${html}</div>` + foot;
  if (!sheet.open) { sheet.classList.remove("closing"); sheet.style.transform = ""; if (typeof sheet.showModal === "function") sheet.showModal(); else sheet.setAttribute("open", ""); }
  const body = sheet.querySelector(".sheet-body");

// From a screen a drill opens the sheet; from inside the sheet it stacks, with Back.
function openSheet(d, inside) {

}
// Slides the sheet away, then closes it (the history steps back when it has closed).
function closeSheet() {

}
// Pull the sheet down by its top, or by its list when that's scrolled to the top, to close it.
function bindSheetDrag(sheet) {

  sheet.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1 || sheet.classList.contains("closing")) return;
    const body = sheet.querySelector(".sheet-body"), grab = !!e.target.closest(".sheet-grab");
    if (!grab && !(body && body.contains(e.target) && body.scrollTop <= 0)) return;
    if (e.target.closest("input")) return;
    drag = { y: e.touches[0].clientY, t: e.timeStamp, dy: 0, active: false, body };
  }, { passive: true });
  sheet.addEventListener("touchmove", (e) => {
    if (!drag) return;
    const dy = e.touches[0].clientY - drag.y;
    if (!drag.active) {
      if (dy > 8 && (!drag.body || drag.body.scrollTop <= 0)) { drag.active = true; drag.y += dy; drag.t = e.timeStamp; }
      else if (dy < -4) { drag = null; return; } else return;
    }
    e.preventDefault();
    drag.dy = Math.max(0, e.touches[0].clientY - drag.y);

}
function drillScreen(d) {

    <div class="drill-page">${html}</div>
    ${hidden ? `<button class="row" type="button" data-drillmore data-auto style="padding-inline:0"><span>Show more</span><span class="count">${fmtN(hidden)} more</span>${CHEV}</button>` : ""}`;
}

<script>
/* ---------- phone: addresses you can bookmark, and the back button ----------
   #/profile, #/diary, #/films, #/people, #/genres for the tabs; #/insights/2024 for Insights of a year;
   #/compare/<friend>; #/data (settings), #/reviews, #/watchnext and #/list for pushed screens; /film/<film> on

   steps back the way it came. */
let sheetDepth = 0, closingByHistory = false, afterClose = null, routeReady = false, routeReplace = false;
const PUSHED = { data: "Settings", reviews: "Reviews", watchnext: "Watch next" };
function routeBase() {
  const top = state.stack[state.stack.length - 1];
  if (!top) {
    if (state.view === "insights") return `#/insights${state.scope !== "all" ? "/" + state.scope : ""}`;
    if (state.view === "compare") return `#/compare${state.cmp ? "/" + encodeURIComponent(state.cmp) : ""}`;
    return `#/${state.view}`;
  }
  return PUSHED[top.type] ? `#/${top.type}` : "#/list";
}
const hashParts = () => {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, "")), m = h.match(/^(.*?)\/?film\/(.+)$/);
  return m ? { base: m[1], film: m[2] } : { base: h, film: null };
};
const filmHash = (key) => `${routeBase().replace(/\/$/, "")}/film/${encodeURIComponent(key)}`;
function routeFromHash() {
  const [a, b] = hashParts().base.split("/");
  if (!a) return;
  if (TOP_VIEWS.includes(a)) {
    Object.assign(state, { view: a, stack: [] });
    if (STATS_VIEWS.includes(a)) state.statsView = a;
    if (a === "insights") state.scope = b || "all";
    if (a === "compare" && b) state.cmp = b;
    return;
  }
  if (PUSHED[a]) {
    const top = state.stack[state.stack.length - 1];
    if (!top || top.type !== a) state.stack = [{ type: a, title: PUSHED[a], ret: 0 }];
  } else if (a === "list" && !(state.stack.length && state.stack[state.stack.length - 1].type === "drill")) state.stack = [];
}
// After a render: a new tab or screen becomes a history entry; a new year or friend replaces the address.
function syncHash(replace) {
  if (!routeReady || sheetDepth) return;
  const want = routeBase();
  if (`#/${hashParts().base}` === want) return;
  try { replace || routeReplace ? history.replaceState(history.state, "", want) : history.pushState({ app: 1 }, "", want); } catch {}
}
function pushSheetState() {
  const d = SSTACK[SSTACK.length - 1];
  try { history.pushState({ sheet: SSTACK.length }, "", d.kind === "film" && d.film ? filmHash(d.film.key) : routeBase()); sheetDepth = SSTACK.length; } catch { sheetDepth = 0; }
}
// Closes the sheet and takes its history entries with it, then runs `next`.
function closeSheetThen(next) {
  const sheet = $("#sheet");
  if (!sheet.open) { next && next(); return; }
  const n = sheetDepth;
  closingByHistory = true; sheet.close();

}
function onSheetClosed() {
  SSTACK = []; PANEL = new Map();
  if (!closingByHistory && sheetDepth) { const n = sheetDepth; sheetDepth = 0; closingByHistory = true; history.go(-n); return; }
  if (!closingByHistory) sheetDepth = 0;
}
function onPopState() {
  const depth = (history.state && history.state.sheet) || 0, sheet = $("#sheet");
  if (closingByHistory) {
    if (depth) return;
    closingByHistory = false; sheetDepth = 0;
    const next = afterClose; afterClose = null;
    if (next) next();
    return;
  }
  if (sheet.open && depth && depth < SSTACK.length) { SSTACK = SSTACK.slice(0, depth); sheetDepth = depth; paintSheet("back"); return; }
  if (sheet.open) { closingByHistory = true; sheet.close(); closingByHistory = false; sheetDepth = 0; }
  // back out of a pushed screen to whatever is under it, where it was scrolled to
  const a = hashParts().base.split("/")[0], top = state.stack[state.stack.length - 1], under = state.stack[state.stack.length - 2];
  routeReplace = true;
  if (top && (under ? under.type === a : !PUSHED[a] && a !== "list")) {
    const d = state.stack.pop();
    if (!state.stack.length && TOP_VIEWS.includes(a)) state.view = a;
    render("pop"); window.scrollTo(0, d.ret || 0);
  } else {
    const was = state.view, had = state.stack.length;
    if (!had) SCROLL[was] = window.scrollY;
    routeFromHash(); render(state.view !== was || had ? "tab" : "");
    window.scrollTo(0, state.view !== was ? SCROLL[state.view] || 0 : window.scrollY);
  }
  routeReplace = false;
  if (!depth) openRouteFilm();
}
function openRouteFilm() {
  const { film } = hashParts();
  if (!film || (!MY_LIB && !SHOW_EXAMPLE)) return;
  const f = state.lib.films.find((x) => x.key === film) || (MY_LIB && MY_LIB.watchlistFilms.find((x) => x.key === film));
  try { history.replaceState(null, "", routeBase()); } catch {}
  if (f) openSheet(D.film(f));
}
function openSearch() {
  const top = SSTACK[SSTACK.length - 1];
  if ($("#sheet").open && top && top.kind === "search") { $("#search-q")?.focus(); return; }
  openSheet({ kind: "search", title: "Search your diary", sub: "", q: "" }, $("#sheet").open);
}
const repaintDrill = () => { if ($("#sheet").open) paintSheet(); else render(); };
